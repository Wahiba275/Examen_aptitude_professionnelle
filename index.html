stabilisée et efficace.<\/li><\/ul>","piege":"Considérer les conflits comme un échec. La confrontation est une étape <strong>normale<\/strong> du développement d'une équipe.","astuce":"Retiens l'ordre : forming, storming, norming, performing, adjourning. « Storm » = tempête = conflits.","regle":"Une équipe se construit en traversant ses conflits, pas en les évitant."},{"id":"8-3","t":8,"n":3,"lvl":1,"neg":false,"q":"<p>Un chef de service délègue à un collaborateur la préparation et la conduite d'un dossier important. Quelle affirmation est <strong>exacte<\/strong> ?<\/p>","o":["Le chef délègue une mission et l'autorité nécessaire, mais il conserve la responsabilité finale vis-à-vis de sa hiérarchie","La délégation transfère toute la responsabilité au collaborateur, le chef n'ayant plus à suivre le dossier","Déléguer signifie confier uniquement les tâches les moins intéressantes","La délégation ne nécessite aucune explication sur les objectifs attendus"],"a":0,"just":"<p>Déléguer, c'est confier à un collaborateur une mission, avec l'autorité et les moyens pour l'accomplir. Le collaborateur devient responsable devant son chef ; mais le chef reste responsable devant sa hiérarchie. Il doit donc définir l'objectif, les moyens, les limites et des points de suivi.<\/p>","ana":"<ul><li>B : la responsabilité finale ne se délègue pas ; un suivi reste nécessaire.<\/li><li>C : déléguer seulement les tâches ingrates démotive ; la délégation est aussi un outil de développement.<\/li><li>D : sans objectif clair, la délégation échoue.<\/li><\/ul>","piege":"Confondre délégation et abandon (« je te le confie et je ne veux plus en entendre parler »).","astuce":"Délégation = mission + autorité + moyens + suivi ; responsabilité finale = chef.","regle":"On délègue l'autorité, pas la responsabilité ultime."},{"id":"8-4","t":8,"n":4,"lvl":1,"neg":false,"q":"<p>Selon la matrice d'<strong>Eisenhower<\/strong>, que faut-il faire d'une tâche <strong>importante mais non urgente<\/strong> (par exemple préparer le plan de formation de l'équipe pour l'année prochaine) ?<\/p>","o":["La faire immédiatement, en abandonnant tout le reste","La déléguer systématiquement","La planifier, en lui réservant un temps défini dans l'agenda","L'abandonner"],"a":2,"just":"<p>La matrice d'Eisenhower croise deux critères : l'importance et l'urgence. Important et urgent → faire tout de suite. Important et non urgent → planifier. Urgent et non important → déléguer. Ni urgent ni important → abandonner ou reporter. Les tâches importantes et non urgentes (prévention, préparation, développement) sont souvent négligées : il faut les protéger dans l'agenda.<\/p>","ana":"<ul><li>A : c'est la réponse pour une tâche importante <strong>et<\/strong> urgente.<\/li><li>B : c'est la réponse pour une tâche urgente mais peu importante.<\/li><li>D : c'est la réponse pour une tâche ni urgente ni importante.<\/li><\/ul>","piege":"Laisser l'urgent chasser l'important. Si les tâches importantes ne sont jamais planifiées, elles finissent par devenir des urgences.","astuce":"Important = lié aux objectifs ; urgent = lié au délai.","regle":"Faire, planifier, déléguer, abandonner."},{"id":"8-5","t":8,"n":5,"lvl":1,"neg":false,"q":"<p>Quel ensemble d'éléments caractérise le mieux une <strong>réunion efficace<\/strong> ?<\/p>","o":["Une réunion sans ordre du jour, pour laisser place à la spontanéité","Un objectif clair, un ordre du jour communiqué à l'avance, des participants concernés, une durée maîtrisée et un compte rendu précisant les décisions et les actions (qui fait quoi, pour quand)","Une réunion quotidienne de deux heures avec tout le service","Une réunion où seul le chef prend la parole"],"a":1,"just":"<p>Une réunion est un outil coûteux (temps de tous les participants). Elle doit avoir un objectif (informer, consulter, décider, produire), réunir les personnes utiles, respecter le temps et déboucher sur des décisions suivies.<\/p>","ana":"<ul><li>A : sans ordre du jour, la réunion se disperse.<\/li><li>C : la durée et le nombre de participants sont disproportionnés.<\/li><li>D : c'est une transmission d'information qui pourrait se faire par écrit.<\/li><\/ul>","piege":"Oublier le suivi : une réunion sans compte rendu ni plan d'action est vite oubliée.","astuce":"La bonne réponse contient presque toujours « objectif », « ordre du jour », « décisions » et « plan d'action ».","regle":"Pas de réunion sans objectif, pas de fin de réunion sans décisions ni responsables."},{"id":"8-6","t":8,"n":6,"lvl":1,"neg":false,"q":"<p>Un chef de service n'intervient jamais dans le travail de son équipe : il ne fixe pas d'objectifs, ne donne pas d'orientations et laisse chacun faire comme il l'entend. Selon la classification de Kurt Lewin, quel style de leadership adopte-t-il ?<\/p>","o":["Autocratique","Démocratique","Participatif","Laisser-faire"],"a":3,"just":"<p>Lewin distingue trois styles : <strong>autocratique<\/strong> (le chef décide seul et impose), <strong>démocratique<\/strong> (le chef associe l'équipe aux décisions tout en gardant un rôle de guide), <strong>laisser-faire<\/strong> (le chef n'exerce pas son rôle : pas d'orientation, pas de suivi). Les études de Lewin montrent que le laisser-faire conduit souvent à une faible productivité et à de la confusion.<\/p>","ana":"<ul><li>A : l'autocrate intervient beaucoup, en imposant ses décisions.<\/li><li>B : le style démocratique implique une participation <strong>guidée<\/strong> par le chef.<\/li><li>C : le style participatif suppose aussi un chef qui anime et oriente.<\/li><\/ul>","piege":"Confondre laisser-faire et délégation. Déléguer, c'est confier une mission avec un objectif et un suivi ; le laisser-faire, c'est l'absence de management.","astuce":"« Ne fixe pas d'objectifs », « n'intervient jamais » → laisser-faire.","regle":"Autocratique (impose), démocratique (associe et guide), laisser-faire (abdique)."},{"id":"8-7","t":8,"n":7,"lvl":2,"neg":false,"q":"<p>Selon le modèle du <strong>leadership situationnel<\/strong> de Hersey et Blanchard, quel style adopter avec un agent expérimenté, très compétent et très motivé ?<\/p>","o":["Le style délégatif : lui confier la responsabilité des décisions et du travail, avec peu d'intervention","Le style directif : lui donner des consignes précises et contrôler étroitement","Le style persuasif (ou « coaching ») : expliquer les décisions et le guider de près","Aucun style : le laisser sans objectif"],"a":0,"just":"<p>Hersey et Blanchard adaptent le style au niveau d'autonomie du collaborateur (compétence et motivation) : <strong>directif<\/strong> pour un collaborateur peu compétent (débutant) ; <strong>persuasif<\/strong> (ou coaching) pour un collaborateur en progression ; <strong>participatif<\/strong> pour un collaborateur compétent mais hésitant ou peu motivé ; <strong>délégatif<\/strong> pour un collaborateur compétent et motivé.<\/p>","ana":"<ul><li>B : le style directif démotiverait un agent autonome.<\/li><li>C : le style persuasif convient à un agent encore en apprentissage.<\/li><li>D : déléguer ne signifie pas supprimer les objectifs.<\/li><\/ul>","piege":"Croire qu'il existe un seul « bon » style. Le leadership situationnel dit l'inverse : le bon style dépend de la personne et de la tâche.","astuce":"Plus l'autonomie du collaborateur est grande, moins le manager dirige et plus il délègue.","regle":"Directif → persuasif → participatif → délégatif, selon l'autonomie croissante du collaborateur."},{"id":"8-8","t":8,"n":8,"lvl":2,"neg":false,"q":"<p>Dans la <strong>grille managériale<\/strong> de Blake et Mouton, quel style est présenté comme le plus efficace ?<\/p>","o":["Le style « appauvri » (1,1) : faible intérêt pour la production et pour les personnes","Le style « social » (1,9) : très fort intérêt pour les personnes, faible intérêt pour les résultats","Le style « management d'équipe » (9,9) : fort intérêt à la fois pour les résultats et pour les personnes","Le style « autoritaire » (9,1) : très fort intérêt pour les résultats, faible intérêt pour les personnes"],"a":2,"just":"<p>La grille croise deux dimensions notées de 1 à 9 : l'intérêt pour la production (les résultats) et l'intérêt pour les personnes. Le style 9,9 combine exigence de résultats et attention aux personnes, grâce à l'engagement et à la confiance. Il est considéré comme le plus efficace. Il existe aussi le style « intermédiaire » (5,5), qui cherche un compromis.<\/p>","ana":"<ul><li>A : le style appauvri correspond à un désengagement du manager.<\/li><li>B : le style social crée une bonne ambiance mais néglige les résultats.<\/li><li>D : le style autoritaire obtient des résultats à court terme mais démotive.<\/li><\/ul>","piege":"Croire qu'il faut choisir entre résultats et personnes.","astuce":"Dans la grille, la meilleure note est 9,9 (le maximum sur les deux axes).","regle":"Le manager efficace est exigeant sur les résultats et attentif aux personnes."},{"id":"8-9","t":8,"n":9,"lvl":2,"neg":false,"q":"<p>Deux chefs de bureau se disputent l'usage d'une salle de réunion. Ils trouvent un accord : chacun l'utilise trois jours par semaine, même si aucun n'obtient entièrement ce qu'il voulait. Selon le modèle de Thomas-Kilmann, quel mode de gestion des conflits ont-ils adopté ?<\/p>","o":["La collaboration","Le compromis","L'évitement","La compétition"],"a":1,"just":"<p>Le modèle de Thomas-Kilmann croise deux dimensions : l'affirmation de soi (défendre ses intérêts) et la coopération (prendre en compte ceux de l'autre). Il en résulte cinq modes : <strong>compétition<\/strong> (je gagne, tu perds), <strong>accommodation<\/strong> (je cède), <strong>évitement<\/strong> (on ne traite pas le conflit), <strong>compromis<\/strong> (chacun cède une partie), <strong>collaboration<\/strong> (on cherche ensemble une solution qui satisfait pleinement les deux).<\/p>","ana":"<ul><li>A : la collaboration aurait cherché une solution satisfaisant pleinement les deux (par exemple une seconde salle ou un usage partagé selon les besoins réels).<\/li><li>C : le conflit a été traité, pas évité.<\/li><li>D : aucun n'a imposé sa volonté.<\/li><\/ul>","piege":"Confondre compromis (chacun perd un peu) et collaboration (les deux gagnent).","astuce":"« Chacun cède une partie » → compromis. « Solution qui satisfait pleinement les deux » → collaboration.","regle":"Compétition, accommodation, évitement, compromis, collaboration : aucun mode n'est toujours le meilleur, mais la collaboration est souvent la plus durable."},{"id":"8-10","t":8,"n":10,"lvl":2,"neg":false,"q":"<p>Un chef de service veut faire un retour (feedback) à un agent qui arrive régulièrement en retard aux réunions. Selon la méthode <strong>DESC<\/strong>, par quoi doit-il commencer ?<\/p>","o":["Annoncer la sanction prévue","Exprimer sa colère","Proposer immédiatement une solution","Décrire les faits de manière objective et précise, sans jugement (« lors des trois dernières réunions, tu es arrivé avec 15 minutes de retard »)"],"a":3,"just":"<p>La méthode DESC structure un message difficile en quatre étapes : <strong>D<\/strong>écrire les faits, <strong>E<\/strong>xprimer son ressenti ou l'effet produit (« cela retarde le travail de l'équipe »), <strong>S<\/strong>pécifier la demande ou la solution attendue, <strong>C<\/strong>onséquences positives de la solution (« nous pourrons terminer à l'heure »). Commencer par les faits évite les jugements sur la personne.<\/p>","ana":"<ul><li>A : la sanction n'est pas l'objet du feedback.<\/li><li>B : exprimer la colère provoque une réaction défensive.<\/li><li>C : la solution intervient à la troisième étape.<\/li><\/ul>","piege":"Parler de la personne (« tu es irresponsable ») au lieu de parler des faits.","astuce":"DESC = Décrire, Exprimer, Spécifier, Conséquences : on commence toujours par les faits.","regle":"Un bon feedback porte sur des faits, pas sur la personnalité."},{"id":"8-11","t":8,"n":11,"lvl":2,"neg":false,"q":"<p>Dans une équipe, un membre propose sans cesse des idées originales et ingénieuses, mais néglige les détails pratiques et a du mal à suivre les consignes. Selon les rôles d'équipe de Belbin, il correspond au profil :<\/p>","o":["Du créatif (concepteur)","Du perfectionniste (finisseur)","De l'organisateur (exécutant)","Du coordinateur"],"a":0,"just":"<p>Meredith Belbin a identifié neuf rôles d'équipe. Le <strong>créatif<\/strong> apporte des idées nouvelles mais peut négliger les détails. Le <strong>perfectionniste<\/strong> repère les erreurs et veille aux délais. L'<strong>organisateur<\/strong> transforme les idées en actions concrètes. Le <strong>coordinateur<\/strong> clarifie les objectifs et répartit les rôles. Les autres rôles sont le propulseur, l'évaluateur, le soutien, l'explorateur de ressources et le spécialiste.<\/p>","ana":"<ul><li>B : le perfectionniste est attentif aux détails, ce qui est l'inverse du profil décrit.<\/li><li>C : l'organisateur est pratique et méthodique.<\/li><li>D : le coordinateur oriente le groupe et facilite les décisions.<\/li><\/ul>","piege":"Considérer les faiblesses d'un rôle comme des défauts à éliminer. Chez Belbin, chaque rôle a des « faiblesses admissibles », compensées par les autres membres.","astuce":"Idées originales + négligence des détails → créatif.","regle":"Une équipe efficace équilibre des rôles complémentaires."},{"id":"8-12","t":8,"n":12,"lvl":2,"neg":false,"q":"<p>Selon la <strong>fenêtre de Johari<\/strong>, la « zone aveugle » d'une personne correspond :<\/p>","o":["À ce que la personne sait d'elle-même et que les autres savent aussi","À ce que la personne sait d'elle-même mais cache aux autres","À ce que les autres perçoivent de la personne mais qu'elle ignore elle-même, zone que le feedback permet de réduire","À ce que ni la personne ni les autres ne connaissent"],"a":2,"just":"<p>La fenêtre de Johari (Joseph Luft et Harrington Ingham) comprend quatre zones : <strong>publique<\/strong> (connue de soi et des autres), <strong>aveugle<\/strong> (connue des autres, inconnue de soi), <strong>cachée<\/strong> (connue de soi, cachée aux autres), <strong>inconnue<\/strong> (inconnue de tous). Le feedback reçu réduit la zone aveugle ; la confiance et l'expression de soi réduisent la zone cachée.<\/p>","ana":"<ul><li>A : c'est la zone publique.<\/li><li>B : c'est la zone cachée.<\/li><li>D : c'est la zone inconnue.<\/li><\/ul>","piege":"Confondre zone aveugle (je ne sais pas) et zone cachée (je sais mais je ne dis pas).","astuce":"Aveugle = « je ne vois pas ce que les autres voient » → remède : feedback.","regle":"Le feedback agrandit la zone publique en réduisant la zone aveugle."},{"id":"8-13","t":8,"n":13,"lvl":2,"neg":false,"q":"<p>Laquelle de ces attitudes relève de l'<strong>écoute active<\/strong> ?<\/p>","o":["Interrompre l'agent pour lui donner rapidement la solution","Reformuler ce que l'agent vient de dire pour vérifier sa compréhension (« si je comprends bien, tu as l'impression que… »)","Consulter ses courriels pendant que l'agent parle","Juger immédiatement le comportement de l'agent"],"a":1,"just":"<p>L'écoute active, développée notamment par Carl Rogers, vise à comprendre réellement l'autre. Ses techniques sont la reformulation, les questions ouvertes, l'acceptation des silences, l'attention aux émotions et l'absence de jugement. La reformulation montre à l'agent qu'il a été entendu et évite les malentendus.<\/p>","ana":"<ul><li>A : interrompre pour conseiller empêche de comprendre le vrai problème.<\/li><li>C : le manque d'attention est le contraire de l'écoute active.<\/li><li>D : le jugement bloque l'expression.<\/li><\/ul>","piege":"Croire qu'écouter, c'est attendre son tour pour parler.","astuce":"Écoute active → reformulation, questions ouvertes, empathie, non-jugement.","regle":"Comprendre avant de répondre."},{"id":"8-14","t":8,"n":14,"lvl":3,"neg":false,"q":"<p>Depuis deux mois, les résultats d'une agente habituellement très performante se dégradent nettement. Quelle est la première action appropriée de son chef de service ?<\/p>","o":["Engager immédiatement une procédure disciplinaire","Lui retirer ses dossiers sans explication","Attendre que la situation se règle d'elle-même","Organiser un entretien individuel pour comprendre les causes (difficultés personnelles, surcharge, changement d'organisation, manque de moyens) et chercher ensemble des solutions"],"a":3,"just":"<p>Une baisse soudaine chez une personne habituellement performante a souvent une cause identifiable : situation personnelle, surcharge, conflit, perte de sens, problème d'outil. Le manager doit d'abord écouter et comprendre, puis agir (aménagement, soutien, orientation vers une aide adaptée).<\/p>","ana":"<ul><li>A : sanctionner sans comprendre est injuste et peut aggraver la situation.<\/li><li>B : retirer les dossiers sans explication est humiliant et démotivant.<\/li><li>C : l'attentisme laisse la situation se dégrader.<\/li><\/ul>","piege":"Réagir au symptôme (la baisse des résultats) sans chercher la cause.","astuce":"Changement brutal chez un bon élément → écouter d'abord.","regle":"Avant de corriger, comprendre."},{"id":"8-15","t":8,"n":15,"lvl":3,"neg":false,"q":"<p>Un conflit ouvert entre deux agents perturbe toute l'équipe : remarques blessantes, refus de se transmettre des informations. Quelle attitude doit adopter le chef de service ?<\/p>","o":["Intervenir rapidement : écouter chaque agent séparément, puis les réunir pour s'appuyer sur les faits, rappeler les règles de travail communes et rechercher une solution acceptable pour tous","Ignorer le conflit, qui relève de la vie privée des agents","Prendre immédiatement parti pour l'agent le plus ancien","Muter les deux agents sans les entendre"],"a":0,"just":"<p>Le conflit a un impact sur le fonctionnement du service : le manager doit agir. Il écoute chaque partie, distingue les faits des interprétations, rappelle le cadre (respect, coopération) et recherche une solution. Si le conflit persiste, il peut faire appel à une médiation.<\/p>","ana":"<ul><li>B : le conflit affecte le travail ; il relève du rôle du manager.<\/li><li>C : prendre parti sans entendre les deux agents est injuste et aggrave le conflit.<\/li><li>D : une mutation sans écoute est une sanction déguisée et ne règle pas les causes.<\/li><\/ul>","piege":"L'évitement : laisser pourrir un conflit le rend plus difficile à résoudre.","astuce":"Conflit qui affecte le service → intervention rapide, écoute des deux parties, faits, règles.","regle":"Le manager traite le conflit tôt, avec équité, sur la base des faits."},{"id":"8-16","t":8,"n":16,"lvl":3,"neg":false,"q":"<p>Un agent vient d'être promu chef du bureau dans lequel il travaillait jusque-là avec ses collègues. Quelle attitude l'aidera le plus à asseoir sa légitimité ?<\/p>","o":["Continuer à se comporter exactement comme avant, en évitant de prendre des décisions","Changer brutalement de comportement et devenir autoritaire pour marquer la distance","Clarifier son nouveau rôle avec l'équipe, rester accessible tout en assumant ses décisions, traiter chacun avec équité et éviter tout favoritisme envers ses anciens proches","Demander à sa hiérarchie de prendre les décisions à sa place pendant un an"],"a":2,"just":"<p>La promotion au sein de son équipe est une situation délicate : les relations changent. La légitimité se construit en expliquant le nouveau rôle, en restant proche sans renoncer à décider, et surtout en étant équitable. Le favoritisme envers d'anciens amis détruit rapidement la confiance des autres.<\/p>","ana":"<ul><li>A : refuser de décider revient à ne pas exercer son rôle.<\/li><li>B : un changement brutal vers l'autoritarisme crée du rejet.<\/li><li>D : déléguer ses décisions à la hiérarchie sape sa légitimité.<\/li><\/ul>","piege":"Choisir l'un des deux extrêmes (rester « un collègue comme avant » ou devenir un « petit chef »).","astuce":"La bonne réponse concilie proximité et autorité, avec équité.","regle":"Légitimité = clarté du rôle + équité + capacité à décider."},{"id":"8-17","t":8,"n":17,"lvl":3,"neg":false,"q":"<p>Un chef de service a fixé à chaque agent des objectifs individuels de nombre de dossiers traités. Les agents se mettent à refuser d'aider leurs collègues et à garder les dossiers simples pour eux. Quelle correction est la plus pertinente ?<\/p>","o":["Augmenter les objectifs individuels","Compléter les objectifs individuels par des objectifs collectifs (délai global du service, qualité, entraide) et reconnaître la contribution à la réussite de l'équipe","Supprimer tout objectif","Attribuer les dossiers par tirage au sort sans autre mesure"],"a":1,"just":"<p>Des objectifs uniquement individuels peuvent créer de la compétition interne et des effets pervers (écrémage des dossiers faciles). L'équilibre entre objectifs individuels et collectifs encourage à la fois la responsabilité personnelle et la coopération.<\/p>","ana":"<ul><li>A : renforcer la pression individuelle aggrave le problème.<\/li><li>C : supprimer tout objectif fait perdre le pilotage.<\/li><li>D : le tirage au sort ne règle pas le manque de coopération.<\/li><\/ul>","piege":"Croire que la somme des performances individuelles fait la performance de l'équipe.","astuce":"Compétition interne + refus d'entraide → ajouter des objectifs collectifs.","regle":"Équilibrer objectifs individuels et collectifs pour concilier responsabilité et coopération."},{"id":"8-18","t":8,"n":18,"lvl":3,"neg":false,"q":"<p>Un chef de service débordé traite lui-même tous les dossiers, y compris les plus simples, car il pense « aller plus vite seul ». Son équipe se démotive et lui-même n'a plus de temps pour piloter. Quelle est la meilleure solution ?<\/p>","o":["Travailler davantage le soir et le week-end","Confier les dossiers simples sans explication et ne plus s'en occuper","Demander des effectifs supplémentaires sans changer son organisation","Déléguer progressivement, en précisant pour chaque mission l'objectif, les moyens, la marge d'autonomie et des points de suivi, et en accompagnant les agents au début"],"a":3,"just":"<p>Ne pas déléguer est une erreur fréquente : le manager s'épuise, les agents ne se développent pas et le pilotage est négligé. Une délégation bien préparée libère du temps pour les tâches de management et valorise les agents.<\/p>","ana":"<ul><li>A : travailler plus ne règle pas le problème d'organisation et mène à l'épuisement.<\/li><li>B : déléguer sans explication ni suivi conduit à l'échec.<\/li><li>C : de nouveaux effectifs ne changeront rien si le chef garde tout pour lui.<\/li><\/ul>","piege":"Croire qu'on va « plus vite seul ». C'est vrai à court terme, mais faux à moyen terme.","astuce":"Manager débordé + équipe démotivée → délégation organisée.","regle":"Le manager est payé pour faire faire et faire progresser, pas pour tout faire lui-même."},{"id":"8-19","t":8,"n":19,"lvl":3,"neg":false,"q":"<p>Un jeune agent vient d'être recruté. Il est très enthousiaste, mais il ne connaît pas encore les procédures du service. Selon le modèle de Hersey et Blanchard, quel style de management est le plus adapté pour commencer ?<\/p>","o":["Le style directif : donner des consignes claires, montrer comment faire et suivre de près le travail","Le style délégatif : lui confier un dossier complexe sans aide","Le style participatif : le laisser proposer ses propres méthodes","Le laisser-faire"],"a":0,"just":"<p>L'agent est motivé mais peu compétent sur la tâche : il a besoin de consignes précises, d'explications concrètes et d'un suivi rapproché. À mesure qu'il progressera, le manager passera au style persuasif, puis participatif, puis délégatif.<\/p>","ana":"<ul><li>B : lui confier seul un dossier complexe l'exposerait à l'échec et à la démotivation.<\/li><li>C : le style participatif convient à un agent compétent mais peu sûr de lui ou peu motivé.<\/li><li>D : le laisser-faire laisse le débutant sans repères.<\/li><\/ul>","piege":"Confondre motivation et compétence. Un agent motivé n'est pas forcément autonome.","astuce":"Débutant enthousiaste → directif ; expert motivé → délégatif.","regle":"On adapte le style à la compétence <strong>et<\/strong> à la motivation, et on le fait évoluer avec la progression de l'agent."},{"id":"8-20","t":8,"n":20,"lvl":3,"neg":false,"q":"<p>Un nouveau chef de service arrive dans une équipe marquée par des tensions, une faible coordination et des résultats en baisse. Quelle démarche est la plus cohérente pour ses premières semaines ?<\/p>","o":["Annoncer dès le premier jour une réorganisation complète, sans avoir rencontré les agents","Remplacer rapidement les agents qu'il juge peu performants","Commencer par un diagnostic (entretiens individuels, observation), puis réunir l'équipe pour partager les constats, définir des objectifs et des règles de fonctionnement communes, clarifier les rôles, obtenir quelques premiers résultats visibles et installer des rituels de suivi","Laisser l'équipe fonctionner comme avant pendant un an pour ne froisser personne"],"a":2,"just":"<p>Un nouveau manager doit d'abord comprendre avant d'agir. Le diagnostic permet d'identifier les causes des tensions. Le partage des constats et la construction de règles communes favorisent l'adhésion. Les premiers résultats visibles (« victoires rapides ») renforcent la confiance, et les rituels (points d'équipe, entretiens) installent un fonctionnement durable.<\/p>","ana":"<ul><li>A : agir sans comprendre provoque du rejet et des erreurs.<\/li><li>B : juger les agents sans connaître la situation est injuste et risqué ; dans la fonction publique, ce n'est d'ailleurs pas si simple.<\/li><li>D : l'immobilisme laisse les problèmes s'aggraver.<\/li><\/ul>","piege":"Vouloir montrer son autorité trop vite, ou au contraire ne rien changer.","astuce":"Pour une prise de poste, la bonne réponse commence presque toujours par « diagnostic » ou « écoute ».","regle":"Écouter, comprendre, co-construire, agir, suivre."},{"id":"9-1","t":9,"n":1,"lvl":1,"neg":false,"q":"<p>En psychologie du travail, la <strong>motivation<\/strong> se définit comme :<\/p>","o":["Le niveau de salaire d'un agent","Le degré de satisfaction d'un agent à l'égard de son poste","L'ensemble des forces qui déclenchent un comportement, l'orientent vers un but et en déterminent l'intensité et la persistance","Le nombre d'heures supplémentaires effectuées"],"a":2,"just":"<p>La motivation comprend quatre composantes : le <strong>déclenchement<\/strong> (ce qui pousse à agir), la <strong>direction<\/strong> (vers quel but), l'<strong>intensité<\/strong> (quel niveau d'effort) et la <strong>persistance<\/strong> (combien de temps l'effort est maintenu, notamment face aux difficultés).<\/p>","ana":"<ul><li>A : le salaire peut influencer la motivation, mais ne la définit pas.<\/li><li>B : la satisfaction est un <strong>état<\/strong> (« je suis content de mon travail ») ; la motivation est une <strong>dynamique<\/strong> (« j'ai envie de m'investir »). Un agent peut être satisfait sans être motivé.<\/li><li>D : les heures supplémentaires peuvent avoir d'autres causes (surcharge, contrainte).<\/li><\/ul>","piege":"Confondre satisfaction et motivation.","astuce":"Motivation = déclenchement + direction + intensité + persistance.","regle":"La motivation est une énergie orientée vers un but, plus ou moins forte et durable."},{"id":"9-2","t":9,"n":2,"lvl":1,"neg":false,"q":"<p>Quel est l'ordre des besoins dans la <strong>pyramide de Maslow<\/strong>, de la base vers le sommet ?<\/p>","o":["Besoins physiologiques → sécurité → appartenance → estime → accomplissement de soi","Estime → sécurité → physiologiques → appartenance → accomplissement","Accomplissement → estime → appartenance → sécurité → physiologiques","Sécurité → physiologiques → estime → appartenance → accomplissement"],"a":0,"just":"<p>Abraham Maslow classe les besoins en cinq niveaux. Selon lui, un besoin supérieur ne devient motivant que lorsque les besoins inférieurs sont suffisamment satisfaits. Au travail : salaire et conditions de base (physiologiques), stabilité de l'emploi (sécurité), intégration dans l'équipe (appartenance), reconnaissance (estime), développement personnel et réalisation de son potentiel (accomplissement).<\/p>","ana":"<p>B, C et D présentent un ordre incorrect. C est l'ordre inversé (du sommet vers la base).<\/p>","piege":"Inverser sécurité et physiologiques, ou appartenance et estime.","astuce":"Moyen mnémotechnique : « Pour Sortir Avec Elle, Accomplis-toi » (Physiologiques, Sécurité, Appartenance, Estime, Accomplissement).","regle":"De la base au sommet : survivre, être en sécurité, appartenir, être reconnu, s'accomplir."},{"id":"9-3","t":9,"n":3,"lvl":1,"neg":false,"q":"<p>Selon la théorie bi-factorielle de <strong>Herzberg<\/strong>, lequel de ces éléments est un <strong>facteur d'hygiène<\/strong> (et non un facteur de motivation) ?<\/p>","o":["La reconnaissance du travail accompli","L'intérêt du travail lui-même","La possibilité de prendre des responsabilités","Les conditions matérielles de travail (locaux, équipements)"],"a":3,"just":"<p>Frederick Herzberg distingue deux familles. Les <strong>facteurs d'hygiène<\/strong> (salaire, conditions de travail, sécurité de l'emploi, relations avec les collègues, politique de l'organisation) provoquent de l'insatisfaction s'ils sont insuffisants, mais ne motivent pas durablement quand ils sont satisfaisants. Les <strong>facteurs moteurs<\/strong> (accomplissement, reconnaissance, intérêt du travail, responsabilité, possibilités d'évolution) créent la motivation.<\/p>","ana":"<p>A, B et C sont des facteurs moteurs, liés au contenu du travail.<\/p>","piege":"Croire que tout ce qui est « positif » motive. Pour Herzberg, de bonnes conditions évitent l'insatisfaction mais ne suffisent pas à motiver.","astuce":"Facteurs d'hygiène = <strong>contexte<\/strong> du travail (autour du travail). Facteurs moteurs = <strong>contenu<\/strong> du travail (le travail lui-même).","regle":"Hygiène = éviter l'insatisfaction ; moteurs = créer la motivation."},{"id":"9-4","t":9,"n":4,"lvl":1,"neg":false,"q":"<p>Un agent consacre beaucoup d'énergie à améliorer un outil de suivi parce qu'il trouve ce travail passionnant et qu'il aime relever des défis techniques, sans attendre de récompense. Quelle forme de motivation est en jeu ?<\/p>","o":["La motivation extrinsèque","La motivation intrinsèque","L'amotivation","La motivation par la sanction"],"a":1,"just":"<p>La motivation <strong>intrinsèque<\/strong> vient de l'activité elle-même : intérêt, plaisir, défi, sentiment de compétence. La motivation <strong>extrinsèque<\/strong> vient de l'extérieur : récompense, prime, promotion, peur d'une sanction. L'<strong>amotivation<\/strong> est l'absence de motivation.<\/p>","ana":"<ul><li>A : l'agent n'attend pas de récompense extérieure.<\/li><li>C : l'agent est au contraire très motivé.<\/li><li>D : aucune menace n'est évoquée.<\/li><\/ul>","piege":"Croire que la motivation passe forcément par une récompense.","astuce":"« Pour le plaisir de l'activité » → intrinsèque ; « pour obtenir ou éviter quelque chose » → extrinsèque.","regle":"Intrinsèque = l'activité elle-même ; extrinsèque = ce que l'activité rapporte."},{"id":"9-5","t":9,"n":5,"lvl":1,"neg":false,"q":"<p>Selon Douglas <strong>McGregor<\/strong>, la « théorie Y » repose sur l'idée que :<\/p>","o":["L'individu n'aime pas travailler et doit être contrôlé et contraint","Seule la menace de sanctions fait travailler les agents","L'individu peut aimer son travail, rechercher des responsabilités et s'autodiriger s'il adhère aux objectifs","Les agents ne recherchent que la sécurité et refusent toute responsabilité"],"a":2,"just":"<p>McGregor oppose deux visions de l'être humain au travail. La <strong>théorie X<\/strong> suppose que l'individu est paresseux, fuit les responsabilités et doit être contrôlé. La <strong>théorie Y<\/strong> suppose qu'il peut s'impliquer, prendre des initiatives et se contrôler lui-même. Chaque vision conduit à un style de management différent (contrôle d'un côté, confiance et participation de l'autre).<\/p>","ana":"<p>A, B et D décrivent la théorie X.<\/p>","piege":"Inverser X et Y.","astuce":"Y comme « oui » au travail et à la responsabilité ; X comme une croix sur la confiance.","regle":"Théorie X = contrôle ; théorie Y = confiance et responsabilisation. Les attentes du manager influencent le comportement des agents (effet Pygmalion)."},{"id":"9-6","t":9,"n":6,"lvl":1,"neg":false,"q":"<p>La notion de <strong>motivation de service public<\/strong> (Perry et Wise) désigne :<\/p>","o":["La motivation fondée sur l'attachement à l'intérêt général, le désir de servir la collectivité et d'être utile aux autres","Le désir d'obtenir une rémunération plus élevée que dans le secteur privé","L'obligation statutaire d'obéir à son supérieur","La recherche exclusive de la sécurité de l'emploi"],"a":0,"just":"<p>James Perry et Lois Wise ont montré que de nombreux agents publics sont motivés par des valeurs : l'intérêt pour l'action publique, l'engagement envers l'intérêt général, la compassion et l'esprit de sacrifice. Cette motivation est un levier important dans une administration où les leviers financiers sont limités.<\/p>","ana":"<ul><li>B : la rémunération publique n'est généralement pas le principal moteur de l'engagement dans le service public.<\/li><li>C : l'obéissance hiérarchique est une obligation, pas une motivation.<\/li><li>D : la sécurité de l'emploi peut attirer, mais elle relève plutôt des facteurs d'hygiène ; elle ne définit pas la motivation de service public.<\/li><\/ul>","piege":"Réduire l'engagement des agents publics à la sécurité de l'emploi.","astuce":"Motivation de service public = <strong>sens<\/strong> et <strong>utilité sociale<\/strong>.","regle":"Le sens de la mission est un levier de motivation propre au secteur public."},{"id":"9-7","t":9,"n":7,"lvl":2,"neg":false,"q":"<p>Après une revalorisation salariale, les plaintes des agents diminuent, mais leur implication dans le travail ne change pas. Comment la théorie de Herzberg explique-t-elle ce résultat ?<\/p>","o":["Le salaire est le principal facteur de motivation ; la revalorisation était insuffisante","Les agents sont naturellement démotivés","La théorie de Herzberg ne s'applique pas au secteur public","Le salaire est un facteur d'hygiène : son amélioration réduit l'insatisfaction mais ne crée pas de motivation durable, qui dépend du contenu du travail"],"a":3,"just":"<p>Selon Herzberg, insatisfaction et motivation ne sont pas les deux extrémités d'une même échelle. Améliorer un facteur d'hygiène fait disparaître l'insatisfaction (moins de plaintes), mais pour motiver, il faut agir sur les facteurs moteurs : responsabilité, reconnaissance, intérêt du travail.<\/p>","ana":"<ul><li>A : c'est précisément ce que Herzberg conteste.<\/li><li>B : la généralisation est infondée.<\/li><li>C : la théorie s'applique à toutes les organisations.<\/li><\/ul>","piege":"Croire que « moins d'insatisfaction » signifie « plus de motivation ».","astuce":"Résultat « moins de plaintes, pas plus d'implication » → Herzberg, facteur d'hygiène.","regle":"Le contraire de l'insatisfaction n'est pas la motivation, mais l'absence d'insatisfaction."},{"id":"9-8","t":9,"n":8,"lvl":2,"neg":false,"q":"<p>Un agent déclare : « Même si je redouble d'efforts, je n'atteindrai jamais l'objectif fixé, car le logiciel tombe en panne tous les jours. » Selon la théorie <strong>VIE<\/strong> de Vroom, quel élément est faible ?<\/p>","o":["La valence","L'expectation (ou attente) : la croyance que l'effort permettra d'atteindre la performance","L'instrumentalité","L'équité"],"a":1,"just":"<p>Victor Vroom explique la motivation par trois croyances : <strong>Expectation<\/strong> (« si je fais des efforts, j'atteindrai la performance »), <strong>Instrumentalité<\/strong> (« si j'atteins la performance, j'obtiendrai une récompense »), <strong>Valence<\/strong> (« cette récompense a de la valeur pour moi »). La motivation résulte du produit V × I × E : si un facteur est nul, la motivation est nulle. Ici, l'agent ne croit pas que ses efforts mèneront au résultat.<\/p>","ana":"<ul><li>A : la valeur de la récompense n'est pas évoquée.<\/li><li>C : le lien entre performance et récompense n'est pas en cause.<\/li><li>D : l'équité relève de la théorie d'Adams.<\/li><\/ul>","piege":"Confondre expectation (effort → performance) et instrumentalité (performance → récompense).","astuce":"« Je n'y arriverai pas » → expectation ; « ça ne servira à rien, je ne serai pas récompensé » → instrumentalité ; « la récompense ne m'intéresse pas » → valence.","regle":"Motivation = Valence × Instrumentalité × Expectation."},{"id":"9-9","t":9,"n":9,"lvl":2,"neg":false,"q":"<p>Une agente découvre qu'un collègue, qui effectue le même travail avec la même ancienneté, bénéficie d'une indemnité qu'elle ne perçoit pas. Sa motivation chute. Quelle théorie explique le mieux cette réaction ?<\/p>","o":["La pyramide de Maslow","La théorie X et Y de McGregor","La théorie de l'équité d'Adams","La théorie des besoins de McClelland"],"a":2,"just":"<p>Selon John Stacy Adams, chacun compare le rapport entre ce qu'il apporte (efforts, compétences, temps) et ce qu'il reçoit (salaire, reconnaissance) à celui d'autres personnes. Un sentiment d'iniquité provoque une tension que l'individu cherche à réduire : baisse de l'effort, revendication, départ.<\/p>","ana":"<ul><li>A : Maslow décrit une hiérarchie de besoins, pas une comparaison avec les autres.<\/li><li>B : McGregor décrit les représentations du manager.<\/li><li>D : McClelland décrit trois besoins (accomplissement, pouvoir, affiliation).<\/li><\/ul>","piege":"Penser que seul le montant absolu de la rémunération compte. La comparaison avec les autres compte tout autant.","astuce":"« Comparaison avec un collègue » + « injustice ressentie » → Adams.","regle":"L'équité perçue est une condition de la motivation : rapport contributions / rétributions comparé à celui des autres."},{"id":"9-10","t":9,"n":10,"lvl":2,"neg":false,"q":"<p>Selon la théorie de la <strong>fixation des objectifs<\/strong> de Locke, quels objectifs motivent le plus ?<\/p>","o":["Des objectifs précis et difficiles, mais acceptés et atteignables, accompagnés d'un retour régulier sur les progrès","Des objectifs vagues, pour laisser de la liberté","Des objectifs très faciles, pour être sûr de les atteindre","Des objectifs impossibles, pour pousser à se dépasser"],"a":0,"just":"<p>Edwin Locke a montré qu'un objectif précis et stimulant mobilise davantage qu'une consigne vague du type « faites de votre mieux ». L'objectif doit être accepté par la personne et rester réaliste. Le retour d'information (feedback) permet d'ajuster l'effort.<\/p>","ana":"<ul><li>B : un objectif vague ne guide pas l'action.<\/li><li>C : un objectif trop facile ne mobilise pas.<\/li><li>D : un objectif impossible décourage (l'expectation devient nulle, au sens de Vroom).<\/li><\/ul>","piege":"Croire que plus l'objectif est élevé, plus la motivation est forte. Au-delà de l'atteignable, elle s'effondre.","astuce":"Locke = précis + stimulant + accepté + feedback.","regle":"Un objectif motive s'il est clair, ambitieux, réaliste et suivi."},{"id":"9-11","t":9,"n":11,"lvl":2,"neg":false,"q":"<p>Selon la <strong>théorie de l'autodétermination<\/strong> de Deci et Ryan, quels sont les trois besoins psychologiques fondamentaux qui nourrissent la motivation intrinsèque ?<\/p>","o":["Salaire, sécurité, statut","Pouvoir, prestige, argent","Contrôle, obéissance, discipline","Autonomie, compétence, appartenance sociale (relation aux autres)"],"a":3,"just":"<p>Edward Deci et Richard Ryan montrent que la motivation la plus durable et de meilleure qualité est la motivation autodéterminée. Elle est favorisée lorsque l'individu se sent <strong>autonome<\/strong> (il choisit, il a des marges de manœuvre), <strong>compétent<\/strong> (il réussit et progresse) et <strong>relié<\/strong> aux autres (il appartient à un collectif).<\/p>","ana":"<ul><li>A et B : ce sont des leviers extrinsèques.<\/li><li>C : le contrôle étroit réduit au contraire la motivation autodéterminée.<\/li><\/ul>","piege":"Confondre leviers extrinsèques (récompenses) et besoins psychologiques.","astuce":"Retiens « ACA » : Autonomie, Compétence, Appartenance.","regle":"Pour nourrir la motivation intrinsèque : donner de l'autonomie, faire progresser, créer du lien."},{"id":"9-12","t":9,"n":12,"lvl":2,"neg":false,"q":"<p>Dans un service, chaque agent traite une seule étape d'un dossier (enregistrement, vérification ou saisie), sans jamais connaître le résultat final pour l'usager. Selon le modèle des caractéristiques de l'emploi de Hackman et Oldham, quelle dimension est particulièrement faible ?<\/p>","o":["La rémunération","L'identité de la tâche : le fait de réaliser un travail complet et identifiable, du début à la fin","La sécurité de l'emploi","La taille du bureau"],"a":1,"just":"<p>Hackman et Oldham identifient cinq caractéristiques qui rendent un emploi motivant : la <strong>variété<\/strong> des compétences mobilisées, l'<strong>identité<\/strong> de la tâche (un travail complet et identifiable), la <strong>signification<\/strong> de la tâche (son importance pour les autres), l'<strong>autonomie<\/strong> et le <strong>retour d'information<\/strong> sur les résultats. Un travail très fragmenté réduit l'identité de la tâche et souvent sa signification.<\/p>","ana":"<p>A, C et D ne font pas partie des cinq caractéristiques du modèle.<\/p>","piege":"Chercher un facteur matériel alors que la question porte sur le contenu du travail.","astuce":"« Une seule étape », « ne voit jamais le résultat » → identité de la tâche (et retour d'information).","regle":"Un travail motivant est varié, complet, utile, autonome et donne un retour sur ses résultats. L'élargissement et l'enrichissement des tâches en sont les leviers."},{"id":"9-13","t":9,"n":13,"lvl":2,"neg":false,"q":"<p>Selon <strong>McClelland<\/strong>, une personne animée par un fort <strong>besoin d'accomplissement<\/strong> :<\/p>","o":["Recherche avant tout l'influence et le contrôle sur les autres","Recherche avant tout l'approbation et des relations chaleureuses","Recherche des objectifs stimulants, aime être responsable de ses résultats et apprécie un retour rapide sur sa performance","Évite toute prise de risque et tout défi"],"a":2,"just":"<p>David McClelland distingue trois besoins acquis : le besoin d'<strong>accomplissement<\/strong> (réussir des défis, progresser), le besoin de <strong>pouvoir<\/strong> (influencer, diriger) et le besoin d'<strong>affiliation<\/strong> (être accepté, entretenir de bonnes relations). Chaque profil réagit à des leviers différents.<\/p>","ana":"<ul><li>A : c'est le besoin de pouvoir.<\/li><li>B : c'est le besoin d'affiliation.<\/li><li>D : c'est l'inverse du besoin d'accomplissement, qui recherche des défis modérés.<\/li><\/ul>","piege":"Confondre accomplissement (réussir) et pouvoir (influencer).","astuce":"Accomplissement → défis et feedback ; pouvoir → influence ; affiliation → relations.","regle":"McClelland : accomplissement, pouvoir, affiliation. Le manager adapte ses leviers au profil dominant."},{"id":"9-14","t":9,"n":14,"lvl":3,"neg":false,"q":"<p>Des agents expérimentés accompagnaient volontairement les nouvelles recrues, par goût de la transmission. La direction instaure une prime à l'heure de tutorat, puis la supprime un an plus tard pour des raisons budgétaires. Le nombre de tuteurs volontaires devient alors plus faible qu'au départ. Quel phénomène explique cette situation ?<\/p>","o":["L'effet d'éviction (ou de surjustification) : une récompense extérieure peut affaiblir une motivation intrinsèque préexistante","L'effet Pygmalion","L'effet de noria","L'effet Ringelmann"],"a":0,"just":"<p>Les travaux de Deci montrent qu'une récompense extérieure attribuée pour une activité réalisée par intérêt peut transformer la façon dont la personne la perçoit : « je le fais pour la prime » remplace « je le fais parce que j'aime ça ». Quand la prime disparaît, la motivation intrinsèque ne revient pas à son niveau initial.<\/p>","ana":"<ul><li>B : l'effet Pygmalion décrit l'influence des attentes d'une personne sur les performances d'une autre.<\/li><li>C : l'effet de noria concerne la masse salariale.<\/li><li>D : l'effet Ringelmann décrit la baisse d'effort individuel dans un groupe.<\/li><\/ul>","piege":"Croire qu'ajouter une récompense augmente toujours la motivation.","astuce":"Activité faite par plaisir + récompense ajoutée puis retirée + motivation plus faible qu'avant → effet d'éviction.","regle":"Les récompenses extrinsèques mal utilisées peuvent éteindre la motivation intrinsèque."},{"id":"9-15","t":9,"n":15,"lvl":3,"neg":false,"q":"<p>Un chef de service ne dispose d'aucun budget pour attribuer des primes. Quels leviers peut-il utiliser pour motiver son équipe ?<\/p>","o":["Aucun levier n'existe sans argent","Augmenter le contrôle et les sanctions","Promettre des promotions qu'il ne peut pas garantir","La reconnaissance (remerciements, valorisation des réussites), l'autonomie, le sens donné aux missions, le développement des compétences, la participation aux décisions et l'équité de traitement"],"a":3,"just":"<p>La plupart des théories (Herzberg, Deci et Ryan, Hackman et Oldham, Perry) montrent que les leviers les plus puissants et durables ne sont pas financiers. Dans l'administration, où les marges salariales sont encadrées par le statut, le manager de proximité dispose de nombreux leviers liés au contenu du travail et à la qualité du management.<\/p>","ana":"<ul><li>A : c'est faux, et c'est une excuse fréquente pour ne pas agir.<\/li><li>B : la pression et les sanctions peuvent obtenir de la conformité, mais pas de l'engagement.<\/li><li>C : une promesse non tenue détruit la confiance (et l'instrumentalité au sens de Vroom).<\/li><\/ul>","piege":"Réduire la motivation à la rémunération.","astuce":"Dans les questions de management public, les leviers non financiers sont presque toujours la bonne réponse.","regle":"Sens, reconnaissance, autonomie, progression, équité : la « boîte à outils » du manager public."},{"id":"9-16","t":9,"n":16,"lvl":3,"neg":false,"q":"<p>Quel ensemble d'indicateurs signale le plus probablement une <strong>démotivation collective<\/strong> dans un service ?<\/p>","o":["Une hausse des demandes de formation et des propositions d'amélioration","Une hausse de l'absentéisme de courte durée, des demandes de mutation, des erreurs et des réclamations des usagers, et une baisse de la participation aux réunions","Une baisse du nombre de dossiers en retard","Une augmentation du nombre de volontaires pour les projets transversaux"],"a":1,"just":"<p>La démotivation a des <strong>incidences<\/strong> mesurables : absentéisme (surtout les absences courtes et répétées), rotation du personnel (mutations, départs), baisse de la qualité (erreurs, réclamations), désengagement (moindre participation, retrait). Le manager doit surveiller ces signaux faibles pour agir tôt.<\/p>","ana":"<p>A, C et D sont des signes d'engagement, pas de démotivation.<\/p>","piege":"Attendre une crise ouverte pour réagir. Les signaux faibles apparaissent bien avant.","astuce":"Incidences de la démotivation → absentéisme, rotation, qualité en baisse, retrait.","regle":"La motivation a des effets concrets sur la performance, la qualité du service et le climat social."},{"id":"9-17","t":9,"n":17,"lvl":3,"neg":false,"q":"<p>Dans une administration, les avancements reposent presque exclusivement sur l'ancienneté. Un agent très investi déclare : « Que je travaille bien ou non, mon évolution sera la même. » Selon Vroom, quel facteur est affaibli, et comment le renforcer ?<\/p>","o":["La valence ; il faut proposer une récompense différente","L'expectation ; il faut former l'agent","L'instrumentalité : le lien entre la performance et ses conséquences ; il faut rendre visible et équitable la reconnaissance de la performance (évaluation sincère, accès aux responsabilités, valorisation)","Aucun ; l'agent est simplement démotivé par nature"],"a":2,"just":"<p>L'agent ne doute pas de sa capacité à bien travailler (expectation) ; il ne croit pas que cela changera quelque chose pour lui (instrumentalité). Une évaluation sincère, la prise en compte du mérite dans l'accès aux postes de responsabilité et la reconnaissance non financière renforcent ce lien.<\/p>","ana":"<ul><li>A : la valeur de la récompense n'est pas en cause.<\/li><li>B : l'agent est compétent ; la formation ne répond pas au problème.<\/li><li>D : la généralisation est infondée ; l'agent était justement très investi.<\/li><\/ul>","piege":"Confondre expectation et instrumentalité.","astuce":"« Ça ne changera rien pour moi » → instrumentalité.","regle":"Si la performance n'a aucune conséquence visible, l'effort finit par baisser."},{"id":"9-18","t":9,"n":18,"lvl":3,"neg":false,"q":"<p>Un agent contractuel, dont le contrat arrive à échéance dans deux mois sans certitude de renouvellement, se montre peu réceptif lorsque son chef lui propose de piloter un projet prestigieux. Comment la pyramide de Maslow peut-elle éclairer cette réaction ?<\/p>","o":["Son besoin de sécurité n'étant pas satisfait, les leviers liés à l'estime (projet prestigieux) ont peu d'effet tant que cette inquiétude persiste","L'agent n'a aucun besoin d'estime","L'agent recherche uniquement l'accomplissement de soi","La pyramide de Maslow ne concerne que les besoins physiologiques"],"a":0,"just":"<p>Selon Maslow, un besoin de niveau supérieur (estime) motive surtout lorsque les besoins inférieurs (ici, la sécurité de l'emploi) sont suffisamment satisfaits. L'inquiétude sur l'avenir mobilise l'attention de l'agent. Le manager peut d'abord clarifier sa situation, autant que possible.<\/p>","ana":"<ul><li>B : rien n'indique l'absence de besoin d'estime ; il est simplement passé au second plan.<\/li><li>C : aucun élément ne le montre.<\/li><li>D : la pyramide comporte cinq niveaux.<\/li><\/ul>","piege":"Appliquer la pyramide de façon trop rigide. Maslow a été critiqué : les besoins ne se satisfont pas toujours dans un ordre strict. Mais ici, l'explication est cohérente.","astuce":"Insécurité (emploi, contrat) → besoin de sécurité prioritaire.","regle":"On ne motive pas par l'estime quelqu'un qui s'inquiète pour sa sécurité."},{"id":"9-19","t":9,"n":19,"lvl":3,"neg":false,"q":"<p>Un agent se lance avec enthousiasme dans un projet d'amélioration, puis l'abandonne dès les premières difficultés. Quelle composante du processus motivationnel est principalement défaillante ?<\/p>","o":["Le déclenchement","La direction","L'intensité initiale","La persistance"],"a":3,"just":"<p>Le processus motivationnel comprend le déclenchement (l'envie d'agir est bien là), la direction (le but est clair), l'intensité (l'enthousiasme initial est fort) et la persistance (le maintien de l'effort dans la durée, notamment face aux obstacles). C'est cette dernière qui fait défaut. Le manager peut l'aider par un soutien, des objectifs intermédiaires et un retour régulier sur les progrès.<\/p>","ana":"<ul><li>A : l'agent s'est bien lancé.<\/li><li>B : le but (l'amélioration) est défini.<\/li><li>C : l'enthousiasme initial montre une intensité forte au départ.<\/li><\/ul>","piege":"Confondre intensité (force de l'effort) et persistance (durée de l'effort).","astuce":"« Abandonne dès les difficultés » → persistance.","regle":"Déclenchement, direction, intensité, persistance : chacune peut faire défaut et appelle une réponse différente."},{"id":"9-20","t":9,"n":20,"lvl":3,"neg":false,"q":"<p>Après une réorganisation, un service connaît une forte démotivation : absentéisme en hausse, perte de sens exprimée par les agents, sentiment d'injustice dans la répartition des tâches. Quel plan d'action est le plus pertinent ?<\/p>","o":["Instaurer un contrôle renforcé des présences et des sanctions","Réaliser un diagnostic (entretiens, enquête), rétablir l'équité dans la répartition du travail, redonner du sens en expliquant la finalité des missions, associer les agents à l'amélioration de l'organisation, reconnaître les efforts et suivre l'évolution d'indicateurs (absentéisme, climat)","Attendre que les agents s'habituent à la nouvelle organisation","Organiser une fête de service, sans autre mesure"],"a":1,"just":"<p>Les causes identifiées renvoient à plusieurs théories : l'injustice (Adams), la perte de sens (Hackman et Oldham, motivation de service public), le manque de participation (Deci et Ryan). Un plan efficace traite ces causes de façon combinée et mesure les effets.<\/p>","ana":"<ul><li>A : le contrôle et la sanction traitent le symptôme (absentéisme) sans agir sur les causes.<\/li><li>C : l'attentisme laisse la démotivation s'installer.<\/li><li>D : un moment convivial peut être utile, mais ne règle ni l'injustice ni la perte de sens.<\/li><\/ul>","piege":"Répondre à la démotivation par le contrôle.","astuce":"Relie chaque cause citée dans l'énoncé à une action : la bonne réponse les traite toutes.","regle":"On remotive en agissant sur les causes : équité, sens, participation, reconnaissance."},{"id":"10-1","t":10,"n":1,"lvl":1,"neg":false,"q":"<p>Selon le modèle de Kurt <strong>Lewin<\/strong>, quelles sont les trois phases d'un processus de changement ?<\/p>","o":["Planification, exécution, contrôle","Diagnostic, décision, sanction","Information, formation, évaluation","Décristallisation (dégel), changement (transition), recristallisation (regel)"],"a":3,"just":"<p>Lewin compare l'organisation à un bloc de glace. Il faut d'abord <strong>décristalliser<\/strong> : faire prendre conscience de la nécessité de changer et remettre en cause les habitudes. Vient ensuite la phase de <strong>changement<\/strong> : mise en place des nouvelles pratiques, avec apprentissage et accompagnement. Enfin, la <strong>recristallisation<\/strong> stabilise les nouvelles pratiques pour qu'elles deviennent la nouvelle norme.<\/p>","ana":"<ul><li>A : ce sont des étapes de gestion de projet.<\/li><li>B : la sanction n'est pas une étape du changement.<\/li><li>C : ce sont des actions d'accompagnement, pas les phases du modèle.<\/li><\/ul>","piege":"Oublier la dernière phase. Sans recristallisation, les anciennes habitudes reviennent.","astuce":"Glace : dégeler → modifier la forme → regeler.","regle":"Lewin : dégel, transition, regel."},{"id":"10-2","t":10,"n":2,"lvl":1,"neg":false,"q":"<p>Selon John <strong>Kotter<\/strong>, quelle est la première des huit étapes d'un changement réussi ?<\/p>","o":["Former une coalition puissante","Créer un sentiment d'urgence","Ancrer le changement dans la culture","Obtenir des victoires rapides"],"a":1,"just":"<p>Les huit étapes de Kotter sont : 1) créer un sentiment d'urgence ; 2) former une coalition de pilotage ; 3) élaborer une vision et une stratégie ; 4) communiquer la vision ; 5) donner aux acteurs les moyens d'agir (lever les obstacles) ; 6) obtenir des victoires rapides ; 7) consolider les gains et poursuivre ; 8) ancrer le changement dans la culture. Sans prise de conscience de la nécessité de changer, rien ne bouge.<\/p>","ana":"<ul><li>A : c'est la 2<sup>e<\/sup> étape.<\/li><li>C : c'est la 8<sup>e<\/sup> et dernière étape.<\/li><li>D : c'est la 6<sup>e<\/sup> étape.<\/li><\/ul>","piege":"Commencer par la coalition ou la vision avant d'avoir fait partager l'urgence.","astuce":"Kotter commence par « pourquoi changer maintenant ? » et finit par « ancrer dans la culture ». Les deux étapes de Kotter correspondent au dégel et au regel de Lewin.","regle":"Urgence → coalition → vision → communication → moyens d'agir → victoires rapides → consolidation → ancrage."},{"id":"10-3","t":10,"n":3,"lvl":1,"neg":false,"q":"<p>Avant de lancer une réforme, une direction vérifie si le projet peut être réalisé compte tenu des contraintes techniques, juridiques, financières, humaines et organisationnelles. De quelle étude s'agit-il ?<\/p>","o":["L'étude de faisabilité","L'étude d'opportunité","Le bilan social","L'audit de conformité"],"a":0,"just":"<p>L'étude d'<strong>opportunité<\/strong> répond à la question « faut-il le faire ? » (le projet est-il utile, pertinent, prioritaire ?). L'étude de <strong>faisabilité<\/strong> répond à la question « peut-on le faire ? » : elle vérifie que les moyens, le cadre juridique, les compétences, la technologie et le calendrier permettent de réaliser le projet, et identifie les risques et conditions de réussite.<\/p>","ana":"<ul><li>B : l'opportunité porte sur l'utilité, pas sur les contraintes de réalisation.<\/li><li>C : le bilan social présente des données sur le personnel.<\/li><li>D : l'audit de conformité vérifie le respect des règles existantes.<\/li><\/ul>","piege":"Confondre opportunité (pourquoi) et faisabilité (comment et avec quoi).","astuce":"« Peut-on ? » + contraintes → faisabilité. « Faut-il ? » + besoins → opportunité.","regle":"Opportunité d'abord (est-ce utile ?), faisabilité ensuite (est-ce réalisable ?)."},{"id":"10-4","t":10,"n":4,"lvl":1,"neg":false,"q":"<p>Après l'annonce d'une fusion de services, des agents expriment ouvertement leur mécontentement, critiquent la direction et accusent le projet d'être injuste. Selon la courbe du deuil (inspirée d'Élisabeth Kübler-Ross), à quelle phase se trouvent-ils probablement ?<\/p>","o":["L'acceptation","Le déni","La colère","L'engagement"],"a":2,"just":"<p>La courbe du deuil, appliquée au changement, décrit les réactions émotionnelles successives : <strong>choc<\/strong>, <strong>déni<\/strong> (« ça ne se fera pas »), <strong>colère<\/strong> (protestation, recherche de coupables), <strong>marchandage<\/strong> (négociation pour limiter les pertes), <strong>tristesse ou découragement<\/strong>, puis <strong>acceptation<\/strong> et engagement dans la nouvelle situation.<\/p>","ana":"<ul><li>A : les agents ne sont pas encore prêts à adopter la nouvelle situation.<\/li><li>B : le déni consiste à refuser de croire au changement ; ici, les agents y croient et s'y opposent.<\/li><li>D : l'engagement est la phase finale.<\/li><\/ul>","piege":"Considérer la colère comme un refus définitif. C'est une étape normale qu'il faut accompagner par l'écoute.","astuce":"Ordre : choc → déni → colère → marchandage → tristesse → acceptation.","regle":"Les réactions au changement suivent un cycle émotionnel ; le manager adapte son accompagnement à chaque phase."},{"id":"10-5","t":10,"n":5,"lvl":1,"neg":false,"q":"<p>Parmi les freins au changement suivants, lequel est un frein <strong>organisationnel<\/strong> (et non individuel) ?<\/p>","o":["La peur de ne pas être capable de maîtriser les nouveaux outils","L'attachement personnel à ses habitudes de travail","La crainte de perdre son statut auprès de ses collègues","Une structure cloisonnée et des règles de fonctionnement (procédures, critères d'évaluation) restées incohérentes avec le changement demandé"],"a":3,"just":"<p>On distingue les freins <strong>individuels<\/strong> (peur de l'inconnu, perte de repères, crainte de l'incompétence, perte d'avantages) et les freins <strong>organisationnels<\/strong> (structures rigides, cloisonnement, procédures, systèmes d'évaluation ou de reconnaissance contraires au changement, manque de moyens, culture de l'organisation).<\/p>","ana":"<p>A, B et C sont des freins individuels, liés aux perceptions et aux craintes des personnes.<\/p>","piege":"Attribuer toutes les résistances aux agents. Souvent, c'est l'organisation elle-même qui envoie des signaux contradictoires.","astuce":"Frein individuel = « je » (peur, habitude) ; frein organisationnel = « le système » (structure, règles, culture).","regle":"Pour réussir le changement, il faut aussi changer les règles, structures et systèmes qui l'empêchent."},{"id":"10-6","t":10,"n":6,"lvl":1,"neg":false,"q":"<p>Lors de l'annonce d'un changement, quel message faut-il communiquer <strong>en priorité<\/strong> pour favoriser l'adhésion ?<\/p>","o":["Le détail technique de toutes les nouvelles procédures","Le sens du changement : pourquoi il est nécessaire, ce qu'il apportera et ce qui restera stable","Uniquement le calendrier des formations","La liste des sanctions prévues en cas de refus"],"a":1,"just":"<p>Les agents ont d'abord besoin de comprendre <strong>pourquoi<\/strong> on change, avant de savoir <strong>comment<\/strong>. Expliquer les raisons, les bénéfices attendus (pour les usagers, pour les agents) et ce qui ne change pas réduit l'anxiété et favorise l'adhésion.<\/p>","ana":"<ul><li>A : trop de détails techniques au départ noient le message essentiel.<\/li><li>C : le calendrier est utile, mais secondaire.<\/li><li>D : la menace provoque la peur et la résistance.<\/li><\/ul>","piege":"Commencer par le « comment » sans avoir expliqué le « pourquoi ».","astuce":"Communication du changement → d'abord le sens, ensuite les modalités.","regle":"Pourquoi → quoi → comment → quand."},{"id":"10-7","t":10,"n":7,"lvl":2,"neg":false,"q":"<p>Selon l'approche sociodynamique de Jean-Christian Fauvet, quelle stratégie est recommandée pour conduire un changement ?<\/p>","o":["S'appuyer sur les acteurs favorables (engagés) pour convaincre les hésitants et les passifs, plutôt que d'épuiser son énergie à tenter de convertir les opposants irréductibles","Concentrer tous les efforts sur les opposants les plus radicaux","Ignorer la majorité passive","Imposer le changement sans tenir compte des positions des acteurs"],"a":0,"just":"<p>Fauvet classe les acteurs selon deux axes : leur <strong>synergie<\/strong> (énergie favorable au projet) et leur <strong>antagonisme<\/strong> (énergie opposée). On trouve notamment les engagés, les hésitants (ou déchirés), les passifs (souvent la majorité), les opposants et les irréductibles. Le « triangle d'or » réunit engagés, hésitants et passifs : c'est sur cette population qu'il faut agir pour créer une dynamique.<\/p>","ana":"<ul><li>B : convertir les irréductibles consomme beaucoup d'énergie pour peu de résultats.<\/li><li>C : la majorité passive est décisive ; elle peut basculer d'un côté ou de l'autre.<\/li><li>D : ignorer les acteurs augmente les résistances.<\/li><\/ul>","piege":"Vouloir convaincre tout le monde, en commençant par les plus opposés.","astuce":"Sociodynamique → triangle d'or : engagés + hésitants + passifs.","regle":"On construit le changement avec ses alliés et on gagne les indécis ; on ne s'épuise pas sur les irréductibles."},{"id":"10-8","t":10,"n":8,"lvl":2,"neg":false,"q":"<p>Un agent est le seul à maîtriser le classement des archives papier d'un service. Il s'oppose fermement au projet de numérisation. Selon l'analyse stratégique de Crozier et Friedberg, comment expliquer sa résistance ?<\/p>","o":["Il manque simplement d'informations techniques","Il est naturellement réfractaire au progrès","Le projet lui fait perdre la maîtrise d'une « zone d'incertitude », source de son pouvoir dans l'organisation","Il n'a pas les compétences pour utiliser un ordinateur"],"a":2,"just":"<p>Michel Crozier et Erhard Friedberg (<em>L'acteur et le système<\/em>) montrent que chaque acteur poursuit des stratégies rationnelles et que son pouvoir dépend des <strong>zones d'incertitude<\/strong> qu'il maîtrise (une compétence rare, une information, une relation). Un changement qui supprime cette zone menace son pouvoir : la résistance est alors logique de son point de vue.<\/p>","ana":"<ul><li>A : rien n'indique un manque d'information.<\/li><li>B : l'analyse stratégique refuse ce type d'explication psychologique simpliste.<\/li><li>D : rien n'indique un problème de compétence informatique.<\/li><\/ul>","piege":"Considérer la résistance comme irrationnelle. Pour Crozier, elle est souvent rationnelle du point de vue de l'acteur.","astuce":"« Seul à maîtriser » + résistance → zone d'incertitude, pouvoir.","regle":"Pour lever ce type de résistance, il faut proposer à l'acteur un nouveau rôle valorisant dans le système futur (par exemple, référent de la numérisation)."},{"id":"10-9","t":10,"n":9,"lvl":2,"neg":false,"q":"<p>Une administration remplace le circuit de validation hiérarchique de chaque demande par un système où les agents décident eux-mêmes dans un cadre défini, avec un contrôle a posteriori. Les rôles et les règles du jeu changent profondément. Selon l'école de Palo Alto, de quel type de changement s'agit-il ?<\/p>","o":["Un changement de type 1, qui ajuste le fonctionnement sans modifier le système","Un simple ajustement technique","Un retour à l'organisation antérieure","Un changement de type 2, qui modifie les règles et le fonctionnement du système lui-même"],"a":3,"just":"<p>Paul Watzlawick et l'école de Palo Alto distinguent le changement de <strong>type 1<\/strong> (on modifie des éléments à l'intérieur d'un système qui reste identique, par exemple accélérer le même circuit) et le changement de <strong>type 2<\/strong> (on change le système lui-même : ses règles, ses rôles, sa logique). Passer d'un contrôle a priori hiérarchique à une décision autonome contrôlée a posteriori est un changement de logique.<\/p>","ana":"<ul><li>A : le système lui-même est modifié.<\/li><li>B : il ne s'agit pas d'un simple ajustement.<\/li><li>C : rien n'indique un retour en arrière.<\/li><\/ul>","piege":"Mesurer l'ampleur d'un changement à ses aspects techniques plutôt qu'à la transformation des règles et des rôles.","astuce":"« Faire plus de la même chose » → type 1 ; « changer les règles du jeu » → type 2.","regle":"Le changement de type 2 transforme le système ; il exige un accompagnement plus profond."},{"id":"10-10","t":10,"n":10,"lvl":2,"neg":false,"q":"<p>Pour piloter le déploiement d'un nouvel outil de gestion du courrier, quel indicateur mesure le mieux l'<strong>appropriation<\/strong> du changement par les agents ?<\/p>","o":["Le nombre de licences achetées","La part des courriers effectivement traités dans le nouvel outil, plutôt que par les anciens circuits","Le nombre de réunions du comité de pilotage","Le montant du budget consommé"],"a":1,"just":"<p>Le pilotage du changement utilise trois familles d'indicateurs : l'<strong>avancement<\/strong> (le déploiement prévu est-il réalisé ? formations faites, sites équipés), l'<strong>appropriation<\/strong> (les agents utilisent-ils réellement les nouvelles pratiques ?) et les <strong>résultats<\/strong> (le changement produit-il les effets attendus ? délais, qualité). Un outil installé mais non utilisé est un échec.<\/p>","ana":"<ul><li>A : l'achat de licences mesure les moyens, pas l'usage.<\/li><li>C : le nombre de réunions mesure l'activité de la gouvernance.<\/li><li>D : le budget consommé est un indicateur de moyens.<\/li><\/ul>","piege":"Confondre déploiement (l'outil est installé) et appropriation (l'outil est utilisé).","astuce":"Appropriation → « usage effectif », « taux d'utilisation », « abandon des anciennes pratiques ».","regle":"Avancement, appropriation, résultats : trois niveaux d'indicateurs de pilotage du changement."},{"id":"10-11","t":10,"n":11,"lvl":2,"neg":false,"q":"<p>Dans un projet de changement, des agents volontaires de différents services sont formés en priorité pour aider leurs collègues, répondre à leurs questions et faire remonter les difficultés à l'équipe projet. Comment les appelle-t-on ?<\/p>","o":["Les relais (ou ambassadeurs) du changement","Les membres du comité d'audit","Les représentants syndicaux","Les inspecteurs"],"a":0,"just":"<p>Les relais (ou ambassadeurs, ou référents) sont des agents de terrain qui jouent un rôle d'intermédiaire : ils expliquent, rassurent, accompagnent leurs collègues au quotidien et font remonter les problèmes. Leur proximité les rend souvent plus crédibles que la direction.<\/p>","ana":"<ul><li>B : le comité d'audit supervise le contrôle interne et l'audit.<\/li><li>C : les représentants syndicaux défendent les intérêts du personnel ; ils sont consultés, mais ne sont pas des relais du projet.<\/li><li>D : les inspecteurs exercent une mission de contrôle.<\/li><\/ul>","piege":"Confondre relais (accompagnement entre pairs) et contrôle.","astuce":"« Agents formés en priorité pour aider leurs collègues » → relais, ambassadeurs, référents.","regle":"Le changement se diffuse mieux par des pairs crédibles que par des notes de service."},{"id":"10-12","t":10,"n":12,"lvl":2,"neg":false,"q":"<p>Avant de déployer une réorganisation, l'équipe projet analyse, pour chaque catégorie d'agents, ce qui va changer concrètement dans leurs tâches, leurs compétences, leurs outils et leur organisation. Comment s'appelle cette démarche ?<\/p>","o":["L'étude d'opportunité","Le bilan comptable","L'étude d'impacts du changement","L'évaluation ex post"],"a":2,"just":"<p>L'étude d'impacts identifie, population par population, l'ampleur des changements (tâches, compétences, outils, organisation, lieu de travail). Elle permet d'adapter l'accompagnement : formation ciblée, communication spécifique, soutien renforcé pour les populations les plus touchées.<\/p>","ana":"<ul><li>A : l'opportunité porte sur l'utilité du projet.<\/li><li>B : le bilan comptable décrit la situation financière.<\/li><li>D : l'évaluation ex post intervient après la mise en œuvre.<\/li><\/ul>","piege":"Appliquer le même accompagnement à tous, alors que les impacts diffèrent selon les populations.","astuce":"« Pour chaque catégorie d'agents, ce qui change » → étude d'impacts.","regle":"On accompagne mieux quand on sait précisément qui est touché et comment."},{"id":"10-13","t":10,"n":13,"lvl":2,"neg":false,"q":"<p>Dans quelle situation une conduite du changement plutôt <strong>prescrite<\/strong> (décidée par la direction) est-elle la plus justifiée ?<\/p>","o":["Lorsque l'organisation dispose de beaucoup de temps et que l'adhésion des agents est essentielle","Lorsque la direction veut éviter tout dialogue par principe","Lorsque le changement concerne la culture de l'organisation sur le long terme","Lorsqu'une obligation légale ou une situation d'urgence impose un délai très court, à condition d'expliquer les raisons et d'accompagner les agents"],"a":3,"just":"<p>On distingue le changement <strong>prescrit<\/strong> (décidé d'en haut, rapide mais avec un risque de faible adhésion), <strong>construit<\/strong> ou participatif (élaboré avec les acteurs, plus lent mais mieux approprié) et <strong>négocié<\/strong> (fruit d'un compromis). En cas d'urgence ou d'obligation légale, le changement prescrit peut être nécessaire, mais il doit être expliqué et accompagné.<\/p>","ana":"<ul><li>A : avec du temps et un besoin fort d'adhésion, l'approche construite est préférable.<\/li><li>B : refuser le dialogue par principe n'est jamais une justification.<\/li><li>C : un changement de culture exige au contraire la participation.<\/li><\/ul>","piege":"Croire qu'une approche est toujours la meilleure. Le choix dépend du contexte (urgence, enjeu, culture).","astuce":"Urgence ou contrainte légale → prescrit (mais expliqué) ; temps disponible et enjeu d'adhésion → construit.","regle":"Le mode de conduite du changement s'adapte au contexte."},{"id":"10-14","t":10,"n":14,"lvl":3,"neg":false,"q":"<p>Une réforme a été annoncée en quelques lignes lors d'une réunion de direction, sans autre explication. Trois mois plus tard, des rumeurs alarmistes circulent (suppressions de postes, mutations forcées) et l'inquiétude paralyse le service. Quelle est la mesure prioritaire ?<\/p>","o":["Interdire les discussions sur la réforme","Mettre en place un plan de communication régulier, honnête et à plusieurs niveaux (réunions, foire aux questions, échanges avec les managers de proximité), qui répond aux inquiétudes réelles","Attendre la fin du projet pour communiquer","Sanctionner les auteurs des rumeurs"],"a":1,"just":"<p>Les rumeurs naissent du vide d'information. Une communication régulière, transparente sur ce que l'on sait et ce que l'on ne sait pas encore, relayée par les managers de proximité et ouverte aux questions, réduit l'anxiété et rétablit la confiance.<\/p>","ana":"<ul><li>A : interdire les discussions renforce la méfiance.<\/li><li>C : le silence alimente les rumeurs.<\/li><li>D : sanctionner ne règle pas la cause (le manque d'information) et détériore le climat.<\/li><\/ul>","piege":"Croire qu'une annonce unique suffit. La communication du changement est continue.","astuce":"Rumeurs + inquiétude → manque de communication → communication régulière et transparente.","regle":"Quand l'information officielle manque, la rumeur prend sa place."},{"id":"10-15","t":10,"n":15,"lvl":3,"neg":false,"q":"<p>Une direction veut numériser toutes ses procédures en trois mois, sans budget dédié, sans informaticien en interne, alors qu'un texte en vigueur impose encore une signature manuscrite pour certains actes. Quelle conclusion tirer de l'étude de faisabilité ?<\/p>","o":["Le projet, tel qu'il est conçu, n'est pas faisable sur les plans financier, humain et juridique : il faut le redimensionner (phasage, priorités), mobiliser des moyens et faire évoluer le cadre juridique ou utiliser la signature électronique là où elle est admise","Le projet est faisable, puisque la volonté politique existe","Il faut lancer le projet et régler les problèmes au fur et à mesure","Il faut ignorer le texte imposant la signature manuscrite"],"a":0,"just":"<p>L'étude de faisabilité examine plusieurs dimensions : financière (budget), humaine (compétences), technique, juridique et calendaire. Ici, plusieurs obstacles majeurs sont identifiés. La bonne réponse n'est pas d'abandonner, mais d'adapter le projet : priorités, phasage, moyens, évolution du cadre juridique ou recours à la signature électronique (au Maroc, la loi 43-20 encadre les services de confiance électroniques).<\/p>","ana":"<ul><li>B : la volonté ne remplace ni les moyens ni le respect du droit.<\/li><li>C : lancer un projet infaisable conduit à l'échec et décrédibilise le changement.<\/li><li>D : l'administration est soumise au principe de légalité.<\/li><\/ul>","piege":"Confondre volonté de changement et faisabilité.","astuce":"Quand l'énoncé accumule les obstacles, la bonne réponse identifie les dimensions de faisabilité concernées et propose d'adapter le projet.","regle":"Un projet infaisable en l'état se redimensionne ; il ne se lance pas « en espérant »."},{"id":"10-16","t":10,"n":16,"lvl":3,"neg":false,"q":"<p>Pendant un projet de réorganisation, des agents expriment des objections précises : la nouvelle répartition des tâches doublerait la charge de travail de certains postes. Comment le chef de projet doit-il considérer ces résistances ?<\/p>","o":["Comme une opposition de principe à ignorer","Comme un motif suffisant pour abandonner le projet","Comme une source d'information utile : il faut écouter, vérifier les faits et, si les objections sont fondées, ajuster le projet","Comme une faute disciplinaire"],"a":2,"just":"<p>La résistance au changement n'est pas toujours irrationnelle. Elle peut révéler des défauts réels du projet (surcharge, oubli d'une contrainte, risque pour la qualité). L'écouter permet d'améliorer le projet et montre aux agents que leur avis compte, ce qui favorise l'adhésion.<\/p>","ana":"<ul><li>A : ignorer des objections précises fait passer à côté de problèmes réels.<\/li><li>B : une objection fondée appelle un ajustement, pas forcément un abandon.<\/li><li>D : exprimer une objection n'est pas une faute.<\/li><\/ul>","piege":"Voir toute résistance comme un obstacle à vaincre.","astuce":"Objections précises et argumentées → écoute, vérification, ajustement.","regle":"La résistance est aussi un signal : elle dit souvent quelque chose de vrai sur le projet."},{"id":"10-17","t":10,"n":17,"lvl":3,"neg":false,"q":"<p>Un projet de modernisation a donné de bons résultats la première année. L'équipe projet est alors dissoute, les indicateurs ne sont plus suivis et, progressivement, les anciennes pratiques réapparaissent. Quelle étape a été négligée ?<\/p>","o":["La création d'un sentiment d'urgence","L'étude d'opportunité","La formation de la coalition","La consolidation et l'ancrage du changement dans la culture et les pratiques (recristallisation)"],"a":3,"just":"<p>Kotter met en garde contre la tentation de « crier victoire trop tôt ». Les nouvelles pratiques doivent être consolidées (suivi, ajustements) puis ancrées dans les règles, les procédures, les critères d'évaluation, la formation des nouveaux arrivants et la culture. C'est la recristallisation de Lewin.<\/p>","ana":"<ul><li>A, B et C : ces étapes interviennent au début du processus ; or le projet a fonctionné au départ.<\/li><\/ul>","piege":"Considérer qu'un changement est acquis dès les premiers résultats.","astuce":"« Bons résultats puis retour des anciennes pratiques » → défaut d'ancrage.","regle":"Un changement n'est réussi que lorsqu'il est devenu la nouvelle norme."},{"id":"10-18","t":10,"n":18,"lvl":3,"neg":false,"q":"<p>Dans un projet de changement, pourquoi est-il recommandé d'obtenir rapidement des <strong>victoires visibles<\/strong> (« quick wins ») ?<\/p>","o":["Pour pouvoir arrêter le projet plus tôt","Pour montrer concrètement que le changement produit des bénéfices, entretenir la dynamique et convaincre les sceptiques","Pour éviter de suivre des indicateurs","Pour remplacer la vision à long terme"],"a":1,"just":"<p>Les changements longs s'essoufflent si personne ne voit de résultats. Des réussites rapides et visibles (un délai réduit, une procédure simplifiée) prouvent que le changement fonctionne, valorisent les acteurs engagés et rendent la position des opposants plus difficile.<\/p>","ana":"<ul><li>A : les victoires rapides ne sont pas la fin du projet.<\/li><li>C : elles doivent au contraire être mesurées et communiquées.<\/li><li>D : elles s'inscrivent dans la vision, elles ne la remplacent pas.<\/li><\/ul>","piege":"Choisir des victoires rapides sans lien avec l'objectif final.","astuce":"Quick wins = preuve + motivation + crédibilité.","regle":"Montrer tôt que le changement marche, puis continuer."},{"id":"10-19","t":10,"n":19,"lvl":3,"neg":false,"q":"<p>Dans un projet de réorganisation, la direction a associé les agents de terrain, mais pas les chefs de service intermédiaires. Ces derniers freinent la mise en œuvre et retiennent les informations. Quel levier faut-il actionner ?<\/p>","o":["Impliquer l'encadrement intermédiaire comme acteur et relais du changement : l'associer aux décisions qui le concernent, le former à l'accompagnement et clarifier son rôle futur","Contourner les chefs de service en s'adressant directement aux agents","Remplacer tous les chefs de service","Supprimer l'échelon intermédiaire sans autre analyse"],"a":0,"just":"<p>L'encadrement intermédiaire est un maillon décisif : il traduit la stratégie en actions concrètes et accompagne les équipes au quotidien. S'il se sent ignoré ou menacé (perte de rôle, de pouvoir), il peut bloquer le changement. Il faut l'associer, le former et lui donner un rôle clair dans l'organisation future.<\/p>","ana":"<ul><li>B : contourner les managers accroît leur résistance et désorganise la ligne hiérarchique.<\/li><li>C : la réponse est disproportionnée et ignore les causes.<\/li><li>D : supprimer un échelon est une décision lourde qui ne répond pas au problème posé.<\/li><\/ul>","piege":"Oublier les managers de proximité dans la conduite du changement.","astuce":"Blocage par l'encadrement intermédiaire → l'impliquer et le valoriser comme relais.","regle":"Le changement passe par les managers de proximité, ou il ne passe pas."},{"id":"10-20","t":10,"n":20,"lvl":3,"neg":false,"q":"<p>Une direction prépare un changement important. Quel plan de pilotage est le plus complet ?<\/p>","o":["Une note de service annonçant le changement, puis une évaluation au bout de deux ans","Un logiciel de gestion de projet et un calendrier, sans autre action","Diagnostic et étude de faisabilité → vision et sens partagés → gouvernance (sponsor, comité de pilotage, chef de projet, relais) → étude d'impacts → plans de communication, de formation et d'accompagnement → indicateurs d'ava
