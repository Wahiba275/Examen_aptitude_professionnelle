on/fiabilité.<\/li><li>D : l'externalisation confie une activité à un tiers ; elle ne crée pas cet équilibre.<\/li><\/ul>","piege":"Croire qu'il faut choisir entre innover et assurer la continuité. L'ambidextrie montre qu'on peut organiser les deux.","astuce":"« À la fois », « en même temps », « concilier », deux logiques opposées → ambidextrie (comme une personne qui se sert de ses deux mains).","regle":"Ambidextrie = exploitation (continuité) + exploration (innovation)."},{"id":"2-10","t":2,"n":10,"lvl":2,"neg":false,"q":"<p>Le ministre de tutelle d'un établissement public souhaite annuler directement une décision prise par le directeur de l'établissement, sans qu'aucun texte ne le lui permette. Que faut-il en penser ?<\/p>","o":["Il ne le peut pas : la tutelle n'est pas un pouvoir hiérarchique, elle ne s'exerce que dans les cas et formes prévus par les textes","Il le peut toujours, car l'établissement public est un service du ministère","Il le peut si le directeur est d'accord","Il le peut, car la tutelle donne un pouvoir d'instruction général"],"a":0,"just":"<p>L'établissement public est une personne morale autonome. L'État exerce sur lui une <strong>tutelle<\/strong> (contrôle de légalité, approbation de certaines décisions, contrôle financier), mais pas un pouvoir hiérarchique. Selon l'adage, « pas de tutelle sans texte, pas de tutelle au-delà des textes ».<\/p>","ana":"<ul><li>B : l'établissement n'est pas un service du ministère ; il a sa propre personnalité morale.<\/li><li>C : l'accord du directeur ne crée pas de compétence au profit du ministre.<\/li><li>D : le pouvoir d'instruction générale caractérise la hiérarchie, pas la tutelle.<\/li><\/ul>","piege":"Confondre tutelle (sur une personne morale distincte) et hiérarchie (au sein d'une même personne morale).","astuce":"Tutelle → « prévu par les textes », contrôle limité. Hiérarchie → ordres, instructions, annulation, réformation.","regle":"Pas de tutelle sans texte, ni au-delà des textes."},{"id":"2-11","t":2,"n":11,"lvl":2,"neg":false,"q":"<p>Dans la gouvernance d'un projet de transformation, quel est le rôle principal du <strong>comité de pilotage (COPIL)<\/strong> ?<\/p>","o":["Réaliser les tâches techniques quotidiennes du projet","Rédiger les comptes rendus des réunions d'équipe","Former les agents aux nouveaux outils","Fixer les orientations, valider les étapes clés et rendre les arbitrages stratégiques (budget, calendrier, périmètre)"],"a":3,"just":"<p>Le COPIL réunit les décideurs (direction, sponsor, responsables métiers). Il donne le cap, valide les livrables majeurs et tranche les choix qui dépassent l'équipe projet. Le comité technique et l'équipe projet assurent le travail opérationnel.<\/p>","ana":"<ul><li>A : c'est le rôle de l'équipe projet.<\/li><li>B : c'est une tâche de secrétariat ou du chef de projet.<\/li><li>C : la formation relève de l'accompagnement du changement, pilotée par l'équipe projet ou la fonction RH.<\/li><\/ul>","piege":"Confondre niveau stratégique (COPIL) et niveau opérationnel (équipe projet, comité technique).","astuce":"« Pilotage » = décider et orienter. Tout ce qui est « faire » relève de l'équipe.","regle":"COPIL = décision et arbitrage ; chef de projet = coordination ; équipe = réalisation."},{"id":"2-12","t":2,"n":12,"lvl":2,"neg":false,"q":"<p>Selon les configurations organisationnelles de <strong>Mintzberg<\/strong>, quelle structure est la plus favorable à l'innovation dans un environnement complexe et changeant ?<\/p>","o":["La bureaucratie mécaniste","L'adhocratie","La structure simple","La structure divisionnelle"],"a":1,"just":"<p>L'adhocratie repose sur des équipes pluridisciplinaires, souples et organisées par projets, coordonnées par l'ajustement mutuel. Elle est adaptée à l'innovation et aux environnements incertains. Les laboratoires d'innovation publique s'en rapprochent.<\/p>","ana":"<ul><li>A : la bureaucratie mécaniste, fondée sur la standardisation des procédés, est efficace pour les tâches répétitives et stables, mais rigide.<\/li><li>C : la structure simple (pouvoir concentré dans le dirigeant) convient aux petites organisations jeunes.<\/li><li>D : la structure divisionnelle (divisions autonomes par produit ou région) vise la gestion de la diversité, pas l'innovation en soi.<\/li><\/ul>","piege":"Associer « grande administration » à « adhocratie ». La plupart des administrations sont des bureaucraties mécanistes ou professionnelles ; l'adhocratie concerne surtout des unités d'innovation.","astuce":"« Ad hoc » = « pour cela », c'est-à-dire des équipes créées pour chaque projet → innovation.","regle":"Stabilité → bureaucratie ; innovation et complexité → adhocratie."},{"id":"2-13","t":2,"n":13,"lvl":2,"neg":false,"q":"<p>Lors d'une réorganisation, un acteur a un <strong>fort pouvoir<\/strong> d'influence sur le projet mais un <strong>faible intérêt<\/strong> pour celui-ci (par exemple un organe de contrôle). Selon la matrice pouvoir/intérêt des parties prenantes, quelle stratégie adopter ?<\/p>","o":["L'ignorer, puisqu'il n'est pas intéressé","L'associer à toutes les réunions de travail opérationnelles","Le tenir satisfait : l'informer des points qui le concernent et éviter qu'il devienne opposant","Se contenter de lui envoyer une information générale une fois le projet terminé"],"a":2,"just":"<p>La matrice pouvoir/intérêt (Mendelow) classe les parties prenantes en quatre groupes : fort pouvoir / fort intérêt → gérer étroitement (acteurs clés) ; fort pouvoir / faible intérêt → tenir satisfait ; faible pouvoir / fort intérêt → tenir informé ; faible pouvoir / faible intérêt → surveiller.<\/p>","ana":"<ul><li>A et D : négliger un acteur puissant est risqué : s'il se sent ignoré, il peut bloquer le projet.<\/li><li>B : l'impliquer dans tout le travail opérationnel serait disproportionné pour un acteur peu intéressé.<\/li><\/ul>","piege":"Raisonner sur un seul critère (« pas intéressé, donc pas important »). Le pouvoir de blocage compte autant que l'intérêt.","astuce":"Fort pouvoir → jamais « ignorer » ; faible pouvoir + fort intérêt → « informer ».","regle":"Gérer étroitement / tenir satisfait / tenir informé / surveiller."},{"id":"2-14","t":2,"n":14,"lvl":3,"neg":false,"q":"<p>Un établissement public veut appliquer l'agilité à un projet numérique. Le chef de projet propose de ne plus respecter la réglementation des marchés publics pour « gagner en réactivité ». Quelle est la bonne analyse ?<\/p>","o":["L'agilité doit s'exercer dans le respect du cadre juridique : il faut adapter la méthode (contrats à bons de commande, découpage en lots, étapes de validation) sans s'affranchir des règles","L'agilité justifie toute dérogation aux règles de la commande publique","Les méthodes agiles sont incompatibles avec le secteur public et doivent être abandonnées","Il suffit d'obtenir l'accord oral du directeur pour déroger aux règles"],"a":0,"just":"<p>Le principe de légalité s'impose à toute administration. L'agilité publique consiste à utiliser les souplesses permises par les textes (allotissement, marchés à bons de commande, phasage, dialogue avec les prestataires) et à organiser le travail par itérations, pas à contourner les règles.<\/p>","ana":"<ul><li>B : aucune méthode de gestion ne permet de déroger à la loi.<\/li><li>C : de nombreuses administrations utilisent l'agilité avec succès ; il faut l'adapter, pas l'abandonner.<\/li><li>D : un accord oral ne crée pas de dérogation légale et engagerait la responsabilité des personnes concernées.<\/li><\/ul>","piege":"Opposer agilité et légalité. La question teste ta capacité à <strong>concilier<\/strong> les deux.","astuce":"Quand une proposition suggère de contourner la loi, elle est fausse. Quand une autre rejette totalement une méthode moderne, elle est aussi suspecte. Cherche la proposition d'adaptation.","regle":"Agilité publique = souplesse dans la méthode, rigueur dans le respect du droit."},{"id":"2-15","t":2,"n":15,"lvl":3,"neg":false,"q":"<p>La direction d'un hôpital annonce par note de service une réorganisation complète des plannings, conçue par un cabinet externe, sans consultation des équipes. Deux semaines plus tard, l'absentéisme augmente et les cadres de santé signalent un fort mécontentement. Quelle erreur principale a été commise ?<\/p>","o":["Le recours à un cabinet externe, qui est interdit dans les hôpitaux publics","Le choix d'une note de service plutôt qu'une circulaire","L'absence de formation technique au logiciel de planning","L'absence d'association des agents à la conception du changement, qui empêche l'appropriation et nourrit les résistances"],"a":3,"just":"<p>Une transformation imposée « d'en haut » sans dialogue est vécue comme une menace. Associer les équipes au diagnostic et à la construction des solutions (groupes de travail, consultation des cadres de proximité, expérimentation) favorise l'appropriation et permet d'intégrer les contraintes du terrain.<\/p>","ana":"<ul><li>A : le recours à un cabinet n'est pas interdit ; le problème est l'absence d'implication interne.<\/li><li>B : la forme de l'acte n'explique pas le mécontentement.<\/li><li>C : rien dans l'énoncé ne parle d'un logiciel ; c'est un détail inventé par la proposition.<\/li><\/ul>","piege":"Chercher une explication technique ou juridique alors que l'énoncé décrit un problème humain (mécontentement, absentéisme).","astuce":"Les indices « sans consultation », « par note de service », « conçue par un cabinet externe » pointent tous vers le manque de participation.","regle":"On ne transforme pas une organisation sans les personnes qui la font vivre : co-construire pour faire adhérer."},{"id":"2-16","t":2,"n":16,"lvl":3,"neg":false,"q":"<p>Un centre hospitalier déploie un nouveau dossier patient informatisé. La direction veut garantir la continuité des soins en cas de panne. Quelle mesure est la plus adaptée ?<\/p>","o":["Interdire l'usage du papier dès le premier jour pour forcer l'adoption","Prévoir un mode dégradé (procédures papier de secours, accès aux données essentielles) et un plan de continuité d'activité testé","Reporter indéfiniment le projet tant qu'un risque de panne existe","Compter sur le prestataire pour réagir en cas de problème, sans procédure interne"],"a":1,"just":"<p>Le plan de continuité d'activité (PCA) prévoit comment maintenir les activités essentielles en cas d'incident. Le mode dégradé permet de continuer à soigner même si le système est indisponible. Il doit être connu des équipes et testé.<\/p>","ana":"<ul><li>A : supprimer toute solution de secours rend l'hôpital vulnérable à la moindre panne.<\/li><li>C : le risque zéro n'existe pas ; reporter indéfiniment bloque la modernisation.<\/li><li>D : la continuité du service public est de la responsabilité de l'établissement ; elle ne peut pas être entièrement déléguée.<\/li><\/ul>","piege":"Les deux extrêmes (tout miser sur le numérique / tout bloquer par peur du risque) sont faux.","astuce":"Continuité + système informatique → « mode dégradé », « PCA », « solution de secours », « tests ».","regle":"Innover, oui, mais avec un plan B testé pour les activités essentielles."},{"id":"2-17","t":2,"n":17,"lvl":3,"neg":false,"q":"<p>Dans le cadre de la réforme des établissements et entreprises publics (EEP) engagée en 2021 au Maroc, quel organisme a été créé pour assurer la gestion stratégique des participations de l'État et le suivi de la performance des EEP ?<\/p>","o":["La Cour des comptes","L'Instance nationale de la probité, de la prévention et de la lutte contre la corruption","L'Agence nationale de gestion stratégique des participations de l'État et de suivi des performances des EEP (ANGSPE)","Le Conseil économique, social et environnemental"],"a":2,"just":"<p>La loi-cadre n° 50-21 relative à la réforme des EEP et la loi n° 82-20 ont créé l'Agence nationale de gestion stratégique des participations de l'État. Elle exerce le rôle d'actionnaire de l'État dans les entreprises publiques et suit leurs performances, dans une logique de rationalisation du portefeuille public et de bonne gouvernance.<\/p>","ana":"<ul><li>A : la Cour des comptes est la juridiction supérieure de contrôle des finances publiques ; elle contrôle les EEP mais ne gère pas les participations de l'État.<\/li><li>B : l'Instance nationale de la probité est chargée de la prévention et de la lutte contre la corruption.<\/li><li>D : le CESE est un organe consultatif.<\/li><\/ul>","piege":"Confondre une institution de <strong>contrôle<\/strong> (Cour des comptes) avec un organisme de <strong>gestion stratégique<\/strong> (ANGSPE).","astuce":"Le nom de l'agence décrit sa mission : « gestion stratégique des participations » et « suivi des performances ».","regle":"Réforme des EEP : loi-cadre 50-21 (orientations) + loi 82-20 (ANGSPE)."},{"id":"2-18","t":2,"n":18,"lvl":3,"neg":false,"q":"<p>Un directeur d'établissement public veut encourager ses agents à proposer et tester des idées nouvelles. Quelle condition est la plus déterminante ?<\/p>","o":["Instaurer un « droit à l'erreur » encadré, qui distingue l'erreur de bonne foi commise en expérimentant de la faute, et valoriser les initiatives","Sanctionner systématiquement toute expérimentation qui échoue, pour responsabiliser les agents","Réserver l'innovation à la direction générale","Exiger qu'une idée soit garantie à 100 % avant tout test"],"a":0,"just":"<p>L'innovation suppose de prendre des risques mesurés. Si toute erreur est sanctionnée, les agents ne proposent plus rien. Le droit à l'erreur encadré protège l'agent qui expérimente de bonne foi, dans un cadre validé, tout en maintenant la responsabilité en cas de faute ou de négligence.<\/p>","ana":"<ul><li>B : une culture de la sanction systématique tue l'initiative.<\/li><li>C : les meilleures idées viennent souvent des agents de terrain, au contact des usagers.<\/li><li>D : exiger une garantie totale avant de tester revient à interdire l'expérimentation.<\/li><\/ul>","piege":"Croire que droit à l'erreur signifie absence de responsabilité. Il est <strong>encadré<\/strong> : bonne foi, périmètre défini, retour d'expérience.","astuce":"Innovation → confiance, initiative, apprentissage. Toute proposition fondée sur la peur ou le contrôle total est à éliminer.","regle":"Pas d'innovation sans droit à l'erreur ; pas de droit à l'erreur sans cadre."},{"id":"2-19","t":2,"n":19,"lvl":3,"neg":false,"q":"<p>Pour mener sa transformation, un office public crée une structure matricielle : chaque agent du projet dépend à la fois de son chef de service métier et du chef de projet. Quel est le principal risque de cette organisation ?<\/p>","o":["L'absence totale de coordination entre services","La disparition des compétences métiers","L'impossibilité de travailler en mode projet","La dualité de commandement, source de conflits de priorités et d'ambiguïté pour les agents"],"a":3,"just":"<p>La structure matricielle croise une logique métier (verticale) et une logique projet (transversale). Elle favorise la coopération et la mobilisation des compétences, mais l'agent qui a « deux chefs » peut recevoir des consignes contradictoires. Il faut donc clarifier les rôles et prévoir des mécanismes d'arbitrage.<\/p>","ana":"<ul><li>A : c'est l'inverse : la matrice est conçue pour améliorer la coordination entre services.<\/li><li>B : les compétences métiers sont conservées grâce au rattachement au service d'origine.<\/li><li>C : la matrice est justement un moyen de travailler en mode projet.<\/li><\/ul>","piege":"Confondre l'objectif de la matrice (transversalité) et son risque (double hiérarchie).","astuce":"« Dépend à la fois de deux responsables » → dualité de commandement. C'est l'inconvénient classique cité par Fayol (unité de commandement).","regle":"Matrice = transversalité + risque de conflit entre les deux hiérarchies, d'où la nécessité de règles d'arbitrage claires."},{"id":"2-20","t":2,"n":20,"lvl":3,"neg":false,"q":"<p>Un établissement public veut lancer un service de prise de rendez-vous en ligne tout en conservant un accueil de qualité au guichet. Quelle démarche concilie le mieux innovation, agilité et continuité ?<\/p>","o":["Supprimer le guichet dès l'ouverture du service en ligne pour réduire les coûts","Partir des besoins des usagers, tester une première version sur un site pilote, l'améliorer par itérations, maintenir le guichet pendant la transition et mesurer l'usage avant de généraliser","Développer pendant trois ans une solution complète sans consulter les usagers, puis la déployer partout le même jour","Laisser chaque agence développer sa propre application, sans coordination"],"a":1,"just":"<p>Cette démarche combine les trois exigences du thème : l'<strong>innovation<\/strong> centrée sur l'usager (design thinking), l'<strong>agilité<\/strong> (première version, itérations, mesure) et la <strong>continuité<\/strong> (maintien du guichet pour ceux qui ne peuvent pas utiliser le numérique, généralisation progressive).<\/p>","ana":"<ul><li>A : supprimer le guichet exclut les usagers éloignés du numérique et rompt l'égal accès au service.<\/li><li>C : c'est l'approche « en cascade » la plus risquée : solution déconnectée des besoins et bascule brutale.<\/li><li>D : l'absence de coordination crée de l'incohérence, des doublons et des coûts inutiles.<\/li><\/ul>","piege":"Penser que moderniser signifie remplacer totalement l'ancien canal. Une transition <strong>multicanale<\/strong> protège l'égalité et la continuité.","astuce":"La bonne réponse coche souvent toutes les cases du titre du thème. Vérifie que la proposition contient usager + test + itération + continuité + mesure.","regle":"Concilier = innover avec les usagers, avancer par étapes, ne laisser personne sans service."},{"id":"3-1","t":3,"n":1,"lvl":1,"neg":false,"q":"<p>La GPEEC se définit comme :<\/p>","o":["La gestion administrative des dossiers individuels des agents (congés, avancements, paie)","Un plan de réduction des effectifs à court terme","Une démarche d'anticipation qui vise à adapter, à moyen terme, les emplois, les effectifs et les compétences aux besoins futurs de l'organisation","Une procédure de recrutement par concours"],"a":2,"just":"<p>La GPEEC est une démarche <strong>prospective<\/strong> : elle compare les ressources humaines dont l'organisation disposera demain (si rien n'est fait) avec celles dont elle aura besoin pour atteindre ses objectifs, puis elle met en place des actions pour réduire l'écart.<\/p>","ana":"<ul><li>A : c'est la gestion administrative du personnel, tournée vers le présent.<\/li><li>B : la GPEEC peut conduire à des redéploiements, mais ce n'est pas un plan de réduction d'effectifs ; elle sert justement à anticiper pour éviter les ajustements brutaux.<\/li><li>D : le recrutement est un des leviers d'action de la GPEEC, pas sa définition.<\/li><\/ul>","piege":"Assimiler GPEEC et réduction d'effectifs. Elle peut aussi conduire à recruter, former ou créer de nouveaux emplois.","astuce":"Le mot « prévisionnelle » est la clé : anticipation, moyen terme, besoins futurs.","regle":"GPEEC = anticiper les écarts entre besoins et ressources en emplois, effectifs et compétences."},{"id":"3-2","t":3,"n":2,"lvl":1,"neg":false,"q":"<p>Quel est l'ordre logique des étapes d'une démarche de GPEEC ?<\/p>","o":["Diagnostic des ressources actuelles → identification des besoins futurs → analyse des écarts → plans d'action","Plans d'action → analyse des écarts → diagnostic des ressources → besoins futurs","Recrutement → formation → diagnostic → évaluation","Besoins futurs → plans d'action → diagnostic des ressources → analyse des écarts"],"a":0,"just":"<p>On décrit d'abord l'existant (effectifs, pyramide des âges, compétences), puis on définit la cible à partir de la stratégie (emplois et compétences nécessaires dans 3 à 5 ans). La comparaison fait apparaître les écarts (en nombre et en compétences), que l'on comble par des plans d'action (recrutement, formation, mobilité, redéploiement).<\/p>","ana":"<ul><li>B et D : on ne peut pas décider d'actions avant d'avoir mesuré les écarts.<\/li><li>C : ce sont des actions isolées, placées avant le diagnostic.<\/li><\/ul>","piege":"D commence correctement par les besoins futurs (certains auteurs commencent par la stratégie), mais place les actions avant le diagnostic et les écarts.","astuce":"Les plans d'action viennent toujours <strong>après<\/strong> l'analyse des écarts. Élimine toute séquence qui commence par une action.","regle":"Existant + cible → écarts → actions → suivi."},{"id":"3-3","t":3,"n":3,"lvl":1,"neg":false,"q":"<p>« Un ensemble de postes de travail présentant des activités et des compétences suffisamment proches pour être étudiés et gérés de façon globale. » Cette définition correspond à :<\/p>","o":["Un poste","Un grade","Un cadre statutaire","Un emploi (ou emploi-type)"],"a":3,"just":"<p>L'emploi regroupe plusieurs postes similaires. Par exemple, l'emploi « gestionnaire des ressources humaines » regroupe tous les postes de gestionnaire RH, quel que soit le service. C'est l'unité de base des référentiels d'emplois et de la GPEEC.<\/p>","ana":"<ul><li>A : le poste est une situation de travail <strong>individuelle et localisée<\/strong> (un agent, dans un service précis).<\/li><li>B : le grade est une notion statutaire : il donne vocation à occuper certains emplois et détermine la rémunération, mais il ne décrit pas les activités.<\/li><li>C : le cadre statutaire regroupe des grades dans la fonction publique ; c'est une notion juridique, pas une description d'activités.<\/li><\/ul>","piege":"Confondre le grade (ce que l'agent <strong>est<\/strong> statutairement) et l'emploi (ce que l'agent <strong>fait<\/strong>).","astuce":"« Ensemble de postes » → emploi. « Situation individuelle » → poste. « Statut, échelle, avancement » → grade.","regle":"Poste (individuel) ⊂ emploi (regroupement) ⊂ famille d'emplois ou de métiers."},{"id":"3-4","t":3,"n":4,"lvl":1,"neg":false,"q":"<p>Quelle définition de la <strong>compétence<\/strong> est la plus juste ?<\/p>","o":["Le diplôme le plus élevé obtenu par l'agent","La capacité à mobiliser, en situation professionnelle, des savoirs, des savoir-faire et des savoir-être pour atteindre un résultat","Le nombre d'années d'ancienneté dans un poste","Le grade détenu par l'agent"],"a":1,"just":"<p>La compétence se constate <strong>dans l'action<\/strong>. Elle combine des connaissances (savoir), des pratiques (savoir-faire) et des comportements (savoir-être), mis en œuvre pour réaliser une activité avec un résultat attendu.<\/p>","ana":"<ul><li>A : le diplôme atteste une qualification, pas la compétence réelle en situation.<\/li><li>C : l'ancienneté peut favoriser l'expérience, mais ne garantit pas la compétence.<\/li><li>D : le grade est une position statutaire.<\/li><\/ul>","piege":"Confondre qualification (diplôme, titre) et compétence (mise en œuvre réelle).","astuce":"Les mots « mobiliser », « en situation », « résultat » signent la définition de la compétence.","regle":"Compétence = savoir + savoir-faire + savoir-être, mobilisés en situation de travail."},{"id":"3-5","t":3,"n":5,"lvl":1,"neg":false,"q":"<p>La pyramide des âges d'une direction montre que 40 % des agents ont plus de 55 ans. Quelle conclusion en tirer en priorité dans une logique de GPEEC ?<\/p>","o":["Un risque important de départs à la retraite dans les prochaines années, et donc de perte de compétences, qu'il faut anticiper","Une situation idéale, puisque les agents sont expérimentés","La nécessité de geler tout recrutement","Aucune conclusion, la pyramide des âges n'étant pas un outil de GPEEC"],"a":0,"just":"<p>La pyramide des âges est un outil de base du diagnostic quantitatif. Une forte proportion d'agents proches de la retraite annonce des départs concentrés dans le temps. Il faut anticiper : transfert de savoirs, recrutements, formation, réorganisation.<\/p>","ana":"<ul><li>B : l'expérience est un atout aujourd'hui, mais la situation crée un risque à moyen terme.<\/li><li>C : c'est l'inverse : il faut préparer le remplacement.<\/li><li>D : la pyramide des âges est au contraire l'un des premiers outils de la GPEEC.<\/li><\/ul>","piege":"Raisonner sur le présent (« ils sont expérimentés ») au lieu de l'avenir (« ils vont partir »).","astuce":"En GPEEC, raisonne toujours à 3-5 ans : « que se passera-t-il si on ne fait rien ? »","regle":"Pyramide vieillissante = risque de départs massifs = urgence d'anticiper le renouvellement et le transfert des compétences."},{"id":"3-6","t":3,"n":6,"lvl":1,"neg":false,"q":"<p>Dans l'administration marocaine, quel outil décrit, pour un département, l'ensemble des emplois-types, leurs activités principales et les compétences requises ?<\/p>","o":["Le tableau des effectifs budgétaires","L'organigramme","Le référentiel des emplois et des compétences (REC)","Le bulletin de paie"],"a":2,"just":"<p>Le REC est l'outil structurant de la gestion par les compétences. Il recense les emplois, décrit leurs missions et activités, et précise les compétences attendues. Il sert de base au recrutement, à la formation, à l'évaluation et à la mobilité. Les départements ministériels marocains ont été invités à élaborer leurs REC dans le cadre de la modernisation de la gestion des ressources humaines.<\/p>","ana":"<ul><li>A : le tableau des effectifs indique des nombres de postes budgétaires, pas les compétences.<\/li><li>B : l'organigramme représente la structure (services, liens hiérarchiques), pas les emplois et compétences.<\/li><li>D : le bulletin de paie est un document de rémunération.<\/li><\/ul>","piege":"Confondre la description de la <strong>structure<\/strong> (organigramme) et celle des <strong>emplois et compétences<\/strong> (REC).","astuce":"« Emplois + activités + compétences » → référentiel (REC). « Services + liens hiérarchiques » → organigramme.","regle":"Le REC est la « carte d'identité » des emplois d'une administration : c'est le socle de toute GPEEC."},{"id":"3-7","t":3,"n":7,"lvl":2,"neg":false,"q":"<p>Un ministère compte assez d'informaticiens pour ses besoins, mais aucun ne maîtrise la cybersécurité, devenue prioritaire. Quel type d'écart la GPEEC met-elle ici en évidence ?<\/p>","o":["Un écart quantitatif en sureffectif","Un écart quantitatif en sous-effectif","Aucun écart, puisque l'effectif est suffisant","Un écart qualitatif, portant sur les compétences"],"a":3,"just":"<p>L'écart <strong>quantitatif<\/strong> porte sur le nombre de personnes ; l'écart <strong>qualitatif<\/strong> porte sur les compétences. Ici, le nombre est suffisant, mais les compétences ne correspondent pas aux besoins.<\/p>","ana":"<ul><li>A et B : l'énoncé précise que l'effectif est suffisant ; il n'y a ni sureffectif ni sous-effectif.<\/li><li>C : il y a bien un écart, mais il n'est pas visible si l'on regarde seulement les chiffres.<\/li><\/ul>","piege":"S'arrêter à l'analyse des effectifs. Une organisation peut avoir le bon nombre d'agents et pourtant manquer des compétences nécessaires.","astuce":"« Nombre suffisant mais… » → écart qualitatif. Réponse typique : formation, recrutement ciblé, mobilité.","regle":"Écart quantitatif = combien ? Écart qualitatif = quelles compétences ?"},{"id":"3-8","t":3,"n":8,"lvl":2,"neg":false,"q":"<p>Avec la dématérialisation des procédures, le contenu de l'emploi d'« agent de saisie » va fortement diminuer dans les prochaines années. Comment qualifier cet emploi dans une démarche de GPEEC ?<\/p>","o":["Un emploi stratégique en croissance","Un emploi sensible (en forte mutation), qui appelle des actions de reconversion","Un emploi stable, qui ne nécessite aucune action","Un emploi supprimé de plein droit par la loi"],"a":1,"just":"<p>Un emploi <strong>sensible<\/strong> est un emploi dont le contenu ou les effectifs vont évoluer fortement sous l'effet de facteurs technologiques, organisationnels ou réglementaires. La GPEEC identifie ces emplois pour anticiper : formation, reconversion vers des emplois en développement, mobilité.<\/p>","ana":"<ul><li>A : l'emploi est en décroissance, pas en croissance.<\/li><li>C : l'énoncé annonce une forte diminution : l'emploi n'est pas stable.<\/li><li>D : aucun texte ne supprime un emploi « de plein droit » ; c'est l'organisation qui fait évoluer ses besoins.<\/li><\/ul>","piege":"« Sensible » ne veut pas dire « délicat » ou « confidentiel » : en GPEEC, cela signifie « en forte évolution ».","astuce":"Technologie qui remplace une tâche → emploi sensible → reconversion et formation.","regle":"Emplois sensibles = emplois en mutation, à accompagner par anticipation."},{"id":"3-9","t":3,"n":9,"lvl":2,"neg":false,"q":"<p>À effectifs constants, la masse salariale d'une administration augmente chaque année en raison des avancements d'échelon et de grade des agents. Comment appelle-t-on ce phénomène ?<\/p>","o":["Le glissement vieillesse-technicité (GVT)","L'effet de noria","L'effet report","L'inflation salariale négociée"],"a":0,"just":"<p>Le GVT (dans sa composante dite « positive ») mesure l'augmentation de la masse salariale due à l'ancienneté (vieillesse) et à la qualification ou à la promotion (technicité), même si le nombre d'agents et la valeur du point d'indice ne changent pas.<\/p>","ana":"<ul><li>B : l'effet de noria est le phénomène inverse : il fait <strong>baisser<\/strong> la masse salariale quand des agents anciens et mieux payés partent et sont remplacés par des recrues moins payées.<\/li><li>C : l'effet report désigne l'impact sur l'année suivante d'une mesure salariale prise en cours d'année.<\/li><li>D : une revalorisation générale négociée n'est pas liée aux avancements individuels.<\/li><\/ul>","piege":"Confondre GVT (hausse liée aux carrières) et noria (baisse liée au renouvellement).","astuce":"GVT = « Glissement » vers le haut, lié à l'âge et aux promotions.","regle":"GVT positif ↑ masse salariale ; effet de noria ↓ masse salariale."},{"id":"3-10","t":3,"n":10,"lvl":2,"neg":false,"q":"<p>Une administration remplace dix cadres partis à la retraite, en fin de carrière, par dix jeunes cadres recrutés au premier échelon. Quel effet cela produit-il sur la masse salariale ?<\/p>","o":["Un effet GVT, qui augmente la masse salariale","Aucun effet, puisque l'effectif est identique","Un effet de noria, qui diminue la masse salariale","Un effet de ciseaux, qui double la masse salariale"],"a":2,"just":"<p>Les agents qui partent sont rémunérés à un niveau élevé (fin de carrière) ; ceux qui arrivent débutent en bas de grille. À effectif constant, la masse salariale baisse. C'est l'effet de noria (ou « effet d'entrées-sorties »).<\/p>","ana":"<ul><li>A : le GVT résulte des avancements des agents présents, pas du remplacement des partants.<\/li><li>B : à effectif égal, la rémunération moyenne baisse ; il y a donc bien un effet.<\/li><li>D : « l'effet de ciseaux » désigne l'écart croissant entre deux courbes (recettes et dépenses, par exemple) ; il ne s'applique pas ici et le « doublement » est absurde.<\/li><\/ul>","piege":"Croire qu'à effectif constant la masse salariale est forcément constante.","astuce":"Départs de seniors + arrivées de juniors → noria (comme une roue qui fait monter et descendre des godets).","regle":"Noria = renouvellement des agents → baisse de la rémunération moyenne."},{"id":"3-11","t":3,"n":11,"lvl":2,"neg":false,"q":"<p>Le directeur des systèmes d'information d'un office public partira dans 18 mois. Personne n'a été préparé à lui succéder. Quel outil de gestion des compétences aurait permis d'éviter cette situation ?<\/p>","o":["Le règlement intérieur","Un plan de succession pour les postes clés, s'appuyant sur l'identification de viviers de potentiels","Le registre du courrier","Le bilan comptable annuel"],"a":1,"just":"<p>Le plan de succession identifie les postes clés (stratégiques ou critiques), repère les agents susceptibles d'y accéder (viviers, hauts potentiels) et organise leur préparation (formation, missions, tutorat). Il garantit la continuité du management.<\/p>","ana":"<ul><li>A : le règlement intérieur fixe des règles de fonctionnement, pas la relève des compétences.<\/li><li>C : le registre du courrier est un outil administratif sans lien avec le sujet.<\/li><li>D : le bilan comptable décrit la situation financière.<\/li><\/ul>","piege":"Attendre le départ pour chercher un remplaçant : la GPEEC impose d'anticiper.","astuce":"« Poste clé » + « départ prévu » + « personne de préparé » → plan de succession, viviers.","regle":"Chaque poste clé doit avoir des successeurs potentiels identifiés et préparés."},{"id":"3-12","t":3,"n":12,"lvl":2,"neg":false,"q":"<p>Dans une démarche de gestion par les compétences, l'entretien annuel d'évaluation sert principalement à :<\/p>","o":["Sanctionner les agents dont le travail est insuffisant","Fixer le montant exact du salaire de l'année suivante","Remplir une obligation formelle sans conséquence","Faire le bilan des résultats et des compétences, fixer des objectifs et identifier les besoins de formation et les souhaits d'évolution"],"a":3,"just":"<p>L'entretien est un moment d'échange entre l'agent et son supérieur direct. Il alimente la GPEEC : il fait remonter les compétences réelles, les écarts, les besoins de formation et les projets de mobilité. Au Maroc, la procédure de notation et d'évaluation des fonctionnaires est encadrée par un décret de 2005.<\/p>","ana":"<ul><li>A : l'évaluation n'est pas une procédure disciplinaire ; la sanction relève d'une procédure distincte.<\/li><li>B : l'évaluation peut influencer l'avancement, mais elle ne fixe pas directement le salaire, déterminé par le statut.<\/li><li>C : vider l'entretien de son sens est justement l'erreur à éviter.<\/li><\/ul>","piege":"Confondre évaluation (développement, dialogue) et discipline (sanction).","astuce":"En GPEEC, l'entretien est une <strong>source d'information<\/strong> sur les compétences et les besoins. Cherche les mots « objectifs », « formation », « évolution ».","regle":"L'entretien d'évaluation relie la performance individuelle, le développement des compétences et la GPEEC."},{"id":"3-13","t":3,"n":13,"lvl":2,"neg":false,"q":"<p>Une administration élabore son plan de formation en reprenant chaque année le catalogue de l'année précédente, selon les demandes spontanées des agents. Quelle critique principale peut-on formuler dans une logique de GPEEC ?<\/p>","o":["Le plan n'est pas construit à partir des écarts de compétences identifiés au regard des besoins futurs de l'organisation","Les agents ne devraient jamais exprimer de souhaits de formation","La formation n'a aucun lien avec la GPEEC","Un plan de formation doit obligatoirement être confié à un prestataire externe"],"a":0,"just":"<p>Dans une logique de GPEEC, la formation est un levier pour combler les écarts entre compétences disponibles et compétences nécessaires. Le plan doit donc découler du diagnostic et des orientations stratégiques, tout en tenant compte des besoins individuels exprimés.<\/p>","ana":"<ul><li>B : les souhaits des agents sont légitimes et utiles ; ils doivent simplement être articulés avec les besoins de l'organisation.<\/li><li>C : la formation est au contraire l'un des principaux leviers de la GPEEC.<\/li><li>D : aucune obligation de ce type n'existe ; la formation peut être interne ou externe.<\/li><\/ul>","piege":"Croire qu'un plan de formation est bon parce qu'il est chargé. Ce qui compte est sa pertinence par rapport aux écarts.","astuce":"Dès qu'une pratique est reconduite « par habitude » sans diagnostic, la critique attendue est l'absence de lien avec les besoins et la stratégie.","regle":"Formation = réponse ciblée aux écarts de compétences identifiés par la GPEEC."},{"id":"3-14","t":3,"n":14,"lvl":3,"neg":false,"q":"<p>Grâce à la dématérialisation, une direction n'a plus besoin que de 10 agents d'accueil au lieu de 40. Elle a en revanche besoin de conseillers pour accompagner les usagers dans leurs démarches en ligne. Quelle est la réponse la plus conforme à une démarche de GPEEC dans la fonction publique ?<\/p>","o":["Licencier les 30 agents en surnombre","Maintenir les 40 agents à l'accueil sans changement","Proposer aux agents concernés une reconversion par la formation et un redéploiement vers les nouveaux emplois de conseiller ou d'autres services en besoin","Recruter 30 conseillers externes et laisser les agents d'accueil sans activité"],"a":2,"just":"<p>La GPEEC vise à transformer un sureffectif sur un emploi en déclin en ressource pour un emploi en développement. La formation et la mobilité interne permettent de valoriser l'expérience des agents (connaissance des usagers et des procédures) et de répondre aux nouveaux besoins.<\/p>","ana":"<ul><li>A : un fonctionnaire titulaire ne peut pas être licencié pour simple suppression de tâches ; ce serait aussi contraire à l'esprit de la GPEEC.<\/li><li>B : maintenir un sureffectif inutile est inefficient et démotivant pour les agents.<\/li><li>D : cette solution double les coûts et gaspille des compétences existantes.<\/li><\/ul>","piege":"Raisonner comme dans le secteur privé (licenciement) ou par immobilisme (rien ne change).","astuce":"Emploi en déclin + emploi en développement dans la même organisation → reconversion et redéploiement.","regle":"GPEEC publique = anticiper les mutations pour reconvertir et redéployer plutôt que subir."},{"id":"3-15","t":3,"n":15,"lvl":3,"neg":false,"q":"<p>Qui porte la GPEEC dans une organisation publique ?<\/p>","o":["Exclusivement la direction des ressources humaines","Plusieurs acteurs : la direction (orientations stratégiques), la DRH (méthodes et outils), les managers de proximité (évaluation et identification des besoins), les agents (acteurs de leur parcours) et les représentants du personnel (dialogue social)","Uniquement les représentants du personnel","Un cabinet de conseil externe, seul compétent"],"a":1,"just":"<p>La « gouvernance des compétences » signifie que la GPEEC est une responsabilité partagée. La direction fixe le cap, la DRH conçoit et anime, les managers connaissent les compétences réelles et les besoins de leurs équipes, les agents construisent leur parcours, et le dialogue social favorise l'acceptation.<\/p>","ana":"<ul><li>A : si la GPEEC reste l'affaire de la seule DRH, elle devient un exercice technique déconnecté du terrain.<\/li><li>C : les représentants du personnel sont consultés, mais ne pilotent pas la démarche.<\/li><li>D : un cabinet peut appuyer la démarche, mais ne peut pas la porter à la place de l'organisation.<\/li><\/ul>","piege":"Les adverbes « exclusivement », « uniquement », « seul » signalent des propositions fausses.","astuce":"« Gouvernance » = plusieurs acteurs et coordination. La bonne réponse est la plus complète.","regle":"La GPEEC est une démarche partagée : stratégie (direction), méthode (DRH), terrain (managers), parcours (agents), dialogue (partenaires sociaux)."},{"id":"3-16","t":3,"n":16,"lvl":3,"neg":false,"q":"<p>Une administration a réalisé un diagnostic détaillé de ses effectifs et compétences, mais sans référence au plan stratégique du ministère. Les plans d'action produits ne répondent pas aux priorités de la direction. Quelle est la cause principale de cet échec ?<\/p>","o":["Le diagnostic était trop détaillé","Les agents n'ont pas été évalués","Les plans d'action étaient trop nombreux","La GPEEC n'a pas été alignée sur la stratégie : les besoins futurs doivent découler des objectifs de l'organisation"],"a":3,"just":"<p>Les besoins futurs en emplois et compétences se déduisent des orientations stratégiques (nouvelles missions, réformes, digitalisation, objectifs de performance). Sans ce lien, la GPEEC décrit l'existant mais ne prépare pas l'avenir voulu. C'est ce qui fait de la GPEEC un outil « au service de la performance ».<\/p>","ana":"<ul><li>A : un diagnostic détaillé n'est pas un défaut en soi.<\/li><li>B : rien dans l'énoncé n'indique un défaut d'évaluation.<\/li><li>C : le nombre de plans n'est pas en cause ; c'est leur orientation.<\/li><\/ul>","piege":"Chercher un défaut technique alors que l'énoncé dit clairement « sans référence au plan stratégique ».","astuce":"Repère dans l'énoncé l'élément manquant : il donne presque toujours la réponse.","regle":"Stratégie → besoins futurs → GPEEC → performance. Sans stratégie, pas de cible."},{"id":"3-17","t":3,"n":17,"lvl":3,"neg":false,"q":"<p>Dans l'administration marocaine, la nomination aux postes de responsabilité (chefs de division, chefs de service) repose sur :<\/p>","o":["Une procédure d'appel à candidatures fondée sur le mérite, la transparence et l'égalité des chances","La seule ancienneté dans l'administration","Le libre choix du ministre, sans procédure","Le tirage au sort entre les agents du même grade"],"a":0,"just":"<p>Depuis 2011, la réglementation marocaine organise la nomination aux postes de responsabilité par appel à candidatures, avec examen des dossiers et entretiens par une commission. Cette procédure traduit la gestion par les compétences : on choisit le candidat dont le profil correspond le mieux aux exigences du poste. Pour les emplois supérieurs, la loi organique n° 02-12 fixe également des principes de mérite, d'égalité des chances et de transparence.<\/p>","ana":"<ul><li>B : l'ancienneté peut entrer en ligne de compte, mais elle n'est pas le seul critère.<\/li><li>C : la décision est prise à l'issue d'une procédure encadrée, pas de façon discrétionnaire.<\/li><li>D : le tirage au sort n'existe pas pour ces nominations.<\/li><\/ul>","piege":"Confondre l'avancement de grade (qui tient compte de l'ancienneté) et la nomination à un poste de responsabilité (fondée sur le profil et le mérite).","astuce":"Les mots « mérite », « transparence », « égalité des chances » reviennent dans tous les textes marocains récents sur l'accès aux emplois publics.","regle":"Postes de responsabilité = appel à candidatures + mérite + transparence + égalité des chances."},{"id":"3-18","t":3,"n":18,"lvl":3,"neg":false,"q":"<p>Quel indicateur mesure le mieux le <strong>risque de perte de compétences critiques<\/strong> dans une administration ?<\/p>","o":["L'effectif total de l'administration","Le montant global de la masse salariale","La part des titulaires d'emplois critiques qui partiront à la retraite dans les trois prochaines années","Le nombre total de jours de formation dispensés"],"a":2,"just":"<p>Cet indicateur croise deux informations essentielles : le caractère critique de l'emploi (compétences rares ou indispensables) et l'horizon de départ. Il permet de prioriser les actions de transfert de savoirs et de recrutement.<\/p>","ana":"<ul><li>A : l'effectif total ne dit rien sur la nature des compétences ni sur les départs.<\/li><li>B : la masse salariale est un indicateur financier.<\/li><li>D : le nombre de jours de formation est un indicateur d'activité ; il ne mesure pas un risque de perte.<\/li><\/ul>","piege":"Choisir un indicateur global (effectif, masse salariale) alors que la question porte sur un risque précis.","astuce":"Un bon indicateur de risque cible la population concernée (emplois critiques) et l'horizon de temps.","regle":"Mesurer un risque RH = cibler les compétences critiques et anticiper les départs."},{"id":"3-19","t":3,"n":19,"lvl":3,"neg":false,"q":"<p>Un ingénieur est le seul à maîtriser le fonctionnement d'un système technique ancien mais essentiel. Il part à la retraite dans un an. Quelle action est prioritaire ?<\/p>","o":["Attendre son départ, puis recruter un remplaçant externe","Organiser un transfert de savoirs : binôme avec un successeur, tutorat, rédaction de documentation et de procédures","Supprimer le système dès son départ","Lui demander de rester en poste sans limite de durée"],"a":1,"just":"<p>Les savoirs détenus par une seule personne sont un risque majeur. Le tutorat (ou compagnonnage), le travail en binôme et la formalisation des connaissances (documentation, procédures, retours d'expérience) permettent de conserver ce savoir dans l'organisation. C'est aussi une démarche de <strong>gestion des connaissances<\/strong> (knowledge management).<\/p>","ana":"<ul><li>A : un recrutement externe tardif ne permettra pas de récupérer un savoir non documenté.<\/li><li>C : supprimer un système essentiel sans solution de remplacement compromet la continuité du service.<\/li><li>D : la limite d'âge s'impose ; prolonger indéfiniment n'est ni légal ni une solution durable.<\/li><\/ul>","piege":"Croire qu'un recrutement suffit à remplacer un savoir-faire tacite accumulé pendant des années.","astuce":"« Seul à maîtriser » + « départ prochain » → transfert de savoirs, tutorat, documentation.","regle":"Un savoir critique ne doit jamais reposer sur une seule personne."},{"id":"3-20","t":3,"n":20,"lvl":3,"neg":false,"q":"<p>Une direction régionale fait face à trois défis : de nombreux départs à la retraite, de nouvelles missions numériques et des recrutements limités par le budget. Quel plan d'action est le plus cohérent ?<\/p>","o":["Recruter massivement, sans tenir compte du budget","Attendre une augmentation du budget avant d'agir","Confier toutes les nouvelles missions aux agents les plus jeunes, sans formation","Identifier les emplois critiques, organiser le transfert de savoirs, former et reconvertir des agents vers les missions numériques, favoriser la mobilité interne, cibler les rares recrutements sur les compétences introuvables en interne, et suivre le tout par des indicateurs"],"a":3,"just":"<p>Face à des contraintes multiples, la GPEEC combine plusieurs leviers. On priorise (emplois critiques), on mobilise les ressources internes (formation, reconversion, mobilité), on réserve le recrutement aux compétences absentes et on suit les résultats. C'est la logique « faire, acheter, emprunter » des compétences : les développer en interne, les recruter, ou les obtenir temporairement.<\/p>","ana":"<ul><li>A : la contrainte budgétaire est explicitement posée dans l'énoncé.<\/li><li>B : l'attentisme est le contraire de la démarche prévisionnelle.<\/li><li>C : l'âge ne garantit pas les compétences numériques ; sans formation, les agents ne pourront pas assumer les missions.<\/li><\/ul>","piege":"Choisir un seul levier alors que la situation exige une combinaison.","astuce":"Quand l'énoncé cumule plusieurs contraintes, la bonne réponse est généralement celle qui les traite <strong>toutes<\/strong> de manière réaliste.","regle":"Leviers GPEEC : former, reconvertir, mobiliser, recruter de façon ciblée, transmettre, suivre."},{"id":"4-1","t":4,"n":1,"lvl":1,"neg":false,"q":"<p>L'<strong>intelligence collective<\/strong> désigne :<\/p>","o":["La somme des diplômes des membres d'une équipe","La capacité d'un groupe à produire, grâce aux interactions entre ses membres, des résultats supérieurs à ce que chacun aurait obtenu seul","L'intelligence du chef d'équipe, transmise à ses collaborateurs","Le fait que tous les membres d'un groupe pensent de la même façon"],"a":1,"just":"<p>L'intelligence collective repose sur la <strong>synergie<\/strong> : la confrontation des points de vue, des expériences et des compétences permet de trouver des solutions plus riches, plus créatives et mieux acceptées. On résume souvent l'idée par « 1 + 1 &gt; 2 ».<\/p>","ana":"<ul><li>A : additionner des diplômes ne crée aucune interaction ni synergie.<\/li><li>C : l'intelligence collective ne dépend pas d'une seule personne ; elle émerge du groupe.<\/li><li>D : l'uniformité de pensée est au contraire un obstacle (voir la « pensée de groupe »). La diversité est une condition de l'intelligence collective.<\/li><\/ul>","piege":"Confondre intelligence collective et consensus. Un groupe peut être d'accord et se tromper collectivement.","astuce":"Cherche les mots « interactions », « synergie », « supérieur à la somme ».","regle":"Intelligence collective = 1 + 1 &gt; 2, grâce à la diversité et aux interactions."},{"id":"4-2","t":4,"n":2,"lvl":1,"neg":false,"q":"<p>Lors d'une séance de <strong>brainstorming<\/strong>, quelle règle doit être respectée pendant la phase de production des idées ?<\/p>","o":["Ne retenir que les idées réalistes et chiffrées","Laisser le responsable hiérarchique valider chaque idée avant de passer à la suivante","Limiter le nombre d'idées pour gagner du temps","Suspendre tout jugement ou critique et rechercher la quantité d'idées"],"a":3,"just":"<p>Le brainstorming, formalisé par Alex Osborn, repose sur quatre règles : ne pas critiquer, rechercher la quantité, accepter les idées les plus originales, rebondir sur les idées des autres. L'évaluation intervient <strong>dans un second temps<\/strong>.<\/p>","ana":"<ul><li>A : filtrer dès le départ bloque la créativité ; le tri vient après.<\/li><li>B : une validation hiérarchique immédiate crée de l'autocensure.<\/li><li>C : la quantité est recherchée : plus il y a d'idées, plus il y a de chances d'en trouver de bonnes.<\/li><\/ul>","piege":"Mélanger la phase de production et la phase d'évaluation.","astuce":"Brainstorming = « divergence d'abord, convergence ensuite ».","regle":"Produire sans juger, puis trier."},{"id":"4-3","t":4,"n":3,"lvl":1,"neg":false,"q":"<p>Pour préparer le rapport annuel d'activité, chaque service rédige séparément son chapitre, puis la direction assemble l'ensemble. Ce mode de travail relève plutôt :<\/p>","o":["De la coopération : les tâches sont réparties et chacun réalise sa partie","De la collaboration : tous travaillent ensemble sur chaque partie, sans division des tâches","De l'intelligence collective au sens strict","Du codéveloppement professionnel"],"a":0,"just":"<p>Dans la <strong>coopération<\/strong>, l'objectif commun est atteint par une division du travail : chacun prend en charge une partie, puis on assemble. Dans la <strong>collaboration<\/strong>, les membres travaillent ensemble, en continu, sur l'ensemble de la production, sans répartition nette des tâches.<\/p>","ana":"<ul><li>B : il n'y a pas de travail commun sur chaque partie ; les services travaillent séparément.<\/li><li>C : l'assemblage de contributions séparées ne crée pas d'interactions produisant une synergie.<\/li><li>D : le codéveloppement est une méthode précise d'aide entre pairs sur un problème professionnel.<\/li><\/ul>","piege":"Utiliser « coopération » et « collaboration » comme des synonymes. À l'examen, la distinction est souvent testée.","astuce":"« Chacun sa partie, puis assemblage » → coopération. « Ensemble, sur tout » → collaboration.","regle":"Coopérer = se répartir le travail ; collaborer = travailler ensemble sur le même travail."},{"id":"4-4","t":4,"n":4,"lvl":1,"neg":false,"q":"<p>Dans la méthode des <strong>six chapeaux de la réflexion<\/strong> d'Edward de Bono, quel chapeau correspond à l'examen des risques, des dangers et des points faibles d'une proposition ?<\/p>","o":["Le chapeau blanc","Le chapeau rouge","Le chapeau noir","Le chapeau vert"],"a":2,"just":"<p>Chaque chapeau représente un mode de pensée : blanc (faits et chiffres), rouge (émotions et intuitions), noir (prudence, risques, critique), jaune (optimisme, avantages), vert (créativité, alternatives), bleu (organisation de la réflexion, synthèse). En faisant « porter » le même chapeau à tous en même temps, on explore un sujet sous tous ses angles sans conflit de personnes.<\/p>","ana":"<ul><li>A : le blanc correspond aux faits neutres.<\/li><li>B : le rouge correspond aux ressentis.<\/li><li>D : le vert correspond aux idées nouvelles.<\/li><\/ul>","piege":"Associer le rouge au danger (comme un feu rouge). Chez de Bono, le rouge représente les émotions ; le danger, c'est le noir.","astuce":"Moyen mnémotechnique : noir = « broyer du noir » (pessimisme) ; jaune = soleil (optimisme) ; vert = pousse (créativité) ; bleu = ciel au-dessus (vue d'ensemble).","regle":"Blanc faits, rouge émotions, noir risques, jaune avantages, vert créativité, bleu organisation."},{"id":"4-5","t":4,"n":5,"lvl":1,"neg":false,"q":"<p>Des gestionnaires des marchés publics de plusieurs ministères se réunissent régulièrement, de façon volontaire, pour partager leurs difficultés et leurs bonnes pratiques. Il s'agit :<\/p>","o":["D'un comité de pilotage","D'une communauté de pratique","D'une commission administrative paritaire","D'une équipe projet"],"a":1,"just":"<p>Une communauté de pratique (concept d'Étienne Wenger) rassemble des personnes qui partagent un même métier ou une même pratique et qui échangent volontairement pour apprendre les unes des autres. Elle dépasse les frontières des services et des organisations.<\/p>","ana":"<ul><li>A : un COPIL pilote un projet et prend des décisions.<\/li><li>C : une commission administrative paritaire est une instance statutaire (avancement, discipline) composée de représentants de l'administration et du personnel.<\/li><li>D : une équipe projet a un objectif, un délai et des livrables définis.<\/li><\/ul>","piege":"Confondre une communauté (volontaire, durable, centrée sur l'apprentissage) avec une équipe projet (temporaire, centrée sur un livrable).","astuce":"« Même métier » + « volontaire » + « partage de pratiques » → communauté de pratique.","regle":"Communauté de pratique = apprendre entre pairs d'un même métier."},{"id":"4-6","t":4,"n":6,"lvl":1,"neg":false,"q":"<p>Une méthode réunit 5 à 8 pairs. À chaque séance, l'un d'eux (le « client ») expose un problème réel de sa pratique ; les autres (les « consultants ») l'aident par des questions et des suggestions, selon des étapes structurées. Il s'agit :<\/p>","o":["Du brainstorming","De la méthode Delphi","Du world café","Du codéveloppement professionnel"],"a":3,"just":"<p>Le codéveloppement, conçu par Adrien Payette et Claude Champagne, est une méthode d'apprentissage entre pairs. Un participant expose une situation, les autres posent des questions de clarification, proposent des pistes, puis le client choisit son plan d'action. Chacun apprend en aidant les autres.<\/p>","ana":"<ul><li>A : le brainstorming produit des idées sur un sujet, sans rôles de client et de consultants.<\/li><li>B : Delphi interroge des experts à distance, de façon anonyme, en plusieurs tours.<\/li><li>C : le world café organise des échanges en petites tables qui tournent, sur de grands groupes.<\/li><\/ul>","piege":"Le mot « consultant » peut évoquer un intervenant externe. Ici, les consultants sont les pairs du groupe.","astuce":"« Client » + « consultants » + « problème réel » + « pairs » → codéveloppement.","regle":"Codéveloppement = des pairs s'aident mutuellement sur des problèmes réels de leur pratique."},{"id":"4-7","t":4,"n":7,"lvl":2,"neg":false,"q":"<p>Un comité de direction très soudé valide à l'unanimité un projet ambitieux. Personne n'exprime de doute, par crainte de briser l'harmonie. Le projet échoue pour des raisons que plusieurs membres avaient pressenties. Quel phénomène est en cause ?<\/p>","o":["La pensée de groupe (groupthink)","L'intelligence collective","La paresse sociale","Le codéveloppement"],"a":0,"just":"<p>La pensée de groupe, décrite par Irving Janis, apparaît dans les groupes très cohésifs : la recherche du consensus et de l'harmonie l'emporte sur l'analyse critique. Les doutes sont autocensurés, les alternatives ne sont pas examinées et le groupe prend de mauvaises décisions.<\/p>","ana":"<ul><li>B : l'intelligence collective suppose la confrontation des points de vue, qui a justement manqué.<\/li><li>C : la paresse sociale est une baisse d'effort individuel dans un groupe, pas une autocensure.<\/li><li>D : aucune méthode de codéveloppement n'est décrite.<\/li><\/ul>","piege":"Croire que l'unanimité prouve la qualité d'une décision.","astuce":"« Groupe soudé » + « personne n'ose contredire » + « mauvaise décision » → pensée de groupe. Remèdes : avocat du diable, avis écrits avant discussion, chef qui parle en dernier, experts externes.","regle":"Trop de cohésion sans débat = pensée de groupe. Le désaccord constructif protège la décision."},{"id":"4-8","t":4,"n":8,"lvl":2,"neg":false,"q":"<p>Dans une équipe de dix agents chargée de traiter un stock de dossiers, la productivité individuelle baisse depuis que les dossiers sont attribués « à l'équipe » sans que l'on sache qui traite quoi. Quel phénomène explique cette baisse, et quel remède appliquer ?<\/p>","o":["La pensée de groupe ; il faut supprimer les réunions","Le syndrome d'épuisement ; il faut réduire la charge de travail","La paresse sociale (effet Ringelmann) ; il faut rendre les contributions individuelles visibles et clarifier les rôles","La sécurité psychologique ; il faut la réduire"],"a":2,"just":"<p>L'effet Ringelmann (ou paresse sociale) décrit la tendance des individus à fournir moins d'effort dans un groupe lorsque leur contribution personnelle n'est pas identifiable. Rendre les contributions visibles, fixer des objectifs individuels et collectifs, et clarifier les rôles réduit ce phénomène.<\/p>","ana":"<ul><li>A : la pensée de groupe concerne les décisions, pas la productivité.<\/li><li>B : rien n'indique une surcharge ; c'est l'organisation du travail qui a changé.<\/li><li>D : la sécurité psychologique est une condition favorable ; la réduire serait néfaste.<\/li><\/ul>","piege":"Croire que le travail en groupe augmente automatiquement la performance. Mal organisé, il peut la réduire.","astuce":"« On ne sait plus qui fait quoi » + baisse d'effort → paresse sociale.","regle":"Le collectif fonctionne quand chacun voit l'utilité de sa contribution."},{"id":"4-9","t":4,"n":9,"lvl":2,"neg":false,"q":"<p>Avant son départ, un agent expérimenté rédige un guide pratique décrivant les « astuces » qu'il appliquait intuitivement pour traiter les dossiers complexes. Dans le modèle SECI de Nonaka et Takeuchi, il s'agit de :<\/p>","o":["La socialisation (de tacite à tacite)","L'externalisation (de tacite à explicite)","La combinaison (d'explicite à explicite)","L'intériorisation (d'explicite à tacite)"],"a":1,"just":"<p>Le modèle SECI décrit quatre modes de création de connaissances. La <strong>socialisation<\/strong> transmet un savoir tacite par l'observation et la pratique partagée. L'<strong>externalisation<\/strong> formalise un savoir tacite en savoir explicite (écrit, schéma). La <strong>combinaison<\/strong> assemble des savoirs explicites. L'<strong>intériorisation<\/strong> transforme un savoir explicite en savoir-faire personnel par la pratique.<\/p>","ana":"<ul><li>A : la socialisation ne passe pas par l'écrit (exemple : travail en binôme).<\/li><li>C : la combinaison part de documents déjà explicites.<\/li><li>D : l'intériorisation est le chemin inverse (un nouvel agent lit le guide et l'applique jusqu'à en faire un réflexe).<\/li><\/ul>","piege":"Confondre externalisation (formaliser) et intériorisation (s'approprier).","astuce":"Tacite = dans la tête ; explicite = écrit. Repère le point de départ et le point d'arrivée.","regle":"SECI : Socialisation, Externalisation, Combinaison, Intériorisation."},{"id":"4-10","t":4,"n":10,"lvl":2,"neg":false,"q":"<p>Une équipe adopte la règle suivante : une proposition est adoptée lorsque <strong>aucun membre n'exprime d'objection majeure et argumentée<\/strong>, même si tous ne sont pas enthousiastes. Ce mode de décision s'appelle :<\/p>","o":["Le vote à la majorité simple","Le consensus","La décision autoritaire","Le consentement"],"a":3,"just":"<p>La décision par consentement (utilisée en sociocratie et en holacratie) recherche l'absence d'objection raisonnable plutôt que l'accord enthousiaste de tous. Une objection doit être argumentée et liée à un risque pour l'organisation ; elle sert à améliorer la proposition.<\/p>","ana":"<ul><li>A : la majorité simple peut laisser une minorité importante opposée.<\/li><li>B : le consensus recherche l'accord de tous ; il est plus exigeant et peut être plus lent.<\/li><li>C : la décision autoritaire est prise par le responsable seul.<\/li><\/ul>","piege":"Confondre consentement (« je n'ai pas d'objection majeure ») et consensus (« tout le monde est d'accord »).","astuce":"« Aucune objection » → consentement. « Accord de tous » → consensus.","regle":"Consentement = absence d'objection argumentée ; consensus = accord unanime."},{"id":"4-11","t":4,"n":11,"lvl":2,"neg":false,"q":"<p>Pour anticiper l'évolution des besoins en santé d'une région à l'horizon de 10 ans, une agence interroge des experts de façon anonyme, en plusieurs tours successifs. À chaque tour, les experts reçoivent la synthèse des réponses précédentes et peuvent ajuster leur avis. Il s'agit de :<\/p>","o":["La méthode Delphi","Le brainstorming","Le world café","La méthode des six chapeaux"],"a":0,"just":"<p>La méthode Delphi recueille l'avis d'experts sans qu'ils se rencontrent. L'anonymat limite l'influence des personnalités dominantes ; les tours successifs permettent une convergence progressive. Elle est très utilisée en prospective.<\/p>","ana":"<ul><li>B : le brainstorming est une séance en présentiel, sans anonymat.<\/li><li>C : le world café organise des discussions en face-à-face.<\/li><li>D : les six chapeaux structurent une réflexion de groupe en réunion.<\/li><\/ul>","piege":"Oublier que l'anonymat est une caractéristique essentielle de Delphi.","astuce":"« Experts » + « anonymat » + « tours successifs » + « prospective » → Delphi.","regle":"Delphi = consultation anonyme d'experts en plusieurs tours pour faire converger les avis."},{"id":"4-12","t":4,"n":12,"lvl":2,"neg":false,"q":"<p>Dans un atelier d'intelligence collective, quel est le rôle principal du <strong>facilitateur<\/strong> ?<\/p>","o":["Imposer la solution qu'il juge la meilleure","Rédiger seul la décision finale","Garantir le bon déroulement du processus (temps, parole, méthode) en restant neutre sur le contenu","Évaluer la performance individuelle des participants"],"a":2,"just":"<p>Le facilitateur est le « gardien du processus ». Il clarifie l'objectif, propose une méthode, distribue la parole, gère le temps et aide le groupe à converger. Il ne prend pas position sur le fond, pour que les idées viennent du groupe.<\/p>","ana":"<ul><li>A et B : ce serait confisquer la production du groupe.<\/li><li>D : l'évaluation individuelle n'est pas le rôle du facilitateur et créerait de l'autocensure.<\/li><\/ul>","piege":"Confondre facilitateur et expert. Le facilitateur n'apporte pas les réponses.","astuce":"Facilitateur = « comment » ; groupe = « quoi ».","regle":"Le facilitateur est responsable du processus, le groupe est responsable du contenu."},{"id":"4-13","t":4,"n":13,"lvl":2,"neg":false,"q":"<p>Selon les travaux d'Amy Edmondson, quelle condition favorise le plus l'apprentissage et l'intelligence collective dans une équipe ?<\/p>","o":["Une compétition interne forte entre les membres","La sécurité psychologique : un climat dans lequel chacun peut poser une question, signaler une erreur ou exprimer un désaccord sans crainte d'être humilié ou sanctionné","Le contrôle permanent de chaque membre par le responsable","L'homogénéité des profils de l'équipe"],"a":1,"just":"<p>La sécurité psychologique permet aux membres de prendre des risques interpersonnels : signaler un problème, proposer une idée, reconnaître une erreur. Sans elle, les informations utiles restent cachées et le groupe n'apprend pas.<\/p>","ana":"<ul><li>A : une compétition forte décourage le partage d'informations.<\/li><li>C : le contrôle permanent crée de la méfiance et de l'autocensure.<\/li><li>D : l'homogénéité réduit la diversité des points de vue, source de l'intelligence collective.<\/li><\/ul>","piege":"Confondre sécurité psychologique et absence d'exigence. Une équipe peut être à la fois exigeante et psychologiquement sûre.","astuce":"Intelligence collective → confiance, diversité, liberté de parole.","regle":"Sans sécurité psychologique, pas de parole libre ; sans parole libre, pas d'intelligence collective."},{"id":"4-14","t":4,"n":14,"lvl":3,"neg":false,"q":"<p>Une administration installe une plateforme collaborative moderne (espaces partagés, messagerie d'équipe, documents en ligne). Six mois plus tard, elle est très peu utilisée : les agents continuent à échanger par courrier électronique et les décisions se prennent toujours en réunion hiérarchique. Quelle analyse est la plus pertinente ?<\/p>","o":["La plateforme est techniquement défaillante et doit être remplacée","Les agents sont réfractaires par nature au numérique","Il faut interdire le courrier électronique","L'outil seul ne crée pas la collaboration : il faut donner du sens, animer, former, faire évoluer les pratiques managériales et montrer l'exemple"],"a":3,"just":"<p>Les pratiques collaboratives relèvent d'abord de la culture et du management. Si les responsables continuent à décider seuls et à privilégier les circuits classiques, les agents n'ont aucune raison d'utiliser l'outil. Il faut définir des usages concrets, désigner des animateurs, former et que les managers utilisent eux-mêmes la plateforme.<\/p>","ana":"<ul><li>A : rien n'indique un problème technique.<\/li><li>B : la généralisation (« par nature ») est infondée et rejette la faute sur les agents.<\/li><li>C : l'interdiction crée du rejet sans changer la culture.<\/li><\/ul>","piege":"Croire qu'une solution technologique règle un problème d'organisation ou de culture.","astuce":"Indice : « décisions toujours en réunion hiérarchique ». Il montre que le management n'a pas changé.","regle":"Collaboration = culture + management + outils, dans cet ordre."},{"id":"4-15","t":4,"n":15,"lvl":3,"neg":false,"q":"<p>Une direction veut recueillir les idées de 80 agents de différents services sur l'amélioration de l'accueil des usagers, en une demi-journée, en favorisant les échanges croisés. Quelle méthode est la plus adaptée ?<\/p>","o":["Le world café : petites tables de discussion, rotation des participants, partage des idées en plénière","La méthode Delphi","Le codéveloppement professionnel","Un entretien individuel avec chaque agent"],"a":0,"just":"<p>Le world café permet de faire travailler un grand groupe. Les participants discutent par petites tables autour de questions, puis changent de table à intervalles réguliers. Un « hôte » reste à chaque table pour transmettre les idées précédentes. Les idées circulent et se croisent ; une synthèse est faite en plénière.<\/p>","ana":"<ul><li>B : Delphi est réservé à des experts, à distance, sur plusieurs tours, souvent plusieurs semaines.<\/li><li>C : le codéveloppement fonctionne en petits groupes (5 à 8 personnes) sur des problèmes individuels.<\/li><li>D : 80 entretiens individuels prendraient beaucoup de temps et ne créeraient aucun échange.<\/li><\/ul>","piege":"Choisir une méthode pertinente en soi mais inadaptée à la taille du groupe ou au délai.","astuce":"Vérifie trois critères : taille du groupe, durée, objectif. Grand groupe + court + échanges croisés → world café (ou forum ouvert).","regle":"Chaque méthode a son terrain : petit groupe et problème individuel (codéveloppement), experts à distance (Delphi), grand groupe et idées croisées (world café)."},{"id":"4-16","t":4,"n":16,"lvl":3,"neg":false,"q":"<p>Lors des réunions de service, le directeur donne toujours son avis en premier. Ensuite, la plupart des agents s'alignent sur sa position. Quelle condition de l'intelligence collective est compromise, et quelle correction apporter ?<\/p>","o":["La rapidité ; il faut réduire la durée des réunions","La hiérarchie ; il faut supprimer le poste de directeur","L'indépendance des opinions ; le directeur devrait recueillir les avis (éventuellement par écrit ou anonymement) et s'exprimer en dernier","La cohésion ; il faut organiser des activités de team building"],"a":2,"just":"<p>Selon James Surowiecki (<em>La sagesse des foules<\/em>), un groupe prend de bonnes décisions si ses membres sont <strong>divers<\/strong>, s'expriment de façon <strong>indépendante<\/strong>, disposent d'informations <strong>décentralisées<\/strong> et si un mécanisme permet d'<strong>agréger<\/strong> leurs avis. Quand le chef parle en premier, il crée un effet d'ancrage et de conformité : l'indépendance disparaît.<\/p>","ana":"<ul><li>A : la durée n'est pas le problème décrit.<\/li><li>B : supprimer la hiérarchie est disproportionné ; il suffit de modifier la manière de conduire la réunion.<\/li><li>D : le problème n'est pas un manque de cohésion, mais un excès d'influence.<\/li><\/ul>","piege":"Croire que le problème vient des agents (« ils manquent de courage ») alors qu'il vient du dispositif.","astuce":"« Le chef parle en premier » + « les autres s'alignent » → perte d'indépendance, effet d'ancrage.","regle":"Diversité, indépendance, décentralisation, agrégation : les quatre conditions de la sagesse des foules."},{"id":"4-17","t":4,"n":17,"lvl":3,"neg":false,"q":"<p>Un dossier d'usager traverse trois services successifs. Chaque service respecte ses propres délais, mais le délai global reste très long et l'usager ne sait jamais qui suit son dossier. Quelle réponse collaborative est la plus pertinente ?<\/p>","o":["Renforcer les objectifs propres à chaque service","Organiser une approche transversale centrée sur le parcours de l'usager : équipe interservices, pilote du processus de bout en bout, indicateur de délai global","Fusionner immédiatement les trois services sans analyse","Ajouter un quatrième service chargé de contrôler les trois autres"],"a":1,"just":"<p>Le problème est typique d'une organisation en <strong>silos<\/strong> : chaque service optimise sa partie, mais personne ne pilote l'ensemble. Une équipe interservices, un responsable du processus de bout en bout et un indicateur global créent une vision commune et favorisent la coopération.<\/p>","ana":"<ul><li>A : renforcer les objectifs par service accentue les silos.<\/li><li>C : une fusion sans analyse est une réponse lourde et risquée ; le problème peut se régler par la coordination.<\/li><li>D : un service de contrôle supplémentaire ajoute une étape sans améliorer la coopération.<\/li><\/ul>","piege":"Penser que si chaque partie est performante, le tout l'est aussi.","astuce":"« Chacun respecte ses délais, mais le délai global est long » → silos → transversalité et pilotage du processus global.","regle":"La performance globale naît de la coopération entre services, pas de la somme des performances isolées."},{"id":"4-18","t":4,"n":18,"lvl":3,"neg":false,"q":"<p>Une commune invite les habitants à donner leur avis en ligne sur un projet d'aménagement. Les avis sont recueillis, puis le conseil communal décide seul, sans s'engager à les suivre. Sur l'échelle de la participation citoyenne, ce dispositif correspond à :<\/p>","o":["La co-décision","La simple information","La délégation de pouvoir aux citoyens","La consultation"],"a":3,"just":"<p>L'échelle de participation (inspirée de Sherry Arnstein) distingue plusieurs niveaux : <strong>information<\/strong> (on informe), <strong>consultation<\/strong> (on demande l'avis, l'autorité décide seule), <strong>concertation<\/strong> (on discute et on fait évoluer le projet ensemble), <strong>co-construction ou co-décision<\/strong> (on élabore et on décide ensemble), <strong>délégation<\/strong> (les citoyens décident). Ici, l'avis est demandé, mais la décision reste à l'autorité.<\/p>","ana":"<ul><li>A : les habitants ne participent pas à la décision.<\/li><li>B : on ne se contente pas d'informer : on recueille des avis.<\/li><li>C : aucun pouvoir n'est transféré aux habitants.<\/li><\/ul>","piege":"Confondre « donner son avis » (consultation) et « décider ensemble » (co-décision).","astuce":"Qui décide ? Si c'est l'autorité seule après avoir recueilli des avis → consultation.","regle":"Information &lt; consultation &lt; concertation &lt; co-construction &lt; délégation."},{"id":"4-19","t":4,"n":19,"lvl":3,"neg":false,"q":"<p>Une équipe travaille désormais en mode hybride (présentiel et télétravail). Les informations circulent mal et certains agents se sentent isolés. Quelle mesure est la plus adaptée pour préserver la collaboration ?<\/p>","o":["Définir des règles communes (rituels d'équipe réguliers, canaux de communication selon l'urgence, documents partagés, temps de présence commun) et entretenir la confiance","Interdire le télétravail","Multiplier les réunions quotidiennes de plusieurs heures","Laisser chacun s'organiser sans aucune règle"],"a":0,"just":"<p>La collaboration à distance exige d'organiser ce qui se faisait naturellement au bureau : des rituels (point d'équipe hebdomadaire), des règles d'usage des outils (messagerie pour l'urgent, plateforme partagée pour les documents), des moments de présence commune et une attention aux liens humains.<\/p>","ana":"<ul><li>B : interdire le télétravail est une réponse extrême qui ignore les bénéfices du travail hybride.<\/li><li>C : l'excès de réunions épuise et réduit le temps de travail effectif.<\/li><li>D : l'absence de règles aggrave le problème décrit.<\/li><\/ul>","piege":"Choisir une réponse extrême (tout interdire ou tout laisser faire).","astuce":"La bonne réponse se situe entre l'interdiction et le laisser-faire : des règles du jeu partagées.","regle":"Équipe hybride = règles claires + rituels + outils partagés + confiance."},{"id":"4-20","t":4,"n":20,"lvl":3,"neg":false,"q":"<p>Un chef de service veut résoudre un problème récurrent de retard dans le traitement des réclamations, en mobilisant l'intelligence collective de son équipe. Quelle démarche est la plus cohérente ?<\/p>","o":["Désigner lui-même la solution, puis demander à l'équipe de l'appliquer","Organiser un vote immédiat sur une solution proposée par un cabinet","Partager le diagnostic avec les agents de terrain, animer des ateliers (avec un facilitateur), sélectionner les idées selon des critères clairs, tester les meilleures, puis faire un retour aux participants sur ce qui a été retenu","Demander à chaque agent d'envoyer une idée par courriel, sans suite"],"a":2,"just":"<p>Cette démarche réunit les conditions de l'intelligence collective : implication des agents qui connaissent le terrain, méthode animée, phase de divergence (idées) puis de convergence (critères), expérimentation et <strong>retour<\/strong> aux participants. Ce retour est essentiel : sans lui, les agents ne participeront plus aux prochaines démarches.<\/p>","ana":"<ul><li>A : c'est une décision descendante, sans intelligence collective.<\/li><li>B : la solution vient de l'extérieur et le vote immédiat empêche le débat.<\/li><li>D : recueillir des idées sans suite démobilise les agents.<\/li><\/ul>","piege":"Négliger le retour aux participants. C'est une erreur fréquente qui tue la participation.","astuce":"La bonne démarche suit le cycle : comprendre ensemble → produire ensemble → choisir → tester → rendre compte.","regle":"Mobiliser l'intelligence collective = associer, animer, décider avec méthode et rendre compte."},{"id":"5-1","t":5,"n":1,"lvl":1,"neg":false,"q":"<p>Laquelle de ces actions correspond le mieux à une <strong>transformation digitale<\/strong> au sens strict ?<\/p>","o":["Scanner les archives papier pour les stocker sur un serveur","Équiper chaque agent d'un ordinateur neuf","Repenser un service public de bout en bout grâce au numérique (parcours usager, processus, organisation, compétences) pour créer plus de valeur pour l'usager","Créer un site internet qui présente les horaires d'ouverture des bureaux"],"a":2,"just":"<p>La transformation digitale ne se limite pas à la technologie. Elle modifie les processus, l'organisation, les compétences, la culture et la relation avec l'usager. Le numérique est un moyen pour concevoir des services plus simples, plus rapides et mieux adaptés.<\/p>","ana":"<ul><li>A : c'est de la <strong>dématérialisation<\/strong> (numérisation des documents) : une étape utile, mais limitée.<\/li><li>B : c'est de l'<strong>équipement<\/strong>, une condition matérielle.<\/li><li>D : un site vitrine informe, mais ne transforme pas le service.<\/li><\/ul>","piege":"Confondre trois niveaux : numériser (le support change), digitaliser (le processus est outillé), transformer (le service et l'organisation sont repensés).","astuce":"Cherche les mots « repenser », « de bout en bout », « organisation », « culture », « valeur pour l'usager ».","regle":"Dématérialisation = changer le support ; transformation digitale = changer le service et l'organisation."},{"id":"5-2","t":5,"n":2,"lvl":1,"neg":false,"q":"<p>Les <strong>données ouvertes (open data)<\/strong> sont :<\/p>","o":["Des données publiques mises à disposition de tous, gratuitement, dans un format ouvert et réutilisable, y compris à des fins commerciales","Toutes les données détenues par l'administration, y compris les données personnelles des usagers","Des données réservées aux agents publics","Des données vendues par l'administration aux entreprises"],"a":0,"just":"<p>L'open data vise la transparence et l'innovation : les citoyens, chercheurs, journalistes et entreprises peuvent réutiliser les données (budgets, équipements, transports, statistiques) pour créer des services ou analyser l'action publique. Au Maroc, le portail national des données ouvertes est data.gov.ma.<\/p>","ana":"<ul><li>B : les données personnelles, couvertes par un secret légal ou touchant la sécurité, sont <strong>exclues<\/strong> de l'ouverture (ou doivent être anonymisées).<\/li><li>C : des données réservées aux agents ne sont pas « ouvertes ».<\/li><li>D : le principe de l'open data est la gratuité.<\/li><\/ul>","piege":"Croire que l'open data consiste à publier toutes les données de l'administration.","astuce":"Open data = gratuit + réutilisable + format ouvert (lisible par une machine) + données non personnelles.","regle":"On ouvre les données publiques, on protège les données personnelles."},{"id":"5-3","t":5,"n":3,"lvl":1,"neg":false,"q":"<p>Le portail en ligne d'une administration est rendu inaccessible pendant deux jours par une attaque par déni de service (DDoS). Quel critère de sécurité de l'information est principalement atteint ?<\/p>","o":["La confidentialité","L'intégrité","La traçabilité","La disponibilité"],"a":3,"just":"<p>La sécurité de l'information repose sur trois critères (la « triade DIC » ou CIA en anglais) : <strong>Disponibilité<\/strong> (le système est accessible quand on en a besoin), <strong>Intégrité<\/strong> (les données ne sont pas modifiées de façon non autorisée), <strong>Confidentialité<\/strong> (seules les personnes autorisées accèdent aux données). Un déni de service vise à rendre le service inaccessible.<\/p>","ana":"<ul><li>A : aucune donnée n'a été divulguée.<\/li><li>B : aucune donnée n'a été modifiée.<\/li><li>C : la traçabilité (ou preuve) est parfois ajoutée comme quatrième critère, mais elle n'est pas atteinte ici.<\/li><\/ul>","piege":"Penser que toute cyberattaque touche la confidentialité. Chaque attaque vise un critère précis.","astuce":"Inaccessible → disponibilité ; modifié → intégrité ; divulgué ou volé → confidentialité.","regle":"DIC : Disponibilité, Intégrité, Confidentialité (+ Traçabilité)."},{"id":"5-4","t":5,"n":4,"lvl":1,"neg":false,"q":"<p>Au Maroc, quelle autorité est chargée de veiller au respect de la protection des données à caractère personnel prévue par la loi n° 09-08 ?<\/p>","o":["La Direction générale de la sécurité des systèmes d'information (DGSSI)","La Commission nationale de contrôle de la protection des données à caractère personnel (CNDP)","L'Agence de développement du digital (ADD)","L'Agence nationale de réglementation des télécommunications (ANRT)"],"a":1,"just":"<p>La loi 09-08 (2009) protège les personnes physiques à l'égard du traitement de leurs données personnelles. La CNDP reçoit les déclarations et demandes d'autorisation des traitements, contrôle leur conformité, traite les plaintes et informe les citoyens de leurs droits.<\/p>","ana":"<ul><li>A : la DGSSI est chargée de la sécurité des systèmes d'information de l'État et de la cybersécurité (loi 05-20).<\/li><li>C : l'ADD (loi 61-16) met en œuvre la stratégie de développement du digital.<\/li><li>D : l'ANRT régule le secteur des télécommunications.<\/li><\/ul>","piege":"Confondre la protection des <strong>données personnelles<\/strong> (CNDP) et
