ncement, d'appropriation et de résultats → ajustements réguliers → ancrage durable","Une formation unique pour tous les agents le jour du lancement"],"a":2,"just":"<p>Le pilotage du changement combine les quatre dimensions du thème : la <strong>faisabilité<\/strong> (diagnostic, étude), les <strong>leviers<\/strong> (sens, communication, formation, relais, accompagnement), le traitement des <strong>freins<\/strong> (étude d'impacts, écoute, ajustements) et le <strong>pilotage<\/strong> proprement dit (gouvernance, indicateurs, ancrage).<\/p>","ana":"<ul><li>A : une note et une évaluation tardive ne constituent pas un pilotage.<\/li><li>B : un outil et un calendrier ne suffisent pas à accompagner les personnes.<\/li><li>D : une formation unique ne répond pas à la diversité des impacts.<\/li><\/ul>","piege":"Réduire la conduite du changement à la gestion de projet technique.","astuce":"La bonne réponse couvre faisabilité, leviers, freins et pilotage, du début à la fin.","regle":"Conduire le changement = préparer, donner du sens, organiser, accompagner, mesurer, ajuster, ancrer."},{"id":"11-1","t":11,"n":1,"lvl":1,"neg":false,"q":"<p>Selon le référentiel COSO, le <strong>contrôle interne<\/strong> se définit comme :<\/p>","o":["Un processus mis en œuvre par la direction, l'encadrement et l'ensemble du personnel, destiné à fournir une assurance raisonnable quant à la réalisation des objectifs liés aux opérations, au reporting et à la conformité","Une mission ponctuelle réalisée par un auditeur externe","Un service spécialisé chargé de vérifier seul toutes les opérations","Le contrôle exercé par la Cour des comptes sur les administrations"],"a":0,"just":"<p>Le contrôle interne n'est pas un service, mais un <strong>dispositif<\/strong> intégré aux activités. Il concerne tout le monde, de la direction aux agents. Il vise trois catégories d'objectifs : <strong>opérations<\/strong> (efficacité et efficience, protection des actifs), <strong>reporting<\/strong> (fiabilité des informations financières et non financières) et <strong>conformité<\/strong> (respect des lois et règlements).<\/p>","ana":"<ul><li>B : une mission ponctuelle d'un auditeur externe est un contrôle <strong>externe<\/strong>.<\/li><li>C : le contrôle interne n'est pas l'affaire d'un seul service ; chaque responsable l'exerce sur ses activités.<\/li><li>D : la Cour des comptes exerce un contrôle externe juridictionnel.<\/li><\/ul>","piege":"Croire que le contrôle interne est un service de contrôle. C'est l'ensemble des dispositifs de maîtrise des activités.","astuce":"Contrôle interne = processus + tout le personnel + assurance raisonnable + trois objectifs.","regle":"Le contrôle interne est l'affaire de tous, intégrée au quotidien."},{"id":"11-2","t":11,"n":2,"lvl":1,"neg":false,"q":"<p>Pourquoi dit-on que le contrôle interne fournit une <strong>assurance raisonnable<\/strong>, et non une assurance absolue ?<\/p>","o":["Parce que les contrôles ne sont jamais appliqués","Parce que la loi interdit les contrôles complets","Parce qu'il comporte des limites inhérentes : erreurs humaines, collusion entre personnes, contournement par la direction, arbitrage entre le coût des contrôles et leurs bénéfices","Parce qu'il ne concerne que les petites organisations"],"a":2,"just":"<p>Même bien conçu, un dispositif de contrôle interne ne peut pas éliminer tous les risques : un agent peut se tromper, plusieurs personnes peuvent s'entendre pour frauder, un dirigeant peut contourner les procédures, et contrôler tout serait trop coûteux et paralysant.<\/p>","ana":"<ul><li>A : le caractère « raisonnable » ne vient pas d'une absence d'application.<\/li><li>B : aucune loi n'interdit les contrôles complets ; ils seraient simplement disproportionnés.<\/li><li>D : le contrôle interne concerne toutes les organisations.<\/li><\/ul>","piege":"Croire qu'un bon contrôle interne garantit l'absence de fraude ou d'erreur.","astuce":"« Assurance raisonnable » → toujours associer : limites humaines, collusion, contournement, coût.","regle":"Le contrôle interne réduit les risques à un niveau acceptable ; il ne les supprime pas."},{"id":"11-3","t":11,"n":3,"lvl":1,"neg":true,"q":"<p>Le référentiel COSO 2013 organise le contrôle interne en cinq composantes. Laquelle <strong>n'en fait pas partie<\/strong> ?<\/p>","o":["L'environnement de contrôle","L'audit externe annuel des comptes","Les activités de contrôle","Le pilotage (ou surveillance) du contrôle interne"],"a":1,"just":"<p>Les cinq composantes du COSO sont : l'<strong>environnement de contrôle<\/strong>, l'<strong>évaluation des risques<\/strong>, les <strong>activités de contrôle<\/strong>, l'<strong>information et la communication<\/strong>, et le <strong>pilotage<\/strong> (activités de surveillance). L'audit externe est extérieur au dispositif de contrôle interne : il peut l'évaluer, mais n'en est pas une composante.<\/p>","ana":"<p>A, C et D sont trois des cinq composantes.<\/p>","piege":"La <strong>négation<\/strong> (« n'en fait pas partie »). L'audit externe est lié au contrôle, mais il est externe.","astuce":"Moyen mnémotechnique des cinq composantes : « Et Elle Accepte Initialement Pour » (Environnement, Évaluation des risques, Activités de contrôle, Information et communication, Pilotage).","regle":"COSO : environnement, risques, activités de contrôle, information-communication, pilotage."},{"id":"11-4","t":11,"n":4,"lvl":1,"neg":false,"q":"<p>Dans un service, le même agent commande les fournitures, réceptionne les livraisons, enregistre les factures et prépare les paiements. Quel principe de contrôle interne est méconnu ?<\/p>","o":["Le principe de continuité","Le principe de spécialité","Le principe de mutabilité","Le principe de séparation des tâches (ou des fonctions)"],"a":3,"just":"<p>La séparation des tâches consiste à confier à des personnes différentes les fonctions incompatibles : <strong>autorisation<\/strong> (décider), <strong>exécution ou enregistrement<\/strong> (réaliser, comptabiliser), <strong>détention des actifs<\/strong> (garder les biens ou les fonds) et <strong>contrôle<\/strong>. Si une seule personne cumule ces fonctions, elle peut commettre une erreur ou une fraude sans qu'elle soit détectée.<\/p>","ana":"<ul><li>A et C : ce sont des principes du service public.<\/li><li>B : la spécialité concerne les établissements publics.<\/li><\/ul>","piege":"Croire que la séparation des tâches est une marque de méfiance envers les agents. Elle protège aussi les agents contre les soupçons.","astuce":"Une seule personne fait « tout le circuit » → séparation des tâches.","regle":"Celui qui décide ne doit pas être celui qui paie, ni celui qui contrôle."},{"id":"11-5","t":11,"n":5,"lvl":1,"neg":false,"q":"<p>Chaque mois, un comptable compare les opérations enregistrées dans les livres de l'établissement avec le relevé bancaire, afin de repérer et d'expliquer les écarts. De quel type de contrôle s'agit-il ?<\/p>","o":["Un contrôle détectif","Un contrôle préventif","Un contrôle correctif","Un contrôle hiérarchique a priori"],"a":0,"just":"<p>On distingue les contrôles <strong>préventifs<\/strong> (ils empêchent l'erreur ou la fraude de se produire : autorisation préalable, contrôle d'accès, séparation des tâches), les contrôles <strong>détectifs<\/strong> (ils repèrent après coup une anomalie : rapprochement bancaire, inventaire, revue des écarts) et les mesures <strong>correctives<\/strong> (elles corrigent l'anomalie détectée et ses causes). Le rapprochement bancaire intervient après les opérations pour détecter les écarts.<\/p>","ana":"<ul><li>B : le rapprochement n'empêche pas l'erreur ; il la révèle.<\/li><li>C : la correction intervient après la détection.<\/li><li>D : il ne s'agit pas d'une validation préalable par un supérieur.<\/li><\/ul>","piege":"Confondre préventif (avant) et détectif (après).","astuce":"Comparaison, rapprochement, inventaire, revue → détectif. Autorisation, habilitation, verrou → préventif.","regle":"Un bon dispositif combine contrôles préventifs et détectifs."},{"id":"11-6","t":11,"n":6,"lvl":1,"neg":false,"q":"<p>Quelle composante du COSO constitue le <strong>socle<\/strong> du contrôle interne, en reflétant l'intégrité, les valeurs éthiques, l'exemplarité de la direction, la structure organisationnelle et les compétences du personnel ?<\/p>","o":["Les activités de contrôle","Le pilotage","L'environnement de contrôle","L'information et la communication"],"a":2,"just":"<p>L'environnement de contrôle est la base de toutes les autres composantes. Il correspond à la culture de l'organisation : engagement en faveur de l'intégrité, exemplarité de la direction (« le ton donné au sommet »), clarté des responsabilités, compétence des agents. Un environnement faible rend inefficaces les meilleures procédures.<\/p>","ana":"<ul><li>A : les activités de contrôle sont les mesures concrètes (autorisations, rapprochements).<\/li><li>B : le pilotage évalue le dispositif dans le temps.<\/li><li>D : l'information et la communication assurent la circulation des informations utiles.<\/li><\/ul>","piege":"Croire que le contrôle interne se résume à des procédures. Sans culture d'intégrité, les procédures sont contournées.","astuce":"Éthique, intégrité, exemplarité de la direction, culture → environnement de contrôle.","regle":"Le contrôle interne commence par l'exemple donné au sommet."},{"id":"11-7","t":11,"n":7,"lvl":2,"neg":false,"q":"<p>Quelle est la différence entre le <strong>contrôle interne<\/strong> et l'<strong>audit interne<\/strong> ?<\/p>","o":["Ce sont deux termes synonymes","Le contrôle interne est le dispositif de maîtrise des activités, mis en œuvre par tous ; l'audit interne est une fonction indépendante qui évalue périodiquement l'efficacité de ce dispositif et formule des recommandations","L'audit interne exécute les opérations, le contrôle interne les évalue","Le contrôle interne relève de la Cour des comptes, l'audit interne du Parlement"],"a":1,"just":"<p>Le contrôle interne est intégré aux opérations (première et deuxième lignes). L'audit interne (troisième ligne) n'exécute pas les contrôles : il examine si le dispositif est bien conçu et bien appliqué, puis recommande des améliorations. Son indépendance est essentielle.<\/p>","ana":"<ul><li>A : les deux notions sont liées, mais distinctes.<\/li><li>C : c'est l'inverse, et l'audit interne ne doit pas exécuter d'opérations.<\/li><li>D : les deux sont internes à l'organisation.<\/li><\/ul>","piege":"Confondre le <strong>système<\/strong> (contrôle interne) et son <strong>évaluateur<\/strong> (audit interne).","astuce":"Contrôle interne = « faire bien au quotidien » ; audit interne = « vérifier que le dispositif fonctionne ».","regle":"L'audit interne audite le contrôle interne ; il n'en fait pas partie opérationnellement."},{"id":"11-8","t":11,"n":8,"lvl":2,"neg":false,"q":"<p>En comptabilité publique, que signifie le principe de <strong>séparation des ordonnateurs et des comptables<\/strong> ?<\/p>","o":["L'ordonnateur et le comptable doivent travailler dans des villes différentes","Le comptable public décide de l'opportunité des dépenses","L'ordonnateur manipule directement les fonds publics","L'ordonnateur engage, liquide et ordonnance les dépenses, tandis que le comptable public, distinct, contrôle leur régularité et effectue le paiement ; les deux fonctions sont incompatibles"],"a":3,"just":"<p>C'est une application historique de la séparation des tâches aux finances publiques. L'<strong>ordonnateur<\/strong> (ministre, directeur, président de collectivité) décide de la dépense : il l'engage, la liquide (en fixe le montant exact) et l'ordonnance (donne l'ordre de payer). Le <strong>comptable public<\/strong> (au Maroc, relevant notamment de la Trésorerie générale du Royaume) vérifie la régularité de la dépense avant de payer et manie les fonds.<\/p>","ana":"<ul><li>A : la séparation est fonctionnelle, pas géographique.<\/li><li>B : le comptable contrôle la <strong>régularité<\/strong>, pas l'opportunité, qui relève de l'ordonnateur.<\/li><li>C : l'ordonnateur ne manie pas les fonds ; c'est justement l'objet de la séparation.<\/li><\/ul>","piege":"Croire que le comptable juge l'opportunité de la dépense.","astuce":"Ordonnateur = décide (engagement, liquidation, ordonnancement) ; comptable = contrôle la régularité et paie.","regle":"Celui qui ordonne ne paie pas ; celui qui paie n'ordonne pas."},{"id":"11-9","t":11,"n":9,"lvl":2,"neg":false,"q":"<p>Selon le <strong>triangle de la fraude<\/strong> de Donald Cressey, une fraude survient généralement lorsque trois conditions sont réunies. Sur laquelle le contrôle interne agit-il le plus directement ?<\/p>","o":["L'opportunité : la possibilité de commettre la fraude sans être détecté","La pression financière personnelle de l'agent","La rationalisation (la justification que l'agent se donne)","Le niveau de salaire de la direction"],"a":0,"just":"<p>Le triangle de la fraude réunit la <strong>pression<\/strong> (ou motivation : difficultés financières, objectifs excessifs), l'<strong>opportunité<\/strong> (une faille permettant d'agir sans être découvert) et la <strong>rationalisation<\/strong> (« je le mérite », « tout le monde le fait »). Les contrôles (séparation des tâches, rapprochements, habilitations) réduisent directement les opportunités. La culture éthique agit sur la rationalisation.<\/p>","ana":"<ul><li>B : l'organisation a peu de prise directe sur la situation personnelle des agents.<\/li><li>C : la rationalisation relève surtout de l'éthique et de la culture (environnement de contrôle).<\/li><li>D : ce n'est pas un élément du triangle.<\/li><\/ul>","piege":"Croire que le contrôle interne peut supprimer les trois conditions.","astuce":"Contrôles → opportunité ; éthique et exemplarité → rationalisation.","regle":"Pression + opportunité + rationalisation = risque de fraude. Le contrôle interne ferme les opportunités."},{"id":"11-10","t":11,"n":10,"lvl":2,"neg":false,"q":"<p>Au Maroc, le <strong>contrôle modulé de la dépense<\/strong> repose sur l'idée suivante :<\/p>","o":["Supprimer tout contrôle sur les dépenses publiques","Appliquer exactement les mêmes contrôles a priori à tous les ordonnateurs, quelle que soit la qualité de leur gestion","Alléger les contrôles a priori pour les ordonnateurs dont la capacité de gestion est jugée satisfaisante, dans une logique de responsabilisation et de contrôle fondé sur les risques","Confier le contrôle des dépenses aux fournisseurs"],"a":2,"just":"<p>Le contrôle modulé de la dépense, mis en place dans le cadre de la réforme du contrôle des dépenses de l'État (décret de 2008), adapte l'intensité du contrôle à la qualité du dispositif de gestion et de contrôle interne de l'ordonnateur. Plus son contrôle interne est solide, plus les contrôles a priori sont allégés, au profit de contrôles a posteriori.<\/p>","ana":"<ul><li>A : le contrôle est modulé, pas supprimé.<\/li><li>B : c'est l'inverse de la modulation.<\/li><li>D : les fournisseurs n'ont aucun rôle de contrôle.<\/li><\/ul>","piege":"Confondre allègement du contrôle et absence de contrôle.","astuce":"« Modulé » = adapté au niveau de risque et à la qualité de la gestion.","regle":"Un bon contrôle interne permet d'alléger les contrôles externes a priori."},{"id":"11-11","t":11,"n":11,"lvl":2,"neg":false,"q":"<p>Dans un service, deux agents chargés de fonctions séparées (l'un valide les bénéficiaires, l'autre effectue les paiements) s'entendent pour verser des aides à des bénéficiaires fictifs. Quelle limite du contrôle interne cette situation illustre-t-elle ?<\/p>","o":["Le coût excessif des contrôles","La collusion entre plusieurs personnes, qui permet de contourner la séparation des tâches","L'absence totale de procédures","L'erreur de saisie involontaire"],"a":1,"just":"<p>La séparation des tâches suppose que les personnes ne s'entendent pas. Si elles se concertent, elles peuvent contourner le contrôle. Pour réduire ce risque, on ajoute des contrôles complémentaires : contrôles croisés de fichiers, contrôles inopinés, rotation des agents sur les postes sensibles, analyse des données et canal de signalement.<\/p>","ana":"<ul><li>A : le problème n'est pas le coût.<\/li><li>C : des procédures existent (la séparation est en place).<\/li><li>D : la fraude est volontaire.<\/li><\/ul>","piege":"Croire que la séparation des tâches suffit à empêcher toute fraude.","astuce":"« Deux agents s'entendent » → collusion.","regle":"La collusion est une limite majeure du contrôle interne ; elle appelle des contrôles complémentaires."},{"id":"11-12","t":11,"n":12,"lvl":2,"neg":false,"q":"<p>Un établissement impose trois signatures et un visa du directeur pour tout achat de fournitures, même pour un montant de 50 dirhams. Quelle critique peut-on formuler ?<\/p>","o":["Aucune, car plus il y a de contrôles, mieux c'est","Il faudrait ajouter une quatrième signature","Il faudrait supprimer tout contrôle sur les achats","Le contrôle est disproportionné : son coût (temps, délais) dépasse le risque couvert ; les contrôles doivent être adaptés au niveau de risque (seuils, procédures simplifiées pour les faibles montants)"],"a":3,"just":"<p>Un contrôle interne efficace est <strong>proportionné<\/strong> : son coût ne doit pas dépasser le bénéfice attendu. Pour les petits montants, des procédures allégées (seuils, régie d'avances, carte d'achat) suffisent ; les contrôles renforcés sont réservés aux opérations à risque élevé.<\/p>","ana":"<ul><li>A : l'excès de contrôles ralentit l'activité, décourage les agents et peut même encourager le contournement.<\/li><li>B : cela aggraverait le problème.<\/li><li>C : supprimer tout contrôle est l'excès inverse.<\/li><\/ul>","piege":"Confondre contrôle interne efficace et contrôle interne lourd.","astuce":"Petit montant + procédure très lourde → proportionnalité.","regle":"Contrôler plus là où le risque est élevé, contrôler moins là où il est faible."},{"id":"11-13","t":11,"n":13,"lvl":2,"neg":false,"q":"<p>Dans un établissement, les agents qui constatent une anomalie ne savent pas à qui la signaler, et les rapports d'incidents ne remontent jamais jusqu'à la direction. Quelle composante du COSO est principalement défaillante ?<\/p>","o":["L'information et la communication","L'évaluation des risques","Les activités de contrôle","L'environnement de contrôle uniquement"],"a":0,"just":"<p>Cette composante garantit que les informations pertinentes et fiables circulent dans tous les sens : de la direction vers les agents (règles, responsabilités) et des agents vers la direction (anomalies, incidents, suggestions). Un canal de signalement clair en fait partie.<\/p>","ana":"<ul><li>B : l'évaluation des risques consiste à identifier et analyser les risques.<\/li><li>C : les activités de contrôle sont les mesures concrètes de maîtrise.<\/li><li>D : l'environnement de contrôle peut jouer (peur de signaler), mais le problème décrit est d'abord l'absence de canal et de circulation de l'information. Le mot « uniquement » rend aussi la proposition fausse.<\/li><\/ul>","piege":"Négliger la composante information-communication, souvent oubliée.","astuce":"« Ne savent pas à qui signaler », « ne remonte pas » → information et communication.","regle":"Un dispositif de contrôle sans circulation de l'information reste aveugle."},{"id":"11-14","t":11,"n":14,"lvl":3,"neg":false,"q":"<p>Dans une régie de recettes, le même agent encaisse les paiements en espèces des usagers, les enregistre, conserve la caisse et effectue les dépôts à la banque. Aucun rapprochement n'est réalisé. Quelles mesures recommander en priorité ?<\/p>","o":["Doubler la rémunération de l'agent pour garantir son honnêteté","Supprimer la régie et refuser tout paiement","Séparer les fonctions d'encaissement, d'enregistrement et de dépôt, délivrer des reçus numérotés, rapprocher régulièrement les recettes enregistrées et les dépôts bancaires, et effectuer des contrôles de caisse inopinés","Faire confiance à l'agent, car il est en poste depuis longtemps"],"a":2,"just":"<p>Le maniement d'espèces est une activité à risque élevé. Les mesures combinent des contrôles <strong>préventifs<\/strong> (séparation des fonctions, reçus numérotés qui obligent à justifier chaque encaissement) et <strong>détectifs<\/strong> (rapprochements, contrôles inopinés).<\/p>","ana":"<ul><li>A : le salaire ne remplace pas le contrôle.<\/li><li>B : supprimer la régie priverait les usagers d'un service.<\/li><li>D : l'ancienneté n'est pas une mesure de contrôle ; une longue présence sans contrôle peut même accroître le risque.<\/li><\/ul>","piege":"Fonder le contrôle sur la confiance personnelle plutôt que sur le dispositif.","astuce":"Espèces + un seul agent + pas de rapprochement → séparation + reçus + rapprochement + contrôles inopinés.","regle":"Plus le risque est élevé (espèces, paiements), plus les contrôles préventifs et détectifs doivent être combinés."},{"id":"11-15","t":11,"n":15,"lvl":3,"neg":false,"q":"<p>Un directeur demande oralement au responsable financier d'effectuer un paiement « en urgence », sans les pièces justificatives exigées par la procédure. Quelle est la bonne analyse ?<\/p>","o":["Le responsable doit exécuter sans discuter, car le directeur est au-dessus des procédures","Il s'agit d'un contournement des contrôles par la direction, limite connue du contrôle interne ; le responsable doit respecter la procédure, demander les justificatifs ou une instruction écrite, et signaler l'anomalie par les voies prévues","Le responsable doit payer, puis détruire les traces de l'opération","Le responsable doit démissionner immédiatement"],"a":1,"just":"<p>Le contournement des contrôles par la direction (souvent appelé « management override ») est l'une des limites majeures du contrôle interne. Les règles s'appliquent à tous, y compris aux dirigeants. Un environnement de contrôle solide prévoit des voies de signalement et protège les agents qui respectent les procédures. Le responsable financier engage par ailleurs sa propre responsabilité s'il paie sans justificatifs.<\/p>","ana":"<ul><li>A : personne n'est au-dessus des procédures.<\/li><li>C : détruire des traces serait une faute grave.<\/li><li>D : la démission n'est pas la réponse attendue ; il existe des voies de signalement.<\/li><\/ul>","piege":"Croire que l'urgence ou la hiérarchie justifient de contourner les contrôles.","astuce":"Ordre oral + absence de justificatifs + urgence → contournement : procédure, écrit, signalement.","regle":"Le contrôle interne s'impose aussi au sommet de l'organisation."},{"id":"11-16","t":11,"n":16,"lvl":3,"neg":false,"q":"<p>Un rapport d'audit interne a formulé quinze recommandations il y a deux ans. Aucune n'a été mise en œuvre et personne n'en assure le suivi. Quelle composante du contrôle interne est défaillante, et quelle mesure s'impose ?<\/p>","o":["L'évaluation des risques ; il faut refaire la cartographie","Les activités de contrôle ; il faut ajouter des signatures","L'environnement de contrôle ; il faut changer le règlement intérieur","Le pilotage (surveillance) ; il faut un plan d'action avec des responsables et des échéances, et un suivi régulier de la mise en œuvre des recommandations par la direction"],"a":3,"just":"<p>Le pilotage comprend l'évaluation continue et périodique du dispositif (auto-évaluations, audits) et la correction des faiblesses identifiées. Un audit dont les recommandations ne sont pas suivies ne sert à rien. La direction doit valider un plan d'action, désigner des responsables, fixer des échéances et suivre leur mise en œuvre.<\/p>","ana":"<ul><li>A : la cartographie n'est pas en cause ; le problème est le suivi.<\/li><li>B : ajouter des signatures ne règle pas l'absence de suivi.<\/li><li>C : changer le règlement ne suffit pas sans suivi.<\/li><\/ul>","piege":"Croire que l'audit suffit. C'est la mise en œuvre des recommandations qui améliore le dispositif.","astuce":"« Recommandations non suivies » → pilotage, plan d'action, suivi.","regle":"Un dispositif de contrôle interne vit grâce à son pilotage : évaluer, corriger, suivre."},{"id":"11-17","t":11,"n":17,"lvl":3,"neg":false,"q":"<p>Un nouveau responsable du contrôle interne veut commencer par rédiger des procédures détaillées pour toutes les activités de l'établissement. Quelle démarche est plus pertinente ?<\/p>","o":["Partir des objectifs et de la cartographie des risques, puis concevoir en priorité des contrôles proportionnés pour les risques majeurs","Rédiger toutes les procédures sans distinction, quel que soit le risque","Copier les procédures d'un autre établissement sans les adapter","Commencer par acheter un logiciel de contrôle interne"],"a":0,"just":"<p>Le contrôle interne sert à maîtriser les risques qui menacent les objectifs. Il faut donc d'abord identifier et hiérarchiser ces risques, puis concentrer les efforts sur les plus critiques. Rédiger des procédures pour tout, sans priorités, épuise les ressources et produit des documents peu utilisés.<\/p>","ana":"<ul><li>B : l'approche est lourde et ne distingue pas l'essentiel de l'accessoire.<\/li><li>C : chaque établissement a ses propres risques et son organisation.<\/li><li>D : un outil ne remplace pas la démarche.<\/li><\/ul>","piege":"Confondre contrôle interne et production de procédures.","astuce":"La démarche de contrôle interne commence par les objectifs et les risques.","regle":"Objectifs → risques → contrôles proportionnés → procédures."},{"id":"11-18","t":11,"n":18,"lvl":3,"neg":false,"q":"<p>Un agent a été muté du service des paiements vers un autre service il y a six mois. Il dispose toujours de ses droits d'accès à l'application de paiement. Quelle faiblesse cette situation révèle-t-elle ?<\/p>","o":["Un défaut de formation de l'agent","Un problème de rémunération","L'absence de revue périodique des habilitations informatiques et de procédure de retrait des droits lors des changements de poste","Une erreur de l'agent, qui aurait dû supprimer lui-même ses accès"],"a":2,"just":"<p>Les habilitations informatiques sont un contrôle préventif essentiel. Elles doivent correspondre aux fonctions réellement exercées (principe du « moindre privilège »). Une procédure doit prévoir le retrait des droits lors des mutations et départs, et une revue périodique des accès doit vérifier leur pertinence.<\/p>","ana":"<ul><li>A : la formation n'est pas en cause.<\/li><li>B : sans rapport avec la situation.<\/li><li>D : la gestion des droits relève de l'organisation (responsable du service et administrateur informatique), pas de l'initiative individuelle.<\/li><\/ul>","piege":"Négliger les contrôles informatiques, qui font pleinement partie du contrôle interne.","astuce":"Ancien agent qui garde des accès → revue des habilitations, moindre privilège.","regle":"Chaque agent ne doit avoir que les accès nécessaires à ses fonctions actuelles."},{"id":"11-19","t":11,"n":19,"lvl":3,"neg":false,"q":"<p>Pourquoi est-il important de <strong>formaliser les procédures<\/strong> (manuels de procédures, organigramme fonctionnel, fiches de poste) dans un dispositif de contrôle interne ?<\/p>","o":["Pour augmenter le volume des archives","Pour garantir l'homogénéité des pratiques, assurer la continuité en cas d'absence ou de départ, faciliter la formation, permettre la traçabilité et servir de référence aux contrôles et aux audits","Pour remplacer le jugement des agents dans toutes les situations","Pour satisfaire uniquement une exigence formelle de l'audit externe"],"a":1,"just":"<p>Une procédure formalisée décrit qui fait quoi, quand, comment et avec quels contrôles. Elle réduit la dépendance à quelques personnes, facilite l'intégration des nouveaux agents et permet de vérifier que les opérations sont réalisées conformément au référentiel.<\/p>","ana":"<ul><li>A : le volume n'est pas un objectif.<\/li><li>C : les procédures encadrent l'action, mais ne suppriment pas le jugement professionnel, notamment face aux situations imprévues.<\/li><li>D : la formalisation sert d'abord à l'organisation elle-même.<\/li><\/ul>","piege":"Croire que des procédures rédigées suffisent : elles doivent être connues, appliquées et mises à jour.","astuce":"Formalisation → continuité, homogénéité, traçabilité, formation.","regle":"Une procédure utile est écrite, connue, appliquée et tenue à jour."},{"id":"11-20","t":11,"n":20,"lvl":3,"neg":false,"q":"<p>Un établissement public veut mettre en place un dispositif de contrôle interne efficace. Quelle démarche est la plus complète ?<\/p>","o":["Nommer un contrôleur chargé de vérifier seul toutes les opérations","Rédiger un manuel de procédures et le diffuser par courriel","Attendre le prochain contrôle de la Cour des comptes pour connaître les faiblesses","Engagement de la direction et charte d'éthique → cartographie des risques → activités de contrôle proportionnées (séparation des tâches, autorisations, rapprochements, habilitations) → formalisation des procédures → information, communication et formation des agents → pilotage (auto-évaluation, audit interne, suivi des recommandations)"],"a":3,"just":"<p>Cette démarche reprend les cinq composantes : <strong>environnement de contrôle<\/strong> (engagement de la direction, éthique), <strong>évaluation des risques<\/strong> (cartographie), <strong>activités de contrôle<\/strong> (proportionnées aux risques), <strong>information et communication<\/strong> (procédures, formation, signalement) et <strong>pilotage<\/strong> (évaluation et amélioration continue).<\/p>","ana":"<ul><li>A : le contrôle interne ne repose pas sur une seule personne.<\/li><li>B : un manuel diffusé sans appropriation ni suivi reste lettre morte.<\/li><li>C : le contrôle externe ne remplace pas le contrôle interne ; il intervient après coup.<\/li><\/ul>","piege":"Réduire le contrôle interne à l'une de ses composantes (procédures ou contrôleur).","astuce":"Vérifie que la proposition couvre les cinq composantes du COSO.","regle":"Un contrôle interne efficace est porté par la direction, fondé sur les risques, proportionné, connu de tous et piloté dans la durée."},{"id":"12-1","t":12,"n":1,"lvl":1,"neg":false,"q":"<p>L'<strong>organisation scientifique du travail<\/strong> (OST) de Frederick Taylor repose principalement sur :<\/p>","o":["L'autonomie des équipes et la participation aux décisions","La prise en compte des besoins sociaux et affectifs des travailleurs","La séparation entre la conception et l'exécution, la division du travail en tâches simples et chronométrées, la recherche de la « seule bonne méthode » et la rémunération au rendement","La définition d'objectifs négociés avec chaque salarié"],"a":2,"just":"<p>Au début du XX<sup>e<\/sup> siècle, Taylor cherche à accroître la productivité par une approche « scientifique » : les ingénieurs conçoivent les méthodes (division verticale), le travail est découpé en tâches élémentaires (division horizontale), chronométré, et les ouvriers sont payés au rendement. Ce modèle a augmenté la productivité, mais il a aussi provoqué monotonie, perte de sens et démotivation.<\/p>","ana":"<ul><li>A : l'autonomie et la participation caractérisent des approches beaucoup plus récentes.<\/li><li>B : c'est l'apport de l'école des relations humaines (Mayo).<\/li><li>D : c'est la direction par objectifs (Drucker).<\/li><\/ul>","piege":"Confondre Taylor (organisation du travail de l'atelier) et Fayol (administration de l'ensemble de l'entreprise).","astuce":"Chronométrage, « one best way », division du travail → Taylor.","regle":"Taylor = rationaliser l'exécution ; ses limites humaines ont nourri les modèles suivants."},{"id":"12-2","t":12,"n":2,"lvl":1,"neg":false,"q":"<p>Henri <strong>Fayol<\/strong> a défini cinq fonctions de l'administration (du management). Lesquelles ?<\/p>","o":["Prévoir, organiser, commander, coordonner, contrôler","Planifier, recruter, former, évaluer, licencier","Produire, vendre, acheter, financer, comptabiliser","Motiver, déléguer, écouter, féliciter, sanctionner"],"a":0,"just":"<p>Fayol (1916) a été le premier à décrire le travail du dirigeant à travers ces cinq fonctions (souvent résumées par « POCCC »). Il a aussi formulé 14 principes d'administration, dont l'unité de commandement (un agent ne reçoit d'ordres que d'un seul chef), la division du travail et l'autorité.<\/p>","ana":"<ul><li>B : ce sont des activités de gestion des ressources humaines.<\/li><li>C : ce sont des fonctions de l'entreprise (Fayol en distinguait six : technique, commerciale, financière, de sécurité, comptable et administrative).<\/li><li>D : ce sont des pratiques managériales modernes, pas les fonctions de Fayol.<\/li><\/ul>","piege":"Confondre les cinq fonctions <strong>administratives<\/strong> avec les six fonctions de l'<strong>entreprise<\/strong>.","astuce":"POCCC : Prévoir, Organiser, Commander, Coordonner, Contrôler.","regle":"Fayol fonde l'approche administrative du management : POCCC et unité de commandement."},{"id":"12-3","t":12,"n":3,"lvl":1,"neg":false,"q":"<p>Les expériences menées par Elton Mayo à l'usine Hawthorne (1924-1932) ont surtout montré que :<\/p>","o":["Seule la rémunération influence la productivité","L'éclairage est le principal facteur de productivité","La division du travail doit être poussée au maximum","L'attention portée aux travailleurs, les relations au sein du groupe et le sentiment de reconnaissance influencent fortement la productivité"],"a":3,"just":"<p>Mayo voulait mesurer l'effet de l'éclairage sur la productivité. Il constate que la productivité augmente quelles que soient les conditions, parce que les ouvrières se sentent observées, considérées et forment un groupe soudé. C'est l'<strong>effet Hawthorne<\/strong>, fondateur de l'<strong>école des relations humaines<\/strong>.<\/p>","ana":"<ul><li>A : c'est l'hypothèse taylorienne que Mayo remet en cause.<\/li><li>B : c'était l'hypothèse de départ, démentie par les résultats.<\/li><li>C : c'est le principe taylorien.<\/li><\/ul>","piege":"Retenir l'éclairage (le point de départ de l'expérience) au lieu de la conclusion (le facteur humain).","astuce":"Mayo, Hawthorne → facteur humain, groupe, reconnaissance.","regle":"L'école des relations humaines a introduit le facteur humain et social dans le management."},{"id":"12-4","t":12,"n":4,"lvl":1,"neg":false,"q":"<p>La <strong>direction par objectifs<\/strong> (DPO), formalisée par Peter Drucker, consiste à :<\/p>","o":["Fixer des consignes détaillées sur la manière d'exécuter chaque tâche","Fixer, en concertation avec chaque collaborateur, des objectifs à atteindre, lui laisser une autonomie dans le choix des moyens, puis évaluer les résultats","Supprimer toute évaluation des résultats","Laisser chaque agent définir seul ses objectifs, sans lien avec ceux de l'organisation"],"a":1,"just":"<p>La DPO (années 1950) déplace le contrôle des moyens vers les résultats. Les objectifs de l'organisation sont déclinés en objectifs individuels, discutés avec chacun. Le collaborateur choisit ses méthodes et rend compte de ses résultats. La DPO a inspiré la gestion axée sur les résultats dans le secteur public.<\/p>","ana":"<ul><li>A : c'est une logique taylorienne de contrôle des moyens.<\/li><li>C : l'évaluation des résultats est au cœur de la DPO.<\/li><li>D : les objectifs individuels doivent être cohérents avec ceux de l'organisation.<\/li><\/ul>","piege":"Croire que l'autonomie sur les moyens signifie l'absence de cadre.","astuce":"DPO = objectifs négociés + autonomie sur les moyens + évaluation des résultats.","regle":"On fixe le « quoi » ensemble, on laisse le « comment » au collaborateur, on évalue le résultat."},{"id":"12-5","t":12,"n":5,"lvl":1,"neg":false,"q":"<p>Le <strong>leadership transformationnel<\/strong> (Burns, Bass) se caractérise par :<\/p>","o":["Un échange de récompenses contre l'atteinte d'objectifs précis","Un contrôle étroit et des sanctions en cas d'écart","La capacité à inspirer une vision partagée, à stimuler la réflexion et la créativité des collaborateurs, à porter attention au développement de chacun et à donner l'exemple","L'absence d'intervention du dirigeant"],"a":2,"just":"<p>Bernard Bass décrit le leadership transformationnel par quatre dimensions (les « 4 I ») : l'<strong>influence idéalisée<\/strong> (exemplarité, charisme), la <strong>motivation inspirante<\/strong> (vision mobilisatrice), la <strong>stimulation intellectuelle<\/strong> (encourager la remise en question et l'innovation) et la <strong>considération individualisée<\/strong> (attention au développement de chacun). Il amène les collaborateurs à dépasser leurs intérêts immédiats pour un projet collectif.<\/p>","ana":"<ul><li>A : c'est le leadership <strong>transactionnel<\/strong>.<\/li><li>B : c'est un style autoritaire, centré sur le contrôle.<\/li><li>D : c'est le laisser-faire.<\/li><\/ul>","piege":"Confondre transformationnel (inspirer, transformer) et transactionnel (échanger, récompenser).","astuce":"« Vision », « inspirer », « exemplarité », « développement » → transformationnel. « Récompense contre résultat » → transactionnel.","regle":"Le leader transformationnel donne du sens et fait grandir ; le transactionnel gère un échange."},{"id":"12-6","t":12,"n":6,"lvl":1,"neg":false,"q":"<p>Le <strong>leadership serviteur<\/strong> (servant leadership), décrit par Robert Greenleaf, repose sur l'idée que :<\/p>","o":["Le leader se met au service de son équipe : il l'écoute, lève les obstacles, développe les compétences et favorise l'autonomie de ses membres","Le leader doit obéir aveuglément à ses collaborateurs","Le leader doit servir uniquement ses propres intérêts de carrière","Le leader doit concentrer tout le pouvoir"],"a":0,"just":"<p>Pour Greenleaf, le rôle premier du leader est de servir : aider les membres de l'équipe à réussir, à progresser et à être autonomes. Ce modèle inspire le rôle du Scrum Master et de nombreuses approches managériales actuelles. Il garde un rôle de cadrage et de décision, mais l'exerce au profit du collectif.<\/p>","ana":"<ul><li>B : servir l'équipe ne signifie pas renoncer à son rôle de responsable.<\/li><li>C : c'est l'inverse de l'esprit du modèle.<\/li><li>D : le leader serviteur distribue plutôt l'autonomie.<\/li><\/ul>","piege":"Confondre « être au service de l'équipe » et « faire tout ce que l'équipe demande ».","astuce":"Leader serviteur → écoute, lever les obstacles, développer, autonomie.","regle":"Le leader serviteur réussit par la réussite de son équipe."},{"id":"12-7","t":12,"n":7,"lvl":2,"neg":true,"q":"<p>Selon Daniel Goleman, l'<strong>intelligence émotionnelle<\/strong> d'un manager comprend plusieurs composantes. Laquelle <strong>n'en fait pas partie<\/strong> ?<\/p>","o":["La conscience de soi","La maîtrise de soi","L'empathie","Le quotient intellectuel mesuré par des tests de logique"],"a":3,"just":"<p>Goleman décrit cinq composantes de l'intelligence émotionnelle : la <strong>conscience de soi<\/strong> (connaître ses émotions), la <strong>maîtrise de soi<\/strong> (les réguler), la <strong>motivation<\/strong> (persévérance, énergie), l'<strong>empathie<\/strong> (comprendre les émotions des autres) et les <strong>compétences sociales<\/strong> (communiquer, gérer les conflits, coopérer). Il montre qu'elle contribue fortement à l'efficacité des managers, au-delà des seules capacités intellectuelles.<\/p>","ana":"<p>A, B et C font partie des cinq composantes.<\/p>","piege":"La <strong>négation<\/strong>. Le QI est une forme d'intelligence, mais pas une composante de l'intelligence émotionnelle.","astuce":"Intelligence émotionnelle = soi (conscience, maîtrise, motivation) + les autres (empathie, compétences sociales).","regle":"Un manager efficace sait gérer ses émotions et comprendre celles des autres."},{"id":"12-8","t":12,"n":8,"lvl":2,"neg":false,"q":"<p>Quelle affirmation concernant le modèle de l'<strong>« entreprise libérée »<\/strong> (Isaac Getz) est la plus juste ?<\/p>","o":["Il consiste à supprimer toute règle et tout objectif","Il repose sur la confiance et la liberté laissée aux salariés de décider des actions qu'ils jugent les meilleures, avec une réduction des échelons hiérarchiques ; sa transposition dans l'administration est limitée par le cadre juridique (hiérarchie statutaire, responsabilité, principe de légalité)","Il impose un contrôle renforcé de chaque salarié","Il s'applique obligatoirement à toutes les administrations publiques"],"a":1,"just":"<p>L'entreprise libérée cherche à libérer l'initiative en supprimant les contrôles inutiles et en responsabilisant les équipes. Le manager devient un facilitateur. Dans l'administration, les règles de légalité, de responsabilité et l'organisation hiérarchique statutaire limitent une transposition complète, mais certains principes (confiance, autonomie, suppression des validations inutiles) peuvent inspirer les pratiques.<\/p>","ana":"<ul><li>A : le modèle maintient une vision et des objectifs partagés.<\/li><li>C : c'est l'inverse du modèle.<\/li><li>D : aucune obligation de ce type n'existe.<\/li><\/ul>","piege":"Croire qu'un modèle du privé se transpose tel quel dans le public, ou au contraire qu'il n'a rien à apporter.","astuce":"Pour les modèles managériaux récents, la bonne réponse indique souvent leur principe <strong>et<\/strong> leurs limites dans le secteur public.","regle":"S'inspirer des modèles innovants en les adaptant au cadre juridique du service public."},{"id":"12-9","t":12,"n":9,"lvl":2,"neg":false,"q":"<p>L'<strong>holacratie<\/strong> est un mode d'organisation qui :<\/p>","o":["Concentre toutes les décisions entre les mains du directeur général","Supprime toute forme de règle et de processus","Distribue l'autorité entre des rôles et des cercles autonomes, selon des règles de gouvernance formalisées (notamment la prise de décision par consentement)","Repose sur l'ancienneté des membres pour attribuer le pouvoir"],"a":2,"just":"<p>L'holacratie, développée par Brian Robertson, remplace la hiérarchie traditionnelle par des <strong>rôles<\/strong> (avec des responsabilités définies) regroupés en <strong>cercles<\/strong>. Les décisions suivent des processus précis, souvent fondés sur le consentement (absence d'objection argumentée). Elle s'inspire de la sociocratie.<\/p>","ana":"<ul><li>A : c'est une organisation centralisée.<\/li><li>B : au contraire, l'holacratie repose sur des règles très formalisées (une « constitution »).<\/li><li>D : l'ancienneté ne joue aucun rôle dans l'attribution des rôles.<\/li><\/ul>","piege":"Croire que les organisations « sans chef » fonctionnent sans règles. Elles en ont souvent davantage.","astuce":"Holacratie → rôles, cercles, consentement, gouvernance distribuée.","regle":"Moins de hiérarchie ne signifie pas moins de règles."},{"id":"12-10","t":12,"n":10,"lvl":2,"neg":false,"q":"<p>Un responsable annonce à son équipe : « Si le délai moyen de traitement descend sous 10 jours ce trimestre, l'équipe bénéficiera d'une journée de récupération supplémentaire. » Quel style de leadership illustre ce mécanisme ?<\/p>","o":["Le leadership transactionnel","Le leadership transformationnel","Le laisser-faire","Le leadership charismatique"],"a":0,"just":"<p>Le leadership transactionnel repose sur un <strong>échange<\/strong> : le leader fixe des objectifs clairs et attribue des récompenses (ou des corrections) selon les résultats. Il est efficace pour des objectifs précis à court terme, mais mobilise moins l'engagement profond que le leadership transformationnel. Les deux sont souvent complémentaires.<\/p>","ana":"<ul><li>B : aucune vision inspirante ni développement personnel n'est en jeu ici.<\/li><li>C : le responsable intervient et fixe un objectif.<\/li><li>D : le charisme concerne la personnalité du leader et sa capacité d'entraînement, pas un mécanisme de récompense.<\/li><\/ul>","piege":"Considérer le transactionnel comme « mauvais ». Il est utile, mais insuffisant à lui seul.","astuce":"« Si… alors récompense » → transactionnel.","regle":"Transactionnel = échange résultats/récompenses ; transformationnel = engagement par le sens."},{"id":"12-11","t":12,"n":11,"lvl":2,"neg":false,"q":"<p>Une administration lance une démarche qui agit à la fois sur les conditions de travail, l'équilibre entre vie professionnelle et vie personnelle, le sens du travail, le dialogue au sein des équipes et la prévention des risques psychosociaux, avec l'objectif d'améliorer conjointement le bien-être des agents et la qualité du service. De quelle démarche s'agit-il ?<\/p>","o":["L'organisation scientifique du travail","La direction par objectifs","Le contrôle de gestion","La qualité de vie et des conditions de travail (QVCT)"],"a":3,"just":"<p>La QVCT (anciennement QVT) considère que la santé et le bien-être des agents et la performance de l'organisation se renforcent mutuellement. Elle porte sur le contenu du travail, l'organisation, les relations, l'équilibre des temps de vie, les conditions matérielles et la prévention des risques psychosociaux (stress, épuisement professionnel).<\/p>","ana":"<ul><li>A : l'OST vise la productivité, sans prise en compte du bien-être.<\/li><li>B : la DPO porte sur les objectifs et les résultats.<\/li><li>C : le contrôle de gestion pilote la performance économique.<\/li><\/ul>","piege":"Réduire la QVCT à des avantages matériels (salle de repos, activités). Elle porte d'abord sur l'organisation et le contenu du travail.","astuce":"Bien-être + performance + organisation du travail + risques psychosociaux → QVCT.","regle":"Prendre soin des agents, c'est aussi améliorer le service rendu."},{"id":"12-12","t":12,"n":12,"lvl":2,"neg":false,"q":"<p>Avec le développement du travail hybride, comment le mode de management doit-il évoluer pour rester efficace ?<\/p>","o":["En renforçant le contrôle du temps de présence devant l'écran","En passant d'un management fondé sur la présence et le contrôle du temps à un management fondé sur des objectifs clairs, la confiance, des rituels d'équipe et l'attention aux personnes","En supprimant les réunions d'équipe","En évitant de fixer des objectifs pour ne pas mettre de pression"],"a":1,"just":"<p>À distance, le manager ne peut plus « voir » le travail. Il doit donc piloter par les résultats (objectifs clairs, points de suivi), entretenir la confiance, organiser des rituels pour maintenir la cohésion et rester attentif aux signes d'isolement ou de surcharge.<\/p>","ana":"<ul><li>A : surveiller la présence à l'écran crée de la défiance et ne mesure pas le travail réel.<\/li><li>C : les réunions d'équipe sont encore plus nécessaires à distance pour maintenir le lien.<\/li><li>D : sans objectifs, l'équipe perd ses repères.<\/li><\/ul>","piege":"Transposer à distance le contrôle de présence du bureau.","astuce":"Management à distance → résultats + confiance + lien.","regle":"À distance, on manage le résultat et la relation, pas la présence."},{"id":"12-13","t":12,"n":13,"lvl":2,"neg":false,"q":"<p>Un chef de service anime une équipe très diverse (âges, parcours, régions d'origine, situations de handicap). Quelle pratique relève d'un <strong>management inclusif<\/strong> ?<\/p>","o":["Uniformiser les comportements en demandant à chacun de se conformer au profil majoritaire","Éviter d'aborder la question de la diversité pour ne froisser personne","Garantir des règles équitables et transparentes, lutter contre les stéréotypes, adapter le poste lorsque c'est nécessaire et valoriser la complémentarité des profils","Constituer des sous-groupes homogènes qui ne travaillent pas ensemble"],"a":2,"just":"<p>Le management inclusif permet à chacun de contribuer pleinement, quelles que soient ses différences. Il repose sur l'égalité de traitement (principe constitutionnel et statutaire), la non-discrimination, l'adaptation raisonnable (par exemple pour une situation de handicap) et la reconnaissance de la diversité comme une richesse pour l'équipe et pour le service rendu à des usagers eux-mêmes divers.<\/p>","ana":"<ul><li>A : l'uniformisation exclut ceux qui ne correspondent pas au profil dominant.<\/li><li>B : le silence laisse prospérer les stéréotypes et les inégalités.<\/li><li>D : séparer les profils empêche la complémentarité.<\/li><\/ul>","piege":"Confondre égalité (mêmes droits pour tous) et uniformité (tout le monde pareil).","astuce":"Management inclusif → équité, non-discrimination, adaptation, complémentarité.","regle":"Inclure, c'est permettre à chacun de contribuer avec ses différences, dans un cadre équitable."},{"id":"12-14","t":12,"n":14,"lvl":3,"neg":false,"q":"<p>Quel enseignement principal peut-on tirer de l'évolution des théories du management, de Taylor aux approches actuelles ?<\/p>","o":["Il n'existe pas de modèle universel : le management efficace s'adapte au contexte, aux missions, aux personnes et à l'environnement (approche de la contingence)","Le modèle taylorien reste le seul efficace","Les modèles les plus récents rendent tous les précédents inutiles","Le management efficace consiste à appliquer strictement un seul modèle, quel que soit le contexte"],"a":0,"just":"<p>Les théories de la <strong>contingence<\/strong> (Lawrence et Lorsch, Woodward, et en management des personnes Hersey et Blanchard) montrent que la bonne organisation et le bon style dépendent de la situation : stabilité ou incertitude de l'environnement, nature des tâches, maturité des équipes. Les approches modernes combinent les apports des différentes écoles plutôt que d'en appliquer une seule.<\/p>","ana":"<ul><li>B : le taylorisme a montré ses limites humaines et son manque d'adaptabilité.<\/li><li>C : chaque école a laissé des apports durables (rigueur de Fayol, facteur humain de Mayo, objectifs de Drucker).<\/li><li>D : c'est la négation même de la contingence.<\/li><\/ul>","piege":"Croire que « moderne » signifie forcément « meilleur dans tous les cas ».","astuce":"Quand une question porte sur « le meilleur modèle », la réponse est souvent « cela dépend du contexte ».","regle":"Le management efficace est contingent et intégrateur."},{"id":"12-15","t":12,"n":15,"lvl":3,"neg":false,"q":"<p>Dans une direction, chaque décision mineure doit passer par cinq niveaux de validation. Les délais sont longs et les agents se sentent déresponsabilisés. Le nouveau directeur veut moderniser le management. Quelle approche est la plus adaptée au contexte public ?<\/p>","o":["Supprimer toutes les règles et laisser chacun décider librement","Ajouter un sixième niveau de validation pour sécuriser les décisions","Conserver le fonctionnement actuel, car il garantit la légalité","Clarifier les objectifs, déléguer les décisions courantes dans un cadre défini (délégations de signature, seuils), passer à un contrôle a posteriori pour les décisions à faible risque et accompagner les agents dans cette autonomie"],"a":3,"just":"<p>Moderniser le management public consiste à concilier <strong>autonomie<\/strong> et <strong>légalité<\/strong>. Les délégations de signature et les seuils permettent de rapprocher la décision du terrain tout en respectant le droit ; le contrôle a posteriori allège les circuits pour les décisions à faible risque ; l'accompagnement aide les agents à assumer leurs nouvelles responsabilités.<\/p>","ana":"<ul><li>A : supprimer toutes les règles est incompatible avec le principe de légalité.<\/li><li>B : alourdir encore les circuits aggrave le problème.<\/li><li>C : la légalité peut être garantie sans circuits aussi lourds.<\/li><\/ul>","piege":"Opposer modernisation et légalité.","astuce":"La bonne réponse concilie confiance et cadre : « déléguer dans un cadre défini ».","regle":"Le management moderne public = autonomie encadrée, contrôle proportionné au risque."},{"id":"12-16","t":12,"n":16,"lvl":3,"neg":false,"q":"<p>Un agent vient voir son chef de service avec un problème complexe. Au lieu de lui donner immédiatement la solution, le chef lui pose des questions pour l'aider à analyser la situation, à envisager des options et à choisir lui-même une solution. Quelle posture managériale adopte-t-il ?<\/p>","o":["Le management directif","Le management coach (ou posture de coaching)","Le laisser-faire","Le management autoritaire"],"a":1,"just":"<p>Le manager coach aide ses collaborateurs à trouver leurs propres solutions par le questionnement, l'écoute et le feedback. Cette posture développe l'autonomie, la confiance en soi et les compétences. Elle convient à des collaborateurs qui ont les ressources pour trouver la réponse ; face à une urgence ou à un débutant, une posture plus directive peut être nécessaire.<\/p>","ana":"<ul><li>A : le manager directif aurait donné la solution et les consignes.<\/li><li>C : le manager s'implique activement ; il ne laisse pas l'agent seul.<\/li><li>D : aucune solution n'est imposée.<\/li><\/ul>","piege":"Confondre coaching (accompagnement actif par le questionnement) et laisser-faire (absence d'implication).","astuce":"Questions plutôt que réponses + développement de l'autonomie → coaching.","regle":"Le manager coach fait grandir en aidant l'autre à trouver ses propres réponses."},{"id":"12-17","t":12,"n":17,"lvl":3,"neg":false,"q":"<p>Une cheffe de service exige de ses agents ponctualité et respect strict des procédures, mais elle arrive régulièrement en retard et contourne elle-même certaines règles. Quelle conséquence est la plus probable ?<\/p>","o":["Une hausse de l'engagement des agents","Aucun effet, car les agents doivent obéir quoi qu'il arrive","Une perte de crédibilité et de légitimité de la cheffe, qui affaiblit l'adhésion aux règles et la confiance au sein de l'équipe","Une amélioration de la qualité du service"],"a":2,"just":"<p>L'<strong>exemplarité<\/strong> est l'un des fondements du leadership actuel, en particulier dans le service public, où l'éthique, l'intégrité et le respect des règles sont des valeurs centrales (Constitution, Charte des services publics). Un manager qui n'applique pas ce qu'il exige perd sa légitimité : les agents respectent moins les règles et la confiance se dégrade.<\/p>","ana":"<ul><li>A : l'incohérence entre discours et actes démobilise.<\/li><li>B : l'obéissance formelle ne garantit ni l'engagement ni le respect réel des règles.<\/li><li>D : la dégradation du climat nuit plutôt à la qualité du service.<\/li><\/ul>","piege":"Croire que l'autorité statutaire suffit à garantir le respect des règles.","astuce":"Incohérence entre ce que le manager dit et ce qu'il fait → perte de crédibilité.","regle":"On ne peut exiger des autres que ce que l'on s'applique à soi-même."},{"id":"12-18","t":12,"n":18,"lvl":3,"neg":false,"q":"<p>Une équipe tient chaque matin un point de 15 minutes debout, utilise un tableau visuel où les tâches passent de « à faire » à « en cours » puis « terminé », et consacre une réunion toutes les deux semaines à analyser ce qui peut être amélioré dans son fonctionnement. Quel mode de management cette équipe applique-t-elle ?<\/p>","o":["Un management agile (rituels courts, visualisation du travail, rétrospectives, amélioration continue)","Un management taylorien","Une bureaucratie mécaniste","Le laisser-faire"],"a":0,"just":"<p>Les pratiques décrites sont typiques de l'agilité : la <strong>mêlée quotidienne<\/strong> (point court de synchronisation), le <strong>tableau kanban<\/strong> (visualisation du flux de travail) et la <strong>rétrospective<\/strong> (réflexion régulière de l'équipe sur ses pratiques pour s'améliorer). Elles favorisent la transparence, l'autonomie et l'amélioration continue.<\/p>","ana":"<ul><li>B : le taylorisme sépare conception et exécution ; ici, l'équipe s'organise et améliore elle-même ses pratiques.<\/li><li>C : la bureaucratie mécaniste repose sur des procédures standardisées et une forte hiérarchie.<\/li><li>D : l'équipe est organisée et structurée par des rituels.<\/li><\/ul>","piege":"Croire que l'agilité est réservée aux projets informatiques. Ses pratiques s'appliquent à de nombreux services.","astuce":"Point quotidien, tableau kanban, rétrospective → agile.","regle":"L'agilité managériale = rituels courts, transparence, autonomie, amélioration continue."},{"id":"12-19","t":12,"n":19,"lvl":3,"neg":false,"q":"<p>Un manager qui se veut « bienveillant » ne fait jamais de remarque à un agent dont le travail comporte des erreurs répétées qui pénalisent les usagers et surchargent ses collègues. Quelle analyse est la plus juste ?<\/p>","o":["C'est un exemple de management bienveillant réussi","Le manager a raison, car toute remarque est une forme de violence","Le manager doit sanctionner immédiatement l'agent sans échange","C'est une confusion entre bienveillance et complaisance : la bienveillance associe l'attention à la personne et l'exigence sur le travail ; elle implique de faire des retours clairs et respectueux, et d'aider l'agent à progresser"],"a":3,"just":"<p>Le management bienveillant ne signifie pas l'absence d'exigence. Être bienveillant, c'est vouloir le bien de la personne et de l'équipe : dire les choses avec respect, s'appuyer sur des faits, proposer un accompagnement. Ne rien dire laisse l'agent dans l'erreur, pénalise les usagers et crée un sentiment d'injustice chez les collègues.<\/p>","ana":"<ul><li>A : l'absence de retour n'est pas de la bienveillance.<\/li><li>B : un retour respectueux et factuel n'est pas une violence ; c'est une aide.<\/li><li>C : sanctionner sans échange est l'excès inverse.<\/li><\/ul>","piege":"Croire que bienveillance et exigence s'opposent.","astuce":"Bienveillance = exigence + respect + accompagnement ; complaisance = laisser faire pour éviter le conflit.","regle":"Bienveillant avec la personne, exigeant sur le travail."},{"id":"12-20","t":12,"n":20,"lvl":3,"neg":false,"q":"<p>Quel profil décrit le mieux le <strong>manager public efficace<\/strong> aujourd'hui ?<\/p>","o":["Un manager qui contrôle étroitement chaque tâche et prend seul toutes les décisions","Un manager qui donne du sens et une vision, adapte son style aux situations et aux personnes, fixe des objectifs clairs et fait confiance, associe son équipe, développe les compétences, veille à la qualité de vie au travail, se montre exemplaire et pilote les résultats dans le respect de la légalité et des valeurs du service public","Un manager qui laisse chacun travailler comme il l'entend, sans objectifs","Un manager qui applique strictement un seul modèle de management, quelle que soit la situation"],"a":1,"just":"<p>Cette réponse fait la synthèse des évolutions du management : la rigueur et le pilotage (Fayol, Drucker), le facteur humain (Mayo), la contingence (Hersey et Blanchard), le leadership transformationnel et serviteur, l'agilité, la QVCT, l'exemplarité éthique. Dans le secteur public, ces pratiques s'exercent dans le cadre de la légalité et au service de l'intérêt général.<\/p>","ana":"<ul><li>A : c'est un management autoritaire et centralisé, inadapté aux enjeux actuels.<\/li><li>C : c'est le laisser-faire.<\/li><li>D : c'est la négation de la contingence.<\/li><\/ul>","piege":"Choisir une réponse centrée sur un seul aspect (contrôle, liberté, modèle unique).","astuce":"Pour une question de synthèse, la bonne réponse est la plus complète et la plus équilibrée.","regle":"Le manager efficace d'aujourd'hui donne du sens, s'adapte, fait confiance, développe, prend soin, montre l'exemple et obtient des résultats."}]};
const Q = Object.fromEntries(DATA.questions.map(q => [q.id, q]));
const TH = Object.fromEntries(DATA.themes.map(t => [t.id, t]));
const byTheme = t => DATA.questions.filter(q => q.t === t);
const GRADES = [
  { n: "Stagiaire", xp: 0 }, { n: "Agent titulaire", xp: 15 }, { n: "Rédacteur", xp: 40 },
  { n: "Administrateur", xp: 80 }, { n: "Chef de service", xp: 130 }, { n: "Chef de division", xp: 190 },
  { n: "Directeur", xp: 260 }, { n: "Secrétaire général", xp: 350 }
];
const BADGES = [
  { id: "premier", ico: "1er", name: "Premier visa", desc: "Réussir sa première question" },
  { id: "serie5", ico: "×5", name: "Série de 5", desc: "5 bonnes réponses d'affilée" },
  { id: "serie10", ico: "×10", name: "Série de 10", desc: "10 bonnes réponses d'affilée" },
  { id: "sansfaute", ico: "20", name: "Sans faute", desc: "20/20 sur un parcours" },
  { id: "sansjoker", ico: "SF", name: "Sans filet", desc: "14/20 ou plus sur un parcours, sans joker" },
  { id: "terrain", ico: "N3", name: "Expert terrain", desc: "Réussir 25 mises en situation (niveau 3)" },
  { id: "chrono", ico: "45s", name: "Rapide et juste", desc: "8/10 ou plus en contre la montre" },
  { id: "survie", ico: "15", name: "Increvable", desc: "15 bonnes réponses en mode survie" },
  { id: "rattrapage", ico: "R", name: "Rattrapage réussi", desc: "Corriger 10 erreurs du carnet" },
  { id: "centurion", ico: "100", name: "Cent dossiers", desc: "Répondre à 100 questions" },
  { id: "explorateur", ico: "12", name: "Tour des services", desc: "Terminer un parcours dans les 12 thèmes" },
  { id: "major", ico: "M", name: "Major de promotion", desc: "3 étoiles dans les 12 thèmes" }
];
const LVL = ["Niveau 1 · connaissances", "Niveau 2 · notions proches", "Niveau 3 · mise en situation"];
const MODES = {
  parcours: "Parcours", entrainement: "Entraînement rapide", chrono: "Contre la montre",
  survie: "Survie", carnet: "Carnet d'erreurs"
};
const CHRONO_S = 45;
const KEY = "grade-par-grade-v2";
const ALL = DATA.themes.map(t => t.id);
const blank = () => ({ xp: 0, stars: {}, best: {}, done: {}, errors: {}, fixed: 0, answered: 0, correct: 0, bestStreak: 0, lvl3: 0, badges: {}, sel: ALL.slice() });

function load() {
  try { const r = localStorage.getItem(KEY); if (r) return Object.assign(blank(), JSON.parse(r)); } catch (e) {}
  return blank();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} }

let P = load();
let VIEW = "home", S = null, eclair = null, timerId = null, briefT = null, confirmReset = false;

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const fmt = n => n.toLocaleString("fr-FR");
const signed = n => (n > 0 ? "+" : n < 0 ? "−" : "") + fmt(Math.abs(n));
const selLabel = a => a.length === ALL.length ? "Tous les thèmes" : a.length === 1 ? `Thème ${pad(a[0])} · ${TH[a[0]].short}` : `${a.length} thèmes mélangés`;
const poolOf = a => DATA.questions.filter(q => a.includes(q.t));
const errorsOf = a => Object.keys(P.errors).filter(id => Q[id] && a.includes(Q[id].t));
const gradeIdx = xp => GRADES.reduce((k, g, i) => (xp >= g.xp ? i : k), 0);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const stars = (s, cls = "stars") => `<span class="${cls}" aria-label="${s} étoile${s > 1 ? "s" : ""} sur 3">${[1, 2, 3].map(k => `<span class="${k <= s ? "f" : ""}">★</span>`).join("")}</span>`;
const dossier = q => `Dossier T${pad(q.t)}-Q${pad(q.n)}`;

/* ---------- En-tête ---------- */
function header() {
  const gi = gradeIdx(P.xp), g = GRADES[gi], nx = GRADES[gi + 1];
  const pct = nx ? Math.round((P.xp - g.xp) / (nx.xp - g.xp) * 100) : 100;
  $("#hdr-grade").textContent = g.n;
  $("#hdr-next").textContent = nx ? `${fmt(P.xp)} pts · ${fmt(nx.xp - P.xp)} avant ${nx.n}` : `${fmt(P.xp)} pts · grade maximal`;
  $("#hdr-fill").style.width = pct + "%";
  $("#hdr-meter").setAttribute("aria-valuenow", pct);
}

/* ---------- Propositions ---------- */
function optsHtml(q, choice, elim, act) {
  const answered = choice !== null;
  return q.o.map((o, i) => {
    let cls = "opt";
    if (answered) {
      if (i === q.a) cls += " correct";
      else if (i === choice) cls += " wrong";
      else cls += " dim";
    } else if (elim.includes(i)) cls += " out";
    const dis = answered || elim.includes(i) ? "disabled" : "";
    return `<button class="${cls}" data-act="${act}" data-i="${i}" ${dis}><span class="l">${"ABCD"[i]}</span><span>${o}</span></button>`;
  }).join("");
}

/* ---------- Accueil ---------- */
function viewHome() {
  const gi = gradeIdx(P.xp);
  const sel = P.sel, one = sel.length === 1, allSel = sel.length === ALL.length;
  const nErr = errorsOf(sel).length;
  const ladder = GRADES.map((g, i) => `<span class="${i < gi ? "on" : i === gi ? "here" : ""}" style="height:${10 + i * 5}px"></span>`).join("");
  const chips = DATA.themes.map(t => {
    const on = !allSel && sel.includes(t.id);
    return `<button class="chip ${on ? "on" : ""}" data-act="sel" data-t="${t.id}" aria-pressed="${on}"><span class="n">${pad(t.id)}</span>${t.short}</button>`;
  }).join("");
  const themes = DATA.themes.map(t => {
    const s = P.stars[t.id] || 0;
    const meta = P.best[t.id] ? `Meilleur score : ${fmt(P.best[t.id])} / 20` : "20 dossiers";
    return `<button class="theme" data-act="brief" data-t="${t.id}">
      <span class="t-num">THÈME ${pad(t.id)}</span><span class="t-name">${t.short}</span>${stars(s)}<span class="t-meta">${meta}</span></button>`;
  }).join("");
  return `
  <section class="hero">
    <p class="eyebrow">Examen d'aptitude professionnelle · 12 thèmes · 240 dossiers</p>
    <h1>Grade <em>par</em> grade</h1>
    <p class="lede">Bonne réponse : +1 point. Réponse fausse : −1 point. Lis la correction après chaque question et monte en grade, de stagiaire à secrétaire général.</p>
    <div class="ladder" aria-hidden="true">${ladder}</div>
    <div class="ladder-cap"><span>Ton grade : <b>${GRADES[gi].n}</b></span><span>${GRADES[gi + 1] ? "Prochain : " + GRADES[gi + 1].n + " à " + GRADES[gi + 1].xp + " pts" : "Sommet atteint"}</span></div>
  </section>
  <section class="card setup" aria-label="Préparer une partie">
    <div class="step">
      <h2 class="sec"><span class="step-n">1</span>Choisis le thème</h2>
      <p class="sec-sub">Un seul thème pour réviser une notion précise, plusieurs pour les mélanger, ou tous.</p>
      <div class="chips">
        <button class="chip all ${allSel ? "on" : ""}" data-act="sel-all" aria-pressed="${allSel}">Mélange de tous les thèmes</button>
        ${chips}
      </div>
      <p class="sel-sum"><b>${selLabel(sel)}</b> · ${poolOf(sel).length} questions disponibles${one ? ` · <button class="linkish" data-act="brief" data-t="${sel[0]}">Lire le briefing du thème</button>` : ""}</p>
    </div>
    <div class="step">
      <h2 class="sec"><span class="step-n">2</span>Choisis le mode</h2>
      <div class="modes">
        <button class="mode" data-act="start" data-m="parcours"><span class="count">20 questions</span><h3>Parcours</h3><p>${one ? "Les 20 questions du thème, de la plus facile à la plus difficile. Étoiles à gagner." : "20 questions tirées dans ta sélection, de la plus facile à la plus difficile."}</p></button>
        <button class="mode" data-act="start" data-m="entrainement"><span class="count">10 questions</span><h3>Entraînement rapide</h3><p>10 questions au hasard dans ta sélection.</p></button>
        <button class="mode" data-act="start" data-m="chrono"><span class="count">10 questions · ${CHRONO_S} s</span><h3>Contre la montre</h3><p>${CHRONO_S} secondes par question. Temps écoulé : −1 point.</p></button>
        <button class="mode" data-act="start" data-m="survie"><span class="count">3 vies</span><h3>Survie</h3><p>Questions de ta sélection jusqu'à la troisième erreur.</p></button>
        <button class="mode" data-act="start" data-m="carnet" ${nErr ? "" : "disabled"}><span class="count">${nErr} à revoir</span><h3>Carnet d'erreurs</h3><p>${nErr ? "Rejoue les questions ratées de ta sélection." : "Aucune erreur dans cette sélection pour l'instant."}</p></button>
      </div>
    </div>
  </section>
  <section class="card" id="eclair" aria-label="Question éclair"></section>
  <section>
    <h2 class="sec">Ta progression par thème</h2>
    <p class="sec-sub">Parcours d'un thème : 1 étoile dès 10 bonnes réponses, 2 dès 14, 3 dès 18. Touche un thème pour lire son briefing.</p>
    <div class="themes">${themes}</div>
  </section>`;
}

function renderEclair() {
  const el = $("#eclair"); if (!el) return;
  if (eclair && !P.sel.includes(Q[eclair.id].t) && eclair.choice === null) eclair = null;
  if (!eclair) { const pool = DATA.questions.filter(q => q.lvl < 3 && P.sel.includes(q.t)); eclair = { id: shuffle(pool.length ? pool : DATA.questions)[0].id, choice: null }; }
  const q = Q[eclair.id], ans = eclair.choice !== null, ok = eclair.choice === q.a;
  el.innerHTML = `
    <div class="ec-head"><p class="eyebrow">Question éclair · +1 / −1</p><span class="tag">Thème ${pad(q.t)} · ${TH[q.t].short}</span></div>
    <div class="prompt">${q.q}</div>
    <div class="opts" style="margin-top:14px">${optsHtml(q, ans ? eclair.choice : null, [], "pick-ec")}</div>
    ${ans ? `<div class="ec-fb">
      <p class="verdict ${ok ? "ok" : "bad"}">${ok ? "Bonne réponse : +1 point." : `Réponse fausse : −1 point. La bonne réponse est ${"ABCD"[q.a]}.`}</p>
      <div class="fb-block"><h4>Justification</h4>${q.just}</div>
      <div class="fb-block rule"><h4>Règle à retenir</h4><p>${q.regle}</p></div>
      <div class="actions"><button class="btn primary" data-act="eclair-next">Une autre question</button><button class="btn ghost" data-act="brief" data-t="${q.t}">Jouer le thème ${q.t}</button></div>
    </div>` : ""}`;
}

/* ---------- Briefing de thème ---------- */
function viewBrief() {
  const t = TH[briefT], s = P.stars[t.id] || 0;
  return `
  <section class="brief">
    <p class="eyebrow">Thème ${pad(t.id)} · briefing avant le parcours</p>
    <h1>${t.title}</h1>
    <p class="lede">Lis ces repères avant de commencer : ils t'aideront à reconnaître vite les bonnes réponses. ${s ? "Ton meilleur résultat : " + stars(s) : ""}</p>
  </section>
  <div class="brief-grid">
    <section class="card"><h3>Mots-clés et indices</h3><ul>${t.keys.map(k => `<li>${k}</li>`).join("")}</ul></section>
    <section class="card"><h3>Pièges à connaître</h3><ol>${t.traps.map(k => `<li>${k}</li>`).join("")}</ol></section>
  </div>
  <div class="actions">
    <button class="btn primary" data-act="start" data-m="parcours" data-t="${t.id}">Commencer le parcours · 20 questions</button>
    <button class="btn" data-act="start" data-m="entrainement" data-t="${t.id}">Entraînement rapide · 10 au hasard</button>
    <button class="btn ghost" data-act="home">Retour</button>
  </div>`;
}

/* ---------- Partie ---------- */
function startSession(mode, themes) {
  themes = (themes && themes.length ? themes : ALL).slice().sort((a, b) => a - b);
  const one = themes.length === 1 ? themes[0] : null;
  const pool = poolOf(themes).map(q => q.id);
  let ids, jk = { f: 1, h: 1 };
  if (mode === "parcours") {
    ids = one ? pool : shuffle(pool).slice(0, 20).sort((a, b) => Q[a].lvl - Q[b].lvl);
    jk = { f: 2, h: 2 };
  }
  else if (mode === "entrainement" || mode === "chrono") ids = shuffle(pool).slice(0, 10);
  else if (mode === "survie") ids = shuffle(pool);
  else ids = shuffle(errorsOf(themes)).slice(0, 20);
  if (!ids.length) { toast("Rien à jouer", "Aucune question ne correspond à cette sélection."); return; }
  S = { mode, t: one, themes, ids, i: 0, score: 0, streak: 0, best: 0, correct: 0, answered: 0, missed: [], lives: 3,
        jk, usedAny: false, usedQ: false, choice: null, elim: [], hint: false, pts: 0,
        startXp: P.xp, startGrade: gradeIdx(P.xp), timeLeft: CHRONO_S };
  VIEW = "quiz";
  if (mode === "chrono") startTimer(CHRONO_S);
  render(); window.scrollTo(0, 0);
}

function viewQuiz() {
  const q = Q[S.ids[S.i]], ans = S.choice !== null, ok = ans && S.choice === q.a;
  const total = S.mode === "survie" ? null : S.ids.length;
  const pct = total ? Math.round((S.i + (ans ? 1 : 0)) / total * 100) : 0;
  const right = S.mode === "chrono"
    ? `<div class="timer ${S.timeLeft <= 10 ? "low" : ""}" id="timer" style="--p:${S.timeLeft / CHRONO_S}" aria-label="Temps restant"><span id="timer-t">${Math.ceil(S.timeLeft)} s</span></div>`
    : S.mode === "survie"
      ? `<div class="stat"><small>Vies</small><span class="lives">${[0, 1, 2].map(k => `<i class="${k < S.lives ? "" : "off"}"></i>`).join("")}</span></div>`
      : "";
  const last = S.mode === "survie" ? (S.lives <= 0 || S.i + 1 >= S.ids.length) : S.i + 1 >= S.ids.length;
  let verdict = "";
  if (ans) {
    if (ok) verdict = `Validé : +1 point${S.streak >= 2 ? ` (série de ${S.streak})` : ""}.`;
    else if (S.choice === -1) verdict = `Temps écoulé : −1 point. La bonne réponse est ${"ABCD"[q.a]}.`;
    else verdict = `À revoir : −1 point. La bonne réponse est ${"ABCD"[q.a]}. La question rejoint ton carnet d'erreurs.`;
  }
  return `
  <div class="q-top">
    <div><p class="eyebrow">${MODES[S.mode]} · ${selLabel(S.themes)}</p>
      <b style="font-family:var(--f-display);font-stretch:85%;font-size:1.2rem">Question ${S.i + 1}${total ? " / " + total : ""}</b></div>
    <div class="q-stats">
      <div class="stat"><small>Points</small><b>${signed(S.score)}</b></div>
      <div class="stat ${S.streak >= 3 ? "hot" : ""}"><small>Série</small><b>×${S.streak}</b></div>
      ${right}
    </div>
  </div>
  ${total ? `<div class="progress" aria-hidden="true"><i style="width:${pct}%"></i></div>` : ""}
  <article class="card qcard ${ans ? "done" : ""}">
    ${ans ? `<div class="stamp ${ok ? "ok" : "bad"}">${ok ? "Validé" : "À revoir"}</div>` : ""}
    <div class="qmeta"><span class="code">${dossier(q)}</span><span class="tag">${LVL[q.lvl - 1]}</span>${!S.t ? `<span class="tag seal">${TH[q.t].short}</span>` : ""}</div>
    <div class="prompt">${q.q}</div>
    ${S.hint && !ans ? `<div class="hint"><b>Indice · </b>${q.astuce}</div>` : ""}
    <div class="opts" role="group" aria-label="Propositions">${optsHtml(q, ans ? S.choice : null, S.elim, "pick")}</div>
    ${!ans ? `<div class="jokers">
      <button class="joker" data-act="fifty" ${S.jk.f > 0 && !S.elim.length ? "" : "disabled"}>50/50 · ${S.jk.f}</button>
      <button class="joker" data-act="hint" ${S.jk.h > 0 && !S.hint ? "" : "disabled"}>Indice · ${S.jk.h}</button>
      <span class="kbd">Touches A à D pour répondre</span></div>` : ""}
    ${ans ? `<div class="fb">
      <p class="verdict ${ok ? "ok" : "bad"}" role="status">${verdict}</p>
      <div class="fb-block"><h4>Justification</h4>${q.just}</div>
      <div class="fb-block trap"><h4>Piège à éviter</h4><p>${q.piege}</p></div>
      <div class="fb-block tip"><h4>Astuce d'examen</h4><p>${q.astuce}</p></div>
      <div class="fb-block rule"><h4>Règle à retenir</h4><p>${q.regle}</p></div>
      <details class="ana"><summary>Pourquoi les autres choix sont faux</summary>${q.ana}</details>
      <div class="actions"><button class="btn primary" data-act="next" id="next-btn">${last ? "Voir le bilan" : "Question suivante"}</button>
        <button class="btn ghost" data-act="quit">Arrêter la partie</button><span class="kbd">Entrée pour continuer</span></div>
    </div>` : ""}
  </article>`;
}

function answer(i) {
  if (!S || S.choice !== null) return;
  stopTimer();
  const q = Q[S.ids[S.i]], ok = i === q.a;
  S.choice = i; S.answered++; P.answered++;
  const pts = ok ? 1 : -1;
  if (ok) {
    S.streak++; S.correct++; P.correct++; S.best = Math.max(S.best, S.streak);
    if (q.lvl === 3) P.lvl3++;
    if (P.errors[q.id]) { delete P.errors[q.id]; P.fixed++; }
  } else {
    S.streak = 0; P.errors[q.id] = 1; S.missed.push(q.id);
    if (S.mode === "survie") S.lives--;
  }
  S.pts = pts; S.score += pts; P.bestStreak = Math.max(P.bestStreak, S.best);
  gain(pts);
  checkBadges();
  save(); render();
  const nb = $("#next-btn"); if (nb) nb.focus({ preventScroll: true });
}

function next() {
  const end = S.mode === "survie" ? (S.lives <= 0 || S.i + 1 >= S.ids.length) : S.i + 1 >= S.ids.length;
  if (end) return finish();
  S.i++; S.choice = null; S.elim = []; S.hint = false; S.usedQ = false; S.pts = 0;
  if (S.mode === "chrono") startTimer(CHRONO_S);
  render(); window.scrollTo(0, 0);
}

function fifty() {
  if (S.jk.f <= 0 || S.choice !== null) return;
  const q = Q[S.ids[S.i]];
  S.elim = shuffle([0, 1, 2, 3].filter(k => k !== q.a)).slice(0, 2);
  S.jk.f--; S.usedQ = true; S.usedAny = true; render();
}
function hint() {
  if (S.jk.h <= 0 || S.choice !== null) return;
  S.hint = true; S.jk.h--; S.usedQ = true; S.usedAny = true; render();
}

function startTimer(sec) {
  stopTimer();
  S.timeLeft = sec; S.tEnd = Date.now() + sec * 1000;
  timerId = setInterval(() => {
    if (!S) return stopTimer();
    S.timeLeft = Math.max(0, (S.tEnd - Date.now()) / 1000);
    const el = $("#timer"), tt = $("#timer-t");
    if (el) { el.style.setProperty("--p", S.timeLeft / CHRONO_S); el.classList.toggle("low", S.timeLeft <= 10); }
    if (tt) tt.textContent = Math.ceil(S.timeLeft) + " s";
    if (S.timeLeft <= 0) answer(-1);
  }, 200);
}
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }

function finish() {
  stopTimer();
  if (S.mode === "parcours" && S.t) {
    const st = S.correct >= 18 ? 3 : S.correct >= 14 ? 2 : S.correct >= 10 ? 1 : 0;
    S.stars = st;
    P.stars[S.t] = Math.max(P.stars[S.t] || 0, st);
    P.done[S.t] = 1;
    S.record = S.score > (P.best[S.t] || 0);
    P.best[S.t] = Math.max(P.best[S.t] || 0, S.score);
    if (S.correct === 20) unlock("sansfaute");
    if (S.correct >= 14 && !S.usedAny) unlock("sansjoker");
    if (Object.keys(P.done).length >= 12) unlock("explorateur");
    if (DATA.themes.every(t => (P.stars[t.id] || 0) >= 3)) unlock("major");
  }
  if (S.mode === "chrono" && S.correct >= 8) unlock("chrono");
  if (S.mode === "survie" && S.correct >= 15) unlock("survie");
  save();
  VIEW = "result"; render(); window.scrollTo(0, 0);
}

function viewResult() {
  const gNow = gradeIdx(P.xp);
  const title = { parcours: "Bilan du parcours", entrainement: "Bilan de l'entraînement", chrono: "Bilan du contre la montre", survie: "Fin de la survie", carnet: "Bilan du rattrapage" }[S.mode];
  const rate = S.answered ? Math.round(S.correct / S.answered * 100) : 0;
  const msg = rate >= 90 ? "Excellent travail : tu maîtrises ces notions."
    : rate >= 70 ? "Bon résultat. Relis les règles des questions ratées ci-dessous."
    : rate >= 50 ? "Résultat moyen. Repasse par le briefing et ton carnet d'erreurs."
    : "Ces notions sont encore fragiles. Lis bien chaque correction, puis rejoue ce mode.";
  const missed = [...new Set(S.missed)].map(id => {
    const q = Q[id];
    return `<div class="miss-item"><span class="code">${dossier(q)} · ${TH[q.t].short}</span>
      <p class="ans">Bonne réponse : ${"ABCD"[q.a]}. ${q.o[q.a]}</p><p><strong>Règle à retenir :</strong> ${q.regle}</p></div>`;
  }).join("");
  return `
  <section class="card res-head">
    <p class="eyebrow">${title} · ${selLabel(S.themes)}</p>
    <div class="res-score">${signed(S.score)} pt${Math.abs(S.score) > 1 ? "s" : ""}</div>
    ${S.mode === "parcours" && S.t ? stars(S.stars, "res-stars") : ""}
    <p style="margin:0">${msg}${S.record ? " Nouveau record pour ce thème." : ""}</p>
    ${gNow > S.startGrade ? `<p class="verdict ok" style="margin:0">Promotion obtenue : ${GRADES[gNow].n}.</p>` : ""}
  </section>
  <div class="res-grid">
    <div class="stat"><small>Bonnes réponses</small><b>${S.correct} / ${S.answered}</b></div>
    <div class="stat"><small>Taux de réussite</small><b>${rate} %</b></div>
    <div class="stat"><small>Meilleure série</small><b>×${S.best}</b></div>
    <div class="stat"><small>Erreurs</small><b>${S.answered - S.correct}</b></div>
  </div>
  ${missed ? `<section><h2 class="sec">À revoir</h2><p class="sec-sub">Ces questions sont rangées dans ton carnet d'erreurs.</p><div class="miss">${missed}</div></section>` : `<p class="verdict ok">Aucune erreur sur cette partie.</p>`}
  <div class="actions">
    <button class="btn primary" data-act="replay">Rejouer</button>
    ${Object.keys(P.errors).length ? `<button class="btn" data-act="start" data-m="carnet" data-scope="all">Revoir mes erreurs (${Object.keys(P.errors).length})</button>` : ""}
    <button class="btn ghost" data-act="home">Accueil</button>
  </div>`;
}

/* ---------- Mon dossier ---------- */
function viewDossier() {
  const gi = gradeIdx(P.xp);
