la <strong>sécurité des systèmes<\/strong> (DGSSI). Les deux sont liées mais relèvent d'institutions différentes.","astuce":"« Données personnelles », « vie privée », « loi 09-08 » → CNDP.","regle":"Loi 09-08 → CNDP ; loi 05-20 (cybersécurité) → DGSSI ; loi 61-16 → ADD."},{"id":"5-5","t":5,"n":5,"lvl":1,"neg":false,"q":"<p>Un usager a déjà transmis son attestation de revenus à une administration. Une autre administration récupère directement cette information, sans lui demander de la fournir à nouveau. Quel principe est appliqué ?<\/p>","o":["Le principe de neutralité technologique","Le principe de gratuité des données","Le principe « Dites-le-nous une fois » (once only)","Le principe de spécialité"],"a":2,"just":"<p>Ce principe veut que l'usager ne fournisse qu'une seule fois une information à l'administration ; les administrations la partagent ensuite entre elles, dans le respect de la protection des données. Il suppose l'<strong>interopérabilité<\/strong> des systèmes et rejoint l'esprit de la loi 55-19 sur la simplification.<\/p>","ana":"<ul><li>A : la neutralité technologique signifie que les règles ne favorisent pas une technologie particulière.<\/li><li>B : la gratuité concerne l'open data, pas l'échange de données entre administrations.<\/li><li>D : le principe de spécialité concerne les établissements publics.<\/li><\/ul>","piege":"Croire que ce partage peut se faire sans cadre. Il doit respecter la finalité des données et les règles de protection.","astuce":"« Ne pas redemander à l'usager » → once only + interopérabilité.","regle":"L'usager donne l'information une fois ; ce sont les données qui circulent, pas l'usager."},{"id":"5-6","t":5,"n":6,"lvl":1,"neg":false,"q":"<p>L'<strong>interopérabilité<\/strong> des systèmes d'information désigne :<\/p>","o":["La capacité de systèmes différents à échanger des données et à les utiliser, grâce à des normes et des formats communs","L'obligation pour toutes les administrations d'utiliser le même logiciel","La protection des données contre les intrusions","La possibilité pour un usager de choisir son agent"],"a":0,"just":"<p>L'interopérabilité permet à des systèmes conçus séparément de « se parler » grâce à des standards (formats, référentiels, interfaces de programmation appelées API). Elle est indispensable au principe « Dites-le-nous une fois » et aux guichets uniques.<\/p>","ana":"<ul><li>B : l'interopérabilité vise justement à faire communiquer des systèmes <strong>différents<\/strong>, sans imposer un logiciel unique.<\/li><li>C : c'est la sécurité informatique.<\/li><li>D : sans rapport avec le sujet.<\/li><\/ul>","piege":"Confondre interopérabilité (faire communiquer la diversité) et uniformisation (imposer un outil unique).","astuce":"« Échanger », « standards », « API », « communiquer entre systèmes » → interopérabilité.","regle":"Interopérabilité = langage commun entre systèmes différents."},{"id":"5-7","t":5,"n":7,"lvl":2,"neg":false,"q":"<p>Le formulaire d'inscription à la bibliothèque d'une commune demande la religion, le revenu mensuel et la situation familiale du demandeur. Quel principe de la protection des données personnelles est principalement méconnu ?<\/p>","o":["Le principe de disponibilité","Le principe de proportionnalité (ou minimisation) : seules les données adéquates, pertinentes et non excessives au regard de la finalité doivent être collectées","Le principe de gratuité","Le principe de mutabilité"],"a":1,"just":"<p>La loi 09-08 impose que les données soient collectées pour une <strong>finalité<\/strong> déterminée et légitime, et qu'elles soient adéquates, pertinentes et non excessives par rapport à cette finalité. Pour une inscription à la bibliothèque, ces informations sont inutiles. De plus, la religion fait partie des <strong>données sensibles<\/strong>, soumises à un régime renforcé.<\/p>","ana":"<ul><li>A : la disponibilité est un critère de sécurité informatique.<\/li><li>C : la gratuité n'est pas en cause.<\/li><li>D : la mutabilité est un principe du service public.<\/li><\/ul>","piege":"Penser que le consentement de l'usager suffit à justifier toute collecte. Même avec son accord, la collecte doit rester proportionnée.","astuce":"Demande-toi : « Cette donnée est-elle nécessaire pour ce service ? » Si non → proportionnalité / minimisation.","regle":"Finalité + proportionnalité : on collecte uniquement ce qui est nécessaire pour un objectif précis."},{"id":"5-8","t":5,"n":8,"lvl":2,"neg":false,"q":"<p>Dans le cadre de sa politique d'open data, une direction envisage de publier le fichier nominatif des bénéficiaires d'une aide sociale (noms, adresses, montants). Quelle est la bonne analyse ?<\/p>","o":["La publication est obligatoire, car toutes les données publiques doivent être ouvertes","La publication est possible si le fichier est au format PDF","La publication est possible avec l'accord oral du directeur","Ces données sont personnelles : elles ne peuvent pas être publiées en l'état ; seules des données anonymisées ou agrégées (par exemple, nombre de bénéficiaires et montants par province) peuvent être ouvertes"],"a":3,"just":"<p>L'ouverture des données publiques doit respecter la protection de la vie privée. Les données nominatives sont exclues. L'anonymisation (suppression des éléments permettant d'identifier une personne) et l'agrégation (regroupement statistique) permettent de concilier transparence et protection.<\/p>","ana":"<ul><li>A : l'ouverture ne concerne pas les données personnelles ou protégées.<\/li><li>B : le format ne change rien à la nature personnelle des données ; de plus, le PDF n'est pas un format facilement réutilisable.<\/li><li>C : un accord hiérarchique ne crée pas de base légale.<\/li><\/ul>","piege":"Opposer transparence et vie privée comme si l'une devait l'emporter totalement. Il faut les concilier.","astuce":"Données nominatives + publication → anonymiser ou agréger.","regle":"Ouvrir les données, oui ; exposer les personnes, non."},{"id":"5-9","t":5,"n":9,"lvl":2,"neg":false,"q":"<p>Le même usager figure dans trois systèmes d'une administration avec trois adresses différentes. Quel problème de gestion des données est mis en évidence, et quelle solution s'impose ?<\/p>","o":["Un problème de disponibilité ; il faut acheter des serveurs plus puissants","Un problème de confidentialité ; il faut chiffrer les trois bases","Un problème de qualité des données (cohérence, unicité) ; il faut mettre en place un référentiel unique de données de référence et des règles de mise à jour","Aucun problème, car chaque système a sa propre utilité"],"a":2,"just":"<p>La qualité des données s'apprécie selon plusieurs dimensions : exactitude, complétude, actualité, cohérence, unicité. Ici, l'information est contradictoire et dupliquée. Un <strong>référentiel<\/strong> de données de référence (une source unique et fiable pour l'identité et l'adresse) et des règles de mise à jour corrigent le problème.<\/p>","ana":"<ul><li>A : la puissance des serveurs ne règle pas l'incohérence des informations.<\/li><li>B : le chiffrement protège les données, mais ne les rend pas cohérentes.<\/li><li>D : des données contradictoires entraînent des erreurs (courriers mal adressés, décisions erronées).<\/li><\/ul>","piege":"Chercher une solution technique (matériel, sécurité) à un problème de gouvernance des données.","astuce":"« Même personne, informations différentes » → cohérence / unicité → référentiel unique.","regle":"Une donnée de référence = une source unique, fiable et partagée."},{"id":"5-10","t":5,"n":10,"lvl":2,"neg":false,"q":"<p>Dans une démarche de gouvernance des données, qui doit être responsable de la définition, de la qualité et des règles d'accès aux données relatives aux bénéficiaires d'un programme social ?<\/p>","o":["Le responsable métier du programme (propriétaire de la donnée), la direction des systèmes d'information assurant le stockage et la sécurité techniques","Uniquement la direction des systèmes d'information","Chaque agent qui saisit des données, de façon libre","Le prestataire informatique qui a développé l'application"],"a":0,"just":"<p>La gouvernance des données distingue le <strong>propriétaire<\/strong> de la donnée (le métier, qui sait ce qu'elle signifie et à quoi elle sert), le <strong>dépositaire<\/strong> technique (la DSI, qui la stocke et la sécurise) et éventuellement un <strong>responsable de la donnée<\/strong> (data steward) qui veille à sa qualité au quotidien. Certaines organisations nomment aussi un administrateur général des données (Chief Data Officer).<\/p>","ana":"<ul><li>B : la DSI maîtrise la technique, mais pas le sens métier des données.<\/li><li>C : sans règles communes, la qualité se dégrade.<\/li><li>D : le prestataire n'a pas la responsabilité des données publiques.<\/li><\/ul>","piege":"Croire que « données » signifie « informatique », donc DSI. La donnée est d'abord un actif métier.","astuce":"Sens et qualité de la donnée → métier ; stockage et sécurité → DSI.","regle":"La donnée appartient au métier ; la DSI en est le gardien technique."},{"id":"5-11","t":5,"n":11,"lvl":2,"neg":false,"q":"<p>On caractérise souvent le <strong>big data<\/strong> par plusieurs « V ». Lequel désigne la diversité des types de données (textes, images, données de capteurs, réseaux sociaux) ?<\/p>","o":["Le volume","La vélocité","La véracité","La variété"],"a":3,"just":"<p>Les « V » du big data sont : <strong>volume<\/strong> (quantité massive), <strong>vélocité<\/strong> (vitesse de production et de traitement), <strong>variété<\/strong> (diversité des formats et des sources), auxquels on ajoute souvent <strong>véracité<\/strong> (fiabilité des données) et <strong>valeur<\/strong> (utilité pour la décision).<\/p>","ana":"<ul><li>A : le volume est la quantité.<\/li><li>B : la vélocité est la vitesse.<\/li><li>C : la véracité est la fiabilité.<\/li><\/ul>","piege":"Confondre variété (types différents) et volume (quantité).","astuce":"Variété = « varié », différents types.","regle":"Volume, vélocité, variété, véracité, valeur."},{"id":"5-12","t":5,"n":12,"lvl":2,"neg":false,"q":"<p>Une administration utilise une messagerie électronique et une suite bureautique accessibles en ligne. Le fournisseur gère l'infrastructure, les mises à jour et la maintenance. Quel modèle de cloud est utilisé, et quel point de vigilance s'impose ?<\/p>","o":["IaaS ; aucun point de vigilance","SaaS (logiciel en tant que service) ; il faut vérifier la localisation, la sécurité et la réversibilité des données hébergées","PaaS ; il faut développer soi-même l'application","Hébergement interne ; la souveraineté est garantie automatiquement"],"a":1,"just":"<p>Dans le modèle <strong>SaaS<\/strong> (Software as a Service), l'utilisateur utilise directement un logiciel en ligne ; le fournisseur gère tout le reste. Le <strong>PaaS<\/strong> fournit une plateforme pour développer ses applications ; l'<strong>IaaS<\/strong> fournit l'infrastructure (serveurs, stockage). Pour des données publiques, il faut vérifier où elles sont hébergées, comment elles sont protégées et comment les récupérer si l'on change de fournisseur.<\/p>","ana":"<ul><li>A : l'IaaS ne fournit que l'infrastructure ; de plus, des points de vigilance existent toujours.<\/li><li>C : dans le scénario, l'administration ne développe rien.<\/li><li>D : le scénario décrit un service externe.<\/li><\/ul>","piege":"Oublier la question de la <strong>souveraineté<\/strong> et de la protection des données publiques confiées à un tiers.","astuce":"Logiciel prêt à l'emploi en ligne → SaaS ; plateforme de développement → PaaS ; serveurs → IaaS.","regle":"Plus on monte de l'IaaS au SaaS, plus le fournisseur gère, et plus il faut encadrer le contrat (sécurité, localisation, réversibilité)."},{"id":"5-13","t":5,"n":13,"lvl":2,"neg":false,"q":"<p>Une administration rend une démarche entièrement en ligne. Une partie des usagers (personnes âgées, populations rurales, personnes peu familiarisées avec le numérique) ne parvient pas à l'effectuer. Quelle réponse respecte le mieux le principe d'égal accès au service public ?<\/p>","o":["Considérer que les usagers doivent s'adapter","Revenir au tout-papier pour tous","Maintenir un canal alternatif (guichet, téléphone) et proposer un accompagnement (médiateurs numériques, points d'accès assistés), tout en améliorant l'accessibilité du service en ligne","Réserver la démarche aux usagers diplômés"],"a":2,"just":"<p>La <strong>fracture numérique<\/strong> (inégalités d'équipement, de connexion et de compétences) peut exclure une partie des usagers. L'égal accès au service public impose de prévoir des solutions pour eux : plusieurs canaux, accompagnement humain, conception accessible (simplicité, langues, handicap).<\/p>","ana":"<ul><li>A : c'est contraire au principe d'égal accès.<\/li><li>B : renoncer au numérique priverait les autres usagers de ses avantages.<\/li><li>D : c'est une discrimination contraire à l'égalité.<\/li><\/ul>","piege":"Croire que le numérique est automatiquement plus inclusif. Mal conçu, il peut exclure.","astuce":"Numérique + publics vulnérables → multicanal + accompagnement + accessibilité.","regle":"Digitaliser sans exclure : le numérique s'ajoute, il ne doit laisser personne sans service."},{"id":"5-14","t":5,"n":14,"lvl":3,"neg":false,"q":"<p>Une administration utilise un algorithme qui classe automatiquement les demandes d'aide sociale. Plusieurs demandes sont rejetées et les agents sont incapables d'expliquer pourquoi. Quelle exigence est la plus importante pour un usage responsable de l'intelligence artificielle dans le service public ?<\/p>","o":["Garantir la transparence et l'explicabilité des décisions, le contrôle d'une décision individuelle par un agent, la vérification de l'absence de biais et un droit de recours pour l'usager","Laisser l'algorithme décider seul, car il est plus objectif qu'un humain","Garder secret le fonctionnement de l'algorithme pour éviter les fraudes","Abandonner définitivement toute utilisation de l'intelligence artificielle"],"a":0,"just":"<p>Un algorithme peut reproduire ou amplifier des <strong>biais<\/strong> présents dans les données qui ont servi à le concevoir. Dans le service public, une décision défavorable doit pouvoir être expliquée et contestée. Le contrôle humain (supervision) et l'évaluation régulière des résultats sont indispensables.<\/p>","ana":"<ul><li>B : un algorithme n'est pas neutre par nature ; il dépend de ses données et de ses règles.<\/li><li>C : l'opacité totale empêche l'usager de comprendre et de contester la décision.<\/li><li>D : l'IA peut apporter de réels bénéfices si elle est bien encadrée.<\/li><\/ul>","piege":"Croire que « automatique » signifie « objectif ».","astuce":"IA + décision individuelle → explicabilité, supervision humaine, biais, recours.","regle":"Dans le service public, l'algorithme aide à décider ; il ne supprime ni la responsabilité ni le droit à l'explication."},{"id":"5-15","t":5,"n":15,"lvl":3,"neg":false,"q":"<p>Un agent reçoit un courriel d'apparence officielle lui demandant de cliquer « en urgence » sur un lien pour confirmer son mot de passe, sous peine de blocage de son compte. Quelle mesure de prévention est la plus efficace à l'échelle de l'administration ?<\/p>","o":["Changer de logiciel de messagerie","Interdire l'usage du courrier électronique","Compter uniquement sur l'antivirus","Sensibiliser régulièrement les agents (reconnaître l'hameçonnage, ne jamais communiquer de mot de passe, vérifier l'expéditeur) et mettre en place une procédure simple de signalement"],"a":3,"just":"<p>L'hameçonnage (phishing) exploite la confiance et l'urgence. Le facteur humain est souvent le maillon le plus exposé : la sensibilisation, les exercices et une procédure de signalement rapide permettent de bloquer l'attaque et d'alerter les autres agents. Les mesures techniques (filtres, authentification à plusieurs facteurs) complètent ce dispositif.<\/p>","ana":"<ul><li>A : le problème ne vient pas du logiciel, mais de la manipulation.<\/li><li>B : interdire le courrier électronique est irréaliste.<\/li><li>C : un antivirus ne détecte pas toujours un faux site qui demande un mot de passe.<\/li><\/ul>","piege":"Croire que la cybersécurité est uniquement technique.","astuce":"« Urgence » + « mot de passe » + « lien » → hameçonnage → sensibilisation et signalement.","regle":"En cybersécurité, l'humain est à la fois le maillon faible et la première ligne de défense."},{"id":"5-16","t":5,"n":16,"lvl":3,"neg":false,"q":"<p>Au Maroc, quelle entité exerce le rôle d'autorité nationale en matière de cybersécurité et de sécurité des systèmes d'information de l'État, notamment dans le cadre de la loi n° 05-20 ?<\/p>","o":["La CNDP","La Direction générale de la sécurité des systèmes d'information (DGSSI)","L'Agence de développement du digital (ADD)","La Cour des comptes"],"a":1,"just":"<p>La DGSSI, rattachée à l'Administration de la défense nationale, élabore les règles de sécurité des systèmes d'information de l'État, veille à leur application et coordonne la réponse aux incidents. La loi 05-20 relative à la cybersécurité (2020) fixe les obligations de sécurité des administrations, des collectivités, des établissements publics et des opérateurs d'infrastructures d'importance vitale.<\/p>","ana":"<ul><li>A : la CNDP protège les données personnelles (loi 09-08).<\/li><li>C : l'ADD promeut le développement du digital.<\/li><li>D : la Cour des comptes contrôle les finances publiques.<\/li><\/ul>","piege":"Confondre protection des données personnelles (CNDP) et cybersécurité (DGSSI).","astuce":"Sécurité des systèmes, incidents, attaques → DGSSI.","regle":"Cybersécurité de l'État → DGSSI, loi 05-20."},{"id":"5-17","t":5,"n":17,"lvl":3,"neg":false,"q":"<p>Dans un ministère, chaque direction achète ses propres logiciels sans concertation. Résultat : des outils incompatibles, des données dupliquées et des coûts élevés. Quelle réponse de gouvernance est la plus adaptée ?<\/p>","o":["Laisser chaque direction libre, car elle connaît ses besoins","Interdire tout nouvel achat de logiciel","Élaborer un schéma directeur des systèmes d'information aligné sur la stratégie, avec une instance de gouvernance qui arbitre les projets et fixe des standards communs","Confier toutes les décisions au prestataire le moins cher"],"a":2,"just":"<p>Le schéma directeur du système d'information définit, sur plusieurs années, les priorités numériques en cohérence avec la stratégie de l'organisation. Une instance de gouvernance arbitre les projets, garantit l'interopérabilité et évite les doublons. On parle aussi d'<strong>urbanisation<\/strong> du système d'information.<\/p>","ana":"<ul><li>A : l'autonomie sans coordination est la cause du problème.<\/li><li>B : un gel total bloque la modernisation.<\/li><li>D : le prix seul ne garantit ni la cohérence ni la qualité.<\/li><\/ul>","piege":"Choisir entre « tout laisser faire » et « tout interdire ». La gouvernance consiste à coordonner.","astuce":"Doublons + incompatibilités + coûts → gouvernance, schéma directeur, standards communs.","regle":"Le numérique se pilote : stratégie → schéma directeur → arbitrage → standards."},{"id":"5-18","t":5,"n":18,"lvl":3,"neg":false,"q":"<p>Une ville publie en open data les horaires et positions de ses bus, puis organise un hackathon. De jeunes entreprises créent des applications de calcul d'itinéraire. Quelle notion illustre cette démarche ?<\/p>","o":["L'innovation ouverte : l'administration s'appuie sur des acteurs externes (entreprises, citoyens, chercheurs) pour créer de la valeur à partir de ses ressources","La privatisation du service de transport","La délégation de service public","La dématérialisation des archives"],"a":0,"just":"<p>L'innovation ouverte consiste à ne pas tout développer en interne, mais à ouvrir ses ressources (données, problèmes à résoudre) à un écosystème externe. L'open data et les hackathons (marathons d'innovation de courte durée) en sont des outils typiques.<\/p>","ana":"<ul><li>B : le service de bus reste public ; seules les données sont réutilisées.<\/li><li>C : aucun contrat ne confie la gestion du service à un tiers.<\/li><li>D : il ne s'agit pas d'archives.<\/li><\/ul>","piege":"Confondre réutilisation des données et transfert du service.","astuce":"Open data + hackathon + startups + citoyens → innovation ouverte.","regle":"Innovation ouverte = innover avec l'écosystème externe."},{"id":"5-19","t":5,"n":19,"lvl":3,"neg":false,"q":"<p>Une analyse de données montre que les quartiers qui comptent le plus de postes de police enregistrent aussi le plus de délits déclarés. Un responsable propose d'en conclure que les postes de police augmentent la délinquance. Quelle est la bonne analyse ?<\/p>","o":["La conclusion est juste, car les données ne mentent pas","Il faut fermer les postes de police pour réduire la délinquance","Il faut supprimer ces données, car elles sont trompeuses","Une corrélation n'est pas une causalité : on implante plus de postes dans les quartiers à forte délinquance, et la présence policière facilite le dépôt de plainte ; d'autres facteurs doivent être analysés"],"a":3,"just":"<p>La décision fondée sur les données exige une interprétation rigoureuse. Deux phénomènes peuvent évoluer ensemble sans que l'un cause l'autre : la causalité peut être inversée, ou un troisième facteur peut expliquer les deux. Il faut aussi tenir compte des biais de collecte (ici, plus de présence policière = plus de délits enregistrés).<\/p>","ana":"<ul><li>A : les données peuvent être exactes et l'interprétation fausse.<\/li><li>B : la décision repose sur une interprétation erronée.<\/li><li>C : les données sont utiles si elles sont bien interprétées.<\/li><\/ul>","piege":"Confondre « les données montrent un lien » et « les données prouvent une cause ».","astuce":"Dès qu'une conclusion du type « A cause B » est tirée d'une simple observation simultanée, pense « corrélation ≠ causalité ».","regle":"Piloter par les données suppose d'interpréter avec méthode : corrélation, causalité, biais."},{"id":"5-20","t":5,"n":20,"lvl":3,"neg":false,"q":"<p>Une administration veut lancer un service numérique de demande d'autorisation. Quelle démarche intègre le mieux les enjeux d'impact, de gouvernance et de management des données ?<\/p>","o":["Acheter rapidement une solution clé en main, puis l'adapter si des problèmes apparaissent","Partir des besoins des usagers, simplifier la procédure, prévoir l'interopérabilité avec les autres administrations, intégrer dès la conception la protection des données et la sécurité, former les agents, maintenir un accompagnement pour les usagers éloignés du numérique et suivre des indicateurs","Confier entièrement le projet au service informatique","Mettre en ligne le formulaire papier existant"],"a":1,"just":"<p>Cette démarche couvre les trois dimensions du thème : <strong>impact<\/strong> (usagers, inclusion, agents), <strong>gouvernance<\/strong> (pilotage, interopérabilité, sécurité) et <strong>données<\/strong> (protection dès la conception, qualité, échange). La protection des données « dès la conception » (privacy by design) signifie qu'on l'intègre au départ, et non après coup.<\/p>","ana":"<ul><li>A : une solution choisie avant d'analyser les besoins risque d'être inadaptée.<\/li><li>C : la transformation digitale implique les métiers, la direction et les agents, pas seulement l'informatique.<\/li><li>D : c'est la dématérialisation sans simplification (« numériser la complexité »).<\/li><\/ul>","piege":"Réduire un projet numérique à sa dimension technique.","astuce":"La bonne réponse est la plus complète et la plus équilibrée : usager + processus + données + sécurité + humain + mesure.","regle":"Un service numérique réussi est simple, sûr, interopérable, inclusif et piloté."},{"id":"6-1","t":6,"n":1,"lvl":1,"neg":false,"q":"<p>Développer une <strong>culture de la performance<\/strong> dans une administration consiste principalement à :<\/p>","o":["Augmenter le nombre de contrôles a priori sur chaque dépense","Rechercher la rentabilité financière de chaque service public","Multiplier les procédures écrites","Passer d'une logique centrée sur les moyens et la conformité à une logique centrée sur les résultats, avec des objectifs, des indicateurs, une responsabilisation des gestionnaires et une reddition des comptes"],"a":3,"just":"<p>La culture de la performance change la question posée : on ne demande plus seulement « a-t-on respecté les règles et consommé les crédits ? », mais aussi « qu'a-t-on obtenu pour les usagers et les citoyens, et à quel coût ? ». Elle s'appuie sur des objectifs clairs, des indicateurs, le pilotage et la reddition des comptes.<\/p>","ana":"<ul><li>A : multiplier les contrôles a priori relève de la logique de conformité.<\/li><li>B : la performance publique n'est pas la rentabilité ; elle intègre l'intérêt général, la qualité et l'équité.<\/li><li>C : plus de procédures n'améliore pas les résultats.<\/li><\/ul>","piege":"Confondre performance publique et rentabilité commerciale.","astuce":"« Culture de la performance » = résultats + responsabilisation + reddition des comptes.","regle":"Performance publique = atteindre des résultats utiles à la collectivité, avec des moyens maîtrisés, dans le respect des valeurs du service public."},{"id":"6-2","t":6,"n":2,"lvl":1,"neg":false,"q":"<p>Parmi ces objectifs, lequel respecte le mieux les critères <strong>SMART<\/strong> ?<\/p>","o":["Améliorer la qualité de l'accueil","Réduire de 30 à 15 jours le délai moyen de délivrance des autorisations de construire d'ici décembre 2027","Être le meilleur service du ministère","Faire le maximum pour satisfaire les usagers"],"a":1,"just":"<p>Un objectif SMART est <strong>S<\/strong>pécifique (il porte sur un point précis), <strong>M<\/strong>esurable (un indicateur chiffré), <strong>A<\/strong>tteignable (ambitieux mais possible), <strong>R<\/strong>éaliste (cohérent avec les moyens) et <strong>T<\/strong>emporellement défini (une échéance). B comporte un objet précis, une valeur de départ, une cible et une date.<\/p>","ana":"<ul><li>A : « améliorer la qualité » est vague et non mesurable.<\/li><li>C : « le meilleur » n'est ni précis ni mesurable, et ne comporte pas d'échéance.<\/li><li>D : c'est une intention, pas un objectif.<\/li><\/ul>","piege":"Prendre une bonne intention pour un objectif.","astuce":"Un objectif SMART contient presque toujours un <strong>chiffre<\/strong> et une <strong>date<\/strong>.","regle":"Objectif SMART = précis, chiffré, réaliste, daté."},{"id":"6-3","t":6,"n":3,"lvl":1,"neg":false,"q":"<p>Le <strong>tableau de bord<\/strong> d'un responsable est :<\/p>","o":["Un outil de pilotage synthétique qui rassemble un nombre limité d'indicateurs clés, utiles à la décision et à l'action, pour un responsable donné","Un document exhaustif qui reprend toutes les données disponibles du service","Un rapport annuel destiné uniquement au Parlement","Un organigramme du service"],"a":0,"just":"<p>Le tableau de bord sert à piloter : il permet au responsable de suivre l'atteinte de ses objectifs, de repérer rapidement les écarts et de décider d'actions correctrices. Il doit être synthétique, adapté à son destinataire, régulièrement mis à jour et visuel (alertes, codes couleur).<\/p>","ana":"<ul><li>B : un document exhaustif noie l'information utile ; un tableau de bord sélectionne.<\/li><li>C : il s'agit plutôt d'un rapport de performance ; le tableau de bord est un outil interne de pilotage.<\/li><li>D : l'organigramme représente la structure.<\/li><\/ul>","piege":"Confondre tableau de bord (piloter son activité) et reporting (rendre compte au niveau supérieur).","astuce":"Tableau de bord = « peu d'indicateurs, bien choisis, pour décider ».","regle":"Un bon tableau de bord est synthétique, ciblé, réactif et orienté vers l'action."},{"id":"6-4","t":6,"n":4,"lvl":1,"neg":true,"q":"<p>Le <strong>tableau de bord prospectif<\/strong> (Balanced Scorecard) de Kaplan et Norton analyse la performance selon quatre axes. Lequel <strong>n'en fait pas partie<\/strong> ?<\/p>","o":["L'axe financier","L'axe clients (ou usagers)","L'axe de la conformité juridique des actes","L'axe apprentissage et développement (ou innovation et apprentissage)"],"a":2,"just":"<p>Le Balanced Scorecard équilibre quatre perspectives : financière, clients/usagers, processus internes, apprentissage et développement (compétences, systèmes d'information, culture). Il évite de ne regarder que les résultats financiers. Dans le secteur public, on place souvent la mission et les usagers en tête.<\/p>","ana":"<p>A, B et D sont trois des quatre axes ; le quatrième est celui des processus internes.<\/p>","piege":"La <strong>négation<\/strong> (« n'en fait pas partie »). La conformité juridique est importante dans l'administration, mais ce n'est pas un axe du modèle.","astuce":"Retiens les 4 axes : <strong>F<\/strong>inances, <strong>U<\/strong>sagers, <strong>P<\/strong>rocessus, <strong>A<\/strong>pprentissage (moyen mnémotechnique : « FUPA »).","regle":"Balanced Scorecard = finances, usagers, processus internes, apprentissage."},{"id":"6-5","t":6,"n":5,"lvl":1,"neg":false,"q":"<p>L'<strong>évaluation d'une politique publique<\/strong> consiste à :<\/p>","o":["Vérifier que les dépenses ont été engagées conformément aux règles de la comptabilité publique","Sanctionner les fonctionnaires responsables d'une mauvaise gestion","Contrôler la légalité des actes administratifs","Apprécier la valeur d'une politique, en analysant ses effets au regard des objectifs fixés et des besoins de la population, pour éclairer la décision"],"a":3,"just":"<p>L'évaluation pose des questions de fond : la politique répond-elle aux besoins ? Atteint-elle ses objectifs ? À quel coût ? Quels effets inattendus ? Elle vise à <strong>améliorer<\/strong> l'action publique et à éclairer les décideurs et les citoyens.<\/p>","ana":"<ul><li>A : c'est le contrôle de régularité financière.<\/li><li>B : l'évaluation n'est pas une procédure de sanction.<\/li><li>C : c'est le contrôle de légalité.<\/li><\/ul>","piege":"Confondre évaluation (valeur et effets), contrôle (conformité) et audit (examen méthodique d'une organisation ou d'un processus au regard d'un référentiel).","astuce":"Évaluation → effets, impacts, besoins, valeur, décision. Contrôle → règles, conformité, régularité.","regle":"Contrôler, c'est vérifier la conformité ; évaluer, c'est apprécier l'utilité et les effets."},{"id":"6-6","t":6,"n":6,"lvl":1,"neg":false,"q":"<p>Selon l'article 70 de la Constitution marocaine de 2011, quelle institution vote les lois, contrôle l'action du gouvernement et <strong>évalue les politiques publiques<\/strong> ?<\/p>","o":["La Cour constitutionnelle","Le Parlement","Le Conseil économique, social et environnemental","Le Conseil supérieur du pouvoir judiciaire"],"a":1,"just":"<p>L'article 70 confie au Parlement l'exercice du pouvoir législatif, le contrôle de l'action du gouvernement et l'évaluation des politiques publiques. La Cour des comptes l'assiste dans les domaines du contrôle des finances publiques (article 148).<\/p>","ana":"<ul><li>A : la Cour constitutionnelle contrôle la conformité des lois à la Constitution.<\/li><li>C : le CESE est un organe consultatif qui donne des avis.<\/li><li>D : le CSPJ gère la carrière des magistrats.<\/li><\/ul>","piege":"Penser que l'évaluation est seulement une affaire de gestionnaires. Elle a aussi une dimension démocratique.","astuce":"Article 70 = trois missions du Parlement : légiférer, contrôler, évaluer.","regle":"Le Parlement évalue les politiques publiques (art. 70), avec l'assistance de la Cour des comptes (art. 148)."},{"id":"6-7","t":6,"n":7,"lvl":2,"neg":false,"q":"<p>On mesure souvent la performance publique selon trois points de vue : celui du citoyen, celui de l'usager et celui du contribuable. L'indicateur « coût moyen de traitement d'un dossier » répond principalement aux attentes :<\/p>","o":["Du contribuable (efficience)","Du citoyen (efficacité socio-économique)","De l'usager (qualité de service)","Du fournisseur de l'administration"],"a":0,"just":"<p>Chaque point de vue correspond à un type d'objectif. Le <strong>citoyen<\/strong> attend des effets sur la société (efficacité socio-économique : baisse du chômage, réussite scolaire). L'<strong>usager<\/strong> attend un service de qualité (délais, accueil, fiabilité). Le <strong>contribuable<\/strong> attend que l'argent public soit bien utilisé (efficience : coût par unité produite).<\/p>","ana":"<ul><li>B : le citoyen s'intéresse aux impacts, pas au coût unitaire.<\/li><li>C : l'usager s'intéresse au délai ou à l'accueil, pas au coût de traitement.<\/li><li>D : le fournisseur n'est pas l'un des trois points de vue.<\/li><\/ul>","piege":"Confondre usager (celui qui utilise le service) et contribuable (celui qui le finance).","astuce":"Coût → contribuable ; délai, accueil, satisfaction → usager ; impact sur la société → citoyen.","regle":"Citoyen = efficacité socio-économique ; usager = qualité de service ; contribuable = efficience."},{"id":"6-8","t":6,"n":8,"lvl":2,"neg":false,"q":"<p>Une direction propose un indicateur qui exigerait une enquête manuelle de trois mois, dont le coût dépasse le budget du programme suivi. Quelle qualité d'un bon indicateur fait défaut ?<\/p>","o":["La pertinence","La compréhensibilité","La disponibilité à un coût raisonnable (faisabilité)","La neutralité politique"],"a":2,"just":"<p>Un bon indicateur est <strong>pertinent<\/strong> (lié à l'objectif), <strong>fiable<\/strong> (données exactes), <strong>compréhensible<\/strong>, <strong>disponible<\/strong> en temps utile et <strong>à un coût raisonnable<\/strong>, et peu <strong>manipulable<\/strong>. Un indicateur qui coûte plus cher que l'action qu'il mesure n'est pas réaliste.<\/p>","ana":"<ul><li>A : l'énoncé ne remet pas en cause le lien avec l'objectif.<\/li><li>B : rien n'indique qu'il soit difficile à comprendre.<\/li><li>D : la neutralité politique n'est pas une qualité technique classique d'un indicateur.<\/li><\/ul>","piege":"Croire qu'un indicateur très précis est forcément un bon indicateur.","astuce":"Coût de collecte excessif ou délai trop long → disponibilité / faisabilité.","regle":"Un bon indicateur est pertinent, fiable, compréhensible, disponible à coût raisonnable et difficile à manipuler."},{"id":"6-9","t":6,"n":9,"lvl":2,"neg":false,"q":"<p>Un centre d'appels public est évalué uniquement sur la durée moyenne des appels. Les téléconseillers écourtent les conversations, et de nombreux usagers doivent rappeler plusieurs fois. Quel phénomène est illustré ?<\/p>","o":["Un effet de noria","Une amélioration réelle de la performance","Une erreur de saisie des données","Un effet pervers de l'indicateur : lorsqu'une mesure devient un objectif en soi, les comportements s'adaptent pour améliorer le chiffre au détriment du résultat réel"],"a":3,"just":"<p>C'est l'illustration de la <strong>loi de Goodhart<\/strong> : quand une mesure devient une cible, elle cesse d'être une bonne mesure. L'indicateur s'améliore, mais la qualité du service se dégrade. Le remède consiste à utiliser un ensemble équilibré d'indicateurs (durée + taux de résolution au premier appel + satisfaction) et à dialoguer sur leur interprétation.<\/p>","ana":"<ul><li>A : l'effet de noria concerne la masse salariale.<\/li><li>B : la performance réelle (résoudre le problème de l'usager) se dégrade.<\/li><li>C : les données sont exactes ; c'est le comportement qui est biaisé.<\/li><\/ul>","piege":"Croire qu'un bon chiffre signifie toujours une bonne performance.","astuce":"Un seul indicateur + comportements qui « trichent » avec la réalité → effet pervers. Solution : indicateurs équilibrés.","regle":"Jamais un seul indicateur : combiner quantité, qualité et coût."},{"id":"6-10","t":6,"n":10,"lvl":2,"neg":false,"q":"<p>Avant de lancer un programme d'aide aux très petites entreprises, le ministère analyse les besoins, les objectifs et l'impact attendu des différentes options possibles. Il s'agit d'une évaluation :<\/p>","o":["Ex post","Ex ante","À mi-parcours (in itinere)","De conformité"],"a":1,"just":"<p>L'évaluation <strong>ex ante<\/strong> intervient <strong>avant<\/strong> la mise en œuvre : elle vérifie la pertinence du projet et estime ses effets probables pour choisir la meilleure option. L'évaluation <strong>in itinere<\/strong> (ou à mi-parcours) a lieu pendant la mise en œuvre pour ajuster. L'évaluation <strong>ex post<\/strong> intervient après, pour mesurer les résultats et les impacts.<\/p>","ana":"<ul><li>A : ex post = après la mise en œuvre.<\/li><li>C : à mi-parcours = pendant.<\/li><li>D : la conformité relève du contrôle, pas de l'évaluation.<\/li><\/ul>","piege":"Confondre ex ante (avant) et ex post (après). « Ante » signifie avant en latin, comme dans « antérieur ».","astuce":"Ante = antérieur ; post = postérieur ; in itinere = en chemin.","regle":"Avant (ex ante) → pendant (in itinere) → après (ex post)."},{"id":"6-11","t":6,"n":11,"lvl":2,"neg":false,"q":"<p>Un programme de formation des jeunes chômeurs atteint tous ses objectifs quantitatifs (nombre de jeunes formés). Mais les métiers enseignés ne correspondent pas aux besoins des entreprises de la région, et peu de jeunes trouvent un emploi. Quel critère d'évaluation est principalement en défaut ?<\/p>","o":["La pertinence : l'adéquation des objectifs du programme aux besoins réels","L'efficience","La cohérence interne","La régularité comptable"],"a":0,"just":"<p>Les critères classiques de l'évaluation (proches de ceux de l'OCDE) sont : <strong>pertinence<\/strong> (les objectifs répondent-ils aux besoins ?), <strong>cohérence<\/strong> (la politique est-elle compatible avec les autres politiques ?), <strong>efficacité<\/strong> (les objectifs sont-ils atteints ?), <strong>efficience<\/strong> (à quel coût ?), <strong>impact<\/strong> (quels effets à long terme ?), <strong>durabilité<\/strong> (les effets durent-ils ?). Ici, le programme est efficace par rapport à ses propres objectifs, mais ces objectifs ne répondent pas au vrai besoin : l'emploi.<\/p>","ana":"<ul><li>B : rien n'est dit sur les coûts.<\/li><li>C : la cohérence interne concerne l'articulation entre objectifs, moyens et actions du programme ; le problème est ici le lien avec les besoins extérieurs.<\/li><li>D : la régularité comptable relève du contrôle financier.<\/li><\/ul>","piege":"Croire qu'un programme qui atteint ses objectifs est forcément réussi. Il faut aussi vérifier que ces objectifs étaient les bons.","astuce":"« Ne correspond pas aux besoins » → pertinence. « Objectifs atteints ou non » → efficacité.","regle":"Pertinence = faire la bonne chose ; efficacité = bien faire la chose prévue."},{"id":"6-12","t":6,"n":12,"lvl":2,"neg":false,"q":"<p>Un gouvernement subventionne fortement le carburant tout en finançant une campagne pour réduire l'usage de la voiture. Quel critère d'évaluation est mis en cause ?<\/p>","o":["L'efficience","La pertinence","La cohérence (externe) entre politiques publiques","La disponibilité des données"],"a":2,"just":"<p>La cohérence externe vérifie que différentes politiques ne poursuivent pas des objectifs contradictoires. Ici, une politique encourage la consommation de carburant pendant qu'une autre cherche à la réduire : les effets s'annulent partiellement.<\/p>","ana":"<ul><li>A : l'efficience porte sur le rapport résultats / moyens d'une politique.<\/li><li>B : chaque politique peut, isolément, répondre à un besoin (pouvoir d'achat, environnement).<\/li><li>D : il ne s'agit pas d'un problème de mesure.<\/li><\/ul>","piege":"Confondre pertinence (une politique face aux besoins) et cohérence (plusieurs politiques entre elles).","astuce":"Deux politiques qui se contredisent → cohérence.","regle":"Cohérence interne = au sein d'une politique ; cohérence externe = entre politiques."},{"id":"6-13","t":6,"n":13,"lvl":2,"neg":false,"q":"<p>Un rapport indique : « Le taux de satisfaction des usagers est de 68 %. » Que manque-t-il principalement pour interpréter ce chiffre ?<\/p>","o":["La couleur du graphique","Le nom de l'agent qui a réalisé l'enquête","Le coût de l'enquête","Une valeur de référence (situation de départ ou année précédente) et une valeur cible"],"a":3,"just":"<p>Un indicateur isolé ne dit rien. 68 % est-il un progrès ou une baisse ? Est-ce proche ou loin de l'objectif ? Pour interpréter, il faut une <strong>référence<\/strong> (valeur initiale, tendance, comparaison avec d'autres services) et une <strong>cible<\/strong> (objectif fixé).<\/p>","ana":"<ul><li>A : la présentation n'aide pas à interpréter le niveau atteint.<\/li><li>B : l'identité de l'agent est sans intérêt pour l'analyse.<\/li><li>C : le coût de l'enquête ne permet pas de juger le résultat.<\/li><\/ul>","piege":"Juger un chiffre « bon » ou « mauvais » sans point de comparaison.","astuce":"Indicateur utile = valeur actuelle + valeur de référence + cible + tendance.","regle":"Un chiffre ne parle que s'il est comparé : à hier, à l'objectif ou aux autres."},{"id":"6-14","t":6,"n":14,"lvl":3,"neg":false,"q":"<p>Pour « créer une culture de la performance », un directeur publie chaque mois un classement de ses services et sanctionne publiquement les trois derniers. Après quelques mois, les chiffres s'améliorent, mais les plaintes des usagers augmentent et l'ambiance se dégrade. Quelle analyse est la plus pertinente ?<\/p>","o":["La méthode fonctionne, puisque les chiffres s'améliorent","La logique de sanction pousse à « soigner les chiffres » plutôt que les résultats réels ; une culture de la performance repose plutôt sur le dialogue, l'analyse des causes des écarts, l'appui et la reconnaissance","Il faut sanctionner aussi les services classés au milieu","Il faut supprimer tous les indicateurs"],"a":1,"just":"<p>Une culture de la performance durable est une culture d'<strong>apprentissage<\/strong>. Les indicateurs servent à comprendre et à améliorer, pas à humilier. Quand l'enjeu est la sanction, les agents adaptent les chiffres (effet pervers) et la coopération entre services disparaît.<\/p>","ana":"<ul><li>A : les plaintes des usagers montrent que la performance réelle se dégrade.<\/li><li>C : étendre la sanction aggrave le problème.<\/li><li>D : supprimer les indicateurs revient à renoncer au pilotage.<\/li><\/ul>","piege":"Confondre amélioration des chiffres et amélioration du service.","astuce":"Indice : « les chiffres s'améliorent mais les plaintes augmentent » → effet pervers et culture de la peur.","regle":"Mesurer pour comprendre et progresser, pas pour punir."},{"id":"6-15","t":6,"n":15,"lvl":3,"neg":false,"q":"<p>Chaque trimestre, le responsable d'un programme et les directeurs régionaux se réunissent pour examiner ensemble les objectifs, les moyens alloués, les résultats obtenus et les difficultés rencontrées, puis ajustent leurs engagements. Comment appelle-t-on ce processus ?<\/p>","o":["Le dialogue de gestion","Le contrôle de légalité","La procédure disciplinaire","L'inspection générale"],"a":0,"just":"<p>Le dialogue de gestion est un échange structuré entre niveaux de responsabilité (central et déconcentré, responsable de programme et responsables opérationnels). Il porte sur les objectifs, les moyens et les résultats. C'est un élément central de la gestion axée sur les résultats introduite par la LOF 130-13.<\/p>","ana":"<ul><li>B : le contrôle de légalité vérifie la conformité des actes au droit.<\/li><li>C : la procédure disciplinaire vise à sanctionner une faute.<\/li><li>D : l'inspection est un contrôle exercé par un corps spécialisé, pas un échange régulier de pilotage.<\/li><\/ul>","piege":"Confondre un échange de pilotage (dialogue) avec un contrôle.","astuce":"« Ensemble », « objectifs, moyens, résultats », « ajuster » → dialogue de gestion.","regle":"Le dialogue de gestion relie objectifs, moyens et résultats entre les niveaux de l'organisation."},{"id":"6-16","t":6,"n":16,"lvl":3,"neg":false,"q":"<p>Dans le cadre de la LOF 130-13, quel document présente, <strong>après l'exécution du budget<\/strong>, les résultats obtenus par rapport aux objectifs et aux indicateurs de chaque programme ?<\/p>","o":["Le projet de performance","La note de présentation du projet de loi de finances","Le rapport annuel de performance, qui accompagne le projet de loi de règlement","Le budget citoyen"],"a":2,"just":"<p>Le <strong>projet de performance<\/strong>, joint au projet de loi de finances, présente les objectifs et indicateurs <strong>avant<\/strong> le vote. Le <strong>rapport annuel de performance<\/strong> compare les résultats obtenus aux prévisions <strong>après<\/strong> l'exécution ; il est rattaché à la loi de règlement, qui arrête les comptes de l'année.<\/p>","ana":"<ul><li>A : le projet de performance est un document prévisionnel.<\/li><li>B : la note de présentation explique le projet de loi de finances.<\/li><li>D : le budget citoyen présente le budget de façon simplifiée au grand public.<\/li><\/ul>","piege":"Inverser projet de performance (prévision) et rapport de performance (réalisation).","astuce":"Projet = avant (loi de finances) ; rapport = après (loi de règlement).","regle":"Prévoir (projet de performance) → exécuter → rendre compte (rapport annuel de performance)."},{"id":"6-17","t":6,"n":17,"lvl":3,"neg":false,"q":"<p>L'indicateur « délai moyen de traitement des réclamations » est de 25 jours, alors que la cible est de 15 jours. Quelle est la démarche la plus appropriée ?<\/p>","o":["Modifier immédiatement la cible pour la porter à 25 jours","Sanctionner automatiquement le chef de service","Ne rien faire, car un indicateur n'est qu'une information","Analyser les causes de l'écart (internes et externes : effectifs, procédures, volume de réclamations, outils), puis définir et suivre des actions correctrices"],"a":3,"just":"<p>Le pilotage de la performance repose sur une boucle : mesurer → comparer à la cible → analyser l'écart → agir → mesurer de nouveau. Un écart peut avoir des causes internes (organisation, compétences) ou externes (hausse imprévue des demandes). Sans analyse, l'action risque d'être inadaptée.<\/p>","ana":"<ul><li>A : modifier la cible sans analyse revient à masquer le problème.<\/li><li>B : sanctionner sans comprendre les causes est injuste et inefficace.<\/li><li>C : un indicateur sert à agir ; l'ignorer vide le pilotage de son sens.<\/li><\/ul>","piege":"Réagir à l'écart sans en rechercher les causes.","astuce":"Écart → « analyse des causes » → « actions correctrices ». C'est la réponse type.","regle":"Un écart est un signal à analyser, pas une faute à punir."},{"id":"6-18","t":6,"n":18,"lvl":3,"neg":false,"q":"<p>Un service respecte à 95 % son délai interne de traitement, mais les enquêtes montrent que les usagers sont majoritairement insatisfaits. Que révèle cette situation ?<\/p>","o":["Les enquêtes de satisfaction sont inutiles","Un écart entre la qualité produite (mesurée en interne) et la qualité perçue par les usagers : il faut compléter les indicateurs internes par l'écoute des usagers","Le délai interne doit être supprimé","Les usagers sont toujours insatisfaits, quoi qu'on fasse"],"a":1,"just":"<p>La qualité <strong>produite<\/strong> (ce que l'administration mesure : délais, conformité) ne coïncide pas toujours avec la qualité <strong>perçue<\/strong> (ce que l'usager ressent : clarté de l'information, accueil, simplicité, résultat obtenu). Les enquêtes de satisfaction, les réclamations et les baromètres permettent d'identifier ce qui compte vraiment pour l'usager. La Charte des services publics (loi 54-19) insiste sur l'écoute des usagers.<\/p>","ana":"<ul><li>A : l'enquête révèle justement une information que les indicateurs internes ne montrent pas.<\/li><li>C : le délai reste un indicateur utile ; il est simplement insuffisant.<\/li><li>D : cette généralisation empêche toute amélioration.<\/li><\/ul>","piege":"Croire qu'un indicateur interne satisfaisant prouve la qualité du service.","astuce":"Indicateur interne bon + usagers mécontents → qualité produite ≠ qualité perçue.","regle":"La performance se mesure aussi du point de vue de l'usager."},{"id":"6-19","t":6,"n":19,"lvl":3,"neg":false,"q":"<p>Une direction veut calculer le coût complet de traitement d'un dossier, en intégrant les salaires, les locaux, l'informatique et une part des fonctions support. De quel outil a-t-elle besoin ?<\/p>","o":["La comptabilité analytique (ou comptabilité de gestion), qui répartit les coûts directs et indirects entre les activités","La comptabilité budgétaire seule","Le registre d'inventaire","Le rapport d'activité annuel"],"a":0,"just":"<p>La comptabilité analytique (ou de gestion) mesure les coûts par activité, produit ou service. Elle affecte les coûts directs (salaires des agents qui traitent les dossiers) et répartit les coûts indirects (locaux, informatique, fonctions support) selon des clés de répartition. C'est un outil indispensable pour mesurer l'efficience.<\/p>","ana":"<ul><li>B : la comptabilité budgétaire suit les crédits par nature et par programme ; elle ne calcule pas directement le coût complet d'un service.<\/li><li>C : le registre d'inventaire recense les biens.<\/li><li>D : le rapport d'activité décrit ce qui a été fait, sans calcul de coûts.<\/li><\/ul>","piege":"Croire que le budget suffit pour connaître le coût d'un service.","astuce":"« Coût complet », « coûts indirects », « par activité » → comptabilité analytique.","regle":"Pour mesurer l'efficience, il faut connaître les coûts : c'est le rôle de la comptabilité analytique."},{"id":"6-20","t":6,"n":20,"lvl":3,"neg":false,"q":"<p>Un nouveau directeur veut installer une culture de la performance dans une direction qui n'a jamais utilisé d'indicateurs. Quelle démarche est la plus cohérente ?<\/p>","o":["Imposer d'emblée 80 indicateurs à tous les services","Copier le tableau de bord d'une entreprise privée","Clarifier les missions et les objectifs stratégiques, les décliner en objectifs opérationnels, choisir avec les équipes un nombre limité d'indicateurs pertinents, construire des tableaux de bord, instaurer un dialogue de gestion régulier et valoriser les progrès","Lier immédiatement la rémunération de chaque agent à un indicateur unique"],"a":2,"just":"<p>Une culture de la performance se construit progressivement. On part du sens (missions et objectifs), on associe les équipes au choix des indicateurs pour favoriser l'appropriation, on commence avec peu d'indicateurs, on pilote par le dialogue et on reconnaît les progrès.<\/p>","ana":"<ul><li>A : trop d'indicateurs dès le départ noie les équipes et décourage l'appropriation.<\/li><li>B : les objectifs d'une administration diffèrent de ceux d'une entreprise ; il faut adapter.<\/li><li>D : un indicateur unique lié à la rémunération provoque des effets pervers.<\/li><\/ul>","piege":"Confondre « mesurer beaucoup » et « bien piloter ».","astuce":"La bonne démarche part du <strong>sens<\/strong> (missions, objectifs) avant les <strong>outils<\/strong> (indicateurs, tableaux de bord).","regle":"Sens → objectifs → indicateurs partagés → pilotage par le dialogue → reconnaissance."},{"id":"7-1","t":7,"n":1,"lvl":1,"neg":false,"q":"<p>Selon la norme ISO 31000, le <strong>risque<\/strong> se définit comme :<\/p>","o":["L'effet de l'incertitude sur l'atteinte des objectifs","Un événement qui s'est déjà produit et a causé un dommage","Une faute commise par un agent","Une perte financière certaine"],"a":0,"just":"<p>La norme ISO 31000 relie le risque aux <strong>objectifs<\/strong> de l'organisation : un risque est un événement incertain qui, s'il survient, peut empêcher ou favoriser leur réalisation. On le caractérise par sa <strong>probabilité<\/strong> et son <strong>impact<\/strong>.<\/p>","ana":"<ul><li>B : un événement déjà survenu est un <strong>incident<\/strong> (ou un sinistre), pas un risque.<\/li><li>C : une faute peut être la cause d'un risque, mais le risque ne se réduit pas à la faute.<\/li><li>D : le risque est par nature incertain ; une perte certaine n'est pas un risque.<\/li><\/ul>","piege":"Confondre risque (incertain, futur) et incident (réalisé).","astuce":"Risque = incertitude + objectifs. Toute définition sans incertitude est fausse.","regle":"Un risque est un événement possible qui menace (ou favorise) l'atteinte des objectifs."},{"id":"7-2","t":7,"n":2,"lvl":1,"neg":false,"q":"<p>Comment mesure-t-on généralement la <strong>criticité<\/strong> d'un risque ?<\/p>","o":["Par le nombre de pages de la procédure concernée","Par l'ancienneté du service exposé","En combinant la probabilité de survenance et l'impact (ou gravité) du risque","Par le seul montant du budget du service"],"a":2,"just":"<p>La criticité permet de hiérarchiser les risques. On la calcule souvent par la formule : criticité = probabilité × impact, chaque facteur étant noté sur une échelle (par exemple de 1 à 4 ou de 1 à 5).<\/p>","ana":"<ul><li>A, B et D : ces éléments n'expriment ni la probabilité ni l'impact d'un événement.<\/li><\/ul>","piege":"Ne retenir qu'un seul critère (la probabilité ou l'impact). Un risque rare mais catastrophique peut être aussi critique qu'un risque fréquent mais modéré.","astuce":"Criticité = « P × I ».","regle":"Criticité = probabilité × impact : elle sert à prioriser."},{"id":"7-3","t":7,"n":3,"lvl":1,"neg":false,"q":"<p>Après la mise en place d'une double signature et de contrôles informatiques sur les paiements, le risque de paiement frauduleux est fortement réduit, sans être totalement supprimé. Le niveau de risque qui subsiste s'appelle :<\/p>","o":["Le risque inhérent (ou brut)","Le risque résiduel (ou net)","Le risque systémique","Le risque nul"],"a":1,"just":"<p>Le <strong>risque inhérent<\/strong> (ou brut) est le risque avant toute mesure de maîtrise. Le <strong>risque résiduel<\/strong> (ou net) est celui qui subsiste après la mise en place des dispositifs de contrôle. L'organisation décide ensuite si ce niveau résiduel est acceptable.<\/p>","ana":"<ul><li>A : le risque inhérent est mesuré avant les contrôles.<\/li><li>C : le risque systémique concerne la propagation d'une défaillance à l'ensemble d'un système (secteur financier, par exemple).<\/li><li>D : le risque zéro n'existe pas ; l'énoncé précise d'ailleurs que le risque n'est pas totalement supprimé.<\/li><\/ul>","piege":"Croire qu'un contrôle supprime totalement un risque.","astuce":"« Avant les contrôles » → inhérent ; « après les contrôles » → résiduel.","regle":"Risque inhérent − effet des contrôles = risque résiduel."},{"id":"7-4","t":7,"n":4,"lvl":1,"neg":false,"q":"<p>Une administration souscrit une assurance pour couvrir les dommages que pourrait subir son parc de véhicules. Quelle stratégie de traitement du risque applique-t-elle ?<\/p>","o":["L'évitement","La réduction","L'acceptation","Le transfert (ou partage)"],"a":3,"just":"<p>Il existe quatre grandes stratégies de traitement : <strong>éviter<\/strong> (renoncer à l'activité qui génère le risque), <strong>réduire<\/strong> (diminuer la probabilité ou l'impact par des mesures de prévention ou de protection), <strong>transférer ou partager<\/strong> (faire supporter tout ou partie des conséquences par un tiers : assurance, contrat), <strong>accepter<\/strong> (assumer le risque en connaissance de cause).<\/p>","ana":"<ul><li>A : l'administration continue d'utiliser ses véhicules.<\/li><li>B : l'assurance ne diminue pas la probabilité d'un accident ; elle en reporte les conséquences financières.<\/li><li>C : l'administration ne se contente pas d'assumer le risque.<\/li><\/ul>","piege":"Croire que l'assurance réduit le risque. Elle transfère les conséquences financières, pas l'événement lui-même.","astuce":"Assurance, sous-traitance, clause contractuelle → transfert. Formation, maintenance, contrôles → réduction.","regle":"Éviter, réduire, transférer, accepter."},{"id":"7-5","t":7,"n":5,"lvl":1,"neg":false,"q":"<p>À quoi sert principalement une <strong>cartographie des risques<\/strong> ?<\/p>","o":["À identifier, évaluer et représenter visuellement les risques selon leur probabilité et leur impact, afin de hiérarchiser les priorités d'action","À représenter la localisation géographique des bâtiments administratifs","À dresser la liste des agents d'un service","À remplacer le plan d'action"],"a":0,"just":"<p>La cartographie des risques est l'outil central du management des risques. Elle présente souvent les risques dans une matrice (probabilité en abscisse, impact en ordonnée), avec des zones de couleur (vert, orange, rouge). Elle permet à la direction de voir d'un coup d'œil les risques prioritaires.<\/p>","ana":"<ul><li>B : le terme « cartographie » ne désigne pas ici une carte géographique.<\/li><li>C : sans rapport avec le sujet.<\/li><li>D : la cartographie prépare le plan d'action ; elle ne le remplace pas.<\/li><\/ul>","piege":"Prendre « cartographie » au sens géographique.","astuce":"Cartographie des risques = matrice probabilité/impact + priorisation.","regle":"La cartographie sert à voir, comparer et prioriser les risques."},{"id":"7-6","t":7,"n":6,"lvl":1,"neg":false,"q":"<p>Lors d'une analyse des causes d'erreurs de paiement avec le diagramme d'Ishikawa, l'équipe relève « une procédure mal rédigée et ambiguë ». Dans quelle catégorie des 5M faut-il classer cette cause ?<\/p>","o":["Main-d'œuvre","Matériel","Méthode","Milieu"],"a":2,"just":"<p>Le diagramme d'Ishikawa (ou diagramme causes-effet, ou « en arête de poisson ») classe les causes d'un problème en cinq familles, les 5M : <strong>Méthode<\/strong> (procédures, modes opératoires), <strong>Main-d'œuvre<\/strong> (compétences, formation, effectifs), <strong>Matériel<\/strong> (équipements, logiciels), <strong>Matière<\/strong> (informations ou matières premières utilisées), <strong>Milieu<\/strong> (environnement de travail). Une procédure relève de la méthode.<\/p>","ana":"<ul><li>A : la main-d'œuvre concernerait par exemple un manque de formation des agents.<\/li><li>B : le matériel concernerait par exemple un logiciel défaillant.<\/li><li>D : le milieu concernerait par exemple un bureau bruyant ou des interruptions fréquentes.<\/li><\/ul>","piege":"Classer la cause selon la personne qui l'a constatée plutôt que selon sa nature.","astuce":"Procédure, mode opératoire, circuit → Méthode.","regle":"5M : Méthode, Main-d'œuvre, Matériel, Matière, Milieu."},{"id":"7-7","t":7,"n":7,"lvl":2,"neg":false,"q":"<p>L'<strong>appétence au risque<\/strong> d'une organisation désigne :<\/p>","o":["La liste des risques déjà survenus","Le niveau global de risque que l'organisation est prête à accepter pour atteindre ses objectifs","Le goût personnel du directeur pour les décisions audacieuses","L'obligation de supprimer tous les risques"],"a":1,"just":"<p>L'appétence (ou appétit) pour le risque est fixée par la direction. Elle oriente les décisions : au-delà de ce niveau, le risque doit être traité ; en deçà, il peut être accepté. La <strong>tolérance<\/strong> au risque précise les écarts acceptables pour un objectif donné.<\/p>","ana":"<ul><li>A : c'est un historique des incidents.<\/li><li>C : l'appétence est une décision collective et formalisée, pas une préférence personnelle.<\/li><li>D : supprimer tous les risques est impossible et paralyserait l'action.<\/li><\/ul>","piege":"Croire que le but du management des risques est de supprimer tous les risques.","astuce":"Appétence = « jusqu'où l'organisation accepte d'aller ».","regle":"On ne supprime pas tous les risques : on les maintient dans les limites de l'appétence fixée."},{"id":"7-8","t":7,"n":8,"lvl":2,"neg":false,"q":"<p>Selon le <strong>modèle des trois lignes<\/strong> (Institut des auditeurs internes, 2020), quel est le rôle de l'audit interne ?<\/p>","o":["Gérer au quotidien les risques de chaque activité opérationnelle","Fixer les objectifs stratégiques de l'organisation","Exécuter les opérations de paiement","Fournir à la direction et aux organes de gouvernance une assurance indépendante et objective sur l'efficacité de la gestion des risques et du contrôle interne"],"a":3,"just":"<p>Le modèle distingue : la <strong>première ligne<\/strong> (le management opérationnel, qui possède et gère les risques de ses activités) ; la <strong>deuxième ligne<\/strong> (les fonctions de gestion des risques, de conformité et de contrôle, qui fournissent méthodes, expertise et suivi) ; la <strong>troisième ligne<\/strong> (l'audit interne, indépendant, qui évalue l'ensemble du dispositif).<\/p>","ana":"<ul><li>A : c'est la première ligne.<\/li><li>B : c'est la responsabilité de la direction et des organes de gouvernance.<\/li><li>C : c'est une activité opérationnelle (première ligne) ; l'auditeur ne doit pas y participer pour rester indépendant.<\/li><\/ul>","piege":"Croire que l'audit interne gère les risques. Il évalue la manière dont ils sont gérés.","astuce":"Audit interne = indépendance + assurance + évaluation.","regle":"1<sup>re<\/sup> ligne gère, 2<sup>e<\/sup> ligne appuie et surveille, 3<sup>e<\/sup> ligne évalue de façon indépendante."},{"id":"7-9","t":7,"n":9,"lvl":2,"neg":false,"q":"<p>Dans le registre des risques d'un établissement, chaque risque est associé à un « propriétaire du risque ». Qui doit, en principe, être désigné ?<\/p>","o":["Le responsable de l'activité ou du processus concerné, qui a l'autorité et les moyens pour gérer ce risque","Systématiquement le responsable de l'audit interne","Le dernier agent recruté","Un consultant externe"],"a":0,"just":"<p>Le propriétaire du risque est la personne qui a la responsabilité et l'autorité pour suivre ce risque et mettre en œuvre les mesures de traitement. C'est généralement le responsable du processus exposé (par exemple, le directeur financier pour le risque d'erreur de paiement).<\/p>","ana":"<ul><li>B : l'audit interne doit rester indépendant ; il ne peut pas être propriétaire des risques qu'il évalue.<\/li><li>C : le critère n'est pas l'ancienneté, mais l'autorité sur l'activité.<\/li><li>D : un consultant n'a ni l'autorité ni la responsabilité durable.<\/li><\/ul>","piege":"Confier le risque à la fonction qui le contrôle plutôt qu'à celle qui le génère et peut agir.","astuce":"Propriétaire du risque = celui qui a la main sur l'activité.","regle":"Chaque risque doit avoir un responsable clairement identifié, doté de l'autorité nécessaire."},{"id":"7-10","t":7,"n":10,"lvl":2,"neg":false,"q":"<p>Un service sensible suit le « taux de rotation des agents chargés des paiements » et le « nombre d'accès informatiques en dehors des heures de travail ». Quelle est la nature de ces indicateurs ?<\/p>","o":["Des indicateurs d'impact socio-économique","Des indicateurs de satisfaction des usagers","Des indicateurs clés de risque (KRI), qui alertent sur l'évolution de l'exposition au risque","Des indicateurs budgétaires"],"a":2,"just":"<p>Les indicateurs clés de risque (KRI, Key Risk Indicators) sont des signaux d'alerte précoce : ils montrent que l'exposition à un risque augmente. Une forte rotation des agents peut accroître le risque d'erreur ; des accès inhabituels peuvent signaler un risque de fraude ou d'intrusion.<\/p>","ana":"<ul><li>A : ces indicateurs ne mesurent pas un effet sur la société.<\/li><li>B : ils ne concernent pas la perception des usagers.<\/li><li>D : ils ne portent pas sur les crédits.<\/li><\/ul>","piege":"Confondre KPI (indicateur de performance : mesure l'atteinte d'un objectif) et KRI (indicateur de risque : alerte sur une menace).","astuce":"Indicateur qui « prévient » d'un danger possible → KRI.","regle":"KPI = « où en est-on par rapport à l'objectif ? » ; KRI = « le danger augmente-t-il ? »"},{"id":"7-11","t":7,"n":11,"lvl":2,"neg":false,"q":"<p>Dans la méthode <strong>AMDEC<\/strong> (analyse des modes de défaillance, de leurs effets et de leur criticité), la criticité d'une défaillance est souvent calculée en multipliant trois facteurs : la gravité, la fréquence (occurrence) et :<\/p>","o":["Le coût du matériel","La probabilité de non-détection de la défaillance","Le nombre d'agents du service","La durée de la procédure"],"a":1,"just":"<p>L'AMDEC, issue de l'industrie, analyse chaque étape d'un processus pour identifier les défaillances possibles. Elle calcule un indice de criticité : gravité × occurrence × détection. Plus une défaillance est difficile à détecter avant qu'elle produise ses effets, plus la note de détection est élevée.<\/p>","ana":"<p>A, C et D ne font pas partie de la formule.<\/p>","piege":"Appliquer à l'AMDEC la formule simple « probabilité × impact ». L'AMDEC ajoute la détection.","astuce":"AMDEC = trois facteurs : G × O × D.","regle":"Une défaillance grave, fréquente et difficile à détecter est la plus critique."},{"id":"7-12","t":7,"n":12,"lvl":2,"neg":false,"q":"<p>Quelle affirmation concernant la norme <strong>ISO 31000<\/strong> est exacte ?<\/p>","o":["Elle impose une certification obligatoire à toutes les administrations","Elle ne s'applique qu'aux banques","Elle traite uniquement des risques informatiques","Elle fournit des lignes directrices applicables à tout type d'organisation et n'est pas destinée à la certification"],"a":3,"just":"<p>ISO 31000 propose des principes, un cadre organisationnel et un processus de management des risques (contexte, identification, analyse, évaluation, traitement, avec communication-consultation et surveillance-revue tout au long du processus). Elle s'adresse à toute organisation, publique ou privée, et couvre tous les types de risques. Contrairement à l'ISO 9001, elle n'est pas conçue pour la certification.<\/p>","ana":"<ul><li>A : ce n'est pas une norme de certification.<\/li><li>B : elle s'applique à tout secteur.<\/li><li>C : elle couvre tous les risques ; la sécurité de l'information fait l'objet d'autres normes (famille ISO 27000).<\/li><\/ul>","piege":"Croire que toutes les normes ISO sont certifiables.","astuce":"ISO 31000 = lignes directrices ; ISO 9001 = certification qualité ; ISO 27001 = sécurité de l'information (certifiable).","regle":"ISO 31000 : principes, cadre et processus de management des risques, pour toute organisation, sans certification."},{"id":"7-13","t":7,"n":13,"lvl":2,"neg":false,"q":"<p>Une commune renonce à organiser un grand événement en plein air dans une zone régulièrement inondée, car aucune mesure ne permettrait de ramener le risque à un niveau acceptable. Quelle stratégie applique-t-elle ?<\/p>","o":["L'évitement","Le transfert","La réduction","L'acceptation"],"a":0,"just":"<p>Éviter un risque, c'est renoncer à l'activité qui l'engendre (ou la modifier profondément). Cette stratégie est choisie quand le risque dépasse l'appétence et qu'aucune autre mesure n'est suffisante.<\/p>","ana":"<ul><li>B : la commune ne fait supporter le risque par aucun tiers.<\/li><li>C : elle n'essaie pas de diminuer le risque ; elle supprime l'activité.<\/li><li>D : elle n'assume pas le risque, puisqu'elle renonce.<\/li><\/ul>","piege":"Confondre éviter (supprimer l'activité) et réduire (garder l'activité en limitant le risque).","astuce":"« Renoncer », « ne pas faire », « abandonner » → évitement.","regle":"Évitement = supprimer l'exposition en renonçant à l'activité."},{"id":"7-14","t":7,"n":14,"lvl":3,"neg":false,"q":"<p>Dans un programme de distribution d'aides, le risque de fraude (bénéficiaires fictifs, doubles inscriptions) est évalué avec une probabilité moyenne et un impact élevé, au-delà de l'appétence fixée. Quelle réponse est la plus adaptée ?<\/p>","o":["Accepter le risque, puisque sa probabilité n'est que moyenne","Supprimer le programme d'aide","Réduire le risque par des mesures de maîtrise : croisement des fichiers, séparation des tâches entre instruction et paiement, contrôles par échantillonnage, traçabilité des opérations","Transférer le risque à une compagnie d'assurance"],"a":2,"just":"<p>Le risque dépasse l'appétence : il ne peut pas être accepté. Le programme répond à une mission de service public : on ne peut pas simplement l'abandonner. La réduction est donc la stratégie adaptée, avec des contrôles préventifs (croisement de fichiers, séparation des tâches) et détectifs (contrôles a posteriori).<\/p>","ana":"<ul><li>A : un risque au-delà de l'appétence doit être traité.<\/li><li>B : l'évitement priverait les bénéficiaires légitimes d'une aide ; c'est disproportionné.<\/li><li>D : le risque de fraude sur des fonds publics ne se transfère pas facilement à un assureur et l'administration reste responsable.<\/li><\/ul>","piege":"Se focaliser sur la probabilité « moyenne » et oublier l'impact élevé.","astuce":"Mission de service public + risque élevé → généralement réduction (on garde l'activité et on la sécurise).","regle":"Quand on ne peut ni renoncer à l'activité ni accepter le risque, on le réduit."},{"id":"7-15","t":7,"n":15,"lvl":3,"neg":false,"q":"<p>Un établissement a élaboré sa cartographie des risques en 2019. Elle n'a jamais été mise à jour depuis, et la direction ne la consulte jamais avant de prendre ses décisions. Quelle est la principale faiblesse du dispositif ?<\/p>","o":["La cartographie aurait dû être confiée à un cabinet plus réputé","Le management des risques a été traité comme un exercice ponctuel : il doit être continu (revues périodiques, mises à jour) et intégré aux processus de décision","La cartographie contient sans doute trop de risques","Il n'y a aucune faiblesse, une cartographie étant valable indéfiniment"],"a":1,"just":"<p>Les risques évoluent (nouvelles missions, numérique, crises, changements réglementaires). Une cartographie figée devient vite obsolète. De plus, le management des risques n'a de valeur que s'il éclaire les décisions (budget, projets, priorités). ISO 31000 insiste sur la surveillance, la revue et l'intégration du management des risques dans tous les processus.<\/p>","ana":"<ul><li>A : le problème n'est pas l'auteur, mais l'absence de suivi et d'usage.<\/li><li>C : rien dans l'énoncé ne l'indique.<\/li><li>D : une cartographie de 2019 ne tient pas compte des évolutions survenues depuis.<\/li><\/ul>","piege":"Considérer la cartographie comme une fin en soi.","astuce":"« Jamais mise à jour » + « jamais consultée » → manque de continuité et d'intégration.","regle":"Le management des risques est un processus continu, intégré au pilotage et à la décision."},{"id":"7-16","t":7,"n":16,"lvl":3,"neg":false,"q":"<p>Le risque de destruction du centre de données d'un ministère par un séisme est jugé très peu probable, mais son impact serait catastrophique (perte de toutes les données, arrêt des services). Quelle est la réponse appropriée ?<\/p>","o":["Ignorer ce risque, puisqu'il est très peu probable","Déménager tous les services dans un autre pays","Attendre qu'un séisme se produise pour agir","Préparer la résilience : sauvegardes régulières stockées sur un site distant, site de secours et plan de continuité d'activité testé"],"a":3,"just":"<p>Les risques de faible probabilité mais d'impact extrême (catastrophes naturelles, cyberattaques majeures) ne peuvent pas être ignorés. On ne peut pas empêcher le séisme, mais on peut réduire son impact : sauvegardes externalisées, site de repli, plan de continuité d'activité (PCA) et plan de reprise (PRA), régulièrement testés.<\/p>","ana":"<ul><li>A : un impact catastrophique justifie des mesures, même si la probabilité est faible.<\/li><li>B : la réponse est disproportionnée et irréaliste.<\/li><li>C : agir après l'événement est trop tard : les données seraient perdues.<\/li><\/ul>","piege":"Raisonner uniquement avec la probabilité. Pour les risques majeurs, l'impact justifie à lui seul une préparation.","astuce":"Probabilité faible + impact catastrophique → préparation et résilience (PCA, sauvegardes, site de secours).","regle":"On ne peut pas toujours empêcher l'événement, mais on peut limiter ses conséquences."},{"id":"7-17","t":7,"n":17,"lvl":3,"neg":false,"q":"<p>Quel est le facteur le plus déterminant pour réussir le déploiement d'une démarche de management des risques dans un établissement public ?<\/p>","o":["L'engagement visible de la direction et le développement d'une culture du risque partagée par les managers et les agents","L'achat d'un logiciel de gestion des risques coûteux","La rédaction d'un manuel de 300 pages","La désignation d'un seul expert chargé de gérer tous les risques à la place des services"],"a":0,"just":"<p>Le management des risques ne fonctionne que s'il est porté au plus haut niveau (politique de gestion des risques, appétence définie, revue régulière en comité de direction) et approprié par les managers, qui sont les propriétaires des risques. La culture du risque encourage les agents à signaler les incidents et les anomalies sans crainte.<\/p>","ana":"<ul><li>B : un outil facilite la démarche, mais ne la crée pas.<\/li><li>C : un manuel trop lourd n'est pas lu ni appliqué.<\/li><li>D : un expert isolé ne peut pas gérer les risques de toute l'organisation ; ce sont les managers qui en sont responsables.<\/li><\/ul>","piege":"Croire que le management des risques est l'affaire d'un spécialiste ou d'un outil.","astuce":"« Déploiement réussi » → engagement de la direction + culture + appropriation par les managers.","regle":"Le management des risques est l'affaire de tous, sous l'impulsion de la direction."},{"id":"7-18","t":7,"n":18,"lvl":3,"neg":false,"q":"<p>Un responsable des risques nouvellement nommé identifie les risques de son établissement seul, depuis son bureau, à partir de la lecture des textes réglementaires. Quelle critique peut-on lui adresser ?<\/p>","o":["Aucune, car les textes suffisent à connaître tous les risques","Il aurait dû demander à l'audit externe d'établir la liste à sa place","Son identification sera incomplète : il faut combiner plusieurs méthodes (analyse des processus, entretiens et ateliers avec les opérationnels, historique des incidents, retours d'expérience)","Il aurait dû se limiter aux risques financiers"],"a":2,"just":"<p>Les agents de terrain connaissent les dysfonctionnements réels, les incidents passés et les points fragiles des processus. Une bonne identification croise plusieurs sources : analyse des processus, ateliers participatifs, entretiens, historique des incidents et réclamations, rapports d'audit et d'inspection.<\/p>","ana":"<ul><li>A : les textes ne révèlent pas les risques opérationnels réels.<\/li><li>B : l'audit externe n'a pas vocation à identifier les risques à la place de l'organisation.<\/li><li>D : les risques sont aussi opérationnels, juridiques, humains, informatiques, de réputation.<\/li><\/ul>","piege":"Croire qu'un expert seul peut identifier tous les risques.","astuce":"Identification des risques → méthodes multiples + implication des opérationnels.","regle":"Ceux qui font le travail connaissent le mieux les risques du travail."},{"id":"7-19","t":7,"n":19,"lvl":3,"neg":false,"q":"<p>Trois risques ont été évalués sur des échelles de 1 à 5 :<\/p><ul><li>Risque A : probabilité 4, impact 2 ;<\/li><li>Risque B : probabilité 2, impact 5 ;<\/li><li>Risque C : probabilité 3, impact 3.<\/li><\/ul><p>En utilisant la formule criticité = probabilité × impact, quel risque est prioritaire ?<\/p>","o":["Le risque A, car c'est le plus probable","Le risque B (criticité 10)","Le risque C (criticité 9)","Les trois risques ont la même criticité"],"a":1,"just":"<p>Calcul : A = 4 × 2 = 8 ; B = 2 × 5 = 10 ; C = 3 × 3 = 9. Le risque B a la criticité la plus élevée. De plus, son impact maximal renforce sa priorité.<\/p>","ana":"<ul><li>A : le risque A est le plus probable, mais sa criticité (8) est la plus faible.<\/li><li>C : le risque C (9) arrive en deuxième position.<\/li><li>D : les trois valeurs sont différentes.<\/li><\/ul>","piege":"Choisir le risque le plus probable au lieu de calculer la criticité.","astuce":"Calcule toujours P × I pour chaque risque avant de répondre. À criticité égale, privilégie le risque à l'impact le plus fort.","regle":"Priorité = criticité la plus élevée, avec une attention particulière aux impacts graves."},{"id":"7-20","t":7,"n":20,"lvl":3,"neg":false,"q":"<p>Un établissement public veut déployer un dispositif de management des risques. Quelle séquence est la plus cohérente ?<\/p>","o":["Acheter un logiciel → remplir le registre → archiver","Établir la liste des risques → la classer sans suite","Rédiger un plan d'action → identifier ensuite les risques → fixer les objectifs","Engagement de la direction et politique de gestion des risques → contexte et objectifs → identification avec les équipes → analyse et évaluation (cartographie) → plans de traitement avec des propriétaires → indicateurs et suivi → revue périodique et communication"],"a":3,"just":"<p>Cette séquence reprend le processus de la norme ISO 31000 : établir le contexte et les objectifs (on ne peut pas identifier des risques sans savoir ce qu'on cherche à atteindre), identifier, analyser, évaluer, traiter, puis surveiller et réexaminer, avec une communication continue. L'engagement de la direction en est la condition préalable.<\/p>","ana":"<ul><li>A : l'outil passe avant la démarche et le registre est archivé sans usage.<\/li><li>B : identifier sans traiter ni suivre ne sert à rien.<\/li><li>C : l'ordre est inversé : les objectifs viennent en premier, le plan d'action en dernier.<\/li><\/ul>","piege":"Oublier que les risques s'identifient <strong>par rapport aux objectifs<\/strong>.","astuce":"Vérifie le début (engagement, objectifs) et la fin (suivi, revue). Une séquence qui se termine par « archiver » ou « classer sans suite » est fausse.","regle":"Contexte → identification → analyse → évaluation → traitement → suivi, avec communication continue."},{"id":"8-1","t":8,"n":1,"lvl":1,"neg":false,"q":"<p>Qu'est-ce qui distingue une <strong>équipe<\/strong> d'un simple <strong>groupe<\/strong> de personnes ?<\/p>","o":["Le nombre de membres, une équipe comptant toujours plus de dix personnes","Un objectif commun, l'interdépendance et la complémentarité de ses membres, et une responsabilité partagée des résultats","Le fait que tous les membres aient le même grade","Le fait que les membres travaillent dans le même bureau"],"a":1,"just":"<p>Un groupe est un ensemble de personnes réunies (par exemple dans un même service) qui peuvent travailler chacune de leur côté. Une équipe partage un objectif, ses membres dépendent les uns des autres pour l'atteindre, leurs compétences se complètent et ils se sentent collectivement responsables du résultat.<\/p>","ana":"<ul><li>A : la taille ne définit pas l'équipe ; une équipe efficace compte souvent moins de dix personnes.<\/li><li>C : la diversité des profils est plutôt un atout.<\/li><li>D : une équipe peut travailler à distance.<\/li><\/ul>","piege":"Croire qu'un service ou un bureau forme automatiquement une équipe.","astuce":"Équipe = « objectif commun + interdépendance ».","regle":"On passe du groupe à l'équipe quand les membres partagent un but et ont besoin les uns des autres pour l'atteindre."},{"id":"8-2","t":8,"n":2,"lvl":1,"neg":false,"q":"<p>Une équipe projet nouvellement constituée connaît, après quelques semaines, des tensions : désaccords sur la répartition des rôles, rivalités et remise en cause des méthodes. Selon le modèle de Tuckman, à quelle phase se trouve-t-elle ?<\/p>","o":["La formation (forming)","La normalisation (norming)","La performance (performing)","La confrontation (storming)"],"a":3,"just":"<p>Bruce Tuckman décrit cinq phases : <strong>formation<\/strong> (les membres se découvrent, prudence et politesse), <strong>confrontation<\/strong> (tensions, conflits sur les rôles et le pouvoir), <strong>normalisation<\/strong> (règles et rôles acceptés, cohésion), <strong>performance<\/strong> (l'équipe fonctionne de façon autonome et efficace), <strong>dissolution<\/strong> (fin du projet). Les tensions décrites sont typiques de la confrontation.<\/p>","ana":"<ul><li>A : la formation est une phase de découverte, plutôt calme.<\/li><li>B : la normalisation suit la résolution des tensions.<\/li><li>C : la performance suppose une équipe
