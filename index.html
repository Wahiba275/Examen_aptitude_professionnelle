<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Jeu de QCM corrigés sur les 12 thèmes du management public : +1 point par bonne réponse, −1 par erreur, correction après chaque question.">
<style>
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Grade par grade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout : un dossier administratif posé sur le bureau — une colonne centrée, un bandeau de grade en haut, des tampons pour valider. */
:root {
  --paper: #edf2ef;
  --card: #ffffff;
  --ink: #13211b;
  --muted: #56675f;
  --line: #d2dcd6;
  --accent: #0a5c44;
  --accent-ink: #ffffff;
  --accent-soft: #dcebe4;
  --seal: #8f5d00;
  --seal-soft: #f5e9d2;
  --ok: #17703f;
  --ok-soft: #e0f1e7;
  --bad: #b42318;
  --bad-soft: #fbe6e3;
  --shadow: 0 1px 2px rgba(19, 33, 27, .06), 0 10px 28px rgba(19, 33, 27, .07);
  --f-display: "Archivo", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1512; --card: #15201b; --ink: #e4ede8; --muted: #9aaea5; --line: #2a3a33;
    --accent: #46c095; --accent-ink: #05211a; --accent-soft: #163128;
    --seal: #e3a93f; --seal-soft: #31260f;
    --ok: #62d293; --ok-soft: #14301f; --bad: #ff8d80; --bad-soft: #3a1714;
    --shadow: 0 1px 0 rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1512; --card: #15201b; --ink: #e4ede8; --muted: #9aaea5; --line: #2a3a33;
  --accent: #46c095; --accent-ink: #05211a; --accent-soft: #163128;
  --seal: #e3a93f; --seal-soft: #31260f;
  --ok: #62d293; --ok-soft: #14301f; --bad: #ff8d80; --bad-soft: #3a1714;
  --shadow: 0 1px 0 rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 1.0625rem;
  line-height: 1.55;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--card);
}
.wrap {
  max-width: 820px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--seal); outline-offset: 2px; border-radius: 6px; }
strong { font-weight: 700; }
sup { font-size: .7em; }

/* Bandeau de grade */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--card); border-bottom: 1px solid var(--line);
}
.bar .wrap { display: flex; align-items: center; gap: 14px; padding-block: 10px; }
.brand {
  background: none; border: 0; padding: 0; cursor: pointer;
  font-family: var(--f-display); font-weight: 900; font-stretch: 72%;
  font-size: 1.25rem; letter-spacing: .02em; text-transform: uppercase; color: var(--accent);
  white-space: nowrap;
}
.rank { flex: 1; min-width: 0; display: grid; gap: 4px; }
.rank-top { display: flex; justify-content: space-between; gap: 8px; font-size: .82rem; }
.rank-top b { font-family: var(--f-display); font-stretch: 85%; font-size: .95rem; }
.rank-top span { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter { height: 6px; background: var(--accent-soft); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .5s ease; }
.icon-btn {
  border: 1px solid var(--line); background: var(--card); border-radius: 8px;
  padding: 6px 10px; cursor: pointer; font-size: .85rem; font-weight: 700; white-space: nowrap;
}
.icon-btn:hover { border-color: var(--accent); }

main { padding-block: 22px 56px; display: grid; gap: 28px; }

/* Typographie */
.eyebrow {
  font-family: var(--f-mono); font-size: .74rem; letter-spacing: .08em; text-transform: uppercase;
  color: var(--seal); margin: 0;
}
h1, h2, h3 { text-wrap: balance; margin: 0; }
.hero h1 {
  font-family: var(--f-display); font-weight: 900; font-stretch: 68%;
  font-size: clamp(2.8rem, 10vw, 5rem); line-height: .92; text-transform: uppercase; letter-spacing: -.005em;
  color: var(--ink);
}
.hero h1 em { font-style: normal; color: var(--accent); }
.lede { margin: 12px 0 0; max-width: 58ch; color: var(--muted); font-size: 1.08rem; }
.sec { font-family: var(--f-display); font-stretch: 80%; font-weight: 800; font-size: 1.35rem; }
.sec-sub { margin: 4px 0 14px; color: var(--muted); font-size: .95rem; }

/* Échelle des grades (héros) */
.ladder { display: flex; gap: 4px; margin-top: 18px; align-items: flex-end; }
.ladder span {
  flex: 1; border-radius: 3px; background: var(--line);
}
.ladder span.on { background: var(--accent); }
.ladder span.here { background: var(--seal); }
.ladder-cap { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); margin-top: 6px; gap: 8px; }
.ladder-cap b { color: var(--ink); }

/* Cartes */
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: var(--shadow); padding: 20px;
}
.tag {
  display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 700;
  padding: 3px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--accent);
}
.tag.seal { background: var(--seal-soft); color: var(--seal); }
.code { font-family: var(--f-mono); font-size: .78rem; color: var(--muted); letter-spacing: .03em; }

/* Modes */
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.mode {
  text-align: left; cursor: pointer; background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r); padding: 16px; display: grid; gap: 6px; align-content: start;
  transition: border-color .15s, transform .15s;
}
.mode:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-2px); }
.mode:disabled { opacity: .55; cursor: not-allowed; }
.mode h3 { font-family: var(--f-display); font-stretch: 82%; font-weight: 800; font-size: 1.12rem; }
.mode p { margin: 0; font-size: .9rem; color: var(--muted); }
.mode .count { font-family: var(--f-mono); font-size: .8rem; color: var(--seal); }

/* Préparation de la partie */
.setup { display: grid; gap: 22px; }
.step { display: grid; gap: 4px; }
.step .sec { display: flex; align-items: center; gap: 10px; }
.step-n {
  width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; flex: none;
  background: var(--accent); color: var(--accent-ink); font-family: var(--f-mono); font-size: .85rem; font-stretch: 100%;
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1.5px solid var(--line); background: var(--card); border-radius: 99px; padding: 7px 13px;
  font-weight: 700; font-size: .9rem; cursor: pointer; transition: border-color .12s, background .12s;
}
.chip:hover { border-color: var(--accent); }
.chip .n { font-family: var(--f-mono); font-size: .74rem; margin-right: 6px; color: var(--muted); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.on .n { color: var(--accent-ink); opacity: .8; }
.chip.all { border-style: dashed; }
.chip.all.on { border-style: solid; }
.sel-sum { margin: 10px 0 0; font-size: .92rem; color: var(--muted); }
.sel-sum b { color: var(--ink); }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; text-decoration: underline; cursor: pointer; }

/* Thèmes */
.themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.theme {
  text-align: left; cursor: pointer; background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r); padding: 14px; display: grid; gap: 4px; align-content: start;
  transition: border-color .15s;
}
.theme:hover { border-color: var(--accent); }
.t-num { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); letter-spacing: .05em; }
.t-name { font-family: var(--f-display); font-stretch: 85%; font-weight: 800; font-size: 1.05rem; line-height: 1.2; }
.t-meta { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.stars { letter-spacing: 2px; font-size: 1rem; color: var(--line); }
.stars .f { color: var(--seal); }

/* Question */
.q-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.q-stats { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.stat {
  display: grid; justify-items: center; min-width: 64px; padding: 4px 10px; border-radius: 8px;
  background: var(--card); border: 1px solid var(--line); font-variant-numeric: tabular-nums;
}
.stat small { font-size: .66rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.stat b { font-family: var(--f-display); font-stretch: 85%; font-size: 1.1rem; line-height: 1.1; }
.stat.hot b { color: var(--seal); }
.lives { display: inline-flex; gap: 4px; }
.lives i { width: 12px; height: 12px; border-radius: 50%; background: var(--bad); display: block; }
.lives i.off { background: var(--line); }
.timer {
  --p: 1; position: relative; width: 52px; height: 52px; border-radius: 50%;
  background: conic-gradient(var(--accent) calc(var(--p) * 360deg), var(--line) 0);
  display: grid; place-items: center; font-family: var(--f-mono); font-size: .8rem; font-weight: 600;
}
.timer::before { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--card); }
.timer span { position: relative; }
.timer.low { background: conic-gradient(var(--bad) calc(var(--p) * 360deg), var(--line) 0); }
.progress { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--seal); transition: width .3s; }

.qcard { position: relative; display: grid; gap: 16px; overflow: hidden; }
.qcard.done .qmeta { padding-right: 150px; }
.qmeta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.prompt { font-size: 1.12rem; }
.prompt p { margin: 0 0 8px; }
.prompt p:last-child { margin-bottom: 0; }
.prompt ul { margin: 4px 0 10px; padding-left: 22px; }

.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; text-align: left;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 9px; padding: 12px 14px;
  cursor: pointer; transition: border-color .12s, background .12s; line-height: 1.45;
}
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt .l {
  width: 30px; height: 30px; display: grid; place-items: center; border-radius: 7px;
  font-family: var(--f-mono); font-weight: 600; background: var(--accent-soft); color: var(--accent);
}
.opt:disabled { cursor: default; }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.correct .l { background: var(--ok); color: var(--card); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .l { background: var(--bad); color: var(--card); }
.opt.dim { opacity: .55; }
.opt.out { opacity: .3; text-decoration: line-through; }

.jokers { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.joker {
  border: 1px dashed var(--seal); color: var(--seal); background: transparent; border-radius: 8px;
  padding: 6px 12px; font-weight: 700; font-size: .88rem; cursor: pointer;
}
.joker:hover:not(:disabled) { background: var(--seal-soft); }
.joker:disabled { opacity: .4; cursor: not-allowed; }
.kbd { font-size: .8rem; color: var(--muted); margin-left: auto; }
.hint {
  border-left: 4px solid var(--seal); background: var(--seal-soft); padding: 10px 14px; border-radius: 0 8px 8px 0;
  font-size: .96rem;
}
.hint b { color: var(--seal); }

/* Tampon */
.stamp {
  position: absolute; top: 18px; right: 18px; z-index: 2; pointer-events: none;
  font-family: var(--f-display); font-weight: 900; font-stretch: 70%; text-transform: uppercase;
  font-size: 1.35rem; letter-spacing: .08em; padding: 4px 14px;
  border: 3px double currentColor; border-radius: 6px; transform: rotate(-10deg);
  animation: stamp .38s cubic-bezier(.2, 1.6, .4, 1) both;
  background: color-mix(in srgb, var(--card) 70%, transparent);
}
.stamp.ok { color: var(--ok); }
.stamp.bad { color: var(--bad); }
.stamp.big { position: static; display: inline-block; font-size: 1.8rem; margin: 6px 0 10px; }
@keyframes stamp { from { transform: rotate(-10deg) scale(2.2); opacity: 0; } to { transform: rotate(-10deg) scale(1); opacity: 1; } }

/* Correction */
.fb { display: grid; gap: 12px; border-top: 1px solid var(--line); padding-top: 16px; }
.verdict { margin: 0; font-weight: 700; font-size: 1.05rem; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }
.fb-block { display: grid; gap: 4px; }
.fb-block h4 {
  margin: 0; font-family: var(--f-mono); font-size: .74rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted);
}
.fb-block p, .fb-block ul { margin: 0; }
.fb-block ul { padding-left: 20px; }
.fb-block li { margin: 3px 0; }
.fb-block.rule {
  background: var(--accent-soft); border-radius: 8px; padding: 12px 14px;
}
.fb-block.rule h4 { color: var(--accent); }
.fb-block.trap h4 { color: var(--bad); }
.fb-block.tip h4 { color: var(--seal); }
details.ana { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
details.ana summary { cursor: pointer; font-weight: 700; }
details.ana[open] summary { margin-bottom: 8px; }
details.ana ul { margin: 0; padding-left: 20px; }
details.ana p { margin: 0; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn {
  border: 1.5px solid var(--accent); background: transparent; color: var(--accent);
  border-radius: 9px; padding: 10px 18px; font-weight: 700; cursor: pointer;
}
.btn:hover { background: var(--accent-soft); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.ghost { border-color: var(--line); color: var(--ink); }
.btn.danger { border-color: var(--bad); color: var(--bad); }

/* Question éclair */
.ec-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; margin-bottom: 12px; }
.ec-fb { margin-top: 14px; display: grid; gap: 12px; }

/* Briefing */
.brief h1 { font-family: var(--f-display); font-stretch: 78%; font-weight: 900; font-size: clamp(1.7rem, 5vw, 2.4rem); line-height: 1.05; margin-top: 6px; }
.brief-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.brief-grid ul, .brief-grid ol { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 6px; font-size: .96rem; }
.brief-grid h3 { font-family: var(--f-display); font-stretch: 82%; font-weight: 800; font-size: 1.1rem; }

/* Bilan */
.res-head { display: grid; gap: 6px; }
.res-score {
  font-family: var(--f-display); font-weight: 900; font-stretch: 70%; font-size: clamp(3rem, 12vw, 5rem);
  line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums;
}
.res-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.res-grid .stat { justify-items: start; padding: 10px 12px; }
.res-stars { font-size: 2rem; letter-spacing: 6px; color: var(--line); }
.res-stars .f { color: var(--seal); }
.miss { display: grid; gap: 10px; }
.miss-item { border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; display: grid; gap: 4px; background: var(--card); }
.miss-item .ans { font-weight: 700; color: var(--ok); }
.miss-item p { margin: 0; }

/* Dossier */
.ladder-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ladder-list li {
  display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 10px;
  padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card);
  font-variant-numeric: tabular-nums;
}
.ladder-list li .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--line); justify-self: center; }
.ladder-list li.done .dot { background: var(--accent); }
.ladder-list li.now { border-color: var(--seal); background: var(--seal-soft); }
.ladder-list li.now .dot { background: var(--seal); }
.ladder-list li span:last-child { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.badge { border: 1px solid var(--line); border-radius: 9px; padding: 12px; display: grid; gap: 6px; background: var(--card); }
.badge .seal-ico {
  width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
  border: 3px double var(--line); color: var(--muted);
  font-family: var(--f-display); font-weight: 900; font-stretch: 75%; font-size: .95rem;
}
.badge.on .seal-ico { border-color: var(--seal); color: var(--seal); background: var(--seal-soft); transform: rotate(-8deg); }
.badge b { font-size: .95rem; }
.badge small { color: var(--muted); font-size: .82rem; line-height: 1.35; }
.badge:not(.on) b { color: var(--muted); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; align-items: start; }

/* Toasts et arrêté */
#toasts {
  position: fixed; z-index: 30; display: grid; gap: 8px;
  top: calc(env(safe-area-inset-top, 0px) + 70px); right: max(16px, env(safe-area-inset-right, 0px));
  width: min(320px, calc(100vw - 32px));
}
.toast {
  background: var(--card); border: 1px solid var(--seal); border-left-width: 5px; border-radius: 8px;
  padding: 10px 14px; box-shadow: var(--shadow); animation: slide .3s ease both; font-size: .92rem;
}
.toast b { display: block; color: var(--seal); font-family: var(--f-mono); font-size: .72rem; letter-spacing: .07em; text-transform: uppercase; }
@keyframes slide { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }
#overlay {
  position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, var(--ink) 55%, transparent);
  display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
#overlay[hidden], [hidden] { display: none !important; }
.arrete {
  background: var(--card); color: var(--ink); max-width: 440px; width: 100%; border-radius: 6px; padding: 26px;
  border: 1px solid var(--line); box-shadow: var(--shadow); text-align: center; display: grid; gap: 6px; justify-items: center;
}
.arrete h2 { font-family: var(--f-display); font-weight: 900; font-stretch: 72%; text-transform: uppercase; font-size: 2rem; color: var(--accent); }
.arrete p { margin: 0; }
.ar-ref { font-family: var(--f-mono); font-size: .78rem; color: var(--muted); }
.ar-grade { font-family: var(--f-display); font-weight: 800; font-stretch: 85%; font-size: 1.6rem; }

@media (max-width: 520px) {
  .rank-top span { display: none; }
  .bar .wrap { gap: 10px; }
  .brand { font-size: .98rem; }
  .icon-btn { padding: 5px 8px; font-size: .8rem; }
  .qcard.done .qmeta { padding-right: 104px; }
  .stamp { font-size: 1.05rem; top: 12px; right: 12px; }
  .kbd { display: none; }
  .card { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<header class="bar">
  <div class="wrap">
    <button class="brand" data-act="home" aria-label="Accueil">Grade par grade</button>

<script>
const DATA = {"themes":[{"id":1,"short":"Modernisation","title":"Les nouveaux axes de modernisation des organisations publiques (impératifs, enjeux, outils)","keys":["<strong>Résultats, performance, objectifs, responsabilisation<\/strong> → NPM.","<strong>Moyens, ressources, coûts<\/strong> → efficience ; <strong>objectifs atteints<\/strong> → efficacité.","<strong>Hiérarchie, services extérieurs<\/strong> → déconcentration ; <strong>personnalité morale, élus<\/strong> → décentralisation.","<strong>Gaspillage, valeur ajoutée, flux<\/strong> → lean ; <strong>meilleures pratiques<\/strong> → benchmarking.","<strong>Réseaux, partenariat, co-construction<\/strong> → Nouvelle gouvernance publique.","<strong>Autonomie, souplesse<\/strong> → contrepartie : objectifs et reddition des comptes.","<strong>Programme, projet et rapport de performance<\/strong> → LOF 130-13."],"traps":["Les négations (« n'en fait pas partie », « sauf », « inexacte ») : entoure-les.","Les numéros de loi consécutifs (54-19 et 55-19).","Les bons éléments dans le mauvais ordre (questions de séquence).","Les propositions extrêmes : « absolu », « toujours », « jamais », « librement ».","Confondre un indicateur d'activité, qui semble positif, avec un indicateur de résultat.","Croire que l'efficience est toujours compatible avec l'égalité et la couverture territoriale.","Confondre autonomie de gestion et absence de contrôle."]},{"id":2,"short":"Transformation","title":"La conduite de la transformation organisationnelle dans les établissements publics : concilier innovation, agilité et continuité du service public","keys":["<strong>Mission spécifique, personnalité morale<\/strong> → établissement public ; <strong>capital<\/strong> → entreprise publique.","<strong>Prévu par les textes<\/strong> → tutelle ; <strong>instructions<\/strong> → hiérarchie.","<strong>Parallèle, progressif, mode dégradé, PCA, retour arrière<\/strong> → continuité.","<strong>Itérations, sprints, backlog, MVP<\/strong> → agilité.","<strong>Empathie, prototype, usager au centre<\/strong> → design thinking.","<strong>À la fois innover et fiabiliser<\/strong> → ambidextrie.","<strong>Deux chefs<\/strong> → structure matricielle, dualité de commandement."],"traps":["Croire que l'agilité autorise à contourner la loi (marchés publics, règles budgétaires).","Croire que la transformation justifie une interruption du service.","Confondre tutelle et hiérarchie.","Assimiler le Scrum Master à un chef hiérarchique.","Considérer que tout projet numérique est une innovation de rupture.","Négliger une partie prenante puissante sous prétexte qu'elle est peu intéressée.","Supprimer l'ancien canal (guichet) dès le lancement du nouveau."]},{"id":3,"short":"GPEEC","title":"La gouvernance des compétences et la gestion prévisionnelle des emplois, des effectifs et des compétences (GPEEC) au service de la performance des organisations publiques","keys":["<strong>Prévisionnelle, anticipation, moyen terme<\/strong> → GPEEC.","<strong>Ensemble de postes<\/strong> → emploi ; <strong>statut, échelle<\/strong> → grade.","<strong>Mobiliser en situation<\/strong> → compétence.","<strong>Nombre suffisant mais compétences absentes<\/strong> → écart qualitatif.","<strong>Avancements, à effectif constant<\/strong> → GVT ; <strong>départs de seniors, arrivées de juniors<\/strong> → noria.","<strong>Poste clé, départ prévu<\/strong> → plan de succession.","<strong>Seul à maîtriser<\/strong> → transfert de savoirs, tutorat."],"traps":["Assimiler GPEEC et réduction d'effectifs.","Ne voir que l'écart quantitatif et ignorer l'écart qualitatif.","Inverser GVT et effet de noria.","Penser que la GPEEC est l'affaire exclusive de la DRH.","Construire la GPEEC sans lien avec la stratégie.","Croire qu'un recrutement suffit à remplacer un savoir tacite.","Transposer au fonctionnaire titulaire des solutions du secteur privé (licenciement)."]},{"id":4,"short":"Intelligence collective","title":"Le développement des pratiques collaboratives et l'intelligence collective","keys":["<strong>Synergie, 1 + 1 &gt; 2<\/strong> → intelligence collective.","<strong>Groupe soudé, personne n'ose contredire<\/strong> → pensée de groupe.","<strong>On ne sait pas qui fait quoi, effort en baisse<\/strong> → paresse sociale.","<strong>Client, consultants, pairs<\/strong> → codéveloppement.","<strong>Anonymat, experts, tours<\/strong> → Delphi.","<strong>Tables, rotations, grand groupe<\/strong> → world café.","<strong>Aucune objection<\/strong> → consentement.","<strong>Avis recueillis, autorité décide seule<\/strong> → consultation."],"traps":["Croire que l'unanimité garantit une bonne décision.","Utiliser coopération et collaboration comme synonymes.","Associer le chapeau rouge au danger.","Croire qu'un outil numérique suffit à créer la collaboration.","Confondre consultation et co-décision.","Oublier le retour aux participants après une démarche participative.","Choisir une méthode inadaptée à la taille du groupe ou au délai."]},{"id":5,"short":"Digital et données","title":"La transformation digitale et l'innovation (impacts, gouvernance et management des données publiques)","keys":["<strong>Repenser, de bout en bout, culture<\/strong> → transformation digitale.","<strong>Gratuit, réutilisable, format ouvert<\/strong> → open data.","<strong>Inaccessible<\/strong> → disponibilité ; <strong>modifié<\/strong> → intégrité ; <strong>divulgué<\/strong> → confidentialité.","<strong>Ne pas redemander à l'usager<\/strong> → once only, interopérabilité.","<strong>Données excessives pour la finalité<\/strong> → proportionnalité.","<strong>Même personne, informations différentes<\/strong> → qualité, référentiel unique.","<strong>Urgence + mot de passe + lien<\/strong> → hameçonnage.","<strong>Décision automatique inexpliquée<\/strong> → explicabilité, supervision humaine."],"traps":["Confondre dématérialisation et transformation digitale.","Croire que l'open data concerne toutes les données, y compris personnelles.","Penser que le consentement suffit à justifier une collecte excessive.","Confondre CNDP et DGSSI.","Croire qu'un algorithme est objectif par nature.","Croire que la cybersécurité est uniquement technique.","Confondre corrélation et causalité."]},{"id":6,"short":"Performance","title":"La culture et la mesure de la performance de l'action publique","keys":["<strong>Chiffre + date<\/strong> → objectif SMART.","<strong>Peu d'indicateurs, pour décider<\/strong> → tableau de bord.","<strong>Finances, usagers, processus, apprentissage<\/strong> → Balanced Scorecard.","<strong>Coût unitaire<\/strong> → efficience, contribuable.","<strong>Ne répond pas aux besoins<\/strong> → pertinence.","<strong>Deux politiques contradictoires<\/strong> → cohérence externe.","<strong>Le chiffre s'améliore mais le service se dégrade<\/strong> → effet pervers.","<strong>Échange entre niveaux sur objectifs et moyens<\/strong> → dialogue de gestion."],"traps":["Confondre performance publique et rentabilité.","Prendre une intention pour un objectif SMART.","Croire qu'un bon chiffre prouve une bonne performance (effets pervers).","Juger un indicateur sans référence ni cible.","Confondre pertinence et efficacité.","Inverser projet de performance et rapport de performance.","Utiliser les indicateurs pour sanctionner au lieu d'améliorer."]},{"id":7,"short":"Risques","title":"Le management des risques (concepts, outils, déploiement)","keys":["<strong>Incertitude + objectifs<\/strong> → risque.","<strong>P × I<\/strong> → criticité.","<strong>Après contrôles<\/strong> → risque résiduel.","<strong>Assurance, contrat<\/strong> → transfert ; <strong>renoncer<\/strong> → évitement ; <strong>contrôles, formation<\/strong> → réduction.","<strong>Assurance indépendante<\/strong> → audit interne (3<sup>e<\/sup> ligne).","<strong>Signal d'alerte précoce<\/strong> → KRI.","<strong>Procédure<\/strong> → Méthode (5M).","<strong>Faible probabilité, impact catastrophique<\/strong> → PCA, sauvegardes, site de secours."],"traps":["Confondre risque et incident.","Croire que l'assurance réduit le risque (elle le transfère).","Choisir le risque le plus probable plutôt que le plus critique.","Ignorer les risques rares mais catastrophiques.","Croire que l'audit interne gère les risques.","Croire qu'ISO 31000 est certifiable.","Traiter la cartographie comme un exercice ponctuel."]},{"id":8,"short":"Équipes","title":"La gestion des équipes","keys":["<strong>Objectif commun, interdépendance<\/strong> → équipe.","<strong>Tensions sur les rôles<\/strong> → storming.","<strong>Chacun cède<\/strong> → compromis ; <strong>les deux gagnent<\/strong> → collaboration.","<strong>Débutant motivé<\/strong> → directif ; <strong>expert motivé<\/strong> → délégatif.","<strong>9,9<\/strong> → management d'équipe.","<strong>Décrire les faits d'abord<\/strong> → DESC.","<strong>Reformulation<\/strong> → écoute active.","<strong>Important non urgent<\/strong> → planifier."],"traps":["Croire que la responsabilité finale se délègue.","Considérer les conflits de la phase de confrontation comme un échec.","Confondre compromis et collaboration.","Croire qu'un seul style de management convient à tous.","Confondre motivation et compétence.","Sanctionner avant de comprendre.","Laisser l'urgent chasser l'important."]},{"id":9,"short":"Motivation","title":"La motivation (concepts, processus, incidences)","keys":["<strong>Contexte du travail<\/strong> → hygiène ; <strong>contenu du travail<\/strong> → moteurs.","<strong>« Je n'y arriverai pas »<\/strong> → expectation ; <strong>« ça ne changera rien »<\/strong> → instrumentalité ; <strong>« ça ne m'intéresse pas »<\/strong> → valence.","<strong>Comparaison avec un collègue<\/strong> → Adams.","<strong>Objectif précis et stimulant<\/strong> → Locke.","<strong>Autonomie, compétence, appartenance<\/strong> → Deci et Ryan.","<strong>Travail fragmenté<\/strong> → Hackman et Oldham.","<strong>Intérêt général, servir<\/strong> → motivation de service public.","<strong>Récompense ajoutée puis retirée<\/strong> → effet d'éviction."],"traps":["Croire que l'argent est le principal moteur de la motivation.","Confondre « moins d'insatisfaction » et « plus de motivation » (Herzberg).","Confondre expectation et instrumentalité (Vroom).","Inverser théorie X et théorie Y.","Croire qu'ajouter une récompense augmente toujours la motivation (effet d'éviction).","Répondre à la démotivation par le contrôle et la sanction.","Appliquer Maslow de façon trop rigide."]},{"id":10,"short":"Changement","title":"Le processus de changement (faisabilité, leviers, freins, pilotage)","keys":["<strong>Dégel, regel<\/strong> → Lewin ; <strong>urgence, coalition, ancrage<\/strong> → Kotter.","<strong>Colère, déni, marchandage<\/strong> → courbe du deuil.","<strong>Peut-on ?<\/strong> → faisabilité ; <strong>faut-il ?<\/strong> → opportunité.","<strong>Seul à maîtriser<\/strong> → zone d'incertitude (Crozier).","<strong>Triangle d'or<\/strong> → sociodynamique (Fauvet).","<strong>Changer les règles du jeu<\/strong> → type 2.","<strong>Usage effectif<\/strong> → appropriation.","<strong>Rumeurs<\/strong> → défaut de communication."],"traps":["Oublier la phase d'ancrage (recristallisation).","Commencer par le « comment » sans expliquer le « pourquoi ».","Considérer toute résistance comme irrationnelle.","Concentrer ses efforts sur les opposants irréductibles.","Confondre déploiement et appropriation.","Confondre volonté politique et faisabilité.","Oublier l'encadrement intermédiaire."]},{"id":11,"short":"Contrôle interne","title":"La mise en place d'un dispositif de contrôle interne efficace","keys":["<strong>Assurance raisonnable, tout le personnel<\/strong> → contrôle interne (COSO).","<strong>Une seule personne fait tout<\/strong> → séparation des tâches.","<strong>Rapprochement, inventaire<\/strong> → contrôle détectif ; <strong>autorisation, habilitation<\/strong> → préventif.","<strong>Intégrité, exemplarité<\/strong> → environnement de contrôle.","<strong>Ne savent pas à qui signaler<\/strong> → information et communication.","<strong>Recommandations non suivies<\/strong> → pilotage.","<strong>Deux agents s'entendent<\/strong> → collusion.","<strong>Ordre oral du directeur sans justificatifs<\/strong> → contournement par la direction."],"traps":["Croire que le contrôle interne est un service.","Croire qu'il garantit l'absence de fraude (assurance raisonnable seulement).","Confondre contrôle interne et audit interne.","Croire que le comptable juge l'opportunité des dépenses.","Croire que plus de contrôles signifie un meilleur contrôle (proportionnalité).","Oublier que les règles s'appliquent aussi à la direction.","Commencer par les procédures au lieu des risques."]},{"id":12,"short":"Management","title":"L'évolution actuelle des modes de management efficace","keys":["<strong>Chronométrage, one best way<\/strong> → Taylor ; <strong>POCCC<\/strong> → Fayol ; <strong>Hawthorne<\/strong> → Mayo.","<strong>Objectifs négociés, autonomie sur les moyens<\/strong> → Drucker (DPO).","<strong>Vision, inspirer, exemplarité<\/strong> → transformationnel ; <strong>si… alors récompense<\/strong> → transactionnel.","<strong>Au service de l'équipe<\/strong> → leader serviteur.","<strong>Questions plutôt que réponses<\/strong> → coaching.","<strong>Rôles, cercles, consentement<\/strong> → holacratie.","<strong>Point quotidien, kanban, rétrospective<\/strong> → agilité.","<strong>Bien-être + performance<\/strong> → QVCT.","<strong>Cela dépend du contexte<\/strong> → contingence."],"traps":["Confondre Taylor et Fayol.","Retenir l'éclairage plutôt que le facteur humain dans l'expérience Hawthorne.","Confondre leadership transformationnel et transactionnel.","Croire que les organisations « sans chef » n'ont pas de règles.","Croire que bienveillance signifie absence d'exigence.","Transposer un modèle du privé dans le public sans l'adapter.","Croire qu'il existe un modèle de management universel."]}],"questions":[{"id":"1-1","t":1,"n":1,"lvl":1,"neg":false,"q":"<p>Le courant du « New Public Management » (Nouvelle gestion publique) vise principalement à :<\/p>","o":["Renforcer le contrôle hiérarchique a priori sur le respect des procédures","Introduire dans l'administration des méthodes de gestion inspirées du secteur privé, centrées sur les résultats","Transférer l'ensemble des services publics au secteur privé","Remplacer le droit administratif par le droit commercial"],"a":1,"just":"<p>Le NPM, apparu dans les années 1980 (Royaume-Uni, Nouvelle-Zélande), veut passer d'une administration de moyens et de procédures à une administration de résultats. Il s'appuie sur des objectifs, des indicateurs, la responsabilisation des gestionnaires, la contractualisation et l'orientation vers l'usager.<\/p>","ana":"<ul><li>A : c'est l'inverse. Le contrôle a priori des procédures caractérise le modèle bureaucratique classique (Weber). Le NPM privilégie le contrôle a posteriori des résultats.<\/li><li>C : le NPM peut encourager l'externalisation, mais il ne supprime pas le service public. C'est une exagération.<\/li><li>D : le NPM change les méthodes de gestion, pas le régime juridique de l'administration.<\/li><\/ul>","piege":"Confondre « s'inspirer du privé » et « privatiser ». Le NPM emprunte des outils au privé, il ne transfère pas l'administration au privé.","astuce":"Les mots « résultats », « performance », « objectifs » et « responsabilisation » signent le NPM. Élimine toute proposition absolue (« l'ensemble », « remplacer »).","regle":"NPM = passer d'une logique de moyens à une logique de résultats, avec des outils de gestion empruntés au privé."},{"id":"1-2","t":1,"n":2,"lvl":1,"neg":false,"q":"<p>Dans le vocabulaire de la performance publique, l'<strong>efficience<\/strong> désigne :<\/p>","o":["Le rapport entre les résultats obtenus et les objectifs fixés","La capacité à dépenser la totalité du budget alloué","Le rapport entre les résultats obtenus et les moyens mis en œuvre","Le degré de satisfaction des usagers"],"a":2,"just":"<p>L'efficience mesure si l'on obtient le meilleur résultat possible avec les ressources utilisées : « faire mieux avec autant, ou autant avec moins ».<\/p>","ana":"<ul><li>A : c'est la définition de l'<strong>efficacité<\/strong> (résultats / objectifs).<\/li><li>B : consommer tout son budget ne prouve aucune performance. C'est même un piège classique de la logique de moyens.<\/li><li>D : la satisfaction des usagers relève de la <strong>qualité de service<\/strong>.<\/li><\/ul>","piege":"La confusion entre efficacité et efficience est la plus fréquente à l'examen.","astuce":"Moyen mnémotechnique : effiCience = Coûts (moyens) ; efficaCité = Cible (objectifs). Si la proposition parle de « moyens », de « ressources » ou de « coûts », c'est l'efficience.","regle":"Efficacité = résultats / objectifs. Efficience = résultats / moyens. Économie = acquérir les moyens au moindre coût. Ce sont les « 3E »."},{"id":"1-3","t":1,"n":3,"lvl":1,"neg":false,"q":"<p>Parmi les principes classiques du service public, lequel fournit le fondement juridique le plus direct à la modernisation des administrations ?<\/p>","o":["Le principe de mutabilité (ou d'adaptabilité)","Le principe de continuité","Le principe d'égalité","Le principe de neutralité"],"a":0,"just":"<p>Le principe de mutabilité impose au service public de s'adapter aux évolutions des besoins de l'intérêt général et des techniques. La modernisation (numérique, nouvelles méthodes, réorganisation) en est l'application directe.<\/p>","ana":"<ul><li>B : la continuité impose un fonctionnement régulier, sans interruption. Elle encadre la modernisation (on n'interrompt pas le service pendant le changement) mais ne la justifie pas.<\/li><li>C : l'égalité impose un traitement identique des usagers placés dans la même situation. C'est une limite à respecter, pas un moteur de changement.<\/li><li>D : la neutralité concerne l'impartialité de l'administration et de ses agents.<\/li><\/ul>","piege":"Les quatre principes sont réels et importants. La question demande lequel <em>fonde<\/em> la modernisation, pas lequel est concerné.","astuce":"« Mutabilité » vient de « muter », c'est-à-dire changer. Associe directement « adaptation / évolution / modernisation » à la mutabilité.","regle":"Lois de Rolland : continuité, égalité, mutabilité. La mutabilité justifie le changement ; la continuité et l'égalité en fixent les limites."},{"id":"1-4","t":1,"n":4,"lvl":1,"neg":false,"q":"<p>Le ministère de la Santé transfère à ses directions régionales le pouvoir de signer certaines décisions jusque-là prises à Rabat. Ces directions restent sous l'autorité hiérarchique du ministre. Il s'agit de :<\/p>","o":["Décentralisation","Privatisation","Délégation de service public","Déconcentration"],"a":3,"just":"<p>La déconcentration consiste à transférer des pouvoirs de décision de l'administration centrale vers ses <strong>propres services extérieurs<\/strong>, qui restent dans la même personne morale (l'État) et sous l'autorité hiérarchique du ministre. Au Maroc, la Charte nationale de la déconcentration administrative (2018) encadre ce mouvement, en accompagnement de la régionalisation avancée.<\/p>","ana":"<ul><li>A : la décentralisation transfère des compétences à des <strong>collectivités territoriales<\/strong> (régions, préfectures et provinces, communes), dotées de la personnalité morale et élues. Elles sont soumises à un contrôle administratif, pas à un pouvoir hiérarchique.<\/li><li>B : aucune entreprise privée n'est concernée.<\/li><li>C : la délégation de service public confie la gestion d'un service à un opérateur (souvent privé) par contrat.<\/li><\/ul>","piege":"Le mot « régionales » fait penser à la régionalisation, donc à la décentralisation. L'indice décisif est « sous l'autorité hiérarchique du ministre ».","astuce":"Hiérarchie + même personne morale + services extérieurs = déconcentration. Collectivité élue + personnalité morale + autonomie = décentralisation.","regle":"La déconcentration rapproche l'<strong>État<\/strong> du citoyen. La décentralisation donne le pouvoir à <strong>d'autres personnes publiques<\/strong>."},{"id":"1-5","t":1,"n":5,"lvl":1,"neg":true,"q":"<p>Selon l'article 154 de la Constitution marocaine de 2011, l'organisation des services publics repose sur plusieurs principes. Lequel <strong>n'en fait pas partie<\/strong> ?<\/p>","o":["L'égal accès des citoyennes et citoyens","La couverture équitable du territoire national","La continuité des prestations rendues","La rentabilité financière des prestations"],"a":3,"just":"<p>L'article 154 fonde l'organisation des services publics sur l'égal accès, la couverture équitable du territoire et la continuité des prestations. Il les soumet aussi à des normes de qualité, de transparence, de reddition des comptes et de responsabilité. La rentabilité n'est pas un principe constitutionnel du service public.<\/p>","ana":"<p>A, B et C figurent tous expressément dans l'article 154.<\/p>","piege":"La <strong>négation<\/strong> (« n'en fait pas partie »). Les trois premières propositions sont vraies : il faut trouver l'intrus. Autre piège : la modernisation recherche l'efficience, mais l'efficience n'est pas la rentabilité.","astuce":"Devant une négation, entoure-la et vérifie chaque proposition par « vrai / faux ». Une notion purement commerciale (rentabilité, profit, bénéfice) est presque toujours l'intrus dans une liste de principes de service public.","regle":"Article 154 : égal accès, couverture équitable du territoire, continuité, plus des normes de qualité, transparence, reddition des comptes et responsabilité. Le Titre XII de la Constitution est consacré à la bonne gouvernance."},{"id":"1-6","t":1,"n":6,"lvl":1,"neg":false,"q":"<p>Une agence urbaine étudie la manière dont trois autres agences, réputées pour leurs délais courts, instruisent les demandes d'autorisation, afin de s'en inspirer. Quel outil utilise-t-elle ?<\/p>","o":["L'audit de conformité","Le benchmarking (parangonnage)","L'analyse SWOT","Le contrôle de gestion"],"a":1,"just":"<p>Le benchmarking consiste à comparer ses pratiques et ses résultats avec ceux d'organisations réputées performantes (les « meilleures pratiques »), puis à s'en inspirer pour s'améliorer.<\/p>","ana":"<ul><li>A : l'audit de conformité vérifie le respect des règles et procédures internes ; il ne compare pas avec l'extérieur.<\/li><li>C : la SWOT analyse les forces/faiblesses internes et les opportunités/menaces externes. C'est un diagnostic stratégique, pas une comparaison avec d'autres organisations.<\/li><li>D : le contrôle de gestion pilote la performance interne (objectifs, indicateurs, écarts).<\/li><\/ul>","piege":"La SWOT contient une dimension externe, ce qui peut tromper. Mais elle n'implique pas d'étudier les pratiques d'autres organisations pour les imiter.","astuce":"Comparaison avec d'autres + meilleures pratiques + s'inspirer = benchmarking.","regle":"Benchmarking = se comparer aux meilleurs pour apprendre et s'améliorer."},{"id":"1-7","t":1,"n":7,"lvl":2,"neg":false,"q":"<p>Quel texte fixe, en application de l'article 157 de la Constitution, les règles de bonne gouvernance relatives au fonctionnement des administrations publiques, des régions, des collectivités territoriales et des organismes publics ?<\/p>","o":["La loi n° 55-19 relative à la simplification des procédures et formalités administratives","La loi n° 54-19 portant Charte des services publics","La loi n° 31-13 relative au droit d'accès à l'information","La loi organique n° 130-13 relative à la loi de finances"],"a":1,"just":"<p>L'article 157 de la Constitution prévoit une Charte des services publics fixant les règles de bonne gouvernance. Elle a été adoptée par la loi 54-19 (2021) et encadre l'accueil des usagers, la qualité, la transparence, la reddition des comptes et l'éthique des agents.<\/p>","ana":"<ul><li>A : la loi 55-19 (2020) porte sur la simplification des procédures administratives, pas sur l'ensemble des règles de bonne gouvernance.<\/li><li>C : la loi 31-13 organise le droit d'accès à l'information (article 27 de la Constitution).<\/li><li>D : la LOF 130-13 organise les finances publiques et la budgétisation axée sur la performance.<\/li><\/ul>","piege":"54-19 et 55-19 ont des numéros consécutifs et des thèmes proches. Piège très classique.","astuce":"54 = Charte (gouvernance globale) ; 55 = simplification (procédures). Le mot « Charte » dans l'énoncé renvoie à la 54-19.","regle":"Article 157 → loi 54-19 (Charte des services publics). Simplification → loi 55-19. Accès à l'information → article 27 et loi 31-13."},{"id":"1-8","t":1,"n":8,"lvl":2,"neg":false,"q":"<p>Pour délivrer une autorisation, un agent exige d'un usager une pièce administrative délivrée par une autre administration, qui pourrait la transmettre directement. Selon la logique de la loi 55-19, quelle est la bonne analyse ?<\/p>","o":["Cette exigence est normale : la charge de la preuve repose toujours sur l'usager","Cette exigence est légale si la pièce est certifiée conforme","Cette exigence va à l'encontre du principe selon lequel l'administration ne doit pas imposer à l'usager de fournir des documents qu'elle peut obtenir d'une autre administration","Cette question relève uniquement du droit d'accès à l'information"],"a":2,"just":"<p>La loi 55-19 cherche à alléger la charge pesant sur l'usager. Les administrations doivent échanger entre elles les documents dont elles disposent, au lieu de faire faire au citoyen la « navette » entre les guichets. Elle s'inscrit dans une logique de confiance et de simplification.<\/p>","ana":"<ul><li>A : c'est justement la logique bureaucratique que la réforme combat. La charge de la preuve ne repose pas « toujours » sur l'usager.<\/li><li>B : la certification conforme n'est pas le problème ; la réforme va dans le sens de la limitation des légalisations et certifications exigées.<\/li><li>D : le droit d'accès à l'information permet au citoyen d'obtenir des informations de l'administration. Ici, c'est l'administration qui exige un document : le sujet relève de la simplification.<\/li><\/ul>","piege":"La proposition D mélange deux réformes proches (transparence et simplification). Demande-toi : qui demande quoi à qui ?","astuce":"« Toujours », « jamais » rendent souvent une proposition fausse. Quand le scénario décrit une charge inutile imposée à l'usager, la réponse est la simplification.","regle":"Simplification administrative : confiance envers l'usager, échange de données entre administrations, réduction des pièces exigées, publication des procédures (portail national des procédures)."},{"id":"1-9","t":1,"n":9,"lvl":2,"neg":false,"q":"<p>Dans le cadre de la loi organique 130-13 relative à la loi de finances, les crédits d'un ministère sont présentés par <strong>programmes<\/strong>. Chaque programme est associé à :<\/p>","o":["Des objectifs précis et des indicateurs chiffrés de performance","Une liste détaillée des fournitures à acheter","Un plafond d'effectifs uniquement","Une autorisation de dépenser sans contrôle a posteriori"],"a":0,"just":"<p>La LOF 130-13 a introduit une budgétisation axée sur les résultats : les crédits sont regroupés en programmes, chacun lié à des objectifs et à des indicateurs. Le <strong>projet de performance<\/strong> présente les objectifs avant le vote ; le <strong>rapport de performance<\/strong> rend compte des résultats après exécution.<\/p>","ana":"<ul><li>B : présenter les achats en détail relève d'une logique de moyens, celle que la LOF dépasse.<\/li><li>C : les effectifs font partie de la programmation, mais pas « uniquement ». Le cœur du programme est le couple objectifs / indicateurs.<\/li><li>D : c'est l'inverse : plus de liberté de gestion implique une obligation de rendre compte.<\/li><\/ul>","piege":"Croire que la globalisation des crédits signifie absence de contrôle. Plus de liberté = plus de responsabilité.","astuce":"Dans tout ce qui touche à la performance budgétaire, cherche le trio programme – objectifs – indicateurs.","regle":"LOF 130-13 : programmes, objectifs, indicateurs ; projet de performance (avant) et rapport de performance (après)."},{"id":"1-10","t":1,"n":10,"lvl":2,"neg":false,"q":"<p>Un hôpital public veut mesurer l'<strong>impact<\/strong> de son programme de santé maternelle et infantile sur la population. Quel indicateur est le plus adapté ?<\/p>","o":["Le nombre de consultations prénatales réalisées","Le taux de consommation des crédits du programme","L'évolution du taux de mortalité infantile dans la zone desservie","Le nombre de sages-femmes recrutées"],"a":2,"just":"<p>Un indicateur d'impact mesure l'effet final de l'action publique sur la société. La baisse de la mortalité infantile est l'objectif ultime du programme.<\/p>","ana":"<ul><li>A : indicateur d'<strong>activité<\/strong> (output) : il mesure ce que l'hôpital produit, pas l'effet sur la santé.<\/li><li>B : indicateur de <strong>moyens<\/strong> (exécution budgétaire).<\/li><li>D : indicateur de <strong>moyens<\/strong> (ressources humaines).<\/li><\/ul>","piege":"Le nombre de consultations paraît « positif » et proche du résultat. Mais faire beaucoup ne prouve pas qu'on atteint l'objectif.","astuce":"Place chaque indicateur sur la chaîne moyens → activités → résultats → impact. « Impact » = changement observé chez les bénéficiaires ou dans la société.","regle":"Moyens (ce qu'on met), activité (ce qu'on fait), résultat/impact (ce que ça change)."},{"id":"1-11","t":1,"n":11,"lvl":2,"neg":false,"q":"<p>La modernisation administrative a souvent conduit à parler du « client » plutôt que de l'« usager ». Quelle affirmation est <strong>exacte<\/strong> ?<\/p>","o":["L'usager et le client sont des notions parfaitement identiques","L'administration peut réserver ses meilleurs services aux usagers qui paient le plus","L'orientation « client » impose d'abandonner le principe d'égalité","L'orientation vers l'usager améliore l'écoute et la qualité, mais l'usager reste titulaire de droits (égalité, continuité) qui ne dépendent pas de sa capacité à payer"],"a":3,"just":"<p>L'approche « client » a permis de mieux écouter les usagers, de réduire les délais et d'améliorer l'accueil. Mais l'usager n'est pas un simple client : il a des droits garantis par les principes du service public, quel que soit son pouvoir d'achat. L'article 156 de la Constitution impose d'ailleurs aux services publics d'être à l'écoute des usagers et de recevoir leurs observations et doléances.<\/p>","ana":"<ul><li>A : les deux notions se recoupent (attente de qualité) mais ne se confondent pas (l'usager a des droits ; le client a un contrat commercial).<\/li><li>B : ce serait contraire au principe d'égalité.<\/li><li>C : l'orientation usager améliore le service sans remettre en cause ses principes fondamentaux.<\/li><\/ul>","piege":"A, B et C poussent la logique « client » jusqu'à l'excès. La bonne réponse est la seule nuancée.","astuce":"En management public, la bonne réponse est souvent celle qui <strong>concilie<\/strong> performance et valeurs du service public. Méfie-toi des propositions extrêmes.","regle":"Orientation usager = qualité et écoute, sans renoncer à l'égalité ni à la continuité."},{"id":"1-12","t":1,"n":12,"lvl":2,"neg":false,"q":"<p>Dans un service d'état civil, une analyse « lean » révèle qu'un dossier passe par 9 étapes, dont 4 vérifications redondantes, et attend en moyenne 6 jours entre deux bureaux. Quel est l'objectif principal de la démarche lean ?<\/p>","o":["Éliminer les étapes et attentes qui n'apportent pas de valeur à l'usager","Augmenter le nombre d'agents à chaque étape","Ajouter un contrôle supplémentaire en fin de processus","Externaliser l'ensemble du service"],"a":0,"just":"<p>Le lean management, issu de l'industrie automobile (Toyota), supprime les « gaspillages » : attentes, étapes inutiles, doublons, retouches. Le but est d'accélérer le processus et d'augmenter la valeur rendue à l'usager, sans moyens supplémentaires.<\/p>","ana":"<ul><li>B : ajouter des agents traite le symptôme en augmentant les coûts ; redondances et attentes demeurent.<\/li><li>C : un contrôle de plus allonge encore le processus : c'est le contraire du lean.<\/li><li>D : l'externalisation est une décision stratégique différente qui ne corrige pas les défauts du processus.<\/li><\/ul>","piege":"Croire que la qualité exige toujours plus de contrôles. En lean, on supprime les contrôles redondants et on fiabilise les étapes utiles.","astuce":"Lean = gaspillage, valeur ajoutée, flux, suppression. Toute proposition qui ajoute des ressources ou des étapes est à éliminer.","regle":"Lean = faire mieux avec moins en supprimant ce qui n'apporte pas de valeur à l'usager."},{"id":"1-13","t":1,"n":13,"lvl":2,"neg":false,"q":"<p>Quel outil de démarche qualité a été conçu <strong>spécifiquement pour les administrations publiques<\/strong> afin de leur permettre de s'auto-évaluer ?<\/p>","o":["La norme ISO 9001","Le CAF (Cadre d'Auto-évaluation des Fonctions publiques)","Le Balanced Scorecard (tableau de bord prospectif)","La méthode des 5S"],"a":1,"just":"<p>Le CAF a été développé au niveau européen pour le secteur public, à partir du modèle d'excellence EFQM. Il permet à une administration d'évaluer elle-même ses pratiques (leadership, stratégie, personnel, processus, résultats) pour engager une démarche d'amélioration continue.<\/p>","ana":"<ul><li>A : l'ISO 9001 s'applique à toute organisation, publique ou privée, et repose sur une <strong>certification<\/strong> par un organisme externe.<\/li><li>C : le Balanced Scorecard (Kaplan et Norton) est un outil de pilotage stratégique issu du privé.<\/li><li>D : les 5S sont une méthode d'organisation du poste de travail issue du lean.<\/li><\/ul>","piege":"L'ISO 9001 est très connue et utilisée dans le public. Mais elle n'est ni spécifique au public ni fondée sur l'auto-évaluation.","astuce":"Le nom contient la réponse : « Cadre d'<strong>Auto<\/strong>-évaluation des <strong>Fonctions publiques<\/strong> ».","regle":"CAF = auto-évaluation propre au secteur public (inspiré d'EFQM). ISO 9001 = certification externe générique."},{"id":"1-14","t":1,"n":14,"lvl":3,"neg":false,"q":"<p>L'État signe un contrat-programme de cinq ans avec un établissement public, qui obtient des financements pluriannuels garantis et plus de souplesse de gestion. Quelle est la contrepartie essentielle de cette autonomie ?<\/p>","o":["L'établissement n'a plus à rendre compte de sa gestion","L'État renonce à tout contrôle sur l'établissement","L'établissement s'engage sur des objectifs mesurables et rend compte de ses résultats","L'établissement peut fixer librement ses missions de service public"],"a":2,"just":"<p>La contractualisation échange de l'autonomie et de la visibilité financière contre des engagements de résultats, suivis par des indicateurs et évalués périodiquement.<\/p>","ana":"<ul><li>A : l'autonomie renforce au contraire l'obligation de reddition des comptes.<\/li><li>B : l'État passe d'un contrôle a priori à un contrôle des résultats ; il ne renonce pas à contrôler.<\/li><li>D : les missions sont fixées par les textes et par la tutelle. Le contrat porte sur les objectifs et les moyens.<\/li><\/ul>","piege":"Confondre autonomie de gestion et indépendance totale.","astuce":"Dès qu'un énoncé mentionne autonomie, souplesse ou liberté de gestion, cherche la contrepartie : objectifs, résultats, reddition des comptes.","regle":"Autonomie contre responsabilité. Pas de liberté de gestion sans obligation de rendre compte."},{"id":"1-15","t":1,"n":15,"lvl":3,"neg":false,"q":"<p>Une administration met en ligne une procédure. Le formulaire en ligne reproduit à l'identique l'ancien formulaire papier et exige toujours 12 pièces justificatives scannées. Les délais ne baissent pas. Quelle est l'analyse la plus pertinente ?<\/p>","o":["La transformation digitale est réussie puisque la procédure est accessible en ligne","L'échec s'explique uniquement par un manque de matériel informatique","Il fallait renoncer au numérique et revenir au papier","L'administration a dématérialisé la procédure sans la simplifier : il fallait d'abord repenser le processus"],"a":3,"just":"<p>Numériser une procédure complexe revient à « digitaliser la complexité ». Une vraie transformation commence par la réingénierie du processus : supprimer les pièces inutiles, récupérer les données auprès des autres administrations, raccourcir les circuits. Ensuite seulement, on numérise.<\/p>","ana":"<ul><li>A : la mise en ligne est un moyen, pas un résultat. L'indicateur de réussite (les délais) n'a pas bougé.<\/li><li>B : rien dans l'énoncé ne parle de matériel ; le problème décrit est la reproduction de la procédure papier.<\/li><li>C : réaction excessive : le numérique n'est pas en cause, c'est la méthode.<\/li><\/ul>","piege":"Confondre dématérialisation (passer du papier au numérique) et transformation digitale (repenser le service grâce au numérique).","astuce":"Repère les indices (« à l'identique », « toujours 12 pièces », « les délais ne baissent pas ») : ils pointent vers le processus, pas vers la technologie.","regle":"On simplifie avant de numériser. Un processus défaillant mis en ligne reste défaillant."},{"id":"1-16","t":1,"n":16,"lvl":3,"neg":false,"q":"<p>L'article 1<sup>er<\/sup> de la Constitution de 2011 fonde notamment le régime constitutionnel sur les principes de bonne gouvernance et sur la corrélation entre deux notions. Lesquelles ?<\/p>","o":["La responsabilité et la reddition des comptes","L'efficacité et l'efficience","La centralisation et la déconcentration","La légalité et l'opportunité"],"a":0,"just":"<p>L'article 1<sup>er<\/sup> associe la bonne gouvernance à la corrélation entre la responsabilité et la reddition des comptes : celui qui exerce une responsabilité publique doit rendre compte de ses actes et de ses résultats.<\/p>","ana":"<ul><li>B : ce sont des critères de performance, pas les notions citées par l'article 1<sup>er<\/sup>.<\/li><li>C : ce sont des modes d'organisation administrative, absents de cet article.<\/li><li>D : légalité et opportunité sont des notions du contrôle administratif.<\/li><\/ul>","piege":"Efficacité et efficience « sonnent » modernisation et paraissent plausibles, mais la question porte sur le texte constitutionnel.","astuce":"Retiens l'expression complète « corrélation entre la responsabilité et la reddition des comptes » : elle revient très souvent dans les sujets marocains.","regle":"Article 1<sup>er<\/sup> : bonne gouvernance + corrélation responsabilité / reddition des comptes."},{"id":"1-17","t":1,"n":17,"lvl":3,"neg":false,"q":"<p>Pour réduire ses coûts, un opérateur public envisage de fermer ses agences rurales jugées peu fréquentées. Avec quel principe cette décision fondée sur l'efficience risque-t-elle d'entrer en conflit ?<\/p>","o":["Le principe de mutabilité","Le principe d'égal accès et de couverture équitable du territoire","Le principe de spécialité","Le principe de neutralité"],"a":1,"just":"<p>La recherche d'efficience peut pousser à concentrer les services là où ils sont « rentables ». Mais l'article 154 exige l'égal accès et la couverture équitable du territoire. Une modernisation équilibrée chercherait d'autres solutions : services mobiles, guichets mutualisés, services numériques avec accompagnement.<\/p>","ana":"<ul><li>A : la mutabilité justifierait plutôt l'adaptation ; elle n'est pas en conflit avec la décision.<\/li><li>C : le principe de spécialité limite un établissement public à sa mission ; il n'est pas en jeu.<\/li><li>D : la neutralité concerne l'impartialité ; la fermeture n'est pas motivée par une préférence politique ou religieuse.<\/li><\/ul>","piege":"Penser que l'efficience est toujours compatible avec les principes du service public. Les examens testent souvent cette <strong>tension<\/strong>.","astuce":"Zones rurales, territoire, éloignement, fracture → égal accès et couverture territoriale.","regle":"La modernisation doit concilier efficience et équité. L'efficience ne justifie pas l'exclusion d'une partie des usagers."},{"id":"1-18","t":1,"n":18,"lvl":3,"neg":false,"q":"<p>Quelle caractéristique distingue le mieux la <strong>Nouvelle gouvernance publique<\/strong> (approche post-NPM) du New Public Management ?<\/p>","o":["La priorité absolue donnée à la réduction des coûts","Le retour au modèle bureaucratique wébérien strict","L'accent mis sur la coopération entre acteurs, les réseaux et la participation des citoyens à la construction des politiques publiques","La séparation stricte entre administrations, chacune optimisant sa propre performance"],"a":2,"just":"<p>Le NPM a amélioré la performance mais a aussi fragmenté l'action publique (agences autonomes, objectifs cloisonnés). La Nouvelle gouvernance publique valorise la coordination entre administrations, les partenariats (privé, société civile, collectivités) et la co-construction avec les citoyens. Au Maroc, la démocratie participative est consacrée par la Constitution de 2011 (pétitions, motions, instances de concertation).<\/p>","ana":"<ul><li>A : la réduction des coûts est une marque du NPM, pas de son dépassement.<\/li><li>B : le post-NPM ne revient pas à la bureaucratie ; il garde l'exigence de performance.<\/li><li>D : la séparation et l'optimisation par entité décrivent les effets du NPM que le post-NPM critique.<\/li><\/ul>","piege":"Croire que tout ce qui « critique le NPM » est un retour en arrière (B).","astuce":"Bureaucratie = règles ; NPM = résultats ; Nouvelle gouvernance = coopération et participation. « Réseaux », « partenariat », « co-construction » → post-NPM.","regle":"Trois modèles successifs : bureaucratie wébérienne (procédures) → NPM (performance) → Nouvelle gouvernance publique (coopération et participation)."},{"id":"1-19","t":1,"n":19,"lvl":3,"neg":false,"q":"<p>Un citoyen demande à une administration des informations sur les marchés publics qu'elle a passés. Laquelle de ces affirmations est <strong>exacte<\/strong> ?<\/p>","o":["L'administration peut refuser librement, sans motif, car elle seule décide de ce qui est communicable","Le citoyen doit obligatoirement justifier d'un intérêt personnel et direct","Le droit d'accès est absolu : aucune information ne peut lui être refusée","Ce droit est garanti par l'article 27 de la Constitution et la loi 31-13, mais il connaît des exceptions limitativement prévues (défense nationale, sûreté de l'État, vie privée…)"],"a":3,"just":"<p>La transparence est un axe majeur de la modernisation. L'article 27 de la Constitution consacre le droit d'accès à l'information détenue par l'administration ; la loi 31-13 l'organise. L'accès est la règle, le refus l'exception. Les exceptions, prévues par la loi, protègent des intérêts supérieurs (défense, sécurité, vie privée, données personnelles…).<\/p>","ana":"<ul><li>A : le refus ne peut pas être libre et arbitraire ; il doit se fonder sur une exception légale et peut faire l'objet d'un recours.<\/li><li>B : le droit d'accès n'est pas subordonné à la justification d'un intérêt particulier.<\/li><li>C : aucun droit de ce type n'est absolu.<\/li><\/ul>","piege":"Les deux extrêmes, A (refus libre) et C (droit absolu), sont faux. La vérité est entre les deux.","astuce":"« Absolu », « librement », « obligatoirement » rendent souvent une proposition fausse. Un principe accompagné d'exceptions encadrées est souvent la bonne réponse en droit public.","regle":"Accès à l'information : le principe est l'accès (article 27, loi 31-13) ; le refus est l'exception et doit être prévu par la loi."},{"id":"1-20","t":1,"n":20,"lvl":3,"neg":false,"q":"<p>Un établissement public veut réduire le délai de délivrance d'une autorisation de 45 à 10 jours. Quelle démarche est la plus cohérente ?<\/p>","o":["Diagnostic du processus actuel → simplification et réingénierie → digitalisation → suivi par des indicateurs et évaluation","Achat d'une plateforme numérique → formation des agents → diagnostic du processus","Recrutement de nouveaux agents → contrôle supplémentaire → publication d'une note de service","Fixation de l'objectif de 10 jours par note de service, sans changement d'organisation"],"a":0,"just":"<p>Une démarche de modernisation réussie suit une logique séquentielle : comprendre où se perd le temps (diagnostic), supprimer les étapes inutiles (réingénierie), outiller avec le numérique, puis mesurer pour corriger (indicateurs, évaluation). C'est la boucle de l'amélioration continue (PDCA : Plan, Do, Check, Act).<\/p>","ana":"<ul><li>B : ordre inversé : on achète l'outil avant de connaître le problème, ce qui conduit à numériser la complexité (voir question 15).<\/li><li>C : plus de moyens et un contrôle de plus allongent le processus et augmentent les coûts, sans traiter les causes.<\/li><li>D : un objectif sans plan d'action ni changement d'organisation reste un vœu pieux.<\/li><\/ul>","piege":"B contient de bons éléments (numérique, formation, diagnostic) mais dans le mauvais ordre. Lis la <strong>séquence<\/strong>, pas seulement les mots.","astuce":"Pour une question d'ordonnancement, l'étape 1 doit presque toujours être un diagnostic ou un état des lieux ; la dernière, un suivi ou une évaluation.","regle":"Diagnostiquer → simplifier → numériser → mesurer → ajuster. La technologie arrive après la réflexion sur le processus."},{"id":"2-1","t":2,"n":1,"lvl":1,"neg":false,"q":"<p>Un établissement public se définit comme :<\/p>","o":["Une personne morale de droit public, dotée d'une autonomie administrative et financière, chargée de gérer une mission de service public déterminée","Un service d'un ministère, sans personnalité juridique propre","Une société commerciale dont l'État détient la majorité du capital","Une collectivité territoriale élue au suffrage universel"],"a":0,"just":"<p>L'établissement public est une technique de décentralisation <strong>par services<\/strong> (ou fonctionnelle) : l'État crée une personne morale distincte, avec son budget et ses organes de gestion, pour gérer une mission précise (un hôpital, une université, un office…). Il reste soumis à la tutelle de l'État.<\/p>","ana":"<ul><li>B : un service d'un ministère n'a pas de personnalité morale ; c'est une simple subdivision de l'État (service central ou déconcentré).<\/li><li>C : c'est la définition d'une société d'État ou entreprise publique à forme commerciale, régie principalement par le droit privé.<\/li><li>D : c'est la décentralisation <strong>territoriale<\/strong> (régions, provinces, communes).<\/li><\/ul>","piege":"Confondre établissement public et entreprise publique. Les deux font partie des « EEP » (établissements et entreprises publics), mais l'établissement public est une personne de droit public.","astuce":"Personnalité morale + droit public + mission spécifique = établissement public. « Capital », « société », « actionnaire » = entreprise publique.","regle":"Établissement public = décentralisation par services ; collectivité territoriale = décentralisation territoriale."},{"id":"2-2","t":2,"n":2,"lvl":1,"neg":false,"q":"<p>Le <strong>principe de spécialité<\/strong> applicable aux établissements publics signifie que :<\/p>","o":["L'établissement doit recruter uniquement des agents spécialisés","L'établissement est libre de diversifier ses activités pour augmenter ses recettes","L'établissement ne peut exercer que les missions définies par son texte de création","L'établissement relève obligatoirement d'un ministère technique"],"a":2,"just":"<p>Contrairement à l'État ou aux collectivités, qui ont une compétence générale, l'établissement public n'existe que pour la mission qui lui a été confiée. Toute activité étrangère à cette mission est en principe illégale.<\/p>","ana":"<ul><li>A : la spécialité porte sur les <strong>missions<\/strong>, pas sur le profil des agents.<\/li><li>B : c'est justement ce que le principe limite. Une diversification n'est possible que si elle reste rattachée à la mission ou si le texte est modifié.<\/li><li>D : le rattachement à une tutelle est réel, mais ce n'est pas le contenu du principe de spécialité.<\/li><\/ul>","piege":"En transformation, l'envie d'innover peut conduire à lancer des activités nouvelles. Il faut vérifier qu'elles restent dans le périmètre légal de l'établissement.","astuce":"« Spécialité » = l'établissement est « spécialisé » dans <strong>une<\/strong> mission. Toute proposition parlant de liberté d'activité est à éliminer.","regle":"Principe de spécialité : un établissement public = une mission définie par son texte de création, pas au-delà."},{"id":"2-3","t":2,"n":3,"lvl":1,"neg":false,"q":"<p>Parmi ces affirmations, laquelle correspond à l'une des <strong>quatre valeurs du Manifeste agile<\/strong> (2001) ?<\/p>","o":["Le suivi rigoureux d'un plan détaillé plus que l'adaptation au changement","Les individus et leurs interactions plus que les processus et les outils","La documentation exhaustive plus qu'un produit qui fonctionne","La négociation contractuelle plus que la collaboration avec le bénéficiaire"],"a":1,"just":"<p>Le Manifeste agile énonce quatre valeurs : les individus et leurs interactions plus que les processus et les outils ; un produit opérationnel plus qu'une documentation exhaustive ; la collaboration avec le client plus que la négociation contractuelle ; l'adaptation au changement plus que le suivi d'un plan.<\/p>","ana":"<p>A, C et D sont les valeurs <strong>inversées<\/strong>. Ils décrivent l'approche traditionnelle (« cycle en V » ou « en cascade ») que l'agilité veut dépasser.<\/p>","piege":"Le manifeste ne dit pas que les processus, la documentation ou les plans sont inutiles : il dit qu'on leur accorde <strong>moins<\/strong> de valeur que les éléments de gauche.","astuce":"L'agilité valorise toujours l'humain, le concret, la collaboration et l'adaptation. Si la proposition met en avant le formalisme (plan, contrat, documentation), c'est l'inverse de l'agile.","regle":"Agile = humain, produit qui fonctionne, collaboration, adaptation."},{"id":"2-4","t":2,"n":4,"lvl":1,"neg":false,"q":"<p>Une université remplace l'envoi des relevés de notes par courrier par un téléchargement sur l'espace étudiant, sans changer le reste de son fonctionnement. Il s'agit d'une innovation :<\/p>","o":["De rupture","Organisationnelle radicale","Institutionnelle","Incrémentale"],"a":3,"just":"<p>Une innovation incrémentale améliore progressivement un service existant, sans en changer la nature ni le modèle. Ici, le service (délivrer un relevé) reste le même ; seul le canal évolue.<\/p>","ana":"<ul><li>A : une innovation de rupture transforme profondément le service ou le modèle (par exemple supprimer totalement un document grâce à une vérification automatique des diplômes par les employeurs).<\/li><li>B : une transformation radicale toucherait la structure, les rôles ou les processus de l'ensemble de l'organisation.<\/li><li>C : une innovation institutionnelle modifie les règles du jeu (cadre juridique, gouvernance).<\/li><\/ul>","piege":"Croire que tout ce qui est numérique est une « rupture ». Une technologie nouvelle peut produire un changement modeste.","astuce":"« Sans changer le reste », « amélioration », « progressif » = incrémental. « Transformation profonde », « nouveau modèle » = rupture.","regle":"Incrémental = améliorer l'existant ; rupture = changer le modèle."},{"id":"2-5","t":2,"n":5,"lvl":1,"neg":false,"q":"<p>Une caisse de sécurité sociale change de système informatique de gestion des prestations. Quelle précaution traduit le mieux le respect du principe de <strong>continuité du service public<\/strong> ?<\/p>","o":["Fermer les guichets pendant un mois pour faciliter la migration","Suspendre le paiement des prestations jusqu'à la stabilisation du nouveau système","Faire fonctionner l'ancien et le nouveau système en parallèle pendant une période de transition, avec une procédure de retour arrière","Basculer en une seule nuit sans test, pour aller plus vite"],"a":2,"just":"<p>Le principe de continuité impose un fonctionnement régulier, sans interruption injustifiée. Une transformation doit donc être conçue pour que les usagers continuent à être servis : période de double fonctionnement, bascule progressive, solution de repli si le nouveau système échoue.<\/p>","ana":"<ul><li>A et B : interrompre l'accueil ou les paiements viole directement la continuité et pénalise des usagers souvent vulnérables.<\/li><li>D : une bascule brutale sans test fait courir un risque majeur d'interruption.<\/li><\/ul>","piege":"Penser que la transformation justifie une « parenthèse » dans le service. La continuité s'applique <strong>aussi<\/strong> pendant le changement.","astuce":"Repère les mots « parallèle », « progressif », « transition », « retour arrière », « mode dégradé » : ce sont les marqueurs de la continuité.","regle":"On transforme le service sans l'interrompre : double fonctionnement, bascule progressive, plan de repli."},{"id":"2-6","t":2,"n":6,"lvl":1,"neg":false,"q":"<p>Dans la démarche de <strong>design thinking<\/strong>, quelle est la première étape ?<\/p>","o":["L'empathie : comprendre en profondeur les besoins et le vécu des usagers","Le prototypage rapide d'une solution","Le déploiement à grande échelle","La rédaction du cahier des charges technique"],"a":0,"just":"<p>Le design thinking (méthode popularisée par Stanford et l'agence IDEO) suit en général cinq étapes : empathie, définition du problème, idéation, prototypage, test. On commence par observer et écouter les usagers pour comprendre leur vrai problème avant d'imaginer des solutions.<\/p>","ana":"<ul><li>B : le prototypage vient en 4<sup>e<\/sup> position, après la définition du problème et l'idéation.<\/li><li>C : le déploiement n'est pas une étape du cycle ; il intervient après des tests concluants.<\/li><li>D : le cahier des charges technique relève d'une démarche classique, qui part de la solution plutôt que de l'usager.<\/li><\/ul>","piege":"Vouloir prototyper tout de suite parce que le design thinking est « rapide ». Sans compréhension de l'usager, on prototype la mauvaise solution.","astuce":"Design thinking = centré sur l'usager. La première étape est forcément tournée vers lui (observer, écouter, comprendre).","regle":"Empathie → définition → idéation → prototype → test."},{"id":"2-7","t":2,"n":7,"lvl":2,"neg":false,"q":"<p>Dans une équipe projet qui applique la méthode <strong>Scrum<\/strong>, qui est responsable de définir et de prioriser le contenu du « backlog produit » (la liste des fonctionnalités à réaliser) ?<\/p>","o":["Le Scrum Master","Le Product Owner","L'équipe de développement, par vote majoritaire","Le directeur général de l'établissement"],"a":1,"just":"<p>Le Product Owner représente les besoins des usagers et du métier. Il rédige et ordonne le backlog en fonction de la valeur attendue. L'équipe réalise le travail par cycles courts appelés <strong>sprints<\/strong> (en général 1 à 4 semaines).<\/p>","ana":"<ul><li>A : le Scrum Master est un facilitateur. Il veille au respect de la méthode et lève les obstacles ; il ne décide pas du contenu et n'est pas un chef hiérarchique.<\/li><li>C : l'équipe estime et organise le travail, mais ne fixe pas les priorités métier.<\/li><li>D : la direction peut être sponsor du projet, mais n'est pas un rôle Scrum.<\/li><\/ul>","piege":"Assimiler le Scrum Master à un chef de projet classique. C'est un « leader au service de l'équipe », pas un donneur d'ordres.","astuce":"Product Owner = le « quoi » et la priorité ; Scrum Master = le « comment travailler ensemble » ; équipe = la réalisation.","regle":"Scrum : 3 rôles (Product Owner, Scrum Master, équipe), des sprints courts, un backlog priorisé."},{"id":"2-8","t":2,"n":8,"lvl":2,"neg":false,"q":"<p>Avant de généraliser un nouveau circuit d'accueil à toutes ses agences, un office public le teste pendant trois mois dans deux agences. Quel est le principal intérêt de cette démarche ?<\/p>","o":["Retarder la décision pour éviter le changement","Satisfaire une obligation légale systématique","Réduire le coût total du projet à zéro","Apprendre sur le terrain et corriger la solution en limitant les risques avant la généralisation"],"a":3,"just":"<p>L'expérimentation (projet pilote, logique « tester et apprendre ») permet de vérifier qu'une solution fonctionne vraiment, d'identifier les difficultés et de l'ajuster sur un périmètre réduit. On protège ainsi la continuité du service à grande échelle.<\/p>","ana":"<ul><li>A : l'expérimentation n'est pas un moyen de différer ; elle prépare une généralisation mieux maîtrisée.<\/li><li>B : il n'existe pas d'obligation générale d'expérimenter avant toute réorganisation.<\/li><li>C : un pilote a un coût ; il permet d'éviter des erreurs coûteuses, pas de supprimer toute dépense.<\/li><\/ul>","piege":"Les propositions absolues (« systématique », « à zéro ») sont presque toujours fausses.","astuce":"Pilote, expérimentation, prototype, MVP (produit minimum viable) → apprentissage + réduction du risque.","regle":"Expérimenter petit, apprendre vite, ajuster, puis généraliser."},{"id":"2-9","t":2,"n":9,"lvl":2,"neg":false,"q":"<p>Un établissement public veut à la fois garantir la fiabilité de ses services quotidiens et développer de nouveaux services innovants. Quel concept décrit cette capacité ?<\/p>","o":["La bureaucratie mécaniste","La centralisation","L'ambidextrie organisationnelle","L'externalisation"],"a":2,"just":"<p>L'ambidextrie (concept développé notamment par James March, puis O'Reilly et Tushman) est la capacité d'une organisation à mener de front l'<strong>exploitation<\/strong> (améliorer et fiabiliser l'existant) et l'<strong>exploration<\/strong> (innover, expérimenter). C'est exactement l'enjeu « innovation + continuité » d'un établissement public.<\/p>","ana":"<ul><li>A : la bureaucratie mécaniste excelle dans la fiabilité et la standardisation, mais elle est peu propice à l'innovation.<\/li><li>B : la centralisation concerne la répartition du pouvoir de décision, pas l'équilibre innovati
