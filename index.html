  const rate = P.answered ? Math.round(P.correct / P.answered * 100) : 0;
  const ladder = GRADES.map((g, i) => `<li class="${i < gi ? "done" : i === gi ? "now" : ""}"><span class="dot"></span><span>${g.n}</span><span>${fmt(g.xp)} pts</span></li>`).reverse().join("");
  const badges = BADGES.map(b => `<div class="badge ${P.badges[b.id] ? "on" : ""}"><span class="seal-ico">${b.ico}</span><b>${b.name}</b><small>${b.desc}</small></div>`).join("");
  const starsTotal = DATA.themes.reduce((s, t) => s + (P.stars[t.id] || 0), 0);
  return `
  <section><p class="eyebrow">Dossier administratif de l'agent</p><h1 class="sec" style="font-size:2rem">Mon dossier</h1></section>
  <div class="res-grid">
    <div class="stat"><small>Points</small><b>${fmt(P.xp)}</b></div>
    <div class="stat"><small>Questions jouées</small><b>${fmt(P.answered)}</b></div>
    <div class="stat"><small>Réussite</small><b>${rate} %</b></div>
    <div class="stat"><small>Meilleure série</small><b>×${P.bestStreak}</b></div>
    <div class="stat"><small>Étoiles</small><b>${starsTotal} / 36</b></div>
    <div class="stat"><small>Carnet</small><b>${Object.keys(P.errors).length}</b></div>
  </div>
  <div class="two">
    <section><h2 class="sec">Échelle des grades</h2><p class="sec-sub">Bonne réponse : +1 point. Réponse fausse ou temps écoulé : −1 point.</p><ol class="ladder-list">${ladder}</ol></section>
    <section><h2 class="sec">Badges</h2><p class="sec-sub">${Object.keys(P.badges).length} obtenus sur ${BADGES.length}.</p><div class="badges">${badges}</div></section>
  </div>
  <section class="card">
    <h2 class="sec" style="font-size:1.1rem">Recommencer à zéro</h2>
    <p class="sec-sub">Efface ton grade, tes étoiles, tes badges et ton carnet d'erreurs sur cet appareil.</p>
    <div class="actions">${confirmReset
      ? `<span>Tout effacer définitivement ?</span><button class="btn danger" data-act="reset-yes">Oui, effacer</button><button class="btn ghost" data-act="reset-no">Annuler</button>`
      : `<button class="btn danger" data-act="reset">Effacer ma progression</button>`}</div>
  </section>
  <div class="actions"><button class="btn primary" data-act="home">Retour à l'accueil</button></div>`;
}

/* ---------- Points, badges, promotions ---------- */
function gain(pts) {
  const before = gradeIdx(P.xp);
  P.xp = Math.max(0, P.xp + pts);
  const after = gradeIdx(P.xp);
  if (after > before) setTimeout(() => promote(after), 350);
}
function unlock(id) {
  if (P.badges[id]) return;
  P.badges[id] = Date.now();
  const b = BADGES.find(x => x.id === id);
  toast("Badge obtenu", `${b.name} : ${b.desc}`);
}
function checkBadges() {
  if (P.correct >= 1) unlock("premier");
  if (S && S.streak >= 5) unlock("serie5");
  if (S && S.streak >= 10) unlock("serie10");
  if (P.lvl3 >= 25) unlock("terrain");
  if (P.fixed >= 10) unlock("rattrapage");
  if (P.answered >= 100) unlock("centurion");
}
function toast(title, text) {
  const t = document.createElement("div");
  t.className = "toast"; t.innerHTML = `<b>${title}</b>${text}`;
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), 4200);
}
function promote(gi) {
  const o = $("#overlay");
  o.innerHTML = `<div class="arrete" role="dialog" aria-modal="true" aria-labelledby="ar-t">
    <p class="ar-ref">Arrêté n° ${new Date().getFullYear()}/${String(gi).padStart(3, "0")} portant promotion</p>
    <h2 id="ar-t">Promotion</h2>
    <p>Au vu des résultats obtenus, l'intéressé(e) est promu(e) au grade de</p>
    <p class="ar-grade">${GRADES[gi].n}</p>
    <div class="stamp ok big">Validé</div>
    <button class="btn primary" data-act="close-ov" id="ov-btn">Continuer</button></div>`;
  o.hidden = false;
  $("#ov-btn").focus();
}

/* ---------- Rendu et événements ---------- */
function render() {
  header();
  const v = $("#view");
  if (VIEW === "quiz" && S) v.innerHTML = viewQuiz();
  else if (VIEW === "result" && S) v.innerHTML = viewResult();
  else if (VIEW === "brief" && briefT) v.innerHTML = viewBrief();
  else if (VIEW === "dossier") v.innerHTML = viewDossier();
  else { VIEW = "home"; v.innerHTML = viewHome(); renderEclair(); }
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === "home") { stopTimer(); VIEW = "home"; render(); window.scrollTo(0, 0); }
  else if (a === "dossier") { stopTimer(); confirmReset = false; VIEW = "dossier"; render(); window.scrollTo(0, 0); }
  else if (a === "brief") { stopTimer(); briefT = +b.dataset.t; VIEW = "brief"; render(); window.scrollTo(0, 0); }
  else if (a === "start") startSession(b.dataset.m, b.dataset.t ? [+b.dataset.t] : b.dataset.scope === "all" ? ALL : P.sel);
  else if (a === "sel-all") { P.sel = ALL.slice(); save(); render(); }
  else if (a === "sel") {
    const id = +b.dataset.t;
    if (P.sel.length === ALL.length) P.sel = [id];
    else P.sel = P.sel.includes(id) ? P.sel.filter(x => x !== id) : P.sel.concat(id).sort((x, y) => x - y);
    if (!P.sel.length) P.sel = ALL.slice();
    save(); render();
  }
  else if (a === "pick") answer(+b.dataset.i);
  else if (a === "next") next();
  else if (a === "fifty") fifty();
  else if (a === "hint") hint();
  else if (a === "quit") finish();
  else if (a === "replay") startSession(S.mode, S.themes);
  else if (a === "pick-ec") {
    if (eclair.choice !== null) return;
    const q = Q[eclair.id]; eclair.choice = +b.dataset.i; P.answered++;
    if (eclair.choice === q.a) { P.correct++; if (P.errors[q.id]) { delete P.errors[q.id]; P.fixed++; } gain(1); }
    else { P.errors[q.id] = 1; gain(-1); }
    checkBadges(); save(); header(); renderEclair();
  }
  else if (a === "eclair-next") { eclair = null; renderEclair(); }
  else if (a === "close-ov") { $("#overlay").hidden = true; $("#overlay").innerHTML = ""; }
  else if (a === "reset") { confirmReset = true; render(); }
  else if (a === "reset-no") { confirmReset = false; render(); }
  else if (a === "reset-yes") { P = blank(); save(); confirmReset = false; eclair = null; toast("Progression effacée", "Tu repars du grade de stagiaire."); render(); }
});

document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (!$("#overlay").hidden) { if (e.key === "Escape" || e.key === "Enter") { $("#overlay").hidden = true; e.preventDefault(); } return; }
  if (VIEW !== "quiz" || !S) return;
  const k = e.key.toLowerCase();
  const map = { a: 0, b: 1, c: 2, d: 3, "1": 0, "2": 1, "3": 2, "4": 3 };
  if (S.choice === null && k in map) {
    if (!S.elim.includes(map[k])) { e.preventDefault(); answer(map[k]); }
  } else if (S.choice !== null && (e.key === "Enter" || e.key === "ArrowRight")) {
    if (document.activeElement && document.activeElement.tagName === "SUMMARY") return;
    e.preventDefault(); next();
  }
});

/* Reprise de la partie si la page est mise à jour pendant le jeu */
function start(data) {
  if (data && data.VIEW) {
    VIEW = data.VIEW; S = data.S && data.S.themes ? data.S : null;
    if (!S && (VIEW === "quiz" || VIEW === "result")) VIEW = "home"; eclair = data.eclair || null; briefT = data.briefT || null;
    if (VIEW === "quiz" && S && S.mode === "chrono" && S.choice === null) startTimer(Math.max(5, S.timeLeft || CHRONO_S));
  }
  render();
}
try { window.claude?.hot?.snapshot?.(() => ({ VIEW, S, eclair, briefT })); } catch (e) {}
const hot = window.claude?.hot;
if (hot?.ready) hot.ready(start); else start(hot?.data ?? {});
</script>
